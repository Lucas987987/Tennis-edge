name: Arena - Installer demo privee
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: npm install --no-save wrangler@4
      - name: Configurer D1
        env:
          DB_ID: ${{ vars.ARENA_D1_DATABASE_ID }}
          ORIGIN: ${{ vars.ARENA_ORIGIN }}
        run: |
          test -n "$DB_ID" && test -n "$ORIGIN"
          cat > workers/arena/wrangler.toml <<EOF
          name = "tennis-edge-arena"
          main = "worker.js"
          compatibility_date = "2026-11-01"
          workers_dev = true
          [vars]
          ARENA_ORIGIN = "$ORIGIN"
          [[d1_databases]]
          binding = "ARENA_DB"
          database_name = "tennis-edge-arena"
          database_id = "$DB_ID"
          EOF
      - name: Vérifier la clé privée
        env:
          KEY: ${{ secrets.ARENA_TEST_ACCESS_KEY }}
          ADMIN: ${{ secrets.ARENA_ADMIN_TOKEN }}
        run: |
          test "${#KEY}" -ge 32 || { echo "::error::Créer ARENA_TEST_ACCESS_KEY de 32 caractères minimum"; exit 1; }
      - name: Installer défis fictifs
        working-directory: workers/arena
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ARENA_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute tennis-edge-arena --remote --file=demo.sql
      - name: Installer progression XP et cartes
        working-directory: workers/arena
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ARENA_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute tennis-edge-arena --remote --file=arena_v12.sql
      - name: Installer cartes pour vrais matchs
        working-directory: workers/arena
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ARENA_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute tennis-edge-arena --remote --file=arena_v13.sql
      - name: Déployer le Worker
        working-directory: workers/arena
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ARENA_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEY: ${{ secrets.ARENA_TEST_ACCESS_KEY }}
          ADMIN: ${{ secrets.ARENA_ADMIN_TOKEN }}
        run: |
          printf %s "$KEY" | npx wrangler secret put ARENA_TEST_ACCESS_KEY
          if [ -n "$ADMIN" ]; then printf %s "$ADMIN" | npx wrangler secret put ARENA_ADMIN_TOKEN; fi
          npx wrangler deploy
