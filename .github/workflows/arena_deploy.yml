name: Arena - Deployer Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Verifier la configuration
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_ID: ${{ vars.ARENA_D1_DATABASE_ID }}
          SESSION: ${{ secrets.ARENA_SESSION_SECRET }}
          ORIGIN: ${{ vars.ARENA_ORIGIN }}
        run: |
          test -n "$TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN manquant"; exit 1; }
          test -n "$ACCOUNT" || { echo "::error::CLOUDFLARE_ACCOUNT_ID manquant"; exit 1; }
          test -n "$DB_ID" || { echo "::error::ARENA_D1_DATABASE_ID manquant"; exit 1; }
          test -n "$SESSION" || { echo "::error::ARENA_SESSION_SECRET manquant"; exit 1; }
          test -n "$ORIGIN" || { echo "::error::ARENA_ORIGIN manquant"; exit 1; }
      - name: Configurer le Worker et D1
        env:
          DB_ID: ${{ vars.ARENA_D1_DATABASE_ID }}
          ORIGIN: ${{ vars.ARENA_ORIGIN }}
        run: |
          cat > workers/arena/wrangler.toml <<EOF
          name = "tennis-edge-arena"
          main = "worker.js"
          compatibility_date = "2026-11-01"
          workers_dev = true
          [vars]
          ARENA_ORIGIN = "$ORIGIN"
          [[d1_databases]]
          binding = "ARENA_DB"
          database_name = "tennis-edge-arena"
          database_id = "$DB_ID"
          EOF
      - name: Installer Wrangler
        run: npm install --no-save wrangler@4
      - name: Initialiser la base D1
        working-directory: workers/arena
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute tennis-edge-arena --remote --file=schema.sql
      - name: Installer les secrets serveur
        working-directory: workers/arena
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARENA_SESSION_SECRET: ${{ secrets.ARENA_SESSION_SECRET }}
          ARENA_ADMIN_TOKEN: ${{ secrets.ARENA_ADMIN_TOKEN }}
        run: |
          printf %s "$ARENA_SESSION_SECRET" | npx wrangler secret put ARENA_SESSION_SECRET
          if [ -n "$ARENA_ADMIN_TOKEN" ]; then
            printf %s "$ARENA_ADMIN_TOKEN" | npx wrangler secret put ARENA_ADMIN_TOKEN
          fi
      - name: Deployer
        working-directory: workers/arena
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
