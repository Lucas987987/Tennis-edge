name: Arena - Valider les résultats confirmés
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation sans attribution de points"
        type: boolean
        default: true
  schedule:
    - cron: '23 */3 * * *'
permissions:
  contents: read
concurrency:
  group: arena-results-v20
  cancel-in-progress: false
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # 22/11/2026 (paquet 351) — COTES EN PRIVÉ, ÉTAPE 3b : en mode ETAT_CHAUD=prive, les fichiers de cotes (dont
      # moves_detail*.csv, suivi_direct/resultats.json, resultats_oddspapi.json) ne sont plus dans le dépôt public ;
      # rapatriés ici depuis R2 (lecture). Dans les autres modes, rien ne change.
      - name: Cotes privées — rapatrier (paquet 351)
        env:
          ETAT_CHAUD: ${{ vars.ETAT_CHAUD || 'double' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python3 scripts/cotes_privees.py pull || true

      - name: Rapprocher les résultats confirmés et les défis
        env:
          ARENA_ADMIN_TOKEN: ${{ secrets.ARENA_ADMIN_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'true' || inputs.dry_run }}
        run: python3 arena/tools/settle_results.py
