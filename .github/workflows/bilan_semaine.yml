name: Bilan — la semaine de l'algo

# AJOUTÉ LE 05/11/2026 (demande de Lucas). Chaque lundi matin, la CARTE DE LA SEMAINE écoulée (PNG 1080×1350, FR et EN) :
# % de bons vainqueurs par circuit contre % annoncé, favoris annoncés à 70 % ou plus, plus gros ratés, scores exacts.
# TOUS les matchs ATP, WTA et Challenger jugés de la semaine : rien n'est trié, gagné ou perdu. Aucune cote.
# Envoyée sur le Telegram PRIVÉ (TELEGRAM_CHAT_ID) seulement : pas d'artefact, rien de commité, aucune adresse de site.

on:
  workflow_dispatch:
  schedule:
    - cron: '47 6 * * 1'

permissions:
  contents: read

concurrency:
  group: bilan-semaine
  cancel-in-progress: false

jobs:
  semaine:
    runs-on: ubuntu-24.04   # 05/11/2026 : image figée (ubuntu-latest est passé à 26.04)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /algo/
            /scripts/video_simulation.py
            /scripts/installer_video.sh
            /scripts/sons.py
            /simulateur/bilan_semaine.py
            /simulateur/journal_pronostics/apres_match/

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Bilan de la semaine (données)
        id: donnees
        run: |
          if python simulateur/bilan_semaine.py .; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "ok=0" >> "$GITHUB_OUTPUT"; echo 'Aucun match jugé la semaine dernière.'; fi

      - name: Navigateur (Chromium)
        if: steps.donnees.outputs.ok == '1'
        run: |
          # 05/11/2026 (paquet 194) : plus d'apt (miroir Ubuntu trop lent, vidéo annulée) — voir le script.
          bash scripts/installer_video.sh

      - name: Carte de la semaine (FR puis EN)
        if: steps.donnees.outputs.ok == '1'
        run: |
          for lang in fr en; do
            python scripts/video_simulation.py --lang "$lang" --semaine --sortie bilans
          done

      - name: Envoyer sur le Telegram privé
        if: steps.donnees.outputs.ok == '1'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then echo '::error::Telegram non configuré : bilan non envoyé.'; exit 1; fi
          for lang in fr en; do
            test -s "bilans/semaine_${lang}.png"
            curl --fail-with-body -sS -o /dev/null -w "Telegram semaine ${lang} : HTTP %{http_code}\n" \
              -F chat_id="${TELEGRAM_CHAT_ID}" -F caption="📅 Bilan de la semaine (${lang}) — tous les matchs, gagnés ou perdus" \
              -F photo=@"bilans/semaine_${lang}.png" \
              "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto"
          done
