name: Indice des opérateurs

# ──────────────────────────────────────────────────────────────────────────
# Publie chaque semaine un comparatif des opérateurs sur le tennis : marge,
# réactivité, fréquence du meilleur prix.
#
# POURQUOI CE PRODUIT
# Les tests ont établi que le CLV net est proche de zéro une fois la marge
# retirée, et que cinq pistes d'anticipation sont fermées (Polymarket, Kalshi,
# Elo, fatigue, momentum, limites). Il n'y a donc pas d'edge à vendre.
# Mais les mêmes données répondent à une question plus utile au lecteur :
# OÙ placer son pari plutôt que QUEL pari placer. Un opérateur à 4,75 % de
# marge coûte deux fois moins cher qu'un à 9,13 %, et c'est vérifiable.
#
# Ne demande AUCUNE requête API : tout est calculé sur les courbes déjà
# collectées. Le cron du lundi laisse le temps aux résultats du week-end
# d'arriver.
# ──────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  schedule:
    # Lundi 07:00 UTC, après la mise à jour Elo de 05:10.
    - cron: '0 7 * * 1'

permissions:
  contents: write

concurrency:
  group: book-index
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # fetch-depth 0 requis par le merge du commit ; filter blob:none
          # évite de rapatrier les centaines de Mo de parts/ (les partitions
          # nécessaires sont téléchargées à la demande).
          fetch-depth: 0
          filter: blob:none

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Construire l'indice
        run: |
          python scripts/curves_parts.py rebuild || true
          python scripts/book_index.py
          # Calibration + Brier par opérateur (réécrit le 25/08/2026 après la
          # corruption du fichier d'origine). Non bloquant : une étude qui
          # rate ne doit pas empêcher la publication du baromètre — mais
          # l'échec reste VISIBLE dans les logs, jamais avalé sans trace.
          python scripts/calibration_books.py || echo "⚠️ calibration_books en échec (non bloquant)"

      - name: Commit
        if: always()
        run: |
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Fichier par fichier : un git add en bloc échoue ENTIÈREMENT si un
          # seul chemin manque, et n'ajoute alors rien (panne du 15/08/2026).
          for f in book_index.json book_index.md calibration_books.md; do
            [ -f "$f" ] && git add -- "$f" || echo "  (absent : $f)"
          done
          if git diff --staged --quiet; then
            echo 'Rien à commit.'; exit 0
          fi
          git commit -m "Indice des opérateurs ($(date -u +%Y-%m-%d))"
          # RETRY RENFORCE — 6 tentatives, attente croissante (03/10/2026).
          #
          # 3 tentatives a 5 s ne suffisaient plus. Message observe sur
          # fetch_book_curves : cannot lock ref 'refs/heads/main' — un autre
          # workflow avait pousse entre le fetch et le push, TROIS fois de suite.
          # Resultat : hist_curves_meta.json fige 538 h, detecte seulement par
          # audit_qa a l'age du fichier.
          #
          # La contention a augmente : une douzaine de workflows commitent en
          # continu, courbes_alertes pousse toutes les 3 min. L'attente doit
          # couvrir la duree d'un push concurrent, pas 5 secondes.
          # 2+4+8+16+32 = 62 s cumulees, soit deux cycles de capture complets.
          attente=2
          for essai in 1 2 3 4 5 6; do
            git fetch origin main || true
            if git merge origin/main --no-edit; then
              if git push; then
                echo "✅ PUSH OK (tentative $essai)"
                exit 0
              fi
              echo "⚠️ push refuse · tentative $essai/6"
            else
              echo "⚠️ merge en conflit · tentative $essai/6"
              git merge --abort 2>/dev/null || true
            fi
            [ "$essai" -lt 6 ] && { echo "   nouvelle tentative dans ${attente}s"; sleep "$attente"; attente=$((attente*2)); }
          done
          echo '❌ PUSH ÉCHOUÉ après 6 tentatives (62 s cumulées).'
          exit 1
