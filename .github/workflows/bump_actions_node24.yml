name: Bump actions vers Node 24 (one-shot)

# CRÉÉ LE 04/09/2026. GitHub RETIRE Node 20 des runners le 16/09/2026 : les
# runs affichent déjà l'avertissement « forced to run on Node.js 24 » à chaque
# exécution. Après cette date, tout workflow encore sur checkout@v4 /
# setup-python@v5 s'arrête -- c'est-à-dire TOUS les workflows du dépôt.
#
# 50 fichiers à éditer : infaisable depuis l'interface web mobile. Ce workflow
# fait le remplacement lui-même et committe. À lancer UNE FOIS depuis l'onglet
# Actions, puis à supprimer (ou à laisser : il est idempotent, un second
# lancement ne trouvera plus rien à remplacer et sortira proprement).
#
# Majeures retenues : la PLUS PETITE de chaque action qui tourne sur Node 24,
# pour minimiser les changements de comportement. Des majeures plus récentes
# existent (checkout v6/v7, setup-python v6.2) ; rien n'oblige à les prendre.
#
# Le mode --dry-run (défaut) montre ce qui serait changé SANS committer.
# Vérifier la sortie, puis relancer avec appliquer=true.

on:
  workflow_dispatch:
    inputs:
      appliquer:
        description: "false = simulation seule ; true = édite et committe"
        required: true
        default: "false"

permissions:
  contents: write

concurrency:
  group: bump-actions-node24
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/parts
          sparse-checkout-cone-mode: false

      - name: Remplacer les majeures
        id: bump
        run: |
          set -euo pipefail
          # source|cible -- une paire par ligne
          PAIRES="
          actions/checkout@v4|actions/checkout@v5
          actions/setup-python@v5|actions/setup-python@v6
          actions/cache@v4|actions/cache@v5
          actions/upload-artifact@v4|actions/upload-artifact@v5
          actions/configure-pages@v5|actions/configure-pages@v6
          actions/deploy-pages@v4|actions/deploy-pages@v5
          actions/upload-pages-artifact@v3|actions/upload-pages-artifact@v5
          "
          total=0
          for paire in $PAIRES; do
            src="${paire%%|*}"; dst="${paire##*|}"
            n=$(grep -rl -- "$src" .github/workflows/*.yml 2>/dev/null | wc -l)
            if [ "$n" -gt 0 ]; then
              echo "  $src -> $dst : $n fichier(s)"
              sed -i "s|$src|$dst|g" .github/workflows/*.yml
              total=$((total + n))
            fi
          done
          echo "total=$total" >> "$GITHUB_OUTPUT"
          if [ "$total" -eq 0 ]; then
            echo "✅ rien à changer -- toutes les actions sont déjà sur Node 24."
          fi

      - name: Vérifier que les 50 YAML parsent toujours
        run: |
          python3 - <<'PY'
          import glob, sys
          try:
              import yaml
          except ImportError:
              import subprocess
              subprocess.run([sys.executable, '-m', 'pip', 'install', '-q',
                              'pyyaml'], check=True)
              import yaml
          # Un sed maladroit casserait TOUS les workflows d'un coup. On refuse
          # de committer si un seul fichier ne parse plus.
          mauvais = []
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
              except Exception as e:
                  mauvais.append(f"{f}: {e}")
          if mauvais:
              print("❌ YAML cassé, AUCUN commit :")
              for m in mauvais:
                  print("  ", m)
              sys.exit(1)
          print(f"✅ {len(glob.glob('.github/workflows/*.yml'))} workflows, YAML tous valides")
          PY

      - name: Rapport (simulation)
        if: ${{ github.event.inputs.appliquer != 'true' }}
        run: |
          echo "=== SIMULATION -- rien n'a été committé ==="
          git --no-pager diff --stat
          echo
          echo "Relancer avec appliquer=true pour committer."

      - name: Committer
        if: ${{ github.event.inputs.appliquer == 'true' && steps.bump.outputs.total != '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/
          git diff --staged --quiet && { echo "rien de neuf"; exit 0; }
          git commit -m "Bump actions vers les majeures Node 24 (retrait de Node 20 le 16/09/2026)"
          for essai in 1 2 3; do
            git fetch origin main || true
            git merge origin/main --no-edit || { git merge --abort 2>/dev/null || true; sleep 8; continue; }
            git push && exit 0
            sleep 8
          done
          echo "❌ PUSH ÉCHOUÉ -- le commit local reste récupérable au prochain run."
          exit 1
