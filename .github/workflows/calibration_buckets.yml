name: Calibration Buckets

# PYTHONDONTWRITEBYTECODE : aucun .pyc n'est plus genere. Les .pyc
# regeneres a chaque run faisaient echouer le merge puis le push
# (panne du 16/08/2026). Portee workflow = toutes les etapes.
env:
  PYTHONDONTWRITEBYTECODE: '1'

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # resultats.json et resultats_fast.json valent "count": 0 depuis des
      # semaines (Sackmann injoignable depuis le runner + source fast vide),
      # alors que resultats_oddspapi.json / set_results.json sont pleins.
      # Sans ce pont, l'etude repondait "Aucun resultat" a chaque run.
      - name: Pont resultats (sources vivantes -> format canonique)
        run: python scripts/results_bridge.py

      - name: Run calibration buckets
        env:
          RESULTS: resultats_derived.json
        run: python scripts/calibration_buckets.py

      - name: Commit and push report
        run: |
          # PANNE DU 16/08/2026 -- cause exacte, tracee par pipeline_status.
          # Les .pyc sont SUIVIS par git (ajoutes avant le .gitignore, qui ne
          # s'applique plus une fois un fichier suivi). capture_closing tourne
          # toutes les 5-10 min avec "git add -A" et republie donc des .pyc
          # neufs en continu. Quand un autre workflow tourne, il regenere les
          # siens localement -> "git merge" ABANDONNE ("Your local changes to
          # the following files would be overwritten") -> branche en retard ->
          # push rejete en non-fast-forward. Resultat observe : 7 fichiers
          # commites localement (dont 830 lignes de moves_detail_hist), jamais
          # pousses. On efface donc les .pyc du disque avant toute action git.
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name '*.pyc' -delete 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f calibration_buckets_report.json ] && git add -- calibration_buckets_report.json
          git diff --staged --quiet || git commit -m "📊 Calibration par tranche de cote $(date -u +%Y-%m-%dT%H:%MZ)"
          git fetch origin main 2>&1 || echo "⚠️ fetch échoué"
          git merge origin/main --no-edit 2>&1 || echo "⚠️ merge en conflit -- le commit local n'est pas perdu"
          git push 2>&1 || echo "❌ PUSH ÉCHOUÉ -- voir message ci-dessus"
