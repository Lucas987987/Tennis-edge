name: Chercheur automatique (pistes d'amélioration)

# 21/11/2026 — paquet 320. Chaque lundi, simulateur/chercheur.py balaie des familles de pistes (pentes et décalages,
# circuit par circuit) sur le rejeu « comme en production » (résultats ITF hommes compris) et classe celles qui
# amélioreraient les % sur des matchs jamais vus. Règle écrite dans son en-tête (seuil 3,3 erreurs types : beaucoup de
# pistes testées à la fois). Les 3 meilleures candidates partent sur le Telegram PRIVÉ. Rien n'entre dans l'algo :
# une candidate passe ensuite par une étude et un paquet à part. 0 requête d'API.
on:
  # 22/11/2026 (paquet 350) : relancé par le worker Cloudflare tennis-edge-closing si le cron du lundi saute
  repository_dispatch:
    types: [chercheur]
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: simulateur
  cancel-in-progress: false

jobs:
  chercheur:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /simulateur/
            /resultats_itf/
            /resultats_itf_femmes/
            /scripts/resultats_itf.py
            /feuilles/
            /Tennis_Edge_Lab/live/pronostics_resultats.json
            /Tennis_Edge_Lab/books.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Archive Sackmann (fichiers de matchs seulement)
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Aneeshers/tennis-sackmann-archive.git /tmp/sackmann
          cd /tmp/sackmann
          git sparse-checkout set --no-cone 'atp_matches_20*.csv' 'atp_matches_qual_chall_20*.csv' 'wta_matches_20*.csv' 'wta_matches_qual_itf_20*.csv'
      - name: Chercher
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          python simulateur/chercheur.py /tmp/sackmann . --telegram | tee /tmp/chercheur.log
          cp simulateur/rapport_chercheur.json /tmp/rapport_chercheur.json
          echo '### Chercheur automatique' >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' /tmp/chercheur.log >> "$GITHUB_STEP_SUMMARY"
      # 22/11/2026 (paquet 350) : chaque candidate contrôlée sur nos pronostics en direct (règle dans l'en-tête de
      # simulateur/controle_candidates.py). Rien ne change dans les pronostics.
      - name: Contrôler les candidates sur nos pronostics en direct
        run: |
          set -euo pipefail
          python simulateur/controle_candidates.py . | tee /tmp/controle.log
          cp simulateur/rapport_controle_candidates.json /tmp/rapport_controle_candidates.json
          echo '### Candidates contrôlées en direct (paquet 350)' >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' /tmp/controle.log >> "$GITHUB_STEP_SUMMARY"
      # 23/11/2026 (paquet 383) : piste suivie, désaccords stats / simulation en Challenger (règle dans l'en-tête de
      # simulateur/suivi_desaccord_modeles.py, décision à 1 000 désaccords). Rien ne change dans les pronostics.
      # 24/11/2026 (paquet 399) : piste suivie, outsider peu documenté (règle dans l'en-tête du script, décision à
      # 1 000 matchs Challenger). Rien ne change dans les pronostics.
      - name: Suivre le profil outsider peu documenté
        run: |
          set -euo pipefail
          python simulateur/suivi_outsider_peu_documente.py . | tee /tmp/outsider.log
          cp simulateur/rapport_outsider_peu_documente.json simulateur/suivi_outsider_peu_documente_matchs.json /tmp/
          echo '### Outsider peu documenté (paquet 399)' >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' /tmp/outsider.log >> "$GITHUB_STEP_SUMMARY"
      - name: Suivre les désaccords entre modèles
        run: |
          set -euo pipefail
          python simulateur/suivi_desaccord_modeles.py . | tee /tmp/desaccord.log
          cp simulateur/rapport_desaccord_modeles.json simulateur/suivi_desaccord_modeles_matchs.json /tmp/
          echo '### Désaccords entre modèles (paquet 383)' >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' /tmp/desaccord.log >> "$GITHUB_STEP_SUMMARY"
      - name: Publier le rapport (sans écraser le travail des autres)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/rapport_chercheur.json simulateur/rapport_chercheur.json
            cp /tmp/rapport_controle_candidates.json simulateur/rapport_controle_candidates.json
            cp /tmp/rapport_desaccord_modeles.json /tmp/suivi_desaccord_modeles_matchs.json simulateur/
            cp /tmp/rapport_outsider_peu_documente.json /tmp/suivi_outsider_peu_documente_matchs.json simulateur/
            git add -- simulateur/rapport_chercheur.json simulateur/rapport_controle_candidates.json \
              simulateur/rapport_desaccord_modeles.json simulateur/suivi_desaccord_modeles_matchs.json \
              simulateur/rapport_outsider_peu_documente.json simulateur/suivi_outsider_peu_documente_matchs.json
            if git diff --cached --quiet; then echo 'Rien de nouveau.'; exit 0; fi
            git commit -q -m 'Chercheur automatique : rapport de la semaine'
            if git push origin HEAD:main; then echo '✅ publié'; exit 0; fi
            sleep $((i * 10))
          done
          echo '::error::Push impossible après 6 essais'; exit 1
