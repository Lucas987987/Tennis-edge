name: Collecte stats de l'année (tennis)

# 26/11/2026 (paquet 482, demande de Lucas : « récupère les informations pour le tennis ») — statistiques de l'année
# par surface et classements de tous les joueurs de nos feuilles, via AllSportsApi (quota de TennisApi non touché),
# de l'année en cours à 2018 (voir l'en-tête de scripts/collecte_stats_annee.py). Rangé dans historique/stats_annee/ :
# aucun script de l'algo ne le lit tant qu'une étude ne l'a pas validé. S'arrête quand il reste 60 requêtes (le tennis
# de table garde les siennes) ; ne rafraîchit rien en formule gratuite. Le journal n'affiche que des comptes.
on:
  schedule:
    - cron: '53 1-23/2 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Durée de collecte au plus (minutes)'
        default: '100'

permissions:
  contents: write

concurrency:
  group: collecte-stats-annee
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /scripts/allsports.py
            /scripts/collecte_stats_annee.py
            /feuilles/
            /historique/itf_points/
            /historique/feuilles_points/
            /historique/stats_annee/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Collecte (années récentes d'abord)
        timeout-minutes: 110
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          MINUTES: ${{ github.event.inputs.minutes || '100' }}
          ALLSPORTS_PAUSE: '0.35'
          ALLSPORTS_RESERVE: '60'
        run: python scripts/collecte_stats_annee.py "$MINUTES" | tee /tmp/sa.log
      - name: Résumé
        if: always()
        run: |
          { echo "### Stats de l'année"; sed 's/^/    /' /tmp/sa.log 2>/dev/null || true; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publier (même après une interruption)
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- historique/stats_annee
          if git diff --cached --quiet; then echo 'Rien de nouveau.'; exit 0; fi
          git commit -q -m "Stats de l'année $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; echo '::error::Conflit avec main'; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 10))
          done
          echo '::error::Push impossible après 5 essais'; exit 1
