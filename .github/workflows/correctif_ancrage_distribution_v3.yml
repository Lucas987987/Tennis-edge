name: 'Correctif V3 - ancrage distribution exacte'
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corriger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 22/11/2026 (paquet 346) — COTES EN PRIVÉ : en mode ETAT_CHAUD=prive, closing_lines, matches_oddspapi,
      # live_odds et les archives de clôtures ne sont plus dans le dépôt public ; rapatriés ici depuis R2 (lecture).
      # Dans les autres modes, rien ne change (seul ce qui manquerait au dépôt est rapatrié).
      - name: Cotes privées — rapatrier (paquet 346)
        env:
          ETAT_CHAUD: ${{ vars.ETAT_CHAUD || 'double' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python3 scripts/cotes_privees.py pull || true

      - name: Vérifier la cohérence du correctif avec le moteur
        run: |
          grep -F 'min(max(p_victoire, 0.005), 0.995)' simulateur/match_simule.py
      - name: Corriger le contrôle sans toucher au modèle
        run: python scripts/correctif_ancrage_distribution_v3.py
      - name: Vérifier syntaxe et diff
        run: |
          python -m py_compile simulateur/pronostics_du_jour.py
          git diff --check
          git diff -- simulateur/pronostics_du_jour.py
      - name: Publier uniquement le correctif
        run: |
          if git diff --quiet -- simulateur/pronostics_du_jour.py; then
            echo 'Déjà corrigé'; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulateur/pronostics_du_jour.py
          git commit -m 'fix: aligner ancrage distribution exacte sur borne moteur'
          git push
