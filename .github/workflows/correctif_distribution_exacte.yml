name: Correctif - distribution exacte 0.5 pourcent
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corriger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 22/11/2026 (paquet 346) — COTES EN PRIVÉ : en mode ETAT_CHAUD=prive, closing_lines, matches_oddspapi,
      # live_odds et les archives de clôtures ne sont plus dans le dépôt public ; rapatriés ici depuis R2 (lecture).
      # Dans les autres modes, rien ne change (seul ce qui manquerait au dépôt est rapatrié).
      - name: Cotes privées — rapatrier (paquet 346)
        env:
          ETAT_CHAUD: ${{ vars.ETAT_CHAUD || 'double' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python3 scripts/cotes_privees.py pull || true

      - name: Appliquer correctif cible
        run: python scripts/correctif_distribution_exacte.py
      - name: Vérifier compilation
        run: python -m py_compile simulateur/pronostics_du_jour.py
      - name: Commit correctif uniquement
        run: |
          if git diff --quiet -- simulateur/pronostics_du_jour.py; then
            echo 'Aucun changement à committer'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulateur/pronostics_du_jour.py
          git commit -m 'fix: tolérer saturation ancrage exact aux extrêmes MC'
          git push
