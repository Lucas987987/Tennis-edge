name: Correctif - distribution exacte 0.5 pourcent
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corriger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Appliquer correctif cible
        run: python scripts/correctif_distribution_exacte.py
      - name: Vérifier compilation
        run: python -m py_compile simulateur/pronostics_du_jour.py
      - name: Commit correctif uniquement
        run: |
          if git diff --quiet -- simulateur/pronostics_du_jour.py; then
            echo 'Aucun changement à committer'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulateur/pronostics_du_jour.py
          git commit -m 'fix: tolérer saturation ancrage exact aux extrêmes MC'
          git push
