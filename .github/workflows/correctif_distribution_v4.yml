name: Correctif V4 - distribution exacte
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corriger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.PAQUET_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # 22/11/2026 (paquet 346) — COTES EN PRIVÉ : en mode ETAT_CHAUD=prive, closing_lines, matches_oddspapi,
      # live_odds et les archives de clôtures ne sont plus dans le dépôt public ; rapatriés ici depuis R2 (lecture).
      # Dans les autres modes, rien ne change (seul ce qui manquerait au dépôt est rapatrié).
      - name: Cotes privées — rapatrier (paquet 346)
        env:
          ETAT_CHAUD: ${{ vars.ETAT_CHAUD || 'double' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python3 scripts/cotes_privees.py pull || true

      - name: Corriger et verifier
        run: python3 scripts/correctif_distribution_v4.py
      - name: Publier sur main
        run: |
          set -euo pipefail
          git config user.name "paquet-bot"
          git config user.email "paquet-bot@users.noreply.github.com"
          git add simulateur/pronostics_du_jour.py
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -m "Fix exact distribution check at clamped anchor"
          git push origin HEAD:main
