name: Courbes live + alertes forward

# CRÉÉ LE 05/09/2026 en découpant Capture Closing Lines.
#
# Contient tout le post-traitement qui occupait 85 % du run de capture :
# 129 à 159 secondes de recalcul LOCAL, ZÉRO requête API. Il bloquait la
# garde du Worker et plafonnait la capture des cotes à 5 minutes.
#
# Pourquoi il peut tourner moins souvent : ces scripts travaillent sur des
# données DÉJÀ capturées et commitées. Les retarder de quelques minutes ne
# fait rien perdre — alors qu'une cote captée 5 minutes trop tard est
# perdue pour toujours.
#
# CADENCE. Déclenché par le worker Cloudflare (repository_dispatch
# 'courbes_alertes') ou à la main. Le worker peut le planifier via
# planifierCollecteur() avec cadenceMin ~10, exactement comme Polymarket et
# Kalshi — la garde API évitera l'empilement de runs annulés.
# Un cron GitHub serait inutile : mesuré le 04/09, ils ne sont pas délivrés.
#
# canal_public.py RESTE ICI et non dans le workflow rapide : il publie sur
# un canal Telegram avec des abonnés et gagne à rester réactif, mais il
# dépend de build_live_curves.py qui est ici. Le séparer imposerait de
# reconstruire les courbes deux fois — 130 s dupliquées pour rien.
# Si la réactivité du canal devient un sujet, c'est cette cadence qu'il
# faut resserrer, pas la découpe qu'il faut défaire.

on:
  repository_dispatch:
    types: [courbes_alertes]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Deux runs simultanés recalculeraient les mêmes courbes et se
  # marcheraient dessus au commit. Contrairement à la capture, rien n'est
  # perdu si un run est annulé : le suivant refera le même calcul sur des
  # données plus fraîches.
  group: courbes-alertes
  cancel-in-progress: false

jobs:
  courbes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          # parts/hist_* est INDISPENSABLE ici : c'est ce que
          # TRACK_CURVES=*_curves.jsonl fait lire à steam_alert et
          # paper_journal via ov.iter_hist_lines(). Un sparse qui l'oubliait
          # a vidé le track record en silence le 25/08 et fait retomber tous
          # les seuils en « indicatif ». parts/live_* sert au rebuild.
          sparse-checkout: |
            /*
            !/parts
            /parts/live_*
            /parts/hist_*

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'


      - name: Cache de calibration (le gain principal)
        # AJOUTÉ LE 05/09/2026. steam_alert.stats_avec_cache() a été écrit le
        # 03/09 pour éviter de recharger l'historique complet — 43 s par
        # appel, six appels par cycle (3 marchés x steam_alert + paper_journal).
        # Il a un TTL de 60 min... mais calib_cache.json est dans .gitignore
        # et n'existe donc QUE sur le runner, détruit à la fin du job.
        # Chaque exécution repartait sur un cache FROID : le TTL n'a jamais
        # été atteint une seule fois depuis sa création.
        #
        # Constaté dans le log du run 92055634625 : deux blocs de 52,8 s et
        # 47,9 s juste après build_live_curves, soit ~100 s sur 129.
        #
        # actions/cache le fait survivre d'un run à l'autre sans le committer
        # (il est régénérable, il n'a rien à faire dans l'historique git —
        # qu'on vient justement de purger de 3,4 Go).
        #
        # La clé est unique par run, donc jamais touchée exactement : le
        # cache est TOUJOURS réécrit en fin de job. restore-keys récupère le
        # plus récent par préfixe. C'est le motif « rolling cache ».
        # La fraîcheur reste gouvernée par le TTL applicatif de 60 min, qui
        # lit les horodatages DANS le fichier : restaurer un cache trop vieux
        # est sans danger, stats_avec_cache() le recalculera. Et un cache
        # absent fait simplement retomber sur le comportement actuel.
        uses: actions/cache@v5
        with:
          path: calib_cache.json
          key: calib-${{ github.run_id }}
          restore-keys: |
            calib-

      - name: Courbes live + alertes forward (0 requête API)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # MIGRATION AUTOMATIQUE (une seule fois) : si parts/ n'existe pas encore,
          # on convertit les fichiers plats existants en partitions, puis on retire
          # ces fichiers du suivi git (ils deviennent régénérables). Aucune donnée
          # perdue : la migration est vérifiée point par point.
          if [ ! -d parts ]; then
            echo "--- migration initiale vers les partitions ---"
            python scripts/curves_parts.py migrate || true
            git rm --cached book_curves_live.jsonl set1_curves_live.jsonl set2_curves_live.jsonl 2>/dev/null || true
          fi
          # Les fichiers plats ne sont plus commités : on les reconstruit depuis
          # les partitions append-only (parts/). Reconstruction identique au point près.
          python scripts/curves_parts.py rebuild
          python scripts/build_live_curves.py

          # ══ ORDRE REVU LE 05/09/2026 : CE QUI ALERTE D'ABORD ══════════
          # Tout ce qui suit coûte le même temps total, mais l'ORDRE décide
          # de la latence du message. canal_public.py ne dépend que de
          # build_live_curves : le passer en premier fait partir la
          # publication vers ~15 s de run au lieu de ~120 s.
          # Sur des paliers de 3 à 12 %, 100 secondes de moins sur un
          # mouvement de cote, c'est du signal conservé pour les abonnés.
          # Les journaux (paper_journal, results_bridge) sont de la
          # comptabilité : ils peuvent attendre la fin du job, personne ne
          # les lit en direct.

          # Canal PUBLIC « Évolution des cotes » : messages d'information
          # neutres (mouvements Pinnacle + juste prix + retards
          # d'ajustement). 0 requête API. EN PREMIER, volontairement.
          PALIERS="3,5,8,12" python scripts/canal_public.py || true

          # TRACK_CURVES = historique riche pour calibrer les seuils par book (sinon "indicatif")
          CURVES=book_curves_live.jsonl TRACK_CURVES=book_curves.jsonl MARKET=match python scripts/steam_alert.py || true
          CURVES=set1_curves_live.jsonl TRACK_CURVES=set1_curves.jsonl MARKET=set1 python scripts/steam_alert.py || true
          CURVES=set2_curves_live.jsonl TRACK_CURVES=set2_curves.jsonl MARKET=set2 python scripts/steam_alert.py || true

          # Signal EXPÉRIMENTAL (non validé) : book déjà ouvert avant Pinnacle,
          # écart au moment où Pinnacle publie son 1er prix. Canal PRIVÉ
          # uniquement (jamais le canal public) -- voir validation_report pour
          # le suivi out-of-sample avant toute exploitation. 0 requête API.
          CURVES=book_curves_live.jsonl python scripts/early_open_signal.py || true

          # ── à partir d'ici : comptabilité, plus aucune alerte ──────────
          # Journal forward : OUVRIR les signaux MAINTENANT, pendant que le match est
          # encore à venir. Le pipeline nocturne (00:15) ne suffit pas : les moves
          # naissent en journée, quelques heures avant les matchs — à 00:15 le signal
          # n'existe pas encore, et le lendemain le match est passé (= journal vide).
          # Dédup par id (uid|book|palier) -> pas de doublon d'un cycle à l'autre.
          # 0 requête API (fichiers locaux). Le dénouement reste au pipeline nocturne.
          CURVES=book_curves_live.jsonl TRACK_CURVES=book_curves.jsonl MARKET=match python scripts/paper_journal.py || true
          CURVES=set1_curves_live.jsonl TRACK_CURVES=set1_curves.jsonl MARKET=set1 python scripts/paper_journal.py || true
          CURVES=set2_curves_live.jsonl TRACK_CURVES=set2_curves.jsonl MARKET=set2 python scripts/paper_journal.py || true
          # JOURNAL ALIGNÉ SUR LE CANAL.
          # paper_journal.py ci-dessus enregistre selon les seuils ADAPTATIFS
          # par book de steam_alert. canal_public, lui, publie sur des paliers
          # FIXES (3/5/8/12) avec un écart >= GAP_MIN. Résultat mesuré le
          # 24/08 : 68 matchs alertés sur le canal, 17 seulement dans le
          # journal forward — un sous-ensemble à 25 %.
          # Le track record ne mesurait donc PAS ce que reçoivent les abonnés,
          # ce qui le rend inutilisable pour justifier quoi que ce soit.
          # paper_journal_canal.py lit canal_public_log.jsonl : par
          # construction, il ne peut plus diverger de la publication.
          # Les DEUX tournent — les seuils adaptatifs restent une stratégie
          # légitime, simplement différente. Deux fichiers, aucune confusion.
          python scripts/results_bridge.py || true
          python scripts/paper_journal_canal.py || true

      - name: Écrire l'état (pour la planification par le Worker)
        # planifierCollecteur() dans le Worker lit `last_run_at` de ce fichier
        # pour espacer les runs. Même convention que
        # polymarket_collector_state.json et kalshi_collector_state.json.
        # Sans lui, minsDepuis vaudrait Infinity et la seule limite serait la
        # garde API : ce job repartirait à chaque réveil du Worker, soit
        # toutes les 3 minutes — exactement ce que la découpe cherche à
        # éviter.
        # Écrit APRÈS le calcul et AVANT le commit, pour être poussé avec.
        if: always()
        run: |
          python3 - <<'PY'
          import json, datetime
          json.dump(
              {'last_run_at': datetime.datetime.now(datetime.timezone.utc)
                                      .isoformat(timespec='seconds')},
              open('courbes_alertes_state.json', 'w'), indent=1)
          PY
          cat courbes_alertes_state.json

      - name: Commit (robuste — même boucle de reprise que la capture)
        run: |
          # PANNE DU 16/08/2026 -- cause exacte, tracee par pipeline_status.
          # Les .pyc sont SUIVIS par git (ajoutes avant le .gitignore, qui ne
          # s'applique plus une fois un fichier suivi). capture_closing tourne
          # toutes les 5-10 min avec "git add -A" et republie donc des .pyc
          # neufs en continu. Quand un autre workflow tourne, il regenere les
          # siens localement -> "git merge" ABANDONNE ("Your local changes to
          # the following files would be overwritten") -> branche en retard ->
          # push rejete en non-fast-forward. Resultat observe : 7 fichiers
          # commites localement (dont 830 lignes de moves_detail_hist), jamais
          # pousses. On efface donc les .pyc du disque avant toute action git.
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name '*.pyc' -delete 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # CORRIGÉ LE 27/08/2026 (audit §2.2/§2.3) : « git add -A » nu
          # contredisait l'invariant de .gitattributes (« chaque workflow ne
          # commite QUE ses propres partitions ») -- ce workflow, le plus
          # fréquent (150x/jour), était le seul à ne pas le respecter.
          # Exclusion par pathspec des partitions des collecteurs (jamais
          # écrites ici), sans énumérer positivement chaque fichier que ce
          # job produit (nombreux : capture_state, courbes live, journaux
          # d'alertes, journal forward...).
          git add -A -- ':!parts/pm_ticks_*' ':!parts/kx_ticks_*'
          echo "--- fichiers en attente de commit ---"
          git status --short
          # GARDE-FOU TAILLE (même principe que kalshi/polymarket).
          # CORRIGÉ LE 27/08/2026 (audit v2 §K) : `git status --porcelain`
          # + awk '{print $2}' casse sur une ligne de renommage
          # (`R  ancien -> nouveau` -> $2 vaut "ancien", le mauvais chemin)
          # et sur tout chemin contenant une espace. `git diff --cached
          # --name-only` ne liste QUE ce qui est réellement indexé, un
          # chemin par ligne, sans ce risque.
          for f in $(git diff --cached --name-only); do
            [ -f "$f" ] || continue
            mo=$(du -m "$f" 2>/dev/null | cut -f1)
            if [ -n "$mo" ] && [ "$mo" -ge 95 ]; then
              echo "⛔ $f fait ${mo} Mo (mur GitHub 100 Mo) — ÉCARTÉ du commit."
              git restore --staged -- "$f" 2>/dev/null || true
            fi
          done
          git diff --staged --quiet || git commit -m "Courbes live + alertes ($(date -u +%H:%MZ))"
          # "merge" et non "rebase" : un rebase en conflit après un commit
          # peut écarter ce commit en silence (avalé par "2>/dev/null ||
          # true") -- exactement le bug qui a figé set_results.json pendant
          # 1 semaine sur steam_pipeline.yml. Ce workflow tourne toutes les
          # 5-10 minutes : le risque de collision avec un autre run est
          # bien plus élevé ici qu'ailleurs.
          # BOUCLE DE REPRISE AVEC FUSION DES CONFLITS JSON.
          # Ce workflow tourne toutes les 5-10 min : deux exécutions se
          # chevauchent régulièrement, et git tombe en conflit sur les JSON
          # d'état (closing_lines, capture_state, matches_oddspapi...). Le run
          # entier était alors perdu, y compris les partitions live qui,
          # elles, avaient fusionné sans problème via merge=union.
          # merge_json_state.py fusionne ces objets JSON clé par clé, sans rien
          # perdre : closing_lines est un ACCUMULATEUR, prendre une version au
          # hasard effacerait les matchs ajoutés par l'autre exécution.
          for essai in 1 2 3; do
            git fetch origin main || true
            if git merge origin/main --no-edit; then
              :
            else
              echo "⚠️ conflit — tentative de fusion JSON (essai $essai)"
              if python scripts/merge_json_state.py; then
                git commit --no-edit || true
              else
                git merge --abort 2>/dev/null || true
                sleep 5
                continue
              fi
            fi
            if git push; then echo "✅ PUSH OK"; exit 0; fi
            sleep 5
          done
          echo "❌ PUSH ÉCHOUÉ après 3 tentatives — commit local perdu avec le runner."
          exit 1
