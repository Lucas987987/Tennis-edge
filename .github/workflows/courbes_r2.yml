name: Courbes -> R2 (Cloudflare)

# Envoie les partitions de courbes (parts/live_* et parts/hist_*) dans le
# compartiment R2 « tennis-edge-courbes ». Remplace le circuit courbes_r2 du
# worker, muet depuis le 05/10 (il cherche des .jsonl, les partitions sont
# en .jsonl.gz depuis le 03/10). Détail : en-tête de scripts/courbes_r2.py.
#
# Ne commite RIEN : n'ajoute pas un octet au dépôt et ne peut pas entrer en
# conflit avec les collecteurs qui poussent toutes les trois minutes.
#
# Secrets : R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT.

on:
  workflow_dispatch:
  schedule:
    # Toutes les heures, à la minute 23 (loin du :00 où tout se bouscule).
    # Une heure de retard ne coûte rien : rien n'est perdu entre deux envois,
    # les partitions restent trois jours dans le dépôt.
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: courbes-r2
  cancel-in-progress: false

jobs:
  envoi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          # Uniquement ce qu'il faut : le script et les partitions de courbes.
          # Pas les ticks pm/kx, déjà archivés en Releases.
          sparse-checkout: |
            /scripts/courbes_r2.py
            /parts/live_match_*
            /parts/live_set1_*
            /parts/live_set2_*
            /parts/hist_book_*
            /parts/hist_set1_*
            /parts/hist_set2_*

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installer boto3
        run: pip install --quiet boto3

      - name: Envoyer vers R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: tennis-edge-courbes
        run: python scripts/courbes_r2.py
