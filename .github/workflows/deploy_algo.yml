name: Déployer le worker algo (site public + coffre privé)

# AJOUTÉ LE 23/10/2026. Déploie workers/algo : le site public de l'algorithme sous une adresse neutre
# (https://algo.tennis-edge.workers.dev, celle des vidéos) et l'accès au coffre privé du Lab (/prive/…).
# À chaque modification du dossier sur main, ou à la main.
# PRÉREQUIS (une fois) : un secret GitHub CLE_PRIVEE (40 caractères au hasard, gardé pour soi). Il devient le
# secret du worker ; il n'est jamais affiché. Le jeton Cloudflare doit avoir le droit « Workers R2 Storage ».

on:
  workflow_dispatch:
  # 24/11/2026 (paquet 412) : lancé aussi par « Appliquer un paquet » quand le paquet change workers/algo/
  repository_dispatch:
    types: [deployer-algo]
  push:
    branches: [main]
    paths:
      - 'workers/algo/**'
      - 'scripts/coffre.py'

permissions:
  contents: read

concurrency:
  group: deploy-algo
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # 18/11/2026 (paquet 284) : + la page, que lit un test du worker (cadence du direct) ; sans elle, le
          # déploiement échouait avant d'atteindre Cloudflare
          sparse-checkout: |
            workers/algo
            scripts/coffre.py
            algo/index.html

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérifier la syntaxe et les tests
        run: |
          node --check workers/algo/worker.js
          node --test workers/algo/test_worker.mjs workers/algo/test_comptes.mjs workers/algo/test_notifs.mjs workers/algo/test_tt.mjs workers/algo/test_notifs_tt.mjs

      - name: Clé du coffre présente ?
        env:
          CLE_PRIVEE: ${{ secrets.CLE_PRIVEE }}
        run: |
          if [ ${#CLE_PRIVEE} -lt 24 ]; then
            echo "::warning::Secret CLE_PRIVEE absent ou trop court (24 caractères minimum) : le site public marche, le coffre reste fermé."
          fi

      - name: Déployer sur Cloudflare
        uses: cloudflare/wrangler-action@v3
        env:
          CLE_PRIVEE: ${{ secrets.CLE_PRIVEE }}
          # 04/11/2026 : bouton « vidéo » du site — jeton GitHub du worker (droit Actions en écriture) : le secret
          # VIDEO_TOKEN s'il existe (conseillé : jeton limité à Actions), sinon PAQUET_TOKEN
          GH_TOKEN: ${{ secrets.VIDEO_TOKEN || secrets.PAQUET_TOKEN }}
          # 06/11/2026 : scores en direct (/live) — la même clé TennisApi que la collecte des feuilles
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/algo
          command: deploy
          secrets: |
            CLE_PRIVEE
            GH_TOKEN
            RAPIDAPI_KEY

      # 23/11/2026 (paquet 377) : e-mails des comptes abonnés (confirmation, mot de passe oublié) par Brevo. Secret GitHub
      # BREVO_CLE_SITE (paquet 379 : clé API Brevo propre au site, limitée aux e-mails transactionnels ; la clé
      # BREVO_API_KEY de l'Arena reste à part) ; absent : les comptes se créent, mais aucun e-mail ne part.
      - name: Clé Brevo des e-mails (si elle existe)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_CLE_SITE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: workers/algo
        run: |
          if [ -z "$BREVO_API_KEY" ]; then echo "::warning::Secret BREVO_CLE_SITE absent : aucun e-mail de compte ne part."; exit 0; fi
          printf '%s' "$BREVO_API_KEY" | npx --yes wrangler@4 secret put BREVO_API_KEY > /dev/null && echo "Clé Brevo posée."

      # 23/11/2026 (paquet 385) : alertes des comptes (nouveau compte, adresse confirmée, place fondateur, code utilisé)
      # sur le Telegram privé, avec les secrets GitHub TELEGRAM_TOKEN et TELEGRAM_CHAT_ID déjà utilisés par les rapports.
      - name: Telegram des alertes de comptes (s'il existe)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SITE_CHAT_ID: ${{ secrets.TELEGRAM_SITE_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: workers/algo
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "::warning::Telegram absent, pas d'alerte de compte."; exit 0; fi
          printf '%s' "$TELEGRAM_TOKEN" | npx --yes wrangler@4 secret put TELEGRAM_TOKEN > /dev/null
          printf '%s' "$TELEGRAM_CHAT_ID" | npx --yes wrangler@4 secret put TELEGRAM_CHAT_ID > /dev/null && echo "Alertes Telegram posées."
          # 478 : canal privé du site (facultatif) ; absent, tout reste dans TELEGRAM_CHAT_ID
          if [ -n "$TELEGRAM_SITE_CHAT_ID" ]; then printf '%s' "$TELEGRAM_SITE_CHAT_ID" | npx --yes wrangler@4 secret put TELEGRAM_SITE_CHAT_ID > /dev/null && echo "Canal du site posé."; fi

      # 23/11/2026 (paquet 386) : factures et rappels de fin d'accès. Secrets GitHub (facultatifs, jamais dans le dépôt) :
      # FACTURE_VENDEUR = {"nom":"…","adresse":"…","siret":"…","mention_tva":"TVA non applicable, art. 293 B du CGI"}
      # VIREMENT = {"titulaire":"…","iban":"FR76…","bic":"…"} (coordonnées données dans l'e-mail de rappel).
      - name: Vendeur des factures et coordonnées de virement (s'ils existent)
        env:
          FACTURE_VENDEUR: ${{ secrets.FACTURE_VENDEUR }}
          VIREMENT: ${{ secrets.VIREMENT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: workers/algo
        run: |
          if [ -n "$FACTURE_VENDEUR" ]; then printf '%s' "$FACTURE_VENDEUR" | npx --yes wrangler@4 secret put FACTURE_VENDEUR > /dev/null && echo "Vendeur des factures posé."; else echo "::warning::FACTURE_VENDEUR absent, aucune facture possible."; fi
          if [ -n "$VIREMENT" ]; then printf '%s' "$VIREMENT" | npx --yes wrangler@4 secret put VIREMENT > /dev/null && echo "Coordonnées de virement posées."; fi

      # 23/11/2026 (paquet 382) : anti-robots des comptes (Cloudflare Turnstile). Secrets GitHub TURNSTILE_SITEKEY et
      # TURNSTILE_SECRET (tableau de bord Cloudflare → Turnstile → widget « gamesetalgo.com ») ; absents : inactif.
      - name: Clés Turnstile (si elles existent)
        env:
          TURNSTILE_SITEKEY: ${{ secrets.TURNSTILE_SITEKEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: workers/algo
        run: |
          if [ -z "$TURNSTILE_SITEKEY" ] || [ -z "$TURNSTILE_SECRET" ]; then echo "::warning::Turnstile non configuré, inscriptions sans anti-robots."; exit 0; fi
          printf '%s' "$TURNSTILE_SITEKEY" | npx --yes wrangler@4 secret put TURNSTILE_SITEKEY > /dev/null
          printf '%s' "$TURNSTILE_SECRET" | npx --yes wrangler@4 secret put TURNSTILE_SECRET > /dev/null && echo "Turnstile posé."

      # 24/11/2026 (paquet 413, Lucas) : les déploiements partent tout seuls après un paquet — un échec ne doit pas passer
      # inaperçu. Message privé avec le lien du run ; le jeton n'est jamais affiché (curl -s, secrets masqués).
      - name: Alerte Telegram si le déploiement échoue
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIEN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || exit 0
          curl -s -o /dev/null --max-time 15 "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🔴 Déploiement du worker du site (algo) échoué. Journal : ${LIEN}" || true
