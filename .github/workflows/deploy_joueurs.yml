name: Déployer le worker joueurs

# CRÉÉ LE 09/10/2026. Fin du copier-coller dans Cloudflare : déposer
# workers/joueurs/worker-joueurs.js dans le dépôt suffit, ce workflow le met
# en ligne sur https://joueurs.tennis-edge.workers.dev puis vérifie que la
# page répond.
#
# Secrets (Settings -> Secrets and variables -> Actions) :
#   CLOUDFLARE_API_TOKEN   jeton « Edit Cloudflare Workers »
#   CLOUDFLARE_ACCOUNT_ID  identifiant du compte Cloudflare

on:
  workflow_dispatch:
  # 24/11/2026 (paquet 412) : lancé aussi par « Appliquer un paquet » quand le paquet change workers/joueurs/
  repository_dispatch:
    types: [deployer-joueurs]
  push:
    branches: [main]
    paths:
      - 'workers/joueurs/**'

permissions:
  contents: read

concurrency:
  group: deploy-joueurs
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: workers/joueurs

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Un fichier tronqué ou mal collé ne part pas en ligne : la page
      # actuelle reste en place.
      - name: Vérifier la syntaxe
        run: node --check workers/joueurs/worker-joueurs.js

      - name: Déployer sur Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/joueurs
          command: deploy

      - name: Vérifier que la page répond
        run: |
          sleep 5
          code=$(curl -s -o page.html -w '%{http_code}' "https://joueurs.tennis-edge.workers.dev/j?v=${GITHUB_RUN_ID}")
          echo "HTTP $code"
          grep -o '<h2>[^<]*</h2>' page.html | head -5 || true
          test "$code" = "200"
          grep -q 'Classement march' page.html

      # 24/11/2026 (paquet 413, Lucas) : les déploiements partent tout seuls après un paquet — un échec ne doit pas passer
      # inaperçu. Message privé avec le lien du run ; le jeton n'est jamais affiché (curl -s, secrets masqués).
      - name: Alerte Telegram si le déploiement échoue
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIEN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || exit 0
          curl -s -o /dev/null --max-time 15 "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🔴 Déploiement du worker joueurs échoué. Journal : ${LIEN}" || true
