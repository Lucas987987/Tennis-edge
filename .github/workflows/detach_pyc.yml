name: Détacher les .pyc (à lancer UNE FOIS)

# ──────────────────────────────────────────────────────────────────────────
# À QUOI ÇA SERT
# Trois fichiers scripts/__pycache__/*.pyc sont SUIVIS par git. Ils ont été
# ajoutés avant que .gitignore ne les couvre — et .gitignore n'a aucun effet
# sur un fichier déjà suivi. Conséquence : capture_closing (git add -A, toutes
# les 5-10 min) republie des .pyc neufs en continu ; quand steam_pipeline
# tourne, Python régénère les siens localement, "git merge" abandonne
# ("Your local changes would be overwritten"), la branche reste en retard et
# le push est rejeté en non-fast-forward. steam_pipeline ne peut donc JAMAIS
# pousser tant que ces fichiers restent suivis.
#
# POURQUOI CE WORKFLOW MARCHE LÀ OÙ UN WORKFLOW RÉCURRENT ÉCHOUERAIT
# Il ne fait AUCUN merge. Il repart de l'état exact du dépôt distant
# (git reset --hard origin/main), puis crée un commit qui en descend
# directement : le push est un simple fast-forward. Le conflit
# "supprimé par nous / modifié par eux" ne peut pas se produire.
#
# UTILISATION
# Onglet Actions -> "Détacher les .pyc" -> Run workflow. Une seule fois.
# Une fois réussi, ce fichier peut être supprimé du repo.
# ──────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: detach-pyc
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  detach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Détacher les .pyc et pousser (fast-forward, sans merge)
        run: |
          set -u
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          echo "── Fichiers .pyc actuellement SUIVIS par git ─────────────"
          git ls-files '*.pyc' '**/__pycache__/*' || true
          N=$(git ls-files '*.pyc' '**/__pycache__/*' | wc -l)
          echo "→ $N fichier(s) suivi(s)"
          if [ "$N" -eq 0 ]; then
            echo "✅ Rien à faire : aucun .pyc n'est suivi. Le correctif est déjà en place."
            exit 0
          fi

          # capture_closing pousse toutes les 5-10 min : on peut perdre la
          # course. On réessaie, en repartant à chaque fois de l'état distant
          # le plus récent -> le push reste toujours un fast-forward.
          for i in 1 2 3 4 5; do
            echo ""
            echo "── Tentative $i ─────────────────────────────────────────"
            git fetch origin main
            git reset --hard origin/main

            # --cached : retire de l'INDEX uniquement. Le fichier reste sur le
            # disque du runner (sans importance, il est détruit en fin de job).
            git rm -r --cached --quiet --ignore-unmatch '*.pyc' 'scripts/__pycache__'

            if git diff --cached --quiet; then
              echo "✅ Plus rien à détacher — un autre run l'a déjà fait."
              exit 0
            fi

            git commit -m "Détache les .pyc du suivi git (bloquaient le merge puis le push)"

            if git push origin HEAD:main; then
              echo ""
              echo "✅ PUSH RÉUSSI."
              echo "── Vérification ─────────────────────────────────────────"
              git fetch origin main
              RESTE=$(git ls-tree -r origin/main --name-only | grep -c '\.pyc$' || true)
              echo "→ .pyc encore suivis sur origin/main : $RESTE"
              if [ "$RESTE" -eq 0 ]; then
                echo "✅ Terminé. .gitignore reprend son effet : ils ne reviendront pas."
                echo "   Tu peux maintenant relancer Steam Pipeline."
              else
                echo "⚠️ Il en reste $RESTE — relance ce workflow."
              fi
              exit 0
            fi

            echo "⚠️ Push perdu de vitesse (capture_closing a poussé entre-temps). On réessaie."
            sleep 15
          done

          echo "❌ 5 tentatives échouées. Le repo est très actif :"
          echo "   désactive temporairement capture_closing.yml, relance, réactive."
          exit 1
