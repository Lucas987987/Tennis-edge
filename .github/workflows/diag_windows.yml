name: Diag Windows (couverture snapshots)

# Diagnostic ponctuel : pourquoi si peu de snapshots t25->t3 sur les matchs
# recents ? Reconstruit, depuis closing_lines.json, a quel point la capture
# s'est approchee du coup d'envoi de chaque match recent. Ne commite rien.

on:
  workflow_dispatch:
    inputs:
      recent_h:
        description: 'Fenetre d analyse en heures (matchs commences dans les X dernieres heures)'
        required: false
        default: '48'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # 22/11/2026 (paquet 346) — COTES EN PRIVÉ : en mode ETAT_CHAUD=prive, closing_lines, matches_oddspapi,
      # live_odds et les archives de clôtures ne sont plus dans le dépôt public ; rapatriés ici depuis R2 (lecture).
      # Dans les autres modes, rien ne change (seul ce qui manquerait au dépôt est rapatrié).
      - name: Cotes privées — rapatrier (paquet 346)
        env:
          ETAT_CHAUD: ${{ vars.ETAT_CHAUD || 'double' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python3 scripts/cotes_privees.py pull || true

      - name: Diagnostic des fenetres de capture
        env:
          CLOSING: closing_lines.json
          RECENT_H: ${{ github.event.inputs.recent_h || '48' }}
        run: python scripts/diag_windows.py
