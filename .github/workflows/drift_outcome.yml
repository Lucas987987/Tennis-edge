name: Drift vs outcome

# Calibre la loi "réalisé ≈ clôture" sur tes données : drift du favori (bwin dévigé)
# vs résultat réel (resultats_fast.json, repli resultats.json). Tableau dans le récap
# du run. Garde-fou n>=30. Lecture seule (rien n'est commité).
#
# Pré-requis : scripts/drift_outcome.py, book_curves.jsonl + resultats_fast.json à la racine.
#
# ⚠️ book_curves.jsonl n'existe plus depuis la migration en partitions du
# 14/08/2026 (remplacé par parts/hist_book_*.jsonl). La garde ci-dessous
# vérifie maintenant aussi parts/, mais scripts/drift_outcome.py doit lui
# aussi être adapté (lire via iter_hist_lines('book') d'oddspapi_v5.py) --
# sinon ce workflow tournera sans erreur mais sans rien trouver, comme
# c'était probablement le cas chaque lundi depuis 5 semaines.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"        # lundi 06:30 UTC

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # RESTAURATION DES PARTITIONS ARCHIVEES — AJOUTEE LE 02/10/2026.
      #
      # Ce workflow lit les partitions hist_* (via curves_parts ou
      # iter_hist_lines). Depuis que archive_curves sort celles de plus de
      # 28 jours vers les releases curves-2026-*, elles ne sont plus dans le
      # depot : sans cette etape, le job travaille sur un historique tronque
      # SANS lever d'erreur.
      #
      # Constate le 02/10 sur book_index : 1 251 matchs et 351 mouvements au
      # lieu de 1 863 et 650, et une reactivite devenue negative partout. Les
      # chiffres changeaient sans que rien ne le signale.
      #
      # restore_curves interroge l'index ET les releases directement : un
      # ARCHIVE_INDEX.json perime ne peut plus masquer de partitions.
      - name: Restaurer les partitions de courbes archivees
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/restore_curves.py || true

      - name: Calibration drift -> résultat
        env:
          SHARP_BOOK: bwin
          RESULTS_FILE: resultats_derived.json
          RESULTS_FALLBACK: resultats_derived.json
        run: |
          if [ ! -f book_curves.jsonl ] && [ ! -d parts ]; then
            echo "Ni book_curves.jsonl ni parts/ -- rien à analyser."; exit 0
          fi
          # resultats_fast.json et resultats.json valent "count": 0 depuis des
          # semaines : sans ce pont, l'étude tourne sur un fichier VIDE et ne
          # produit rien, en silence.
          python scripts/results_bridge.py || true
          python scripts/drift_outcome.py
