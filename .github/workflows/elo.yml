name: Signaux indépendants — Elo, fatigue, forme

# ──────────────────────────────────────────────────────────────────────────
# Deux étapes.
#   1. elo_fetch.py récupère les Elo publiés par Tennis Abstract (ATP + WTA,
#      Elo global + par surface, Challengers et ITF 50K+ inclus). Mis à jour
#      chaque semaine à la source, d'où le cron hebdomadaire.
#   2. elo_model.py construit notre Elo maison sur nos propres résultats et
#      compare les deux à Pinnacle sur les MÊMES matchs.
#
# Pourquoi la référence externe : notre Elo maison plafonne à 53,7 % de
# précision contre 66,9 % pour Pinnacle, faute d'historique (médiane d'un match
# par joueur). Tennis Abstract calcule sur l'historique complet du circuit.
#
# À SURVEILLER AU PREMIER RUN : le runner GitHub n'atteignait pas le dépôt
# Sackmann (egress bloqué). tennisabstract.com est un hôte différent, mais si
# la récupération échoue, elo_fetch.py écrit elo_fetch_diag.json et CONSERVE
# le fichier existant — il n'écrase jamais un référentiel valide par du vide.
# ──────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  schedule:
    # Lundi 05:10 UTC : Tennis Abstract publie en début de semaine.
    - cron: '10 5 * * 1'

permissions:
  contents: write

concurrency:
  group: elo
  cancel-in-progress: false

env:
  # Étape 4 (16/10/2026) : l'historique FIGÉ des courbes (parts/hist_*) est
  # servi par R2 ; les lecteurs rapatrient ce qui manque (scripts/hist_r2.py).
  R2_HIST_MATERIALIZE: '1'
  # R2 (15/10/2026) — voir README_MIGRATION_R2.md. off | double | on ;
  # sans variable de dépôt : double (git fait foi, R2 reçoit une copie).
  R2_PRIMARY: ${{ vars.R2_PRIMARY || 'double' }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  elo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # fetch-depth 0 requis par le merge de l'étape de commit ;
          # filter blob:none évite de télécharger les centaines de Mo de parts/.
          fetch-depth: 0
          filter: blob:none

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 22/11/2026 (paquet 346) — COTES EN PRIVÉ : en mode ETAT_CHAUD=prive, closing_lines, matches_oddspapi,
      # live_odds et les archives de clôtures ne sont plus dans le dépôt public ; rapatriés ici depuis R2 (lecture).
      # Dans les autres modes, rien ne change (seul ce qui manquerait au dépôt est rapatrié).
      - name: Cotes privées — rapatrier (paquet 346)
        env:
          ETAT_CHAUD: ${{ vars.ETAT_CHAUD || 'double' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python3 scripts/cotes_privees.py pull || true

      # urllib de la bibliothèque standard : aucune dépendance à installer.
      - name: Récupérer les Elo publiés
        run: python scripts/elo_fetch.py || echo "⚠️ récupération échouée — le modèle tournera sans référence"

      # 24/11/2026 (paquet 402) : « env » vide = fichier refusé par GitHub. Les courbes se reconstruisent
      # sans les clés R2 (comportement d'avant) ; le script suit, dans sa propre étape, avec les clés du journal privé.
      - name: Reconstruire les courbes
        run: python scripts/curves_parts.py rebuild || true

      - name: Construire le modèle et comparer au marché
        env:   # 393 : journal complet de scripts/discret.py → coffre privé (échec : Telegram)
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/discret.py -- python scripts/elo_model.py --eval

      # Même famille que l'Elo : des signaux qui ne regardent AUCUNE cote, et la
      # même cadence hebdomadaire. Plutôt qu'un 44e workflow pour un script qui
      # tourne en 30 s, on le rattache ici — la charge de maintenance d'un dépôt
      # à 43 workflows et 93 scripts est déjà le vrai facteur limitant.
      - name: Fatigue et forme récente
        env:   # 393 : journal complet de scripts/discret.py → coffre privé (échec : Telegram)
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/discret.py -- python scripts/player_form.py --eval || true

      - name: Commit
        if: always()
        run: |
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Fichier par fichier : un git add en bloc échoue ENTIÈREMENT si un
          # seul chemin manque, et n'ajoute alors rien (panne du 15/08/2026).
          for f in elo_reference.json elo_ratings.json elo_fetch_diag.json \
                   player_form.json; do
            [ -f "$f" ] && git add -- "$f" || echo "  (absent : $f)"
          done
          if git diff --staged --quiet; then
            echo 'Rien à commit.'; exit 0
          fi
          git commit -m "Signaux independants ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3; do
            git fetch origin main || true
            if git merge origin/main --no-edit; then
              if git push origin HEAD:main; then echo 'Push Elo OK.'; exit 0; fi
            else
              echo 'Merge non automatique — abandon.'; exit 1
            fi
            sleep 5
          done
          echo 'ERREUR: push impossible après 3 tentatives.'; exit 1
