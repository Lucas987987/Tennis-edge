name: Elo — référence et modèle

# ──────────────────────────────────────────────────────────────────────────
# Deux étapes.
#   1. elo_fetch.py récupère les Elo publiés par Tennis Abstract (ATP + WTA,
#      Elo global + par surface, Challengers et ITF 50K+ inclus). Mis à jour
#      chaque semaine à la source, d'où le cron hebdomadaire.
#   2. elo_model.py construit notre Elo maison sur nos propres résultats et
#      compare les deux à Pinnacle sur les MÊMES matchs.
#
# Pourquoi la référence externe : notre Elo maison plafonne à 53,7 % de
# précision contre 66,9 % pour Pinnacle, faute d'historique (médiane d'un match
# par joueur). Tennis Abstract calcule sur l'historique complet du circuit.
#
# À SURVEILLER AU PREMIER RUN : le runner GitHub n'atteignait pas le dépôt
# Sackmann (egress bloqué). tennisabstract.com est un hôte différent, mais si
# la récupération échoue, elo_fetch.py écrit elo_fetch_diag.json et CONSERVE
# le fichier existant — il n'écrase jamais un référentiel valide par du vide.
# ──────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  schedule:
    # Lundi 05:10 UTC : Tennis Abstract publie en début de semaine.
    - cron: '10 5 * * 1'

permissions:
  contents: write

concurrency:
  group: elo
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  elo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth 0 requis par le merge de l'étape de commit ;
          # filter blob:none évite de télécharger les centaines de Mo de parts/.
          fetch-depth: 0
          filter: blob:none

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # urllib de la bibliothèque standard : aucune dépendance à installer.
      - name: Récupérer les Elo publiés
        run: python scripts/elo_fetch.py || echo "⚠️ récupération échouée — le modèle tournera sans référence"

      - name: Construire le modèle et comparer au marché
        run: |
          python scripts/curves_parts.py rebuild || true
          python scripts/elo_model.py --eval

      - name: Commit
        if: always()
        run: |
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Fichier par fichier : un git add en bloc échoue ENTIÈREMENT si un
          # seul chemin manque, et n'ajoute alors rien (panne du 15/08/2026).
          for f in elo_reference.json elo_ratings.json elo_fetch_diag.json; do
            [ -f "$f" ] && git add -- "$f" || echo "  (absent : $f)"
          done
          if git diff --staged --quiet; then
            echo 'Rien à commit.'; exit 0
          fi
          git commit -m "Elo ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3; do
            git fetch origin main || true
            if git merge origin/main --no-edit; then
              if git push origin HEAD:main; then echo 'Push Elo OK.'; exit 0; fi
            else
              echo 'Merge non automatique — abandon.'; exit 1
            fi
            sleep 5
          done
          echo 'ERREUR: push impossible après 3 tentatives.'; exit 1
