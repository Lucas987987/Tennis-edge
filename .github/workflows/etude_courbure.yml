name: Étude - forme de la courbe d'étalonnage (paquet 497)

# 27/11/2026 — paquet 497. Les % extrêmes et les % du milieu sont-ils faux dans des sens différents ? Règle écrite
# dans l'en-tête de simulateur/etude_courbure.py (apprise 2018–2022, jugée une fois 2023 → mai 2026, circuit par
# circuit ; Challenger aussi comme en production). Se lance tout seul quand le paquet arrive sur main (ou à la main).
# Écrit simulateur/rapport_courbure.json et l'entrée 497 du journal. 0 requête d'API. Rien n'entre dans l'algo.
on:
  push:
    branches: [main]
    paths: ['simulateur/etude_courbure.py']
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: simulateur
  cancel-in-progress: false

jobs:
  etude:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /simulateur/
            /resultats_itf/
            /resultats_itf_femmes/
            /scripts/resultats_itf.py
            /scripts/feuilles_match.py
            /feuilles/
            /Tennis_Edge_Lab/live/pronostics_resultats.json
            /Tennis_Edge_Lab/books.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Archive Sackmann (fichiers de matchs seulement)
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Aneeshers/tennis-sackmann-archive.git /tmp/sackmann
          cd /tmp/sackmann
          git sparse-checkout set --no-cone 'atp_matches_20*.csv' 'atp_matches_qual_chall_20*.csv' 'wta_matches_20*.csv' 'wta_matches_qual_itf_20*.csv'
      - name: Apprendre 2018–2022, juger une fois 2023 → mai 2026
        run: |
          set -euo pipefail
          python simulateur/etude_courbure.py /tmp/sackmann . | tee /tmp/courbure.log
          cp simulateur/rapport_courbure.json /tmp/rapport_courbure.json
          echo '### Forme de la courbe (paquet 497, étude seule)' >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' /tmp/courbure.log >> "$GITHUB_STEP_SUMMARY"
      - name: Publier (rapport + entrée du journal, sans écraser le travail des autres)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/rapport_courbure.json simulateur/rapport_courbure.json
            python simulateur/etude_courbure.py --journal-depuis-rapport /tmp/rapport_courbure.json
            git add -- simulateur/rapport_courbure.json simulateur/journal_changements.json
            if git diff --cached --quiet; then echo 'Rien de nouveau.'; exit 0; fi
            git commit -q -m 'Étude 497 : forme de la courbe d étalonnage (rapport et journal)'
            if git push origin HEAD:main; then echo '✅ publié'; exit 0; fi
            sleep $((i * 10))
          done
          echo '::error::Push impossible après 6 essais'; exit 1
