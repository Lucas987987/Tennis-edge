name: Étude Elo tennis de table

# 26/11/2026 (paquet 487, Lucas : « lance » le ping-pong) — première étape : un Elo joueur par joueur sur les résultats
# collectés (historique/tennis_de_table/), jugé UNE SEULE FOIS du 01/10/2025 au dernier jour (règle écrite dans
# l'en-tête de tennis_de_table/etude_elo_tt.py avant tout essai). À lancer une fois l'historique complet (01/01/2021).
# Rien n'est publié sur le site. Le rapport ne contient que des comptes et des moyennes.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etude-elo-tt
  cancel-in-progress: false

jobs:
  etude:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /tennis_de_table/
            /historique/tennis_de_table/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Tests de l'étude (données factices)
        run: python -m unittest discover -s tennis_de_table/tests -p 'test_*.py'
      - name: Apprendre puis juger une seule fois
        run: |
          set -euo pipefail
          python tennis_de_table/etude_elo_tt.py . | tee /tmp/elo_tt.log
          cp tennis_de_table/rapport_elo_tt.json /tmp/rapport_elo_tt.json
          { echo '### Elo du tennis de table (paquet 487)'; sed 's/^/    /' /tmp/elo_tt.log; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publier le rapport
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/rapport_elo_tt.json tennis_de_table/rapport_elo_tt.json
            git add -- tennis_de_table/rapport_elo_tt.json
            if git diff --cached --quiet; then echo 'Rien de nouveau.'; exit 0; fi
            git commit -q -m 'Étude Elo tennis de table (rapport)'
            if git push origin HEAD:main; then echo '✅ publié'; exit 0; fi
            sleep $((i * 10))
          done
          echo '::error::Push impossible après 6 essais'; exit 1
