name: Étude tennis de table étape 2

# 27/11/2026 (paquet 494, Lucas : « fais ça pour le tennis de table ») — étape 2 : une pente par ligue puis la
# simulation aux points (manches à 11, match en 3 ou 4 manches gagnantes), jugées UNE SEULE FOIS du 01/10/2025 au dernier
# jour (règle écrite dans l'en-tête de tennis_de_table/etude_etape2_tt.py avant tout essai). Ligues du produit :
# International et Pologne. Rien n'est publié sur le site ; le rapport ne contient que des comptes et des moyennes.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etude-etape2-tt
  cancel-in-progress: false

jobs:
  etude:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /tennis_de_table/
            /historique/tennis_de_table/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Tests de l'étude (données factices)
        run: python -m unittest discover -s tennis_de_table/tests -p 'test_*.py'
      - name: Apprendre puis juger une seule fois
        run: |
          set -euo pipefail
          python tennis_de_table/etude_etape2_tt.py . | tee /tmp/etape2_tt.log
          cp tennis_de_table/rapport_etape2_tt.json /tmp/rapport_etape2_tt.json
          { echo '### Tennis de table, étape 2 (paquet 494)'; sed 's/^/    /' /tmp/etape2_tt.log; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publier le rapport
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/rapport_etape2_tt.json tennis_de_table/rapport_etape2_tt.json
            git add -- tennis_de_table/rapport_etape2_tt.json
            if git diff --cached --quiet; then echo 'Rien de nouveau.'; exit 0; fi
            git commit -q -m 'Étude tennis de table étape 2 (rapport)'
            if git push origin HEAD:main; then echo '✅ publié'; exit 0; fi
            sleep $((i * 10))
          done
          echo '::error::Push impossible après 6 essais'; exit 1
