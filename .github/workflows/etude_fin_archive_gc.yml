name: Contrôle doublons fin d'archive + étude Grand Chelem (paquet 533)

# 1. controle_doublons_fin_archive.py : COMPTAGE SEUL, rien n'est modifié.
# 2. etude_grand_chelem_feuilles.py : règle écrite le 28/11/2026 dans l'en-tête, avant tout calcul.
# Le journal n'affiche que des comptes et des log loss.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

concurrency:
  group: etude-fin-archive-gc
  cancel-in-progress: false

jobs:
  etude:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/parts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Matchs suivis privés — rapatrier
        env:
          ETAT_CHAUD: ${{ vars.ETAT_CHAUD || 'double' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python3 scripts/cotes_privees.py pull > /dev/null 2>&1 || true
      - name: Archive Sackmann (fichiers de matchs seulement)
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Aneeshers/tennis-sackmann-archive.git /tmp/sackmann
          cd /tmp/sackmann
          git sparse-checkout set --no-cone 'atp_matches_20*.csv' 'atp_matches_qual_chall_20*.csv' 'wta_matches_20*.csv' 'wta_matches_qual_itf_20*.csv'
      - name: Doublons de fin d'archive (comptage)
        run: |
          set -euo pipefail
          python simulateur/controle_doublons_fin_archive.py /tmp/sackmann . | tee /tmp/doublons.log
          { echo '### Doublons de fin d archive (comptage seul)'; sed 's/^/    /' /tmp/doublons.log; } >> "$GITHUB_STEP_SUMMARY"
          cp simulateur/rapport_doublons_fin_archive.json /tmp/
      - name: Étude Grand Chelem dans nos feuilles
        run: |
          set -euo pipefail
          python simulateur/etude_grand_chelem_feuilles.py /tmp/sackmann . | tee /tmp/gc.log
          { echo '### Grand Chelem dans nos feuilles'; sed 's/^/    /' /tmp/gc.log; } >> "$GITHUB_STEP_SUMMARY"
          cp simulateur/rapport_grand_chelem_feuilles.json /tmp/
      - name: Publier les rapports
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/rapport_doublons_fin_archive.json /tmp/rapport_grand_chelem_feuilles.json simulateur/
            git add -- simulateur/rapport_doublons_fin_archive.json simulateur/rapport_grand_chelem_feuilles.json
            if git diff --cached --quiet; then echo 'Rien de nouveau.'; exit 0; fi
            git commit -q -m 'Paquet 533 - doublons de fin d archive et étude Grand Chelem (rapports)'
            if git push origin HEAD:main; then echo '✅ publié'; exit 0; fi
            sleep $((i * 10))
          done
          echo '::error::Push impossible après 6 essais'; exit 1
