name: Étude - niveau du match (paquet 301)

# 20/11/2026 — paquet 301. Un même écart d'Elo vaut-il la même chose en haut et en bas du circuit ? Règle écrite
# dans l'en-tête de simulateur/etude_pente_niveau.py (appris 2018–2022, jugé une fois sur 2023 → juin 2026, circuit
# par circuit). Se lance tout seul quand le paquet arrive sur main (ou à la main). Écrit
# simulateur/rapport_pente_niveau.json et l'entrée 301 du journal, avec les résultats. 0 requête d'API.
# Rien n'entre dans l'algo.
on:
  push:
    branches: [main]
    paths: ['simulateur/etude_pente_niveau.py']
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: simulateur
  cancel-in-progress: false

jobs:
  etude:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /simulateur/
            /scripts/closing_store.py
            /Tennis_Edge_Lab/books.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Archive Sackmann (fichiers de matchs seulement)
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Aneeshers/tennis-sackmann-archive.git /tmp/sackmann
          cd /tmp/sackmann
          git sparse-checkout set --no-cone 'atp_matches_20*.csv' 'atp_matches_qual_chall_20*.csv' 'wta_matches_20*.csv' 'wta_matches_qual_itf_20*.csv'
      - name: Apprendre sur 2018–2022, juger une fois sur 2023 → juin 2026
        run: |
          set -euo pipefail
          python simulateur/etude_pente_niveau.py /tmp/sackmann . | tee /tmp/pente_niveau.log
          cp simulateur/rapport_pente_niveau.json /tmp/rapport_pente_niveau.json
          echo '### Niveau du match (paquet 301)' >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' /tmp/pente_niveau.log >> "$GITHUB_STEP_SUMMARY"
      - name: Publier (rapport + entrée du journal, sans écraser le travail des autres)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5 6; do
            # À chaque essai : main tel qu'il est maintenant, puis NOTRE rapport et NOTRE entrée (l'entrée du
            # paquet 301 est remplacée si elle existe déjà) : jamais de rebase sur le journal.
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/rapport_pente_niveau.json simulateur/rapport_pente_niveau.json
            python simulateur/etude_pente_niveau.py --journal-depuis-rapport /tmp/rapport_pente_niveau.json
            git add -- simulateur/rapport_pente_niveau.json simulateur/journal_changements.json
            if git diff --cached --quiet; then echo 'Rien de nouveau.'; exit 0; fi
            git commit -q -m 'Étude 301 : niveau du match (rapport et journal)'
            if git push origin HEAD:main; then echo '✅ publié'; exit 0; fi
            sleep $((i * 10))
          done
          echo '::error::Push impossible après 6 essais'; exit 1
