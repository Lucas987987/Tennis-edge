name: Étude - poids du mélange selon le modèle le plus sûr (paquet 469)

# 26/11/2026 — paquet 469 (Lucas : quand l'Elo et la simulation divergent, qui a raison ?).
# Le poids de la simulation doit-il dépendre du modèle le plus sûr (deux régimes, variante à trois régimes) ?
# Règle écrite dans l'en-tête de simulateur/etude_plus_sur.py (apprise 01/2025 → 05/2026, jugée une fois sur
# 06 → 12/2024, face à un témoin « poids uniques réappris »). Se lance tout seul quand le paquet arrive sur main (ou à la main). Écrit
# simulateur/rapport_plus_sur.json et l'entrée 469 du journal. 0 requête d'API. Rien n'entre dans l'algo.
# Journal du run : comptes et moyennes seulement, aucun nom de joueur.
# scripts/feuilles_match.py est nécessaire : scripts/resultats_itf.py l'importe ; sans lui, les résultats ITF hommes
# ne sont pas lus (0 match, sans erreur) et l'Elo n'est plus celui de la production. Le script s'arrête dans ce cas.
on:
  push:
    branches: [main]
    paths: ['simulateur/etude_plus_sur.py']
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: simulateur
  cancel-in-progress: false

jobs:
  etude:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /simulateur/
            /resultats_itf/
            /resultats_itf_femmes/
            /scripts/resultats_itf.py
            /scripts/feuilles_match.py
            /feuilles/
            /Tennis_Edge_Lab/books.py
            /Tennis_Edge_Lab/live/pronostics_resultats.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Archive Sackmann (fichiers de matchs seulement)
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Aneeshers/tennis-sackmann-archive.git /tmp/sackmann
          cd /tmp/sackmann
          git sparse-checkout set --no-cone 'atp_matches_20*.csv' 'atp_matches_qual_chall_20*.csv' 'wta_matches_20*.csv' 'wta_matches_qual_itf_20*.csv'
      - name: Rejouer Elo et simulation, apprendre 01/2025 → 05/2026, juger une fois 06 → 12/2024
        run: |
          set -euo pipefail
          python simulateur/etude_plus_sur.py /tmp/sackmann . | tee /tmp/plus_sur.log
          cp simulateur/rapport_plus_sur.json /tmp/rapport_plus_sur.json
          echo '### Poids du mélange selon le modèle le plus sûr (paquet 469, étude seule)' >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' /tmp/plus_sur.log >> "$GITHUB_STEP_SUMMARY"
      - name: Publier (rapport + entrée du journal, sans écraser le travail des autres)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5 6; do
            # À chaque essai, main tel qu'il est maintenant, puis NOTRE rapport et NOTRE entrée (l'entrée du
            # paquet 469 est remplacée si elle existe déjà), jamais de rebase sur le journal.
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/rapport_plus_sur.json simulateur/rapport_plus_sur.json
            python simulateur/etude_plus_sur.py --journal-depuis-rapport /tmp/rapport_plus_sur.json
            git add -- simulateur/rapport_plus_sur.json simulateur/journal_changements.json
            if git diff --cached --quiet; then echo 'Rien de nouveau.'; exit 0; fi
            git commit -q -m 'Étude 469 - poids du mélange selon le modèle le plus sûr (rapport et journal)'
            if git push origin HEAD:main; then echo '✅ publié'; exit 0; fi
            sleep $((i * 10))
          done
          echo '::error::Push impossible après 6 essais'; exit 1
