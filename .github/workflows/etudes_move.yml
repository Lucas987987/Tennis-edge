name: Etudes Mouvement (set1 + anatomie)

# Lance les deux etudes offline sur les mouvements de cote :
#   - move_vs_set1.py  : le move predit-il le gain du 1er set / du match
#                        au-dela de la cloture ?
#   - move_anatomy.py  : 6 angles (forme, timing, match court/abandon,
#                        fakeout, crossover, volatilite/calibration).
# Lecture seule (clv_history.jsonl + resultats_oddspapi.json), AUCUNE API.
# Resultats visibles dans le log du run ET commites dans etudes_move_report.txt.
#
# CORRIGE (16/08/2026) : book_asymmetry.py, margin_dynamics.py et
# capture_quality.py referencent toujours BOOK_FILE=book_curves.jsonl (nom
# legacy disparu a la migration en partitions du 14/08), mais ils lisent
# desormais via ov.open_curves(), qui bascule automatiquement sur
# parts/hist_book_*.jsonl. Le nom legacy reste donc valide comme ALIAS.
# Un fichier vraiment introuvable leve maintenant une erreur VISIBLE au lieu
# de produire une etude vide en silence.

# PYTHONDONTWRITEBYTECODE : aucun .pyc n'est plus genere. Les .pyc
# regeneres a chaque run faisaient echouer le merge puis le push
# (panne du 16/08/2026). Portee workflow = toutes les etapes.
env:
  PYTHONDONTWRITEBYTECODE: '1'

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  etudes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Move vs Set 1
        env:
          CLV_FILE: clv_history.jsonl
          RESULTS: resultats_oddspapi.json
        run: |
          echo "=== RAPPORT ETUDES MOUVEMENT — $(date -u +%FT%TZ) ===" > etudes_move_report.txt
          echo "" >> etudes_move_report.txt
          python scripts/move_vs_set1.py | tee -a etudes_move_report.txt
      - name: Anatomie des mouvements (6 angles)
        env:
          CLV_FILE: clv_history.jsonl
          RESULTS: resultats_oddspapi.json
        run: |
          echo "" >> etudes_move_report.txt
          python scripts/move_anatomy.py | tee -a etudes_move_report.txt
      - name: Points de reference (snapshots, marge, micro-move)
        env:
          CLOSING: closing_lines.json
          RESULTS: resultats_oddspapi.json
        run: |
          echo "" >> etudes_move_report.txt
          python scripts/reference_points.py | tee -a etudes_move_report.txt
      - name: Asymetrie books mous (steam vs drift)
        env:
          CLV_FILE: clv_history.jsonl
          BOOK_FILE: book_curves.jsonl
        run: |
          echo "" >> etudes_move_report.txt
          python scripts/book_asymmetry.py | tee -a etudes_move_report.txt
      - name: Continuation post-alerte (T-35)
        env:
          ALERTS_LOG: odds_alerts_log.jsonl
          CLV_FILE: clv_history.jsonl
        run: |
          echo "" >> etudes_move_report.txt
          python scripts/alert_continuation.py | tee -a etudes_move_report.txt
      - name: Momentum BO3 (set1/set2)
        env:
          CLV_FILE: clv_history.jsonl
          RESULTS: resultats_oddspapi.json
        run: |
          echo "" >> etudes_move_report.txt
          python scripts/bo3_momentum.py | tee -a etudes_move_report.txt
      - name: Efficacite de la ligne d'ouverture
        env:
          CLV_FILE: clv_history.jsonl
          RESULTS: resultats_oddspapi.json
        run: |
          echo "" >> etudes_move_report.txt
          python scripts/opening_efficiency.py | tee -a etudes_move_report.txt
      - name: Moves nocturnes vs diurnes
        env:
          CLV_FILE: clv_history.jsonl
          RESULTS: resultats_oddspapi.json
        run: |
          echo "" >> etudes_move_report.txt
          python scripts/night_moves.py | tee -a etudes_move_report.txt
      - name: Recurrence joueur (steam qui suit)
        env:
          CLV_FILE: clv_history.jsonl
          RESULTS: resultats_oddspapi.json
        run: |
          echo "" >> etudes_move_report.txt
          python scripts/player_steam.py | tee -a etudes_move_report.txt
      - name: Dynamique des marges (par book)
        env:
          CLOSING: closing_lines.json
          CLV_FILE: clv_history.jsonl
          BOOK_FILE: book_curves.jsonl
          RESULTS: resultats_oddspapi.json
        run: |
          echo "" >> etudes_move_report.txt
          python scripts/margin_dynamics.py | tee -a etudes_move_report.txt
      - name: Audit capture + triangulation closings
        env:
          CLOSING: closing_lines.json
          CLV_FILE: clv_history.jsonl
          BOOK_FILE: book_curves.jsonl
        run: |
          echo "" >> etudes_move_report.txt
          python scripts/capture_quality.py | tee -a etudes_move_report.txt
      - name: Commit du rapport
        run: |
          # PANNE DU 16/08/2026 -- cause exacte, tracee par pipeline_status.
          # Les .pyc sont SUIVIS par git (ajoutes avant le .gitignore, qui ne
          # s'applique plus une fois un fichier suivi). capture_closing tourne
          # toutes les 5-10 min avec "git add -A" et republie donc des .pyc
          # neufs en continu. Quand un autre workflow tourne, il regenere les
          # siens localement -> "git merge" ABANDONNE ("Your local changes to
          # the following files would be overwritten") -> branche en retard ->
          # push rejete en non-fast-forward. Resultat observe : 7 fichiers
          # commites localement (dont 830 lignes de moves_detail_hist), jamais
          # pousses. On efface donc les .pyc du disque avant toute action git.
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name '*.pyc' -delete 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f etudes_move_report.txt ] && git add -- etudes_move_report.txt
          git diff --cached --quiet || git commit -m "etudes mouvement $(date -u +%FT%TZ)"
          # BOUCLE DE REPRISE AVEC FUSION DES CONFLITS JSON.
          # Ce workflow tourne toutes les 5-10 min : deux exécutions se
          # chevauchent régulièrement, et git tombe en conflit sur les JSON
          # d'état (closing_lines, capture_state, matches_oddspapi...). Le run
          # entier était alors perdu, y compris les partitions live qui,
          # elles, avaient fusionné sans problème via merge=union.
          # merge_json_state.py fusionne ces objets JSON clé par clé, sans rien
          # perdre : closing_lines est un ACCUMULATEUR, prendre une version au
          # hasard effacerait les matchs ajoutés par l'autre exécution.
          # RETRY RENFORCE — 6 tentatives, attente croissante (03/10/2026).
          #
          # 3 tentatives a 5 s ne suffisaient plus. Message observe sur
          # fetch_book_curves : cannot lock ref 'refs/heads/main' — un autre
          # workflow avait pousse entre le fetch et le push, TROIS fois de suite.
          # Resultat : hist_curves_meta.json fige 538 h, detecte seulement par
          # audit_qa a l'age du fichier.
          #
          # La contention a augmente : une douzaine de workflows commitent en
          # continu, courbes_alertes pousse toutes les 3 min. L'attente doit
          # couvrir la duree d'un push concurrent, pas 5 secondes.
          # 2+4+8+16+32 = 62 s cumulees, soit deux cycles de capture complets.
          attente=2
          for essai in 1 2 3 4 5 6; do
            git fetch origin main || true
            if git merge origin/main --no-edit; then
              if git push; then
                echo "✅ PUSH OK (tentative $essai)"
                exit 0
              fi
              echo "⚠️ push refuse · tentative $essai/6"
            else
              echo "⚠️ merge en conflit · tentative $essai/6"
              git merge --abort 2>/dev/null || true
            fi
            [ "$essai" -lt 6 ] && { echo "   nouvelle tentative dans ${attente}s"; sleep "$attente"; attente=$((attente*2)); }
          done
          echo "❌ PUSH ÉCHOUÉ après 6 tentatives (62 s cumulées) — commit local perdu avec le runner."
          exit 1
