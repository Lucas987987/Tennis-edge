name: Fetch Book Curves

# ──────────────────────────────────────────────────────────────────────────
# MODIF : fetch_book_curves.py patché produit aussi set1_curves.jsonl et
# set2_curves.jsonl (même appel, zéro requête de plus). Le git add les inclut
# pour qu'ils PERSISTENT (sinon perdus à chaque run).
# BOOKS : tu peux élargir à la même liste FR ; pinnacle DOIT rester (référence sharp).
# Rappel : ce workflow ne traite que les matchs TERMINÉS -> alimente le track
# record / backtest / journal, pas les alertes forward.
# ──────────────────────────────────────────────────────────────────────────

# PYTHONDONTWRITEBYTECODE : aucun .pyc n'est plus genere. Les .pyc
# regeneres a chaque run faisaient echouer le merge puis le push
# (panne du 16/08/2026). Portee workflow = toutes les etapes.
env:
  PYTHONDONTWRITEBYTECODE: '1'

on:
  workflow_dispatch:
  schedule:
    - cron: '45 23 * * *'

permissions:
  contents: write

jobs:
  fetch-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Courbes books (match + set1 + set2) via historical v5
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          BOOKS: "pinnacle,betfair-ex,winamax.fr,unibet.fr,bet365.fr,pmu,zebet.fr,netbet.fr,bwin.fr,genybet.fr,vbet.fr,circusbet.fr,feelingbet.fr,unibet,bwin,betsson,bet365,williamhill,betway,1xbet,888sport,leovegas,tipico,netbet,betsafe,nordicbet,coolbet,interwetten,vbet,marathonbet,22bet"
        run: python scripts/fetch_book_curves.py
      - name: Migration ponctuelle vers partitions mensuelles (idempotent)
        # book_curves.jsonl a atteint 140,73 Mo (14/08/2026) -> GitHub rejette
        # tout push > 100 Mo, gelant le fichier distant SANS ERREUR VISIBLE
        # ("git push || true" avalait l'échec chaque nuit). Ce script bascule
        # vers parts/hist_<market>_<YYYY-MM>.jsonl (une partition par mois,
        # largement < 100 Mo chacune) et supprime les fichiers monolithiques.
        # Sans effet si déjà migré (fichiers legacy absents -> ignoré).
        run: python scripts/migrate_hist_partitions.py || true
      - name: Score de fiabilité des books (persistance du retard + jumeaux)
        run: python scripts/book_reliability.py || true
      - name: Commit
        run: |
          # PANNE DU 16/08/2026 -- cause exacte, tracee par pipeline_status.
          # Les .pyc sont SUIVIS par git (ajoutes avant le .gitignore, qui ne
          # s'applique plus une fois un fichier suivi). capture_closing tourne
          # toutes les 5-10 min avec "git add -A" et republie donc des .pyc
          # neufs en continu. Quand un autre workflow tourne, il regenere les
          # siens localement -> "git merge" ABANDONNE ("Your local changes to
          # the following files would be overwritten") -> branche en retard ->
          # push rejete en non-fast-forward. Resultat observe : 7 fichiers
          # commites localement (dont 830 lignes de moves_detail_hist), jamais
          # pousses. On efface donc les .pyc du disque avant toute action git.
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name '*.pyc' -delete 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git rm --cached book_curves.jsonl set1_curves.jsonl set2_curves.jsonl 2>/dev/null || true
          git add parts/hist_*.jsonl 2>/dev/null || true
          [ -f hist_curves_meta.json ] && git add -- hist_curves_meta.json
          git diff --cached --quiet || git commit -m "book+set curves partitionnées $(date -u +%FT%TZ)"
          # "merge" et non "rebase" : un rebase en conflit après un commit
          # peut écarter ce commit en silence -- exactement le bug qui a
          # figé set_results.json pendant 1 semaine sur steam_pipeline.yml.
          git fetch origin main 2>&1 || echo "⚠️ fetch échoué"
          git merge origin/main --no-edit 2>&1 || echo "⚠️ merge en conflit -- le commit local n'est pas perdu"
          git push 2>&1 || echo "❌ PUSH ÉCHOUÉ -- voir message ci-dessus"
