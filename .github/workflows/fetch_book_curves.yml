name: Fetch Book Curves

# ──────────────────────────────────────────────────────────────────────────
# fetch_book_curves.py produit aussi les courbes set1 et set2 en un seul appel.
# Les partitions V6.4 sont synchronisées avec R2; un artefact Actions de
# 90 jours sert de file de reprise uniquement si R2 est indisponible.
# BOOKS : tu peux élargir à la même liste FR ; pinnacle DOIT rester (référence sharp).
# Rappel : ce workflow ne traite que les matchs TERMINÉS -> alimente le track
# record / backtest / journal, pas les alertes forward.
# ──────────────────────────────────────────────────────────────────────────

# PYTHONDONTWRITEBYTECODE : aucun .pyc n'est plus genere. Les .pyc
# regeneres a chaque run faisaient echouer le merge puis le push
# (panne du 16/08/2026). Portee workflow = toutes les etapes.
env:
  PYTHONDONTWRITEBYTECODE: '1'

on:
  workflow_dispatch:
  schedule:
    - cron: '45 23 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: fetch-book-curves-v64
  cancel-in-progress: false

jobs:
  fetch-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # RESTAURATION DES PARTITIONS ARCHIVEES.
      #
      # Ce workflow lance un script dont le resultat depend de
      # l'historique COMPLET. Depuis que archive_curves sort les
      # partitions de plus de 28 jours vers les releases curves-2026-*,
      # elles ne sont plus dans le depot : sans cette etape, le job
      # travaille sur un historique tronque SANS lever d'erreur.
      #
      # Constate le 02/10 sur book_index : 1 251 matchs au lieu de 1 863,
      # et une reactivite devenue negative partout. Les chiffres
      # changeaient sans que rien ne le signale.
      #
      # `|| true` : une panne de release ne doit pas bloquer le job.
      # restore_curves interroge l'index ET les releases directement.
      - name: Restaurer les partitions de courbes archivees
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_REQUIRED: '1'
        run: |
          pip install --quiet boto3
          python scripts/restore_curves.py

      - name: Prepare R2 V6.4 state
        continue-on-error: true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          rm -rf parts/v64-outbox parts/v64-baseline.json
          python scripts/r2_v64.py prepare \
            --namespace bookmakers/match \
            --namespace bookmakers/set1 \
            --namespace bookmakers/set2 \
            --namespace bookmakers/completion

      - name: Courbes books (match + set1 + set2) via historical v5
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          BOOKS: "pinnacle,betfair-ex,winamax.fr,unibet.fr,bet365.fr,pmu,zebet.fr,netbet.fr,bwin.fr,genybet.fr,vbet.fr,circusbet.fr,feelingbet.fr,unibet,bwin,betsson,bet365,williamhill,betway,1xbet,888sport,leovegas,tipico,netbet,betsafe,nordicbet,coolbet,interwetten,vbet,marathonbet,22bet"
        run: python scripts/fetch_book_curves.py
      - name: Score de fiabilité des books (persistance du retard + jumeaux)
        run: python scripts/book_reliability.py || true

      - name: Persist bookmaker partitions to R2
        if: success()
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          python scripts/r2_v64.py push \
            --namespace bookmakers/match \
            --namespace bookmakers/set1 \
            --namespace bookmakers/set2 \
            --namespace bookmakers/completion

      - name: Export durable R2 outbox
        if: failure()
        run: |
          python scripts/r2_v64.py export-outbox \
            --namespace bookmakers/match \
            --namespace bookmakers/set1 \
            --namespace bookmakers/set2 \
            --namespace bookmakers/completion

      - name: Preserve V6.4 outbox for retry
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v64-outbox-${{ github.run_id }}-${{ github.run_attempt }}
          path: parts/v64-outbox/
          if-no-files-found: error
          retention-days: 90

      - name: Commit
        run: |
          # PANNE DU 16/08/2026 -- cause exacte, tracee par pipeline_status.
          # Les .pyc sont SUIVIS par git (ajoutes avant le .gitignore, qui ne
          # s'applique plus une fois un fichier suivi). capture_closing tourne
          # toutes les 5-10 min avec "git add -A" et republie donc des .pyc
          # neufs en continu. Quand un autre workflow tourne, il regenere les
          # siens localement -> "git merge" ABANDONNE ("Your local changes to
          # the following files would be overwritten") -> branche en retard ->
          # push rejete en non-fast-forward. Resultat observe : 7 fichiers
          # commites localement (dont 830 lignes de moves_detail_hist), jamais
          # pousses. On efface donc les .pyc du disque avant toute action git.
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name '*.pyc' -delete 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git rm --cached book_curves.jsonl set1_curves.jsonl set2_curves.jsonl 2>/dev/null || true
          # CHACUN SES PARTITIONS. « git add -A parts/ » balayait TOUT le
          # dossier et embarquait pm_ticks_* et kx_ticks_* tels qu'ils étaient
          # au checkout. Or les collecteurs Polymarket et Kalshi y AJOUTENT des
          # lignes en parallèle : deux workflows modifiaient donc le même
          # fichier en fin de fichier, le merge partait en conflit, et le push
          # était rejeté. C'est très probablement la cause des 54 h sans
          # régénération de hist_curves_meta.json signalées par l'audit.
          # Les gros historiques sont exclusivement servis par R2/les Releases.
          # Ce workflow ne stage plus jamais parts/hist_*.
          [ -f hist_curves_meta.json ] && git add -- hist_curves_meta.json
          git diff --cached --quiet || git commit -m "book+set curves partitionnées $(date -u +%FT%TZ)"
          # "merge" et non "rebase" : un rebase en conflit après un commit
          # peut écarter ce commit en silence -- exactement le bug qui a
          # figé set_results.json pendant 1 semaine sur steam_pipeline.yml.
          # UN PUSH QUI ÉCHOUE DOIT FAIRE ÉCHOUER LE RUN.
          # « git push || echo » rendait le job VERT alors que rien n'était
          # poussé : le dépôt est resté figé 54 h sans que rien ne le signale,
          # jusqu'à ce que audit_qa le détecte par l'âge du fichier. Un échec
          # silencieux est le pire mode de panne de ce projet.
          # On réessaie 3 fois — un merge peut échouer parce qu'un autre
          # workflow a poussé entre-temps — puis on sort en erreur.
          attente=2
          for essai in 1 2 3 4 5 6; do
            git fetch origin main || true
            if git merge origin/main --no-edit; then
              if git push; then echo "✅ PUSH OK"; exit 0; fi
            else
              echo "⚠️ merge en conflit — tentative $essai"
              # RESOLUTION DU CONFLIT JSON — ajoutee le 26/10/2026.
              #
              # Un conflit de CONTENU sur closing_lines.json se reproduit a
              # chaque tentative : relancer ne sert a rien. Observe sur
              # fetch_clv, bloque 2 jours avec « tentative 6/6 ».
              #
              # merge_json_state.py fusionne les objets JSON cle par cle.
              # closing_lines est un ACCUMULATEUR : prendre une version au
              # hasard effacerait les matchs ajoutes par l'autre execution.
              if python scripts/merge_json_state.py; then
                git commit --no-edit || true
              else
                git merge --abort 2>/dev/null || true
              fi
            fi
            sleep "$attente"; attente=$((attente*2))
          done
          echo "❌ PUSH ÉCHOUÉ après 6 tentatives (62 s cumulées) — le commit local est perdu avec le runner."
          exit 1
