name: Fetch Book Curves

# ──────────────────────────────────────────────────────────────────────────
# MODIF : fetch_book_curves.py patché produit aussi set1_curves.jsonl et
# set2_curves.jsonl (même appel, zéro requête de plus). Le git add les inclut
# pour qu'ils PERSISTENT (sinon perdus à chaque run).
# BOOKS : tu peux élargir à la même liste FR ; pinnacle DOIT rester (référence sharp).
# Rappel : ce workflow ne traite que les matchs TERMINÉS -> alimente le track
# record / backtest / journal, pas les alertes forward.
# ──────────────────────────────────────────────────────────────────────────

# PYTHONDONTWRITEBYTECODE : aucun .pyc n'est plus genere. Les .pyc
# regeneres a chaque run faisaient echouer le merge puis le push
# (panne du 16/08/2026). Portee workflow = toutes les etapes.
env:
  # Étape 4 (16/10/2026) : l'historique FIGÉ des courbes (parts/hist_*) est
  # servi par R2 ; les lecteurs rapatrient ce qui manque (scripts/hist_r2.py).
  R2_HIST_MATERIALIZE: '1'
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  PYTHONDONTWRITEBYTECODE: '1'

on:
  workflow_dispatch:
    inputs:
      r2_v64_shadow:
        description: "Mode shadow V6.4 (écritures R2 vérifiées en plus des fichiers existants)"
        type: boolean
        default: false
      forcer:
        description: "Lancer malgré la pause économie (avant le 27/10)"
        type: boolean
        default: false
      reserve_par_jour:
        description: "Requêtes réservées à la capture par jour jusqu'au renouvellement"
        default: "1100"
  schedule:
    - cron: '45 23 * * *'

permissions:
  contents: write

jobs:
  fetch-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Installer le client R2 facultatif
        if: inputs.r2_v64_shadow == true && vars.R2_V64_SHADOW_ENABLED == 'true'
        run: pip install boto3
      # RESTAURATION DES PARTITIONS ARCHIVEES.
      #
      # Ce workflow lance un script dont le resultat depend de
      # l'historique COMPLET. Depuis que archive_curves sort les
      # partitions de plus de 28 jours vers les releases curves-2026-*,
      # elles ne sont plus dans le depot : sans cette etape, le job
      # travaille sur un historique tronque SANS lever d'erreur.
      #
      # Constate le 02/10 sur book_index : 1 251 matchs au lieu de 1 863,
      # et une reactivite devenue negative partout. Les chiffres
      # changeaient sans que rien ne le signale.
      #
      # `|| true` : une panne de release ne doit pas bloquer le job.
      # restore_curves interroge l'index ET les releases directement.
      - name: Restaurer les partitions de courbes archivees
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/restore_curves.py || true

      - name: Courbes books (match + set1 + set2) via historical v5
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          R2_V64_SHADOW: ${{ inputs.r2_v64_shadow && vars.R2_V64_SHADOW_ENABLED == 'true' && '1' || '0' }}
          # Étape 4 : secrets toujours fournis (lecture de l'historique R2) ; le
          # shadow V6.4 reste piloté par R2_V64_SHADOW ci-dessus.
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          # 27/10/2026 : 20 books (Pinnacle + 19). Retirés : les 12 books qui n'apparaissent JAMAIS
          # dans 2 744 matchs collectés (zebet.fr, netbet.fr, bwin.fr, genybet.fr,
          # vbet.fr, circusbet.fr, feelingbet.fr, betsafe, nordicbet, interwetten,
          # vbet) : l'API ne les couvre pas en tennis, 39 % des requêtes perdues.
          BOOKS: "pinnacle,betfair-ex,bet365,1xbet,22bet,unibet,winamax.fr,unibet.fr,pmu,bwin,coolbet,betsson,betway,williamhill,888sport,leovegas,tipico,netbet,marathonbet,bet365.fr"
          # Niveau 1 d'abord pour TOUS les matchs en attente, puis les autres books.
          BOOKS_NIVEAU1: "pinnacle,betfair-ex,bet365,1xbet,22bet,unibet,winamax.fr,unibet.fr,pmu"
          # Budget : on s'arrête quand le quota restant ne couvre plus la capture
          # (CAPTURE_PAR_JOUR × jours avant renouvellement). Plafond par run.
          # Plancher : la réserve réelle est MESURÉE à chaque run (consommation du reste
          # du projet depuis le run précédent × 1,3), jamais en dessous de ce plancher.
          CAPTURE_PAR_JOUR: ${{ github.event.inputs.reserve_par_jour || '600' }}
          FORCER: ${{ github.event.inputs.forcer || 'false' }}
          CURVES_MAX_RUN: "2500"
          # Programme du 21/10 : 40 000 requêtes jusqu'au 20/11 -> ~2 000 gardées au renouvellement.
          QUOTA_PLANCHER: "2000"
        # ÉCONOMIE QUOTA RapidAPI (ajouté le 14/10/2026) : 31 books x 40
        # matchs = jusqu'à 1 240 requêtes par nuit, la moitié du quota
        # quotidien. EN PAUSE jusqu'au 27/10, reprise AUTOMATIQUE ensuite
        # (rien à retoucher). Les courbes live des alertes viennent de la
        # capture, pas d'ici : les alertes H13-H18 ne sont pas touchées.
        run: |
          if [ "$(date -u +%Y%m%d)" -lt 20261021 ] && [ "$FORCER" != "true" ]; then
            echo "⏸️ économie quota RapidAPI jusqu'au 27/10 : courbes books en pause"
            exit 0
          fi
          python scripts/fetch_book_curves.py
      - name: Migration ponctuelle vers partitions mensuelles (idempotent)
        # book_curves.jsonl a atteint 140,73 Mo (14/08/2026) -> GitHub rejette
        # tout push > 100 Mo, gelant le fichier distant SANS ERREUR VISIBLE
        # ("git push || true" avalait l'échec chaque nuit). Ce script bascule
        # vers parts/hist_<market>_<YYYY-MM>.jsonl (une partition par mois,
        # largement < 100 Mo chacune) et supprime les fichiers monolithiques.
        # Sans effet si déjà migré (fichiers legacy absents -> ignoré).
        run: python scripts/migrate_hist_partitions.py || true
      - name: Score de fiabilité des books (persistance du retard + jumeaux)
        run: python scripts/book_reliability.py || true
      # Compresse les partitions historiques CLOSES (jamais celle en cours
      # d'écriture). parts/ grossissait de ~80 Mo/semaine sans jamais être purgé
      # (purge_old_partitions ne filtre que parts/live_*, HIST_DAYS=0 par choix).
      # gzip est SANS PERTE, l'intégrité est revérifiée avant toute suppression,
      # et ov.iter_hist_lines lit .jsonl et .jsonl.gz indifféremment : aucun
      # script consommateur n'a à changer. Mesuré : 396 Mo -> 64 Mo.
      - name: Compresser les partitions historiques closes
        env:
          # Ce workflow ne commite que parts/hist_* (règle « chacun ses
          # partitions »). Compresser pm_ticks_* / kx_ticks_* ici revenait donc
          # à créer les .gz sur le runner et à les JETER : le commit ne les
          # prenait pas, et le checkout suivant restaurait les .jsonl.
          # Constaté le 21/08 : « 320,5 Mo -> 17,3 Mo » affiché à chaque run,
          # pour un dépôt qui restait à 579 Mo. La compression des ticks est
          # désormais faite par chaque collecteur, sur ses propres partitions.
          EXTRA_GLOBS: ''
        run: python scripts/compress_hist_partitions.py || true

      - name: Commit
        if: always()
        run: |
          # PANNE DU 16/08/2026 -- cause exacte, tracee par pipeline_status.
          # Les .pyc sont SUIVIS par git (ajoutes avant le .gitignore, qui ne
          # s'applique plus une fois un fichier suivi). capture_closing tourne
          # toutes les 5-10 min avec "git add -A" et republie donc des .pyc
          # neufs en continu. Quand un autre workflow tourne, il regenere les
          # siens localement -> "git merge" ABANDONNE ("Your local changes to
          # the following files would be overwritten") -> branche en retard ->
          # push rejete en non-fast-forward. Resultat observe : 7 fichiers
          # commites localement (dont 830 lignes de moves_detail_hist), jamais
          # pousses. On efface donc les .pyc du disque avant toute action git.
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name '*.pyc' -delete 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git rm --cached book_curves.jsonl set1_curves.jsonl set2_curves.jsonl 2>/dev/null || true
          # CHACUN SES PARTITIONS. « git add -A parts/ » balayait TOUT le
          # dossier et embarquait pm_ticks_* et kx_ticks_* tels qu'ils étaient
          # au checkout. Or les collecteurs Polymarket et Kalshi y AJOUTENT des
          # lignes en parallèle : deux workflows modifiaient donc le même
          # fichier en fin de fichier, le merge partait en conflit, et le push
          # était rejeté. C'est très probablement la cause des 54 h sans
          # régénération de hist_curves_meta.json signalées par l'audit.
          # -A reste indispensable ICI pour enregistrer la SUPPRESSION des
          # .jsonl remplacés par leur .gz — mais restreint à parts/hist_*.
          git add -A -- 'parts/hist_*' 2>/dev/null || true
          [ -f hist_curves_meta.json ] && git add -- hist_curves_meta.json
          # 27/10 : mémoire des « book ne cote pas ce match » et bilan de couverture.
          for f in courbes_absences.json courbes_couverture.json courbes_stats.json; do [ -f "$f" ] && git add -- "$f"; done
          git diff --cached --quiet || git commit -m "book+set curves partitionnées $(date -u +%FT%TZ)"
          # "merge" et non "rebase" : un rebase en conflit après un commit
          # peut écarter ce commit en silence -- exactement le bug qui a
          # figé set_results.json pendant 1 semaine sur steam_pipeline.yml.
          # UN PUSH QUI ÉCHOUE DOIT FAIRE ÉCHOUER LE RUN.
          # « git push || echo » rendait le job VERT alors que rien n'était
          # poussé : le dépôt est resté figé 54 h sans que rien ne le signale,
          # jusqu'à ce que audit_qa le détecte par l'âge du fichier. Un échec
          # silencieux est le pire mode de panne de ce projet.
          # On réessaie 3 fois — un merge peut échouer parce qu'un autre
          # workflow a poussé entre-temps — puis on sort en erreur.
          attente=2
          for essai in 1 2 3 4 5 6; do
            git fetch origin main || true
            if git merge origin/main --no-edit; then
              if git push; then echo "✅ PUSH OK"; exit 0; fi
            else
              echo "⚠️ merge en conflit — tentative $essai"
              # RESOLUTION DU CONFLIT JSON — ajoutee le 26/10/2026.
              #
              # Un conflit de CONTENU sur closing_lines.json se reproduit a
              # chaque tentative : relancer ne sert a rien. Observe sur
              # fetch_clv, bloque 2 jours avec « tentative 6/6 ».
              #
              # merge_json_state.py fusionne les objets JSON cle par cle.
              # closing_lines est un ACCUMULATEUR : prendre une version au
              # hasard effacerait les matchs ajoutes par l'autre execution.
              if python scripts/merge_json_state.py; then
                git commit --no-edit || true
              else
                git merge --abort 2>/dev/null || true
              fi
            fi
            sleep "$attente"; attente=$((attente*2))
          done
          echo "❌ PUSH ÉCHOUÉ après 6 tentatives (62 s cumulées) — le commit local est perdu avec le runner."
          exit 1
