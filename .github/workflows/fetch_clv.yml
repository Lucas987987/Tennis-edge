name: Fetch CLV

# PYTHONDONTWRITEBYTECODE : aucun .pyc n'est plus genere. Les .pyc
# regeneres a chaque run faisaient echouer le merge puis le push
# (panne du 16/08/2026). Portee workflow = toutes les etapes.
env:
  PYTHONDONTWRITEBYTECODE: '1'

on:
  schedule:
    - cron: '0 23 * * *'     # 1×/jour, 23h UTC (après la journée de matchs)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-closing      # même groupe (écrit aussi dans closing_lines.json)
  cancel-in-progress: false

jobs:
  clv:
    runs-on: ubuntu-latest
    # AJOUTÉ LE 11/09/2026 avec CLV_MAX_PER_RUN=150. Aucun timeout n'était
    # défini : si l'API historical-odds se bloquait, le job aurait tourné
    # jusqu'à la limite GitHub de 6 h. À 150 matchs et 3 s de cooldown, un
    # run normal fait ~18 min ; 40 laisse une marge large sans permettre
    # qu'un blocage passe inaperçu.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Calcul du CLV via historique (OddsPapi v5)
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          # RELEVÉ DE 40 À 150 LE 11/09/2026.
          #
          # Le défaut du script est 40 matchs par run, et ce workflow ne
          # passait aucune variable CLV_*. Or la cadence de capture est
          # passée à 3 min le 05/09 : closing_lines.json se remplit
          # maintenant de 50 à 80 matchs par jour. Le débit d'entrée
          # dépassait le débit de traitement d'environ 30 matchs/jour.
          #
          # Constaté le 11/09 : « 378 matchs à traiter (max 40/run) »,
          # 40 traités, 0 échec. La file est traitée dans l'ordre du
          # dictionnaire, donc les matchs récents attendent derrière les
          # anciens -> clv_history.jsonl semblait ARRÊTÉ au 01/09 alors que
          # closing_lines allait jusqu'au 11/09. Ce n'était pas une panne,
          # c'était un embouteillage.
          #
          # Effet de bord non anticipé de l'amélioration de la capture :
          # améliorer un producteur sature son consommateur en aval.
          #
          # 150 absorbe 80 matchs/jour et résorbe les 378 en retard en
          # ~3 jours. Coût : 150 x COOLDOWN 3 s = 7,5 min de pause, soit un
          # job d'environ 18 min contre 11,7 aujourd'hui.
          #
          # À VÉRIFIER APRÈS LE PREMIER RUN : historical-odds est décrite
          # comme gratuite dans la docstring de fetch_clv.py, mais si
          # requetes_cumul_jour (capture_state.json) bondit de ~110, c'est
          # qu'elle est comptée dans le budget de 1 400/jour. La marge
          # existe (~640 consommées aujourd'hui), mais il faudra l'intégrer.
          CLV_MAX_PER_RUN: '150'
        run: python scripts/fetch_clv.py
      - name: Commit
        run: |
          # PANNE DU 16/08/2026 -- cause exacte, tracee par pipeline_status.
          # Les .pyc sont SUIVIS par git (ajoutes avant le .gitignore, qui ne
          # s'applique plus une fois un fichier suivi). capture_closing tourne
          # toutes les 5-10 min avec "git add -A" et republie donc des .pyc
          # neufs en continu. Quand un autre workflow tourne, il regenere les
          # siens localement -> "git merge" ABANDONNE ("Your local changes to
          # the following files would be overwritten") -> branche en retard ->
          # push rejete en non-fast-forward. Resultat observe : 7 fichiers
          # commites localement (dont 830 lignes de moves_detail_hist), jamais
          # pousses. On efface donc les .pyc du disque avant toute action git.
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name '*.pyc' -delete 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in closing_lines.json clv_history.jsonl; do
            [ -f "$f" ] && git add -- "$f"
          done
          git diff --staged --quiet || git commit -m "CLV historique (v5)"
          # BOUCLE DE REPRISE AVEC FUSION DES CONFLITS JSON.
          # Ce workflow tourne toutes les 5-10 min : deux exécutions se
          # chevauchent régulièrement, et git tombe en conflit sur les JSON
          # d'état (closing_lines, capture_state, matches_oddspapi...). Le run
          # entier était alors perdu, y compris les partitions live qui,
          # elles, avaient fusionné sans problème via merge=union.
          # merge_json_state.py fusionne ces objets JSON clé par clé, sans rien
          # perdre : closing_lines est un ACCUMULATEUR, prendre une version au
          # hasard effacerait les matchs ajoutés par l'autre exécution.
          for essai in 1 2 3; do
            git fetch origin main || true
            if git merge origin/main --no-edit; then
              :
            else
              echo "⚠️ conflit — tentative de fusion JSON (essai $essai)"
              if python scripts/merge_json_state.py; then
                git commit --no-edit || true
              else
                git merge --abort 2>/dev/null || true
                sleep 5
                continue
              fi
            fi
            if git push; then echo "✅ PUSH OK"; exit 0; fi
            sleep 5
          done
          echo "❌ PUSH ÉCHOUÉ après 3 tentatives — commit local perdu avec le runner."
          exit 1
