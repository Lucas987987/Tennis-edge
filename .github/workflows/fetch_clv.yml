name: Fetch CLV

# PYTHONDONTWRITEBYTECODE : aucun .pyc n'est plus genere. Les .pyc
# regeneres a chaque run faisaient echouer le merge puis le push
# (panne du 16/08/2026). Portee workflow = toutes les etapes.
env:
  PYTHONDONTWRITEBYTECODE: '1'

on:
  schedule:
    # 10/10/2026 : 4 passages par jour au lieu d'un. À 40 matchs par jour
    # pour 60 à 100 matchs suivis, le retard grossissait sans fin (583 en
    # attente le 10/10) : plus aucun résultat récupéré après le 01/10, car
    # la récupération des résultats ne cherche que les matchs passés ici.
    - cron: '0 23 * * *'     # après la journée de matchs
    - cron: '40 5 * * *'
    - cron: '40 11 * * *'
    - cron: '40 17 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: capture-closing      # même groupe : protège aussi l'état CLV local
  cancel-in-progress: false

jobs:
  clv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Prepare R2 state (continue collection if unavailable)
        continue-on-error: true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          pip install --quiet boto3
          rm -rf parts/v64-outbox parts/v64-baseline.json
          python scripts/r2_v64.py prepare --namespace closing
      - name: Calcul du CLV via historique (OddsPapi v5)
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          # 120 matchs par passage, 1,5 s entre deux appels : ~5 min par
          # passage. Ce workflow partage son groupe de concurrence avec la
          # capture des cotes (tous deux écrivent closing_lines.json) : un
          # passage trop long retarderait les captures, d'où la limite.
          CLV_MAX_PER_RUN: '120'
          CLV_COOLDOWN: '1.5'
        run: python scripts/fetch_clv.py
      - name: Persist closing partitions to R2
        if: success()
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python scripts/r2_v64.py push --namespace closing
      - name: Export durable R2 outbox
        if: failure()
        run: python scripts/r2_v64.py export-outbox --namespace closing
      - name: Preserve V6.4 outbox for retry
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v64-outbox-${{ github.run_id }}-${{ github.run_attempt }}
          path: parts/v64-outbox/
          if-no-files-found: error
          retention-days: 90
      - name: Commit
        run: |
          # PANNE DU 16/08/2026 -- cause exacte, tracee par pipeline_status.
          # Les .pyc sont SUIVIS par git (ajoutes avant le .gitignore, qui ne
          # s'applique plus une fois un fichier suivi). capture_closing tourne
          # toutes les 5-10 min avec "git add -A" et republie donc des .pyc
          # neufs en continu. Quand un autre workflow tourne, il regenere les
          # siens localement -> "git merge" ABANDONNE ("Your local changes to
          # the following files would be overwritten") -> branche en retard ->
          # push rejete en non-fast-forward. Resultat observe : 7 fichiers
          # commites localement (dont 830 lignes de moves_detail_hist), jamais
          # pousses. On efface donc les .pyc du disque avant toute action git.
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name '*.pyc' -delete 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in clv_history.jsonl; do
            [ -f "$f" ] && git add -- "$f"
          done
          git diff --staged --quiet || git commit -m "CLV historique (v5)"
          # BOUCLE DE REPRISE AVEC FUSION DES CONFLITS JSON.
          # Ce workflow tourne toutes les 5-10 min : deux exécutions se
          # chevauchent régulièrement, et git tombe en conflit sur les JSON
          # d'état (closing_lines, capture_state, matches_oddspapi...). Le run
          # entier était alors perdu, y compris les partitions live qui,
          # elles, avaient fusionné sans problème via merge=union.
          # merge_json_state.py fusionne ces objets JSON clé par clé, sans rien
          # perdre : closing_lines est un ACCUMULATEUR, prendre une version au
          # hasard effacerait les matchs ajoutés par l'autre exécution.
          attente=2
          for essai in 1 2 3 4 5 6; do
            git fetch origin main || true
            if git merge origin/main --no-edit; then
              :
            else
              echo "⚠️ conflit — tentative de fusion JSON (essai $essai)"
              if python scripts/merge_json_state.py; then
                git commit --no-edit || true
              else
                git merge --abort 2>/dev/null || true
                sleep "$attente"; attente=$((attente*2))
                continue
              fi
            fi
            if git push; then echo "✅ PUSH OK"; exit 0; fi
            sleep "$attente"; attente=$((attente*2))
          done
          echo "❌ PUSH ÉCHOUÉ après 6 tentatives (62 s cumulées) — commit local perdu avec le runner."
          exit 1
