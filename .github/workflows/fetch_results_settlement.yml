name: Fetch Results (settlement, fast)

# PYTHONDONTWRITEBYTECODE : aucun .pyc n'est plus genere. Les .pyc
# regeneres a chaque run faisaient echouer le merge puis le push
# (panne du 16/08/2026). Portee workflow = toutes les etapes.
env:
  PYTHONDONTWRITEBYTECODE: '1'

on:
  schedule:
    - cron: '30 22 * * *'   # 22h30 UTC : après la journée de matchs (et après Fetch CLV)
    - cron: '0 16 * * *'    # 16h UTC : récupère les matchs du matin/début d'aprem déjà finis
  workflow_dispatch:
    inputs:
      retry_false:
        description: 'Re-tenter les set1/set2 marques indispo (apres correction de bug)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: tennis-results       # sérialise avec les autres écritures de résultats
  cancel-in-progress: false

jobs:
  settlement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # 22/11/2026 (paquet 351) — COTES EN PRIVÉ, ÉTAPE 3b : en mode ETAT_CHAUD=prive, les fichiers de cotes (dont
      # moves_detail*.csv, suivi_direct/resultats.json, resultats_oddspapi.json) ne sont plus dans le dépôt public ;
      # rapatriés ici depuis R2 (lecture). Dans les autres modes, rien ne change.
      - name: Cotes privées — rapatrier (paquet 351)
        env:
          ETAT_CHAUD: ${{ vars.ETAT_CHAUD || 'double' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python3 scripts/cotes_privees.py pull || true

      - name: Résultats rapides via /settlement (OddsPapi v5)
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RETRY_FALSE: ${{ github.event.inputs.retry_false || '0' }}
          # FINISHED_AFTER_H: '4'        # marge avant de considérer un match fini
          # MAX_SETTLEMENT_CALLS: '60'   # plafond d'appels par run
        # ÉCONOMIE QUOTA RapidAPI (ajouté le 14/10/2026) : 20 appels par run
        # au lieu de 60 jusqu'au 21/10 (quota renouvelé le 20/10), retour AUTOMATIQUE ensuite.
        run: |
          if [ "$(date -u +%Y%m%d)" -lt 20261021 ]; then
            export MAX_SETTLEMENT_CALLS=20
            echo "💰 économie quota jusqu'au 21/10 (quota renouvelé le 20/10) : $MAX_SETTLEMENT_CALLS appels max"
          fi
          python scripts/fetch_results_settlement.py
      # 22/11/2026 (paquet 351) : resultats_oddspapi.json envoyé au coffre ; en mode ETAT_CHAUD=prive, sorti du dépôt
      - name: Cotes privées — envoyer (résultats du règlement, paquet 351)
        env:
          ETAT_CHAUD: ${{ vars.ETAT_CHAUD || 'double' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          python3 scripts/cotes_privees.py push --groupe resultats_reglement || true
          python3 scripts/cotes_privees.py retirer --groupe resultats_reglement || true
      - name: Commit
        run: |
          # PANNE DU 16/08/2026 -- cause exacte, tracee par pipeline_status.
          # Les .pyc sont SUIVIS par git (ajoutes avant le .gitignore, qui ne
          # s'applique plus une fois un fichier suivi). capture_closing tourne
          # toutes les 5-10 min avec "git add -A" et republie donc des .pyc
          # neufs en continu. Quand un autre workflow tourne, il regenere les
          # siens localement -> "git merge" ABANDONNE ("Your local changes to
          # the following files would be overwritten") -> branche en retard ->
          # push rejete en non-fast-forward. Resultat observe : 7 fichiers
          # commites localement (dont 830 lignes de moves_detail_hist), jamais
          # pousses. On efface donc les .pyc du disque avant toute action git.
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name '*.pyc' -delete 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in resultats_oddspapi.json backtest_tennis.csv; do
            if [ -f "$f" ] && ! git check-ignore -q --no-index -- "$f"; then git add -- "$f"; fi   # 351 : jamais un fichier au coffre
          done
          git diff --staged --quiet || git commit -m "Résultats rapides (settlement v5)"
          # COMMIT D'ABORD (ci-dessus), puis "merge" et non "rebase" : un
          # rebase en conflit après un commit peut écarter ce commit en
          # silence (avalé par "2>/dev/null || true") -- exactement le bug
          # constaté sur steam_pipeline.yml (set_results.json figé 1 semaine
          # malgré des écritures locales réussies chaque jour). Un merge en
          # conflit échoue bruyamment, sans perdre le commit local.
          # BOUCLE DE REPRISE AVEC FUSION DES CONFLITS JSON.
          # Ce workflow tourne toutes les 5-10 min : deux exécutions se
          # chevauchent régulièrement, et git tombe en conflit sur les JSON
          # d'état (closing_lines, capture_state, matches_oddspapi...). Le run
          # entier était alors perdu, y compris les partitions live qui,
          # elles, avaient fusionné sans problème via merge=union.
          # merge_json_state.py fusionne ces objets JSON clé par clé, sans rien
          # perdre : closing_lines est un ACCUMULATEUR, prendre une version au
          # hasard effacerait les matchs ajoutés par l'autre exécution.
          attente=2
          for essai in 1 2 3 4 5 6; do
            git fetch origin main || true
            if git merge origin/main --no-edit; then
              :
            else
              echo "⚠️ conflit — tentative de fusion JSON (essai $essai)"
              if python scripts/merge_json_state.py; then
                git commit --no-edit || true
              else
                git merge --abort 2>/dev/null || true
                sleep "$attente"; attente=$((attente*2))
                continue
              fi
            fi
            if git push; then echo "✅ PUSH OK"; exit 0; fi
            sleep "$attente"; attente=$((attente*2))
          done
          echo "❌ PUSH ÉCHOUÉ après 6 tentatives (62 s cumulées) — commit local perdu avec le runner."
          exit 1
