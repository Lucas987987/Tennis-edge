name: Fetch Results (settlement, fast)

on:
  schedule:
    - cron: '30 22 * * *'   # 22h30 UTC : après la journée de matchs (et après Fetch CLV)
    - cron: '0 16 * * *'    # 16h UTC : récupère les matchs du matin/début d'aprem déjà finis
  workflow_dispatch:
    inputs:
      retry_false:
        description: 'Re-tenter les set1/set2 marques indispo (apres correction de bug)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: tennis-results       # sérialise avec les autres écritures de résultats
  cancel-in-progress: false

jobs:
  settlement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Résultats rapides via /settlement (OddsPapi v5)
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RETRY_FALSE: ${{ github.event.inputs.retry_false || '0' }}
          # FINISHED_AFTER_H: '4'        # marge avant de considérer un match fini
          # MAX_SETTLEMENT_CALLS: '60'   # plafond d'appels par run
        run: python scripts/fetch_results_settlement.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in resultats_oddspapi.json backtest_tennis.csv; do
            [ -f "$f" ] && git add -- "$f"
          done
          git diff --staged --quiet || git commit -m "Résultats rapides (settlement v5)"
          # COMMIT D'ABORD (ci-dessus), puis "merge" et non "rebase" : un
          # rebase en conflit après un commit peut écarter ce commit en
          # silence (avalé par "2>/dev/null || true") -- exactement le bug
          # constaté sur steam_pipeline.yml (set_results.json figé 1 semaine
          # malgré des écritures locales réussies chaque jour). Un merge en
          # conflit échoue bruyamment, sans perdre le commit local.
          git fetch origin main 2>&1 || echo "⚠️ fetch échoué"
          git merge origin/main --no-edit 2>&1 || echo "⚠️ merge en conflit -- le commit local n'est pas perdu"
          git push 2>&1 || echo "❌ PUSH ÉCHOUÉ -- voir message ci-dessus"
