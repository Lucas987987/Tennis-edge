name: Feuilles de match (TennisApi)

# 22/10/2026 — feuilles de match complètes (aces, doubles fautes, 1re et 2e balle,
# balles de break, jeux de service, retour ; match entier et chaque set) de tous
# les matchs en simple terminés : ATP, WTA, Challenger, ITF (quand la feuille
# existe). Source : TennisApi (RapidAPI, formule Pro, 15 000 requêtes/jour),
# clé RAPIDAPI_KEY. Une requête par catégorie et par jour, puis une par match.
#
# Automatique : toutes les 2 h (worker Cloudflare), d'avant-hier à AUJOURD'HUI (23/10/2026) : le résultat
# et la feuille d'un match arrivent quelques heures après sa fin, plus le lendemain.
# RATTRAPAGE : Run workflow avec debut = 2026-06-01 (fin vide = hier). Les jours
# déjà complets ne sont jamais redemandés : relancer reprend où le run s'est arrêté.
# Garde-fous : budget par run, arrêt sous la réserve de quota, 5 requêtes/s.
# Stockage : feuilles/AAAA-MM-JJ.jsonl.gz + feuilles/etat.json (bilan par jour).
# Point par point (livraison 46) : feuilles_points/AAAA-MM-JJ.jsonl.gz, les plus récents
# d'abord ; sonde = oui pour vérifier une fois le format de la réponse.
on:
  # 23/10/2026 : déclenché toutes les 2 h par le worker Cloudflare (tennis-edge-closing), matchs du jour
  # compris ; les deux crons restent en filet.
  repository_dispatch:
    types: [feuilles_match]
  schedule:
    - cron: '41 4 * * *'
    - cron: '41 16 * * *'
  workflow_dispatch:
    inputs:
      debut:
        description: 'Premier jour (AAAA-MM-JJ) ; vide = avant-hier. Rattrapage : 2026-06-01'
        default: ''
      fin:
        description: 'Dernier jour (AAAA-MM-JJ) ; vide = hier'
        default: ''
      categories:
        description: 'Catégories (vide = atp,wta,challenger,wta 125,davis cup,billie jean king cup ; ITF retiré le 22/10/2026, ajouter itf men,itf women pour le reprendre)'
        default: ''
      budget:
        description: 'Requêtes au plus pour ce run (formule Pro : 15 000 par jour)'
        default: '4000'
      points:
        description: 'Requêtes au plus pour le point par point (une par match ; 0 = rien)'
        default: '2500'
      sonde:
        description: 'oui = affiche la réponse brute du point par point d’un match (vérification du format), sans rien collecter'
        default: ''

permissions:
  contents: write

concurrency:
  group: feuilles-match
  cancel-in-progress: false

jobs:
  feuilles:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /scripts/feuilles_match.py
            /scripts/joueurs_infos.py
            /scripts/lieux_tournois.py
            /scripts/points_match.py
            /scripts/classements_tennisapi.py
            /scripts/durees_matchs.py
            /scripts/resultats_itf.py
            /resultats_itf/
            /resultats_itf_femmes/
            /simulateur/elo.py
            /feuilles/
            /feuilles_points/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Collecte
        timeout-minutes: 300
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          FEUILLES_BUDGET: ${{ github.event.inputs.budget || '4000' }}
          FEUILLES_RESERVE: '1500'
          DEBUT: ${{ github.event.inputs.debut }}
          FIN: ${{ github.event.inputs.fin }}
          CATS: ${{ github.event.inputs.categories }}
        run: python scripts/feuilles_match.py "$DEBUT" "$FIN" "$CATS"
      - name: Résultats ITF hommes et femmes des derniers jours (Elo seulement ; jamais pronostiqués ni pariés) — ~16 requêtes
        # 28/10/2026 : les jours de plus de 3 jours sont déjà complets ; seuls les 3 derniers jours sont redemandés.
        if: always()
        timeout-minutes: 10
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          FEUILLES_RESERVE: '3000'
          ITF_MINUTES: '8'
        run: |
          python scripts/resultats_itf.py '' '' 200
          ITF_SEXE=F python scripts/resultats_itf.py '' '' 200
      - name: Classements ATP et WTA du jour (TennisApi) — une photo par jour, 2 à 4 requêtes
        if: always()
        timeout-minutes: 5
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          FEUILLES_RESERVE: '1500'
          SONDE: ${{ github.event.inputs.sonde }}
        run: |
          if [ "$SONDE" = "oui" ]; then python scripts/classements_tennisapi.py --sonde; else python scripts/classements_tennisapi.py; fi
      - name: Durée des matchs déjà collectés (une fois par jour de feuilles, ~5 requêtes par jour)
        if: always()
        timeout-minutes: 15
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python scripts/durees_matchs.py 800
      - name: Infos joueurs (gaucher / droitier, taille, naissance) — une requête par nouveau joueur
        if: always()
        timeout-minutes: 30
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          FEUILLES_RESERVE: '1500'
        run: python scripts/joueurs_infos.py 500
      - name: Lieux et météo des tournois (Open-Meteo, gratuit, sans clé)
        if: always()
        timeout-minutes: 20
        run: python scripts/lieux_tournois.py 400
      - name: Point par point (pression, 30-30, égalité, servir pour le set) — une requête par match
        if: always()
        timeout-minutes: 60
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          # 23/10/2026 : le point par point passe APRÈS les résultats et les feuilles — il s'arrête quand il reste
          # 6 000 requêtes, pour que les collectes suivantes de la journée (toutes les 2 h) aient toujours du quota.
          FEUILLES_RESERVE: '6000'
          POINTS: ${{ github.event.inputs.points || '2500' }}
          SONDE: ${{ github.event.inputs.sonde }}
        run: |
          if [ "$SONDE" = "oui" ]; then python scripts/points_match.py 5 --sonde; exit 0; fi
          if [ "$POINTS" != "0" ]; then python scripts/points_match.py "$POINTS"; fi
      - name: Publier (même après une interruption)
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- feuilles feuilles_points 2>/dev/null || git add -- feuilles
          for d in resultats_itf resultats_itf_femmes; do if [ -e "$d" ]; then git add -- "$d"; fi; done
          if git diff --cached --quiet; then echo 'Rien de nouveau.'; exit 0; fi
          git commit -q -m "Feuilles de match $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; echo '::error::Conflit avec main'; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 10))
          done
          echo '::error::Push impossible après 5 essais'; exit 1
