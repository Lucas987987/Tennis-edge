name: Force Cancel Run

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID du run bloqué (ex: 16631)"
        required: true
        type: string

jobs:
  cancel:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Annuler le run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RID: ${{ inputs.run_id }}
        run: |
          echo "=== État initial ==="
          gh api "repos/$REPO/actions/runs/$RID" \
            --jq '{status, conclusion, created_at}'

          echo "=== Cancel standard ==="
          gh api -X POST "repos/$REPO/actions/runs/$RID/cancel" || echo "cancel refusé"

          sleep 45

          STATUS=$(gh api "repos/$REPO/actions/runs/$RID" --jq '.status')
          echo "Statut après cancel: $STATUS"

          if [ "$STATUS" != "completed" ]; then
            echo "=== Force cancel ==="
            gh api -X POST "repos/$REPO/actions/runs/$RID/force-cancel" || echo "force-cancel refusé"
            sleep 20
          fi

          echo "=== État final ==="
          gh api "repos/$REPO/actions/runs/$RID" \
            --jq '{status, conclusion}'
