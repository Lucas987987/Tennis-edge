name: Force Cancel Run

on:
  workflow_dispatch:
    inputs:
      run_number:
        description: "Numéro affiché du run (ex: 16631) OU son run_id complet"
        required: true
        type: string

jobs:
  cancel:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Annuler le run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT: ${{ inputs.run_number }}
        run: |
          set +e

          # Un run_id fait 9 chiffres ou plus ; en dessous c'est un numéro affiché
          if [ ${#INPUT} -ge 9 ]; then
            RID="$INPUT"
            echo "Entrée traitée comme run_id : $RID"
          else
            echo "=== Résolution du numéro #$INPUT vers un run_id ==="
            RID=$(gh api "repos/$REPO/actions/runs?per_page=100" --paginate \
              --jq ".workflow_runs[] | select(.run_number==$INPUT) | .id" \
              2>/dev/null | head -1)

            if [ -z "$RID" ]; then
              echo "Aucun run trouvé avec le numéro #$INPUT."
              echo ""
              echo "=== Runs non terminés actuellement ==="
              gh api "repos/$REPO/actions/runs?per_page=100" \
                --jq '.workflow_runs[]
                      | select(.status != "completed")
                      | "#\(.run_number)  id=\(.id)  \(.status)  \(.name)  \(.created_at)"'
              exit 1
            fi
            echo "Résolu : #$INPUT -> run_id $RID"
          fi

          echo ""
          echo "=== État initial ==="
          gh api "repos/$REPO/actions/runs/$RID" \
            --jq '{run_number, status, conclusion, created_at}'

          echo ""
          echo "=== Cancel standard ==="
          gh api -X POST "repos/$REPO/actions/runs/$RID/cancel" || echo "cancel refusé"

          sleep 45

          STATUS=$(gh api "repos/$REPO/actions/runs/$RID" --jq '.status')
          echo "Statut après cancel : $STATUS"

          if [ "$STATUS" != "completed" ]; then
            echo ""
            echo "=== Force cancel ==="
            gh api -X POST "repos/$REPO/actions/runs/$RID/force-cancel" || echo "force-cancel refusé"
            sleep 20
          fi

          echo ""
          echo "=== État final ==="
          gh api "repos/$REPO/actions/runs/$RID" --jq '{run_number, status, conclusion}'
