name: Freeze Adaptive Thresholds (9e hypothèse)

# Déclenchement MANUEL UNIQUEMENT (workflow_dispatch) -- jamais de schedule.
# freeze_thresholds.py fige la sélection ACTUELLE des seuils adaptatifs par
# book pour un suivi out-of-sample (validation_report.py, adaptive_threshold_
# watch()). Si ce workflow tournait automatiquement (cron), le gel se
# réinitialiserait à chaque run, ce qui viderait le test de tout son sens :
# on doit comparer une sélection FIGÉE à des résultats futurs, pas une
# sélection qui bouge en même temps que les données qu'elle est censée
# prédire.
#
# À lancer :
#   - une première fois maintenant, pour créer frozen_thresholds.json
#   - puis seulement si on décide consciemment de re-geler (walk-forward),
#     auquel cas cocher "append" pour conserver l'historique des gels
#     précédents plutôt que de l'écraser.

on:
  workflow_dispatch:
    inputs:
      append:
        description: "Conserver les gels précédents (walk-forward) au lieu d'écraser"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gel des seuils adaptatifs
        run: |
          if [ "${{ inputs.append }}" = "true" ]; then
            python scripts/freeze_thresholds.py --append
          else
            python scripts/freeze_thresholds.py
          fi

      - name: Commit frozen_thresholds.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add frozen_thresholds.json
          git diff --cached --quiet || git commit -m "gel seuils adaptatifs (9e hypothèse) $(date -u +%FT%TZ)"
          git fetch origin main 2>&1 || echo "⚠️ fetch échoué"
          git merge origin/main --no-edit 2>&1 || echo "⚠️ merge en conflit -- le commit local n'est pas perdu"
          git push 2>&1 || echo "❌ PUSH ÉCHOUÉ -- voir message ci-dessus"
