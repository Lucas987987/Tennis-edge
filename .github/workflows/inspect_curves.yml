name: Inspect curves

# Lancement MANUEL. Vérifie si book_curves.jsonl contient des points in-play
# (postérieurs au coup d'envoi). Lis le résultat dans le log de l'exécution.
# Pré-requis : scripts/inspect_curves.py + le fichier book_curves.jsonl committé.

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Chemin du book_curves.jsonl dans le repo"
        default: "book_curves.jsonl"

env:
  # Étape 4 (16/10/2026) : l'historique FIGÉ des courbes (parts/hist_*) est
  # servi par R2 ; les lecteurs rapatrient ce qui manque (scripts/hist_r2.py).
  R2_HIST_MATERIALIZE: '1'
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Inspecter
        run: python scripts/inspect_curves.py "${{ github.event.inputs.path }}"
