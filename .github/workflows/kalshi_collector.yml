name: Kalshi collector

# ──────────────────────────────────────────────────────────────────────────
# Collecte les prix Kalshi des matchs de tennis de notre univers.
# Validé par kalshi_probe.py (5 itérations) : 4/4 de nos matchs complets
# appariés, couverture ATP + WTA + Challengers + ITF, volume jusqu'à 7,0 M
# par match, fourchette de 1 point, aucune authentification requise.
#
# Pas de WebSocket : le flux temps réel Kalshi exige une signature RSA-PSS
# même pour les canaux publics. On sonde /markets en REST toutes les 60 s,
# ce qui suffit très largement pour une analyse sur grille de 5 minutes.
# ──────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Essai à blanc : découverte et appariement, aucune écriture"
        type: boolean
        default: false
  repository_dispatch:
    types: [kalshi_collector]

permissions:
  contents: write

concurrency:
  group: kalshi-collector
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  # Sortie en direct : sans cela, un run qui plante à mi-parcours laisse un
  # log vide et un diagnostic impossible (constaté sur le collecteur Polymarket).
  PYTHONUNBUFFERED: '1'

jobs:
  collect:
    runs-on: ubuntu-latest
    # 900 s de collecte + checkout + commit. Le collecteur s'arrête seul.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth 0 est requis par le merge de l'étape de commit, mais le
          # dépôt pèse plusieurs centaines de Mo : filter blob:none récupère
          # tout le graphe de commits SANS télécharger les contenus, ce qui a
          # fait tomber le checkout de 178 s à 22 s sur le collecteur Polymarket.
          fetch-depth: 0
          filter: blob:none

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # urllib de la bibliothèque standard suffit : aucune dépendance à
      # installer, donc rien qui puisse casser au prochain run.
      - name: Kalshi collector
        run: |
          python scripts/kalshi_collector.py \
            --duration-seconds ${KX_DURATION:-900} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # Compresse les partitions kx_ticks_* CLOSES (jamais celle du jour).
      # Fait ICI et non dans fetch_book_curves : ce workflow est le seul à
      # commiter parts/kx_ticks_*, donc le seul où le .gz survit au run.
      # Gain mesuré : ~95 % (97,8 Mo -> 5,4 Mo sur une partition réelle).
      - name: Compresser les partitions kx_ticks closes
        env:
          MARKETS: ''
          EXTRA_GLOBS: 'parts/kx_ticks_*.jsonl'
        run: python scripts/compress_hist_partitions.py || true

      - name: Commit Kalshi data
        if: always()
        run: |
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Fichier par fichier : un git add en bloc échoue ENTIÈREMENT si un
          # seul chemin manque, et n'ajoute alors rien du tout (panne du 15/08).
          for f in kalshi_markets.json kalshi_collector_state.json; do
            [ -f "$f" ] && git add -- "$f" || echo "  (absent : $f)"
          done

          # GARDE-FOU TAILLE. Le 19/08, une partition de 221 Mo a fait rejeter
          # le push ENTIER par GitHub : 15 min de collecte et tous les autres
          # fichiers du commit perdus. Un fichier trop gros est écarté de
          # l'index, le reste passe. Le collecteur bascule normalement de
          # partition à 60 Mo ; ceci est le filet.
          # CHACUN SES PARTITIONS. Ce workflow ne commite QUE ses propres
          # fichiers kx_ticks_*. Auparavant il balayait tout parts/ et
          # embarquait les ticks des AUTRES collecteurs tels qu'ils étaient à
          # son checkout : quand l'autre workflow y ajoutait des lignes en
          # parallèle, les deux modifiaient le même fichier en fin de fichier
          # et le merge partait en conflit — donc run perdu. Constaté : le run
          # Kalshi du 20/08 a commité 12 427 lignes de l'autre collecteur.
          # Le .gitattributes (merge=union) reste le filet si ça arrive quand même.
          for f in $(git status --porcelain 'parts/kx_ticks_*' | awk '{print $2}'); do
            [ -f "$f" ] || continue
            mo=$(du -m "$f" | cut -f1)
            if [ "$mo" -ge 95 ]; then
              echo "⛔ $f fait ${mo} Mo (mur GitHub 100 Mo) — ÉCARTÉ du commit."
            else
              git add -- "$f" || true
            fi
          done

          echo '--- en attente de commit ---'
          git status --short

          if git diff --staged --quiet; then
            echo 'Rien à commit.'; exit 0
          fi
          git commit -m "Kalshi collector ($(date -u +%H:%MZ))"

          for attempt in 1 2 3; do
            git fetch origin main || true
            if git merge origin/main --no-edit; then
              if git push origin HEAD:main; then echo 'Push Kalshi OK.'; exit 0; fi
            else
              echo 'Merge non automatique — abandon.'; exit 1
            fi
            sleep 5
          done
          echo 'ERREUR: push impossible après 3 tentatives.'; exit 1
