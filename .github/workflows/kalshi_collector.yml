name: Kalshi collector

# ──────────────────────────────────────────────────────────────────────────
# Collecte les prix Kalshi des matchs de tennis de notre univers.
# Validé par kalshi_probe.py (5 itérations) : 4/4 de nos matchs complets
# appariés, couverture ATP + WTA + Challengers + ITF, volume jusqu'à 7,0 M
# par match, fourchette de 1 point, aucune authentification requise.
#
# Pas de WebSocket : le flux temps réel Kalshi exige une signature RSA-PSS
# même pour les canaux publics. On sonde /markets en REST toutes les 60 s,
# ce qui suffit très largement pour une analyse sur grille de 5 minutes.
# ──────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Essai à blanc : découverte et appariement, aucune écriture"
        type: boolean
        default: false
  repository_dispatch:
    types: [kalshi_collector]

permissions:
  contents: write

concurrency:
  group: kalshi-collector
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  # Sortie en direct : sans cela, un run qui plante à mi-parcours laisse un
  # log vide et un diagnostic impossible (constaté sur le collecteur Polymarket).
  PYTHONUNBUFFERED: '1'

jobs:
  collect:
    runs-on: ubuntu-latest
    # 900 s de collecte + checkout + commit. Le collecteur s'arrête seul.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # fetch-depth 0 est requis par le merge de l'étape de commit, mais le
          # dépôt pèse plusieurs centaines de Mo : filter blob:none récupère
          # tout le graphe de commits SANS télécharger les contenus, ce qui a
          # fait tomber le checkout de 178 s à 22 s sur le collecteur Polymarket.
          fetch-depth: 0
          filter: blob:none

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # urllib de la bibliothèque standard suffit : aucune dépendance à
      # installer, donc rien qui puisse casser au prochain run.
      # RESTAURATION DES PARTITIONS ARCHIVEES — AJOUTEE LE 02/10/2026.
      #
      # Ce workflow lit les partitions hist_* (via curves_parts ou
      # iter_hist_lines). Depuis que archive_curves sort celles de plus de
      # 28 jours vers les releases curves-2026-*, elles ne sont plus dans le
      # depot : sans cette etape, le job travaille sur un historique tronque
      # SANS lever d'erreur.
      #
      # Constate le 02/10 sur book_index : 1 251 matchs et 351 mouvements au
      # lieu de 1 863 et 650, et une reactivite devenue negative partout. Les
      # chiffres changeaient sans que rien ne le signale.
      #
      # restore_curves interroge l'index ET les releases directement : un
      # ARCHIVE_INDEX.json perime ne peut plus masquer de partitions.
      - name: Restaurer les partitions de courbes archivees
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_REQUIRED: '1'
          R2_RESTORE_TICKS: '1'
        run: pip install --quiet boto3 && python scripts/restore_curves.py

      - name: Kalshi collector
        run: |
          python scripts/kalshi_collector.py \
            --duration-seconds ${KX_DURATION:-900} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # Compresse les partitions kx_ticks_* CLOSES (jamais celle du jour).
      # Compresse les ticks clos avant leur synchronisation vers R2. Ces
      # partitions ne sont plus ajoutées aux commits Git.
      # Gain mesuré : ~95 % (97,8 Mo -> 5,4 Mo sur une partition réelle).
      - name: Compresser les partitions kx_ticks closes
        env:
          MARKETS: ''
          EXTRA_GLOBS: 'parts/kx_ticks_*.jsonl'
        run: python scripts/compress_hist_partitions.py || true

      - name: Persister les partitions Kalshi vers R2
        id: persist-r2
        if: success() && !inputs.dry_run
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_INCLUDE: '^(kx_ticks_).+\.jsonl(\.gz)?$'
          R2_ALLOW_EMPTY: '1'
        run: pip install --quiet boto3 && python scripts/courbes_r2.py

      - name: Sauvegarder les partitions Kalshi en attente
        if: failure() && !inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: v64-outbox-${{ github.run_id }}-${{ github.run_attempt }}
          path: parts/kx_ticks_*.jsonl*
          if-no-files-found: warn
          retention-days: 90

      - name: Commit Kalshi data
        if: always()
        run: |
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Fichier par fichier : un git add en bloc échoue ENTIÈREMENT si un
          # seul chemin manque, et n'ajoute alors rien du tout (panne du 15/08).
          for f in kalshi_markets.json kalshi_collector_state.json; do
            [ -f "$f" ] && git add -- "$f" || echo "  (absent : $f)"
          done



          echo '--- en attente de commit ---'
          git status --short

          if git diff --staged --quiet; then
            echo 'Rien à commit.'; exit 0
          fi
          git commit -m "Kalshi collector ($(date -u +%H:%MZ))"

          for attempt in 1 2 3; do
            git fetch origin main || true
            if git merge origin/main --no-edit; then
              if git push origin HEAD:main; then echo 'Push Kalshi OK.'; exit 0; fi
            else
              echo 'Merge non automatique — abandon.'; exit 1
            fi
            sleep 5
          done
          echo 'ERREUR: push impossible après 3 tentatives.'; exit 1
