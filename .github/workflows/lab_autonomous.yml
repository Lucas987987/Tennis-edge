name: Tennis Edge Lab - découverte et gels automatiques

on:
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * *'

permissions:
  contents: write

concurrency:
  group: lab-automatic-registry
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Tennis_Edge_Lab
            parts
            historique
            scripts/validation_report.py
            scripts/oddspapi_v5.py
            matches_oddspapi.json
            moves_detail_hist.csv
            moves_detail.csv
            closing_lines.json
            resultats_derived.json
            resultats_oddspapi.json
            set_results.json
            book_index.json
            pipeline_status.json
            canal_clv_detail.csv
            paper_trades_canal.jsonl
            paper_trades_match.jsonl
            paper_canal_report.json
            h13_signal_log.jsonl
            h15_signal_log.jsonl
            h16_signal_log.jsonl
            h16b_signal_log.jsonl
            h17_signal_log.jsonl
            h18_signal_log.jsonl

      - name: Réaligner sur main avant tout calcul
        run: |
          git fetch origin main
          git merge --ff-only origin/main

      - name: Vérifier les invariants avant toute écriture
        run: python3 -m unittest discover -s Tennis_Edge_Lab/tests -v

      - name: Indexer les sources massives sans lire le futur
        run: |
          set -e
          python3 Tennis_Edge_Lab/source_features.py .
          python3 Tennis_Edge_Lab/historical_archive.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('Tennis_Edge_Lab/cache/parts_features.json')
          j=json.loads(p.read_text())
          assert j['input_count']>0 and j['schema_version']==1
          print('✅ Partitions indexées:',j['input_count'],'; fiches pré-signal:',j['eligible_matches'])
          PY

      - name: Analyser les marchés pré-match V5 (sans API ni gel)
        run: |
          set -e
          if python3 Tennis_Edge_Lab/bookmakers_sets_v5.py .; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('Tennis_Edge_Lab/live/bookmakers_sets.json')
          data=json.loads(p.read_text())
          assert data['schema_version']==1
          assert data['methodology']['freeze_automatic'] is False
          assert set(data['coverage'])=={'match','set1','set2'}
          print('✅ V5:',data['summary']['settled_snapshots'],'snapshots pré-match ; gels désactivés')
          PY
          else
            result=$?
            mkdir -p Tennis_Edge_Lab/live
            printf '{"schema_version":1,"status":"error","message":"Analyse V5 indisponible; code %s"}\n' "$result" > Tennis_Edge_Lab/live/bookmakers_sets.json
            echo "⚠ Analyse V5 indisponible (code $result) ; la recherche et le registre V4 continuent."
          fi

      - name: Rechercher les filtres et préparer le gel
        run: |
          set -e
          python3 Tennis_Edge_Lab/build_from_repo.py .
          python3 Tennis_Edge_Lab/autoresearch.py .
          python3 Tennis_Edge_Lab/candidate_registry.py verify --root .
          python3 Tennis_Edge_Lab/candidate_registry.py freeze --root .
          python3 Tennis_Edge_Lab/candidate_registry.py verify --root .

      - name: Publier exclusivement le cache compact et le registre
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p Tennis_Edge_Lab/registry
          if [ ! -f Tennis_Edge_Lab/registry/candidates.jsonl ]; then
            : > Tennis_Edge_Lab/registry/candidates.jsonl
          fi
          git add -- Tennis_Edge_Lab/cache/parts_features.json \
            Tennis_Edge_Lab/cache/source_catalog.json \
            Tennis_Edge_Lab/cache/archive \
            Tennis_Edge_Lab/live/bookmakers_sets.json \
            Tennis_Edge_Lab/registry/candidates.jsonl
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Aucune donnée à publier : index et gels inchangés.'
            exit 0
          fi
          git commit -m 'Lab: inventaire pré-signal et registre prospectif'
          # Les snapshots transitoires ne sont pas committés. Nettoyage LOCAL
          # du runner avant rebase, jamais des fichiers de la branche principale.
          git restore -- Tennis_Edge_Lab/data.js Tennis_Edge_Lab/data.json Tennis_Edge_Lab/manifest.json || true
          # main est mis à jour toutes les quelques minutes par les collecteurs.
          # Rebase seulement si aucune divergence sur le registre (sinon arrêt).
          for i in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '⛔ Conflit : registre inchangé. Contrôle humain requis.'
              exit 1
            fi
            python3 Tennis_Edge_Lab/candidate_registry.py verify --root .
            if git push origin HEAD:main; then
              echo '✅ Registre et inventaire publiés sans réécriture'
              exit 0
            fi
            sleep $((i*4))
          done
          echo '⛔ Push bloqué ; aucune donnée existante écrasée.'
          exit 1
