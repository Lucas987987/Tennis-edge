name: Tennis Edge Lab - découverte et gels automatiques

on:
  workflow_dispatch:
    inputs:
      preview_v63:
        description: Préparer et vérifier la sélection V6.3 sans publication durable
        type: boolean
        required: true
        default: false
      publish_v63:
        description: Autoriser explicitement la publication des hypothèses sélectionnées V6.3
        type: boolean
        required: true
        default: false
      preview_v62:
        description: Calculer V6.2 sans publier de registre (audit exploratoire)
        type: boolean
        required: true
        default: false
      publish_v62:
        description: Publier le registre V6.2 et ses preuves apres validation
        type: boolean
        required: true
        default: false
  schedule:
    - cron: '20 4 * * *'

permissions:
  contents: write

concurrency:
  group: lab-automatic-registry
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/lab_autonomous.yml
            .github/workflows/pages.yml
            Tennis_Edge_Lab
            parts
            historique
            scripts/validation_report.py
            scripts/oddspapi_v5.py
            matches_oddspapi.json
            moves_detail_hist.csv
            moves_detail.csv
            closing_lines.json
            resultats_derived.json
            resultats_oddspapi.json
            set_results.json
            book_index.json
            pipeline_status.json
            canal_clv_detail.csv
            paper_trades_canal.jsonl
            paper_trades_match.jsonl
            paper_canal_report.json
            h13_signal_log.jsonl
            h15_signal_log.jsonl
            h16_signal_log.jsonl
            h16b_signal_log.jsonl
            h17_signal_log.jsonl
            h18_signal_log.jsonl

      - name: Réaligner sur main avant tout calcul
        run: |
          git fetch origin main
          git merge --ff-only origin/main

      - name: Interdire les exécutions simultanées V6.2 et V6.3
        if: github.event_name == 'workflow_dispatch'
        env:
          V62_REQUESTED: ${{ inputs.preview_v62 || inputs.publish_v62 }}
          V63_REQUESTED: ${{ inputs.preview_v63 || inputs.publish_v63 }}
        run: |
          if [[ "$V62_REQUESTED" == "true" && "$V63_REQUESTED" == "true" ]]; then
            echo "V6.2 et V6.3 doivent être lancés séparément."
            exit 1
          fi

      - name: Vérifier les invariants avant toute écriture
        run: python3 -m unittest discover -s Tennis_Edge_Lab/tests -v

      - name: Indexer les sources massives sans lire le futur
        run: |
          set -e
          python3 Tennis_Edge_Lab/source_features.py .
          python3 Tennis_Edge_Lab/historical_archive.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('Tennis_Edge_Lab/cache/parts_features.json')
          j=json.loads(p.read_text())
          assert j['input_count']>0 and j['schema_version']==1
          print('✅ Partitions indexées:',j['input_count'],'; fiches pré-signal:',j['eligible_matches'])
          PY

      - name: Découvrir et valider les marchés pré-match V6 (sans API payante)
        run: |
          set -e
          python3 Tennis_Edge_Lab/bookmakers_sets_v5.py .
          python3 - <<'PY'
          import gzip
          import hashlib
          import json
          from pathlib import Path
          p=Path('Tennis_Edge_Lab/live/bookmakers_sets.json')
          data=json.loads(p.read_text())
          assert data['schema_version']==1
          assert set(data['coverage'])=={'match','set1','set2'}
          assert isinstance(data['discovery_candidates'],list)
          assert data['methodology']['freeze_automatic'] is False
          audit=json.loads(Path('Tennis_Edge_Lab/live/bookmakers_sets_audit.json').read_text())
          assert audit['segment_count']==data['summary']['audit_segments']
          assert set(audit['markets'])=={'match','set1','set2'}
          assert audit['archive']['source_snapshot_sha256']
          manifest_path=Path('Tennis_Edge_Lab')/audit['archive']['manifest']
          manifest=json.loads(manifest_path.read_text())
          assert manifest['source_snapshot_sha256']==audit['archive']['source_snapshot_sha256']
          exported=0
          for market,entry in manifest['markets'].items():
            archive=Path(entry['compressed_jsonl'])
            checksum=hashlib.sha256()
            with archive.open('rb') as source:
              for chunk in iter(lambda: source.read(1024*1024),b''):
                checksum.update(chunk)
            digest=checksum.hexdigest()
            assert digest==entry['compressed_sha256'], f'Archive corrompue: {market}'
            with gzip.open(archive,'rt',encoding='utf-8') as stream:
              full_count=sum(1 for line in stream if line.strip())
            page_count=sum(len(json.loads(Path(page).read_text())['segments'])
                           for page in entry['pages'])
            assert full_count==page_count==entry['segment_count'], f'Export incomplet: {market}'
            exported+=full_count
          assert exported==audit['segment_count']
          print('✅ V5:',data['summary']['settled_snapshots'],'snapshots pré-match ;',
                audit['segment_count'],'segments audités exhaustivement ;',
                len(data['discovery_candidates']),'candidats stricts V6')
          PY
          python3 Tennis_Edge_Lab/candidate_registry_v6.py freeze --root .
          python3 Tennis_Edge_Lab/candidate_watch_v61.py discover --root .

      - name: Actualiser les mesures prospectives après les gels
        run: |
          set -e
          python3 Tennis_Edge_Lab/candidate_registry_v6.py evaluate --root .
          python3 Tennis_Edge_Lab/candidate_watch_v61.py evaluate --root .
          python3 Tennis_Edge_Lab/candidate_registry_v6.py verify --root .

      - name: Évaluer V4 sans modifier ses gels historiques
        run: |
          set -e
          python3 Tennis_Edge_Lab/build_from_repo.py .
          python3 Tennis_Edge_Lab/autoresearch.py .
          python3 Tennis_Edge_Lab/candidate_registry.py verify --root .
          python3 Tennis_Edge_Lab/candidate_registry.py evaluate --root .
          python3 Tennis_Edge_Lab/candidate_registry.py verify --root .
          python3 Tennis_Edge_Lab/candidate_registry_v6.py verify --root .
          python3 Tennis_Edge_Lab/candidate_watch_v61.py verify --root .
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('Tennis_Edge_Lab/live/candidate_watch_v61_prospective.json').read_text())
          assert report['registry']=='registry/candidate_watch_v61.jsonl'
          assert all(item['state'] in {'observation exploratoire','signal prospectif à auditer','non confirmé'}
                     for item in report['candidates'])
          print('✅ Suivi V6.1:',report['total_frozen'],'pistes,',len(report['candidates']),'états vérifiés')
          PY

      - name: Vérifier les gels historiques sans publier les explorations
        run: |
          set -e
          python3 Tennis_Edge_Lab/candidate_registry.py verify --root .
          python3 Tennis_Edge_Lab/candidate_registry_v6.py verify --root .
          python3 Tennis_Edge_Lab/candidate_watch_v61.py verify --root .

      - name: Préenregistrer et construire l'archive complète V6.3
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' &&
          (inputs.preview_v63 == true || inputs.publish_v63 == true))
        run: |
          set -euo pipefail
          backup_dir="$RUNNER_TEMP/tennis-edge-v63-backup"
          mkdir -p "$backup_dir"
          python3 Tennis_Edge_Lab/candidate_selection_v63.py run --root .
          python3 Tennis_Edge_Lab/candidate_selection_v63.py verify --root .
          python3 Tennis_Edge_Lab/candidate_registry_v62.py verify --root .
          python3 Tennis_Edge_Lab/backup_v63.py build --root . \
            --bundle "$backup_dir/tennis-edge-v63.tar.gz" \
            --checksum "$backup_dir/tennis-edge-v63.tar.gz.sha256"

      - name: Sauvegarder l'audit complet V6.2/V6.3 pendant 90 jours
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' &&
          (inputs.preview_v63 == true || inputs.publish_v63 == true))
        uses: actions/upload-artifact@v4
        with:
          name: tennis-edge-full-audit-v63-${{ github.run_id }}
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/tennis-edge-v63-backup/

      - name: Restaurer l'artifact dans un dossier isolé
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' &&
          (inputs.preview_v63 == true || inputs.publish_v63 == true))
        uses: actions/download-artifact@v4
        with:
          name: tennis-edge-full-audit-v63-${{ github.run_id }}
          path: ${{ runner.temp }}/tennis-edge-v63-restore

      - name: Vérifier l'intégrité de la sauvegarde restaurée
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' &&
          (inputs.preview_v63 == true || inputs.publish_v63 == true))
        run: |
          set -euo pipefail
          python3 Tennis_Edge_Lab/backup_v63.py verify \
            --bundle "$RUNNER_TEMP/tennis-edge-v63-restore/tennis-edge-v63.tar.gz" \
            --checksum "$RUNNER_TEMP/tennis-edge-v63-restore/tennis-edge-v63.tar.gz.sha256" \
            --destination "$RUNNER_TEMP/tennis-edge-v63-restored"

      - name: Publier uniquement les gels sélectionnés après autorisation explicite
        if: github.event_name == 'workflow_dispatch' && inputs.publish_v63 == true
        run: |
          set -euo pipefail
          python3 Tennis_Edge_Lab/candidate_selection_v63.py verify --root .
          python3 Tennis_Edge_Lab/candidate_registry_v62.py verify --root .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Tennis_Edge_Lab/registry/candidate_watch_v62.jsonl \
            Tennis_Edge_Lab/registry/candidate_selection_v63.jsonl \
            Tennis_Edge_Lab/registry/v62_evidence \
            Tennis_Edge_Lab/live/candidate_watch_v62_prospective.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'V6.3: aucun gel sélectionné à publier.'
            exit 0
          fi
          git commit -m 'Lab: publier les hypothèses sélectionnées V6.3'
          for i in 1 2 3 4 5; do
            git fetch origin main
            # Les calculs modifient d'autres fichiers suivis : les préserver pendant le rebase.
            if ! git rebase --autostash origin/main; then
              git rebase --abort || true
              echo 'Conflit V6.3 : registres distants préservés.'
              exit 1
            fi
            # Un autostash peut signaler un conflit sans rendre le rebase lui-même rouge.
            if [ -n "$(git ls-files -u)" ]; then
              echo '::error::Conflit après restauration des changements locaux : push V6.3 annulé.'
              exit 1
            fi
            python3 Tennis_Edge_Lab/candidate_selection_v63.py verify --root .
            python3 Tennis_Edge_Lab/candidate_registry_v62.py verify --root .
            if git push origin HEAD:main; then
              echo 'V6.3 publié après sauvegarde et restauration vérifiées.'
              exit 0
            fi
            sleep $((i*4))
          done
          echo 'Publication V6.3 bloquée ; aucun registre existant écrasé.'
          exit 1

      - name: Construire et vérifier le registre compact V6.2
        if: >-
          (github.event_name == 'workflow_dispatch' &&
           (inputs.preview_v62 == true || inputs.publish_v62 == true))
        run: |
          set -e
          python3 Tennis_Edge_Lab/candidate_registry_v62.py compact --root .
          python3 Tennis_Edge_Lab/candidate_registry_v62.py verify --root .
          python3 Tennis_Edge_Lab/candidate_registry_v62.py evaluate --root .

      - name: Archiver l'audit exhaustif V6.2 pour relecture (90 jours)
        if: >-
          (github.event_name == 'workflow_dispatch' &&
           (inputs.preview_v62 == true || inputs.publish_v62 == true))
        uses: actions/upload-artifact@v4
        with:
          name: tennis-edge-full-audit-v62-${{ github.run_id }}
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
          path: |
            Tennis_Edge_Lab/live/bookmakers_sets_audit.json
            Tennis_Edge_Lab/live/archive/bookmakers_sets_v61/current/*.jsonl.gz
            Tennis_Edge_Lab/live/archive/bookmakers_sets_v61/current/manifest.json
            Tennis_Edge_Lab/live/candidate_watch_v62_prospective.json

      - name: Publier les gels compacts V6.2 après accord explicite
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.publish_v62 == true
        run: |
          set -e
          python3 Tennis_Edge_Lab/candidate_registry_v62.py verify --root .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Tennis_Edge_Lab/registry/candidate_watch_v62.jsonl \
            Tennis_Edge_Lab/registry/v62_evidence \
            Tennis_Edge_Lab/live/candidate_watch_v62_prospective.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'V6.2: aucune modification a publier.'
            exit 0
          fi
          git commit -m 'Lab: registre compact et preuves V6.2'
          for i in 1 2 3 4 5; do
            git fetch origin main
            # Idem V6.2 : rebase sans perdre les sorties de calcul non commitées.
            if ! git rebase --autostash origin/main; then
              git rebase --abort || true
              echo 'Conflit V6.2: publication bloquee pour proteger les registres.'
              exit 1
            fi
            if [ -n "$(git ls-files -u)" ]; then
              echo '::error::Conflit après restauration des changements locaux : push V6.2 annulé.'
              exit 1
            fi
            python3 Tennis_Edge_Lab/candidate_registry_v62.py verify --root .
            if git push origin HEAD:main; then
              echo 'V6.2 publie: gels compacts et preuves immuables.'
              exit 0
            fi
            sleep $((i*4))
          done
          echo 'Publication V6.2 non effectuee.'
          exit 1

      # Met à jour uniquement les rapports publics après la routine nocturne ou publication V6.3.
      # Les sélections et preuves gelées sont des données immuables.
      - name: Publier automatiquement les évaluations nocturnes (sans changer les gels)
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_v63 == true)
        run: |
          set -euo pipefail
          # Une nouvelle sélection doit être autorisée explicitement par publish_v63.
          # Ne jamais publier le rapport prospectif d'un gel non préenregistré.
          FROZEN=(
            Tennis_Edge_Lab/registry/candidate_selection_v63.jsonl
            Tennis_Edge_Lab/registry/candidate_watch_v62.jsonl
            Tennis_Edge_Lab/registry/v62_evidence
          )
          if ! git diff --quiet -- "${FROZEN[@]}" || \
             [[ -n "$(git ls-files --others --exclude-standard -- "${FROZEN[@]}")" ]]; then
            echo '::error::Nouveaux gels détectés : publication nocturne interdite ; lancer publish_v63 explicitement.'
            exit 1
          fi
          python3 Tennis_Edge_Lab/candidate_selection_v63.py verify --root .
          python3 Tennis_Edge_Lab/candidate_registry_v62.py verify --root .
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path('Tennis_Edge_Lab')
          report = json.loads((base/'live/candidate_watch_v62_prospective.json').read_text())
          events = [json.loads(line) for line in (base/'registry/candidate_selection_v63.jsonl').read_text().splitlines() if line.strip()]
          authorized = {cid for event in events for cid in event['selected_candidate_ids']}
          observed = {candidate['candidate_id'] for candidate in report['candidates']}
          assert authorized and observed and observed <= authorized, 'Suivi non relié aux gels publiés'
          assert report['active_total'] == sum(report['active_by_market'].values())
          assert report['evaluated_future_period']['starts_after_freeze'] is True
          assert report['registry'] == 'registry/candidate_watch_v62.jsonl'
          print('✅ Suivi prospectif autorisé :', len(observed), 'hypothèses gelées')
          PY

          # Publics et légers : le corpus exhaustif 600+ Mo reste en artifact.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- \
            Tennis_Edge_Lab/live/candidate_watch_v62_prospective.json \
            Tennis_Edge_Lab/live/bookmakers_sets.json \
            Tennis_Edge_Lab/live/bookmakers_sets_prospective.json \
            Tennis_Edge_Lab/live/candidate_watch_v61_prospective.json \
            Tennis_Edge_Lab/live/bookmakers_sets_audit.json \
            Tennis_Edge_Lab/cache/source_catalog.json \
            Tennis_Edge_Lab/cache/archive/index.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Rapports nocturnes : aucun changement à publier.'
            exit 0
          fi
          git commit -m 'Lab: actualiser les rapports prospectifs et métadonnées publics'
          for i in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase --autostash origin/main; then
              git rebase --abort || true
              echo '::error::Conflit de synchronisation ; aucun gel ni rapport distant écrasé.'
              exit 1
            fi
            if [[ -n "$(git ls-files -u)" ]]; then
              echo '::error::Conflit auto-stash ; publication bloquée.'
              exit 1
            fi
            python3 Tennis_Edge_Lab/candidate_selection_v63.py verify --root .
            python3 Tennis_Edge_Lab/candidate_registry_v62.py verify --root .
            if git push origin HEAD:main; then
              echo '✅ Rapports V6/V6.1/V6.3 et catalogue actualisés sur main.'
              exit 0
            fi
            sleep $((i*4))
          done
          echo '::error::Impossible de publier les rapports après 5 tentatives.'
          exit 1
