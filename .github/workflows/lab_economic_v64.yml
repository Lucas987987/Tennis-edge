name: Tennis Edge Lab V6.4 - sélection économique ROI+ CLV+

# Manuel uniquement : la sélection historique informée par les résultats
# n'est PAS une validation prospective ni un gel V6.3.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = artifact uniquement / publish = figer le snapshot V6.4 sur main"
        type: choice
        options: [preview, publish]
        default: preview

permissions:
  contents: write

concurrency:
  group: lab-automatic-registry
  cancel-in-progress: false

jobs:
  v64:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/lab_economic_v64.yml
            Tennis_Edge_Lab
            parts
            scripts/oddspapi_v5.py
            set_results.json
            moves_detail_hist.csv

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Vérifier le moteur économique (pas de modifications des gels)
        run: python3 -m unittest discover -s Tennis_Edge_Lab/tests -p test_v64.py -v

      - name: Reconstruire et vérifier l'inventaire historique V6.1
        run: |
          set -euo pipefail
          python3 Tennis_Edge_Lab/bookmakers_sets_v5.py .
          test -s Tennis_Edge_Lab/live/archive/bookmakers_sets_v61/current/match.jsonl.gz
          test -s Tennis_Edge_Lab/live/archive/bookmakers_sets_v61/current/manifest.json

      - name: Construire la sélection économique sans quota de marché
        run: |
          set -euo pipefail
          python3 Tennis_Edge_Lab/economic_v64.py --root . --output "$RUNNER_TEMP/economic_v64.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'economic_v64.json').read_text())
          assert report['selected_count']>0
          assert all(x['roi_pct']>0 and x['clv_mean_pct']>0 for x in report['candidates'])
          assert sum(report['by_market'].values()) == report['selected_count']
          print('Sélection V6.4 :',report['selected_count'],'hypothèses,',report['by_market'])
          PY

      - name: Conserver la prévisualisation (90 jours)
        uses: actions/upload-artifact@v4
        with:
          name: lab-economic-v64-${{ github.run_id }}
          path: ${{ runner.temp }}/economic_v64.json
          retention-days: 90
          if-no-files-found: error

      - name: Publier V6.4 séparément des gels V6.3
        if: inputs.mode == 'publish'
        run: |
          set -euo pipefail
          FROZEN=(
            Tennis_Edge_Lab/registry/candidate_selection_v63.jsonl
            Tennis_Edge_Lab/registry/candidate_watch_v62.jsonl
            Tennis_Edge_Lab/registry/v62_evidence
          )
          if ! git diff --quiet HEAD -- "${FROZEN[@]}" || \
             [[ -n "$(git ls-files --others --exclude-standard -- "${FROZEN[@]}")" ]]; then
            echo '::error::Gels V6.3 modifiés : publication V6.4 interdite.'
            exit 1
          fi
          target=Tennis_Edge_Lab/live/economic_v64.json
          registry=Tennis_Edge_Lab/registry/economic_v64_selection.json
          if [[ -e "$target" || -e "$registry" ]]; then
            echo '::error::Un snapshot V6.4 existe déjà : interdiction de remplacer une sélection préenregistrée.'
            exit 1
          fi
          cp "$RUNNER_TEMP/economic_v64.json" "$target"
          cp "$RUNNER_TEMP/economic_v64.json" "$registry"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$target" "$registry"
          git diff --cached --check
          git commit -m 'Lab V6.4 : figer la sélection économique historique'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase --autostash origin/main; then
              git rebase --abort || true
              echo '::error::Conflit de publication V6.4, main conservé.'
              exit 1
            fi
            if [[ -n "$(git ls-files -u)" ]]; then
              echo '::error::Conflit autostash non résolu.'
              exit 1
            fi
            python3 Tennis_Edge_Lab/candidate_selection_v63.py verify --root .
            python3 Tennis_Edge_Lab/candidate_registry_v62.py verify --root .
            if git push origin HEAD:main; then
              echo 'Sélection économique V6.4 publiée, gels V6.3 préservés.'
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo '::error::Publication V6.4 impossible, aucune écriture forcée.'
          exit 1
