name: Lab - gel (V6.6 et explorateur)

# Seul chemin pour geler une piste V6.6 : Lucas choisit des identifiants parmi
# les « Propositions de la semaine » publiées sur la page Recherche, puis lance
# ce workflow à la main. Aucun gel automatique, aucun appel à l'API de cotes payante.
# Le suivi (lab_quotidien.yml) ne compte que les matchs à partir du jour UTC
# suivant le gel, hors matchs ayant servi à la découverte.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: Pistes V6.6 - identifiants séparés par des virgules (ex. a1b2c3d4e5f60718,0f1e2d3c4b5a6978)
        type: string
        required: false
        default: ''
      explorateur:
        description: Explorateur - coller le bloc JSON de « Préparer le gel » (onglet Explorateur)
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: lab-automatic-registry
  cancel-in-progress: false

jobs:
  geler:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows
            Tennis_Edge_Lab
            scripts

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Tests des gels V6.6 et Explorateur
        run: |
          python -m unittest discover -s Tennis_Edge_Lab/tests -p 'test_v66*.py' -v
          python -m unittest discover -s Tennis_Edge_Lab/tests -p 'test_v67*.py' -v

      - name: Geler les identifiants ou la sélection choisis
        env:
          IDS: ${{ inputs.ids }}
          SPEC: ${{ inputs.explorateur }}
        run: |
          set -euo pipefail
          if [[ -z "${IDS// /}" && -z "${SPEC// /}" ]]; then
            echo '::error::Renseigner « ids » (V6.6) ou « explorateur » (bloc JSON).'
            exit 1
          fi
          python Tennis_Edge_Lab/selection_v66.py verify --root .
          python Tennis_Edge_Lab/explorer_gel.py verify --root .
          if [[ -n "${IDS// /}" ]]; then
            python Tennis_Edge_Lab/selection_v66.py freeze --root . --ids "$IDS"
          fi
          if [[ -n "${SPEC// /}" ]]; then
            python Tennis_Edge_Lab/explorer_gel.py freeze --root . --spec "$SPEC"
          fi
          python Tennis_Edge_Lab/selection_v66.py verify --root .
          python Tennis_Edge_Lab/explorer_gel.py verify --root .

      - name: Publier le registre (ajout seul, jamais de force push)
        env:
          IDS: ${{ inputs.ids }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Seuls les registres de gels V6.6 et Explorateur peuvent changer ici.
          if [[ -n "$(git status --porcelain -- . ':!Tennis_Edge_Lab/registry/gel_v66.jsonl' ':!Tennis_Edge_Lab/registry/gel_explorateur.jsonl' ':!**/__pycache__/**')" ]]; then
            git status --porcelain
            echo '::error::Fichiers inattendus modifiés : gel annulé.'
            exit 1
          fi
          for f in Tennis_Edge_Lab/registry/gel_v66.jsonl Tennis_Edge_Lab/registry/gel_explorateur.jsonl; do
            if [ -f "$f" ]; then git add -- "$f"; fi
          done
          git diff --cached --quiet && { echo 'Rien à geler.'; exit 0; }
          git commit -m "Lab : gel V6.6 / Explorateur"
          for i in 1 2 3 4 5; do
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort || true
              echo '::error::Conflit avec main : gel non publié, aucun registre écrasé.'
              exit 1
            fi
            python Tennis_Edge_Lab/selection_v66.py verify --root .
            python Tennis_Edge_Lab/explorer_gel.py verify --root .
            if git push origin HEAD:main; then
              echo '✅ Gel publié. Suivi à partir du jour UTC suivant.'
              exit 0
            fi
            sleep $((i * 5))
          done
          echo '::error::Gel non publié après cinq tentatives.'
          exit 1
