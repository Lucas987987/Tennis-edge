name: Tennis Edge Lab V6.5.1 - Audit sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 22/11/2026 (paquet 351) — COTES EN PRIVÉ, ÉTAPE 3b : en mode ETAT_CHAUD=prive, les fichiers de cotes (dont
      # moves_detail*.csv, suivi_direct/resultats.json, resultats_oddspapi.json) ne sont plus dans le dépôt public ;
      # rapatriés ici depuis R2 (lecture). Dans les autres modes, rien ne change.
      - name: Cotes privées — rapatrier (paquet 351)
        env:
          ETAT_CHAUD: ${{ vars.ETAT_CHAUD || 'double' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python3 scripts/cotes_privees.py pull || true

      - name: Audit non destructif
        run: python3 Tennis_Edge_Lab/v65/source_audit_v651.py --root . --output "$RUNNER_TEMP/v651_source_audit.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v651-source-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/v651_source_audit.json
          retention-days: 30
