name: Merge backtest

# Se déclenche AUTOMATIQUEMENT quand tu déposes/mets à jour `tool_export.csv`
# (l'export de l'outil) dans le repo. Fusionne sans perte dans backtest_tennis.csv
# et committe. Aussi lançable à la main.
#
# Le SEUL geste manuel : uploader l'export de l'outil sous le nom tool_export.csv
# (la donnée vit dans ton navigateur, un Action ne peut pas aller la chercher).
#
# Pré-requis : scripts/merge_backtest.py.

# PYTHONDONTWRITEBYTECODE : aucun .pyc n'est plus genere. Les .pyc
# regeneres a chaque run faisaient echouer le merge puis le push
# (panne du 16/08/2026). Portee workflow = toutes les etapes.
env:
  PYTHONDONTWRITEBYTECODE: '1'

on:
  workflow_dispatch:
  push:
    paths:
      - "tool_export.csv"

permissions:
  contents: write

concurrency:
  group: merge-backtest
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fusionner l'export outil dans le backtest
        run: |
          if [ ! -f tool_export.csv ]; then
            echo "Pas de tool_export.csv — rien à fusionner."; exit 0
          fi
          python scripts/merge_backtest.py tool_export.csv backtest_tennis.csv | tee merge_report.txt
          {
            echo "## Merge backtest"
            echo ""
            echo '```'
            cat merge_report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Committer le backtest fusionné
        run: |
          # PANNE DU 16/08/2026 -- cause exacte, tracee par pipeline_status.
          # Les .pyc sont SUIVIS par git (ajoutes avant le .gitignore, qui ne
          # s'applique plus une fois un fichier suivi). capture_closing tourne
          # toutes les 5-10 min avec "git add -A" et republie donc des .pyc
          # neufs en continu. Quand un autre workflow tourne, il regenere les
          # siens localement -> "git merge" ABANDONNE ("Your local changes to
          # the following files would be overwritten") -> branche en retard ->
          # push rejete en non-fast-forward. Resultat observe : 7 fichiers
          # commites localement (dont 830 lignes de moves_detail_hist), jamais
          # pousses. On efface donc les .pyc du disque avant toute action git.
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name '*.pyc' -delete 2>/dev/null || true
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f backtest_tennis.csv ] && git add -- backtest_tennis.csv
          if git diff --staged --quiet; then
            echo "Aucun changement — rien à committer."
          else
            git commit -m "backtest: merge tool_export $(date -u +%Y-%m-%dT%H:%MZ)"
            git fetch origin main 2>&1 || echo "⚠️ fetch échoué"
            git merge origin/main --no-edit 2>&1 || echo "⚠️ merge en conflit -- le commit local n'est pas perdu"
          # UN PUSH QUI ÉCHOUE DOIT FAIRE ÉCHOUER LE RUN. « git push || echo »
          # rendait le job VERT alors que rien n'était poussé — c'est ainsi que
          # hist_curves_meta.json est resté figé 54 h sans alerte (20/08/2026).
          if git push 2>&1; then
            echo "✅ PUSH OK"
          else
            echo "❌ PUSH ÉCHOUÉ — le commit local sera perdu avec le runner."
            exit 1
          fi
          fi
