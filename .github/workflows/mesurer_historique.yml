name: Mesurer le poids de l'historique git (lecture seule)

# CRÉÉ LE 04/09/2026, après la mesure de la sentinelle :
#   SENTINELLE DÉPÔT : 4.00 Go côté serveur (alarme 4.0 Go, zone GitHub ~5 Go)
#   🟠 marge restante : 0.00 Go
#
# Le répertoire de travail ne pèse que ~330 Mo : l'écart est presque
# entièrement dans l'HISTORIQUE. Retirer un fichier d'un commit ne libère
# rien — ses blobs restent dans tous les commits antérieurs. Les partitions
# pm_ticks/kx_ticks archivées vers les Releases par archive_ticks.py sont
# parties du répertoire de travail, PAS de l'historique.
#
# CE WORKFLOW NE MODIFIE RIEN. Il ne fait que mesurer, pour répondre à une
# question qu'il faut trancher AVANT d'envisager quoi que ce soit :
# combien un nettoyage récupérerait-il réellement ?
#
# Un `git filter-repo` réécrit tout l'historique et exige un force-push.
# C'est irréversible sans sauvegarde et cela invalide tous les clones. On ne
# lance pas ça sur une intuition — d'où cette mesure d'abord.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesurer-historique
  cancel-in-progress: false

jobs:
  mesurer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # Historique COMPLET avec les blobs : c'est justement eux qu'on
          # mesure. Pas de blob:none ici, pas de sparse-checkout — ce serait
          # mesurer précisément ce qu'on aurait exclu.
          fetch-depth: 0

      - name: Poids réel du dépôt cloné
        run: |
          echo "=== .git ==="
          du -sh .git
          echo
          echo "=== répertoire de travail (hors .git) ==="
          du -sh --exclude=.git . 2>/dev/null || true
          echo
          echo "=== nombre de commits ==="
          git rev-list --count --all

      - name: Poids par préfixe de chemin, sur TOUT l'historique
        run: |
          set -euo pipefail
          echo "Inventaire de tous les blobs de tous les commits."
          echo "Un même chemin apparaît autant de fois qu'il a de versions :"
          echo "c'est précisément ce qui fait grossir un dépôt append-only."
          echo

          git rev-list --objects --all \
            | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' \
            | awk '$1 == "blob" && $4 != "" { print $3, $4 }' \
            > /tmp/blobs.txt

          echo "blobs recensés : $(wc -l < /tmp/blobs.txt)"
          echo

          echo "─── TOP 25 par préfixe (le chemin réduit à sa famille) ───"
          awk '{
                 taille = $1; chemin = $2
                 # parts/pm_ticks_2026-08-19_3.jsonl.gz -> parts/pm_ticks
                 # (classes explicites plutôt que {4} : les intervalles ERE
                 #  ne sont pas garantis sur toutes les awk, et hist_book_
                 #  2026-W34 doit se replier comme les partitions datées)
                 sub(/_[0-9][0-9][0-9][0-9]-.*$/, "", chemin)
                 sub(/\.[^.\/]+$/, "", chemin)
                 total[chemin] += taille
                 n[chemin] += 1
               }
               END {
                 for (c in total)
                   printf "%10.1f Mo  %6d versions  %s\n", total[c]/1048576, n[c], c
               }' /tmp/blobs.txt \
            | sort -rn | head -25

          echo
          echo "─── Total ───"
          awk '{s += $1} END {printf "%.2f Go de blobs (avant compression git)\n", s/1073741824}' /tmp/blobs.txt

          echo
          echo "─── Ce qu'un nettoyage des ticks récupérerait ───"
          awk '$2 ~ /^parts\/(pm|kx)_ticks/ {s += $1}
               END {printf "parts/pm_ticks_* + parts/kx_ticks_* : %.2f Go\n", s/1073741824}' /tmp/blobs.txt
          echo "(ces partitions sont déjà archivées dans les Releases GitHub —"
          echo " voir parts/ARCHIVE_INDEX.json — donc les retirer de l'historique"
          echo " ne perdrait aucune donnée.)"

      - name: Les 15 plus gros blobs individuels
        run: |
          sort -rn /tmp/blobs.txt | head -15 \
            | awk '{printf "%8.1f Mo  %s\n", $1/1048576, $2}'
