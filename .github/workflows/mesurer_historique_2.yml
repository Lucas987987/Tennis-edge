name: Mesurer l'historique — passe 2, tailles COMPRESSEES (lecture seule)

# CRÉÉ LE 04/09/2026 après la passe 1, dont le résultat invalide l'hypothèse
# de départ (la mienne) : pm_ticks + kx_ticks ne pèsent que 24 Go sur 148 Go
# de blobs bruts, soit 16 %. Les vrais poids lourds sont ailleurs.
#
# MAIS les chiffres de la passe 1 sont des tailles DÉCOMPRESSÉES. Or 148 Go
# de blobs tiennent dans un .git de 3,9 Go : git delta-compresse, et il le
# fait remarquablement bien sur des fichiers append-only (chaque version =
# la précédente + un ajout). Un chemin à 30 Go bruts peut ne coûter que
# quelques centaines de Mo une fois packé.
#
# Décider d'une réécriture d'historique sur des tailles brutes serait donc
# une erreur : on purgerait peut-être le chemin le plus volumineux à l'écran
# pour ne récupérer presque rien. `git filter-repo --analyze` donne les DEUX
# colonnes — décompressé ET packé. C'est la seconde qui décide.
#
# CE WORKFLOW NE MODIFIE RIEN. `--analyze` est en lecture seule et n'écrit
# qu'un rapport sur le runner. Le drapeau `--force` n'est volontairement PAS
# passé : c'est lui qui autorise filter-repo à réécrire l'historique, et il
# n'a rien à faire dans un job de mesure. Si filter-repo refuse de démarrer,
# le job échoue sans avoir rien touché — c'est le comportement voulu.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesurer-historique
  cancel-in-progress: false

jobs:
  analyser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # Historique complet AVEC les blobs : ce sont eux qu'on mesure.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Installer git-filter-repo
        run: |
          python3 -m pip install --quiet git-filter-repo
          git filter-repo --version

      - name: Analyser (lecture seule)
        run: |
          set -euo pipefail
          git filter-repo --analyze
          echo "Rapports générés :"
          ls -la .git/filter-repo/analysis/

      - name: Afficher tous les rapports
        run: |
          # On ne présume PAS des noms de fichiers produits par filter-repo :
          # on parcourt le dossier et on affiche le début de chacun. Plus
          # robuste qu'une liste codée en dur, et ça ne rate rien.
          for f in .git/filter-repo/analysis/*; do
            echo
            echo "════════════════════════════════════════════════════════"
            echo "  $(basename "$f")"
            echo "════════════════════════════════════════════════════════"
            # CORRIGÉ depuis la passe 1 : celle-ci finissait en
            # `sort ... | head` sous `set -o pipefail`. head ferme le tube,
            # sort reçoit SIGPIPE, et le job sortait en code 2 alors que la
            # sortie était complète. Ici head lit un fichier, pas un tube.
            head -40 "$f" || true
          done

      - name: Rappel de lecture
        run: |
          echo "Colonne à regarder : la taille PACKÉE. C'est elle qui dit ce"
          echo "qu'une purge libérerait réellement sur les 3,9 Go du .git."
          echo
          echo "Le rapport sur les chemins SUPPRIMÉS est le plus parlant : il"
          echo "liste ce qui a déjà quitté le répertoire de travail mais pèse"
          echo "toujours dans l'historique — donc exactement ce que"
          echo "l'archivage des ticks vers les Releases n'a PAS libéré."
