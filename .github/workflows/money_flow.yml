name: money_flow

# Analyse « où va l'argent » à partir des courbes de clv_history.jsonl.
# Pur calcul local, AUCUN appel API. Déclenchement manuel (mobile-friendly).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  money-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Analyse du flux d'argent
        run: python scripts/money_flow.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ORDRE CORRIGÉ : cet ordre (add -> pull --rebase -> commit) faisait
          # tenter un rebase avec des changements déjà STAGÉS mais non
          # commités -- git refuse généralement ça. Ordre correct : commit
          # d'abord (en sécurité dans l'historique local), PUIS synchro.
          for f in money_flow.jsonl money_flow_report.json; do
            [ -f "$f" ] && git add -- "$f"
          done
          git diff --staged --quiet || git commit -m "money flow $(date -u +%FT%TZ)"
          # "merge" et non "rebase" : un rebase en conflit peut écarter le
          # commit qu'on vient de créer en silence.
          git fetch origin main 2>&1 || echo "⚠️ fetch échoué"
          git merge origin/main --no-edit 2>&1 || echo "⚠️ merge en conflit -- le commit local n'est pas perdu"
          git push 2>&1 || echo "❌ PUSH ÉCHOUÉ -- voir message ci-dessus"
