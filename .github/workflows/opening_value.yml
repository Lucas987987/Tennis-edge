name: Opening Value

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  opening-value:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # resultats.json vaut "count": 0 depuis des semaines (Sackmann injoignable
      # depuis le runner). Le pont reconstruit le format canonique a partir de
      # resultats_oddspapi.json + set_results.json, qui eux sont pleins.
      - name: Pont resultats (sources vivantes -> format canonique)
        run: python scripts/results_bridge.py

      # OPENING_VALUE_MODE=prospective : reference = Pinnacle A L'INSTANT de
      # l'ouverture du book. L'ancien mode (reference = CLOTURE) selectionnait
      # les prix ayant bouge favorablement en le sachant apres coup -- ROI non
      # misable. Ne repasser en 'close' que pour un diagnostic, jamais publier.
      - name: Ouvertures molles - gagne-t-on vraiment ?
        env:
          CLV_HISTORY: clv_history.jsonl
          BOOK_CURVES: book_curves.jsonl
          RESULTS: resultats_derived.json
          OPENING_VALUE_MODE: prospective
          OPENING_VALUE_REPORT: opening_value_report.json
        run: python scripts/opening_value.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          [ -f opening_value_report.json ] && git add -- opening_value_report.json
          git diff --cached --quiet || git commit -m "opening value $(date -u +%FT%TZ)"
          git fetch origin main 2>&1 || echo "⚠️ fetch échoué"
          git merge origin/main --no-edit 2>&1 || echo "⚠️ merge en conflit -- le commit local n'est pas perdu"
          git push 2>&1 || echo "❌ PUSH ÉCHOUÉ -- voir message ci-dessus"
