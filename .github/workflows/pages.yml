# .github/workflows/pages.yml
# Publication GitHub Pages Tennis Edge (incluant Arena V1.9.2)
#
# 22/11/2026 (paquet 334, Lucas : « basculer un maximum de choses en privé ») — le dépôt est public et Pages publiait
# TOUT _site à tout le monde, Lab compris (CLV, journaux de suivi, recherches) et l'ancien tableau de bord avec ses
# fichiers de cotes. Désormais :
#   1. _site est construit comme avant ;
#   2. il part dans le bucket R2 privé (scripts/publier_r2.py) : algo/ et arena/ sous site/ (public), tout le reste
#      sous prive/site/ — servi par le worker « algo » : le site public sur gamesetalgo.com, le Lab et le tableau sur
#      algo.tennis-edge.workers.dev/lab/ et /tableau/ SEULEMENT après connexion avec la clé privée ;
#   3. GitHub Pages ne garde que algo/ (secours du worker) et arena/ (jeu public). Si l'envoi à R2 échoue, Pages garde
#      tout, comme avant : le Lab n'est jamais perdu.
name: Deploy Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'division10.html'
      - 'confidence.js'
      - '.github/workflows/pages.yml'
      - 'Tennis_Edge_Lab/**'
      - 'algo/**'
      - 'arena/**'
  workflow_run:
    workflows: ['Pronostics du jour']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            index.html
            division10.html
            confidence.js
            /algo/
            /arena/
            matches_oddspapi.json
            resultats.json
            resultats_fast.json
            players_data.json
            elo_ratings_atp.json
            elo_ratings_wta.json
            confidence_calib.json
            backtest_tennis.csv
            Tennis_Edge_Lab/index.html
            Tennis_Edge_Lab/style.css
            Tennis_Edge_Lab/app.js
            Tennis_Edge_Lab/data.js
            Tennis_Edge_Lab/manifest.json
            Tennis_Edge_Lab/build_data.py
            Tennis_Edge_Lab/build_from_repo.py
            Tennis_Edge_Lab/closing_source.py
            Tennis_Edge_Lab/fetch_worker_snapshot.py
            Tennis_Edge_Lab/autoresearch.py
            Tennis_Edge_Lab/research.html
            Tennis_Edge_Lab/research.css
            Tennis_Edge_Lab/research.js
            Tennis_Edge_Lab/research_v61.js
            Tennis_Edge_Lab/research_v63.js
            Tennis_Edge_Lab/research_v632.css
            Tennis_Edge_Lab/research_v66.css
            Tennis_Edge_Lab/research_v66.js
            Tennis_Edge_Lab/research_explorer.js
            Tennis_Edge_Lab/research_explorer.css
            Tennis_Edge_Lab/research_profils.js
            Tennis_Edge_Lab/research_profils.css
            Tennis_Edge_Lab/research_reconciliation.js
            Tennis_Edge_Lab/research_reconciliation.css
            Tennis_Edge_Lab/research_direct.js
            Tennis_Edge_Lab/research_direct.css
            Tennis_Edge_Lab/research_registre.js
            Tennis_Edge_Lab/research_h18_h20.js
            Tennis_Edge_Lab/prive.js
            Tennis_Edge_Lab/research_registre.css
            Tennis_Edge_Lab/tennis_meta.py
            Tennis_Edge_Lab/books.py
            Tennis_Edge_Lab/clv_stats.py
            Tennis_Edge_Lab/freshness.js
            Tennis_Edge_Lab/publish_guard.py
            Tennis_Edge_Lab/v4.js
            Tennis_Edge_Lab/v6.js
            Tennis_Edge_Lab/candidate_registry.py
            Tennis_Edge_Lab/source_catalog.py
            Tennis_Edge_Lab/cache
            Tennis_Edge_Lab/live/bookmakers_sets.json
            Tennis_Edge_Lab/live/bookmakers_sets_audit.json
            Tennis_Edge_Lab/live/bookmakers_sets_prospective.json
            Tennis_Edge_Lab/live/candidate_watch_v61_prospective.json
            Tennis_Edge_Lab/live/candidate_watch_v61_prospective.json.gz
            Tennis_Edge_Lab/live/candidate_watch_v62_prospective.json
            Tennis_Edge_Lab/live/history_stability.json
            Tennis_Edge_Lab/live/propositions_v66.json
            Tennis_Edge_Lab/live/gel_v66_prospective.json
            Tennis_Edge_Lab/live/gel_explorateur_prospective.json
            Tennis_Edge_Lab/live/profils_hypotheses.json
            Tennis_Edge_Lab/live/explorateur_alertes.json.gz
            Tennis_Edge_Lab/live/explorateur_histo.json.gz
            Tennis_Edge_Lab/live/explorateur_matchs.json.gz
            Tennis_Edge_Lab/live/explorateur_detections.json.gz
            Tennis_Edge_Lab/live/reconciliation_hypotheses.json
            Tennis_Edge_Lab/live/registre
            Tennis_Edge_Lab/live/lectures_profils.json
            Tennis_Edge_Lab/live/delai_alertes.json
            Tennis_Edge_Lab/live/croisements.json
            Tennis_Edge_Lab/live/pronostics_bilan.json
            Tennis_Edge_Lab/live/joueurs_service.json.gz
            Tennis_Edge_Lab/live/archive/bookmakers_sets_v61/current
            Tennis_Edge_Lab/registry
            scripts/validation_report.py
            scripts/site_leger.py
            scripts/decouper_page.py
            scripts/publier_r2.py
            scripts/r2_io.py
            scripts/coffre.py
            scripts/pronostics_prives.py
            set_results.json
            moves_detail_hist.csv
            moves_detail.csv
            paper_trades_canal.jsonl
            paper_trades_match.jsonl
            canal_clv_detail.csv
            closing_lines.json
            closing_lines
            scripts/closing_store.py
            resultats_oddspapi.json
            resultats_derived.json
            pipeline_status.json
            book_index.json
            paper_canal_report.json
            h13_signal_log.jsonl
            h15_signal_log.jsonl
            h16_signal_log.jsonl
            h16b_signal_log.jsonl
            h17_signal_log.jsonl
            /scripts/cotes_privees.py
            /scripts/etat_chaud.py
            /scripts/merge_json_state.py
            scripts/discret.py
            simulateur/telegram_envoi.py
      # 22/11/2026 (paquet 346) — COTES EN PRIVÉ : en mode ETAT_CHAUD=prive, closing_lines, matches_oddspapi,
      # live_odds et les archives de clôtures ne sont plus dans le dépôt public ; rapatriés ici depuis R2 (lecture).
      # Dans les autres modes, rien ne change (seul ce qui manquerait au dépôt est rapatrié).
      - name: Cotes privées — rapatrier (paquet 346)
        env:
          ETAT_CHAUD: ${{ vars.ETAT_CHAUD || 'double' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python3 scripts/cotes_privees.py pull --entiers mouvements,resultats_reglement,kalshi,direct || true  # 352 : seulement ce que ce workflow lit

      # 22/11/2026 (paquet 334) : journaux de suivi et CLV du canal, au coffre privé (R2), lus par le Lab
      - name: Coffre privé — rapatrier (journaux de suivi, lecture seule)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          python scripts/coffre.py pull --groupe suivi || true
          # 335 : « le prix tient-il après l'alerte ? » — au coffre, plus dans le dépôt public
          python scripts/coffre.py pull --groupe lab_site || true
          # 338 : sorties du Lab et instantané data.js (version précédente, pour le contrôle de baisse) au coffre
          python scripts/coffre.py pull --groupe lab_sorties || true
          python scripts/coffre.py pull --groupe lab_donnees || true
          # 345 : journaux des canaux (instantané du Lab) et verdicts en direct (réconciliation)
          python scripts/coffre.py pull --groupe canaux || true
          python scripts/coffre.py pull --groupe verdicts || true
      - name: Reconstruire les données Tennis Edge Lab
        env:
          LAB_CHECK_PREVIOUS: '1'
        run: |
          python Tennis_Edge_Lab/build_from_repo.py .
          python - <<'PYCODE'
          import json, pathlib, hashlib
          p=pathlib.Path('Tennis_Edge_Lab')
          manifest=json.loads((p/'manifest.json').read_text(encoding='utf8'))
          data=(p/'data.json').read_bytes()
          assert hashlib.sha256(data).hexdigest()==manifest['dataset_sha256']
          assert manifest['row_count']>=200
          print('✅ Jeu vérifié:',manifest['row_count'],'observations, hash',manifest['dataset_sha256'][:12])
          PYCODE
      # 338 : le nouvel instantané du Lab (cotes, CLV) part au coffre privé, jamais dans le dépôt
      - name: Coffre privé — envoyer l'instantané du Lab
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python scripts/coffre.py push --groupe lab_donnees || true
      - name: Recherche statistique autonome (lecture seule)
        env:   # 393 : journal complet de scripts/discret.py → coffre privé (échec : Telegram)
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if python3 scripts/discret.py -- python3 Tennis_Edge_Lab/autoresearch.py . && python3 -c "import json,pathlib; p=pathlib.Path('Tennis_Edge_Lab/live/research.json'); x=json.loads(p.read_text()); assert x['schema_version']==1 and x['row_counts']['settled_quality_ok']>=200 and len(x['frozen_hypotheses'])==7"; then
            echo 'Analyse autonome valide.'
          else
            echo '::warning::Analyse autonome indisponible ; rapport précédent conservé si valide.'
            rm -f Tennis_Edge_Lab/live/research.json Tennis_Edge_Lab/live/matches_index.json
          fi
      - name: Évaluer les pistes gelées uniquement sur les nouveaux matchs
        run: |
          python3 Tennis_Edge_Lab/candidate_registry.py evaluate --root .
          python3 - <<'PY'
          import json
          o=json.load(open('Tennis_Edge_Lab/live/prospective.json'))
          assert o['schema_version']==1 and isinstance(o['models'],list)
          print('✅ Pistes prospectives:',len(o['models']))
          PY
      - name: Capturer le bilan public D1 (lecture seule, sans bloquer Pages)
        run: python Tennis_Edge_Lab/fetch_worker_snapshot.py Tennis_Edge_Lab/worker_hypotheses.json
      - name: Date de la dernière tâche quotidienne réussie (fraîcheur)
        id: daily
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          at=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow lab_quotidien.yml --status success --limit 1 --json updatedAt --jq '.[0].updatedAt' 2>/dev/null || true)
          echo "at=${at}" >> "$GITHUB_OUTPUT"
          echo "Dernière tâche quotidienne réussie : ${at:-inconnue}"
      - name: Préparer les ressources 3D locales V9.2
        run: |
          set -euo pipefail
          mkdir -p algo/vendor
          # Fichiers récupérés UNE FOIS lors du build, jamais depuis le téléphone.
          npm install --no-save --no-audit --no-fund --prefix /tmp/tennis-edge-v92 babylonjs@7.54.3 babylonjs-loaders@7.54.3
          cp /tmp/tennis-edge-v92/node_modules/babylonjs/babylon.js algo/vendor/babylon.js
          cp /tmp/tennis-edge-v92/node_modules/babylonjs-loaders/babylonjs.loaders.min.js algo/vendor/babylonjs.loaders.min.js
          curl --fail --location --retry 3 --silent --show-error --output algo/vendor/Soldier.glb \
            https://raw.githubusercontent.com/mrdoob/three.js/r164/examples/models/gltf/Soldier.glb
          test "$(wc -c < algo/vendor/Soldier.glb)" -gt 10000
          file algo/vendor/Soldier.glb
          du -h algo/vendor/*
      - name: Version précédente des données du Lab (R2, sinon GitHub Pages)
        id: precedent
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          python scripts/publier_r2.py telecharger --prefixe prive/site/Tennis_Edge_Lab/live/ --vers /tmp/lab_precedent || true
          if ls /tmp/lab_precedent/*.json >/dev/null 2>&1; then
            echo "base=file:///tmp/lab_precedent" >> "$GITHUB_OUTPUT"
          else
            echo "base=https://${GITHUB_REPOSITORY_OWNER}.github.io/${{ github.event.repository.name }}/Tennis_Edge_Lab/live" >> "$GITHUB_OUTPUT"
          fi
      # 23/11/2026 (paquet 378) : le dépôt public n'a plus que les matchs commencés ; la version complète est au coffre
      - name: Pronostics complets — rapatrier du coffre (paquet 378)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python scripts/pronostics_prives.py pull . --seulement algo/donnees.json || echo "::warning::pronostics complets non rapatriés, copie publique seulement"
      - name: Construire _site
        env:
          LAB_PRECEDENT: ${{ steps.precedent.outputs.base }}
          GITHUB_EVENT_REPO_NAME: ${{ github.event.repository.name }}
          DAILY_RUN_AT: ${{ steps.daily.outputs.at }}
        run: |
          set -e
          mkdir -p _site
          touch _site/.nojekyll
          for f in index.html division10.html confidence.js; do
            cp -f "$f" _site/ || echo "❌ MANQUANT (fichier de site) : $f"
          done
          for f in \
            matches_oddspapi.json \
            resultats.json \
            resultats_fast.json \
            players_data.json \
            elo_ratings_atp.json \
            elo_ratings_wta.json \
            confidence_calib.json \
            backtest_tennis.csv \
          ; do
            cp -f "$f" _site/ || echo "⚠️ absent : $f"
          done
          mkdir -p _site/algo
          cp algo/index.html _site/algo/ || echo "❌ MANQUANT : algo/index.html"
          cp algo/donnees.json _site/algo/ 2>/dev/null || echo "⚠️ algo/donnees.json absent (prochain passage des pronostics)"
          # 21/11/2026 (paquet 328) : site plus rapide et « pro ». site.json (l'essentiel, chargé d'abord) et site_plus.json
          # (bilan, journal, fiabilité, chargés ensuite) ; donnees.json reste publié (images et vidéos, secours de la page).
          if [ -f algo/donnees.json ]; then python3 scripts/site_leger.py algo/donnees.json _site/algo || echo "⚠️ site léger non construit : la page lira donnees.json"; fi
          cp algo/editeur.json algo/partage.png algo/methode.html algo/apropos.html _site/algo/
          # 23/11/2026 (paquet 391) : appli installable (manifeste, service worker, icônes) et page découpée (script et
          # style dans des fichiers à empreinte, gardés un an par le navigateur). Échec : la page reste d'un seul tenant.
          cp algo/manifest.webmanifest algo/sw.js algo/icone-192.png algo/icone-512.png algo/icone-maskable-512.png algo/apple-touch-icon.png _site/algo/
          python3 scripts/decouper_page.py _site/algo || { echo "::warning::page non découpée, publiée d'un seul tenant"; cp algo/index.html _site/algo/index.html; }
          if ls algo/polices/*.woff2 >/dev/null 2>&1; then
            mkdir -p _site/algo/polices && cp algo/polices/*.woff2 algo/polices/OFL.txt _site/algo/polices/
          else
            echo "::warning::Polices absentes : lancer une fois le workflow « Polices du site »."
          fi
          # 18/11/2026 (paquet 282) : les modèles 3D des personnages (joueurs, arbitre, juges de ligne, ramasseurs).
          # Ils n'avaient jamais été publiés : sur le site, le direct 3D restait en personnages simplifiés (les vidéos,
          # faites depuis le dépôt, les avaient). Échec explicite s'ils manquent.
          mkdir -p _site/algo/modeles
          cp algo/modeles/joueurs3d.bin algo/modeles/LICENCE.txt _site/algo/modeles/
          test -s _site/algo/modeles/joueurs3d.bin

          # V9.2 : 3D auto-hébergée ; échec explicite si les fichiers sont absents.
          mkdir -p _site/algo/vendor
          cp algo/vendor/babylon.js algo/vendor/babylonjs.loaders.min.js algo/vendor/Soldier.glb _site/algo/vendor/
          test -s _site/algo/vendor/babylon.js
          test -s _site/algo/vendor/babylonjs.loaders.min.js
          test -s _site/algo/vendor/Soldier.glb
          echo 'V9.2 : ressources 3D locales publiées.'

          # V10 : publier le studio 3D autonome, ses scripts et ses ressources.
          test -s algo/v10/index.html
          mkdir -p _site/algo/v10
          cp -R algo/v10/. _site/algo/v10/
          test -s _site/algo/v10/index.html
          echo 'V10 : studio 3D publie.'

          # Arena V1.9.2 : publier aussi les ressources CSS/JS utilisées par index.html.
          mkdir -p _site/arena
          cp arena/index.html arena/arena.js arena/config.js arena/arena-ui.css arena/arena-ui.js _site/arena/
          test -s _site/arena/arena-ui.css
          test -s _site/arena/arena-ui.js
          echo 'Arena : CSS et JS publiés avec succès.'

          mkdir -p _site/arena
          cp arena/index.html arena/arena.js _site/arena/

          mkdir -p _site/Tennis_Edge_Lab
          for f in index.html style.css app.js data.js; do
            cp "Tennis_Edge_Lab/$f" "_site/Tennis_Edge_Lab/$f"
          done
          for f in research.html research.js research_v61.js research_v63.js research_v66.js research_explorer.js research_profils.js research_reconciliation.js research_direct.js research_registre.js research_h18_h20.js freshness.js prive.js research.css research_v632.css research_v66.css research_explorer.css research_profils.css research_reconciliation.css research_direct.css research_registre.css v4.js v6.js; do
            cp "Tennis_Edge_Lab/$f" "_site/Tennis_Edge_Lab/$f"
          done
          python Tennis_Edge_Lab/publish_guard.py --root . --site _site \
            --previous-base "${LAB_PRECEDENT}" \
            --daily-run-at "${DAILY_RUN_AT}"
          for x in explorateur_alertes explorateur_histo explorateur_matchs explorateur_detections; do
            if [ -f "Tennis_Edge_Lab/live/$x.json.gz" ]; then
              cp "Tennis_Edge_Lab/live/$x.json.gz" "_site/Tennis_Edge_Lab/live/$x.json.gz"
              gunzip -c "Tennis_Edge_Lab/live/$x.json.gz" > "_site/Tennis_Edge_Lab/live/$x.json"
            fi
          done
          if [ -d Tennis_Edge_Lab/live/registre ]; then
            mkdir -p _site/Tennis_Edge_Lab/live/registre
            cp Tennis_Edge_Lab/live/registre/* _site/Tennis_Edge_Lab/live/registre/
          fi
          cp Tennis_Edge_Lab/live/lectures_profils.json _site/Tennis_Edge_Lab/live/ 2>/dev/null || echo "⚠️ lectures_profils.json absent"
          cp Tennis_Edge_Lab/live/delai_alertes.json _site/Tennis_Edge_Lab/live/ 2>/dev/null || echo "⚠️ delai_alertes.json absent"
          cp Tennis_Edge_Lab/live/croisements.json _site/Tennis_Edge_Lab/live/ 2>/dev/null || echo "⚠️ croisements.json absent"
          cp Tennis_Edge_Lab/live/pronostics_bilan.json _site/Tennis_Edge_Lab/live/ 2>/dev/null || echo "⚠️ bilan des pronostics absent"
          cp Tennis_Edge_Lab/live/joueurs_service.json.gz _site/Tennis_Edge_Lab/live/ 2>/dev/null || echo "⚠️ fiches service/retour absentes"
          mkdir -p _site/Tennis_Edge_Lab/live/archive
          cp Tennis_Edge_Lab/cache/archive/20*.json _site/Tennis_Edge_Lab/live/archive/ 2>/dev/null || echo "⚠️ archive annuelle absente"
          echo "--- contenu publié ---"
          du -sh _site
          ls -la _site
      - name: Envoyer le site à Cloudflare R2 (public et privé)
        id: r2
        continue-on-error: true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python scripts/publier_r2.py envoyer --site _site
      - name: Ne garder sur GitHub Pages que le site public (algo/ et arena/)
        if: steps.r2.outcome == 'success'
        run: |
          set -e
          mkdir -p _pages
          touch _pages/.nojekyll
          cp -R _site/algo _pages/
          cp -R _site/arena _pages/
          # 23/11/2026 (paquet 377) : les données complètes sont réservées à l'accès Plus (servies par le worker, depuis R2,
          # aux seuls abonnés) : jamais sur GitHub Pages, qui ne garde que la version libre.
          rm -f _pages/algo/site.json _pages/algo/donnees.json _pages/algo/site_admin.json   # 380 : sections internes
          echo "Pages : $(find _pages -type f | wc -l) fichiers publics (le Lab et le tableau sont servis par Cloudflare)."
      - name: Avertir si R2 a échoué (Pages garde tout, comme avant)
        if: steps.r2.outcome != 'success'
        run: echo "::warning::Envoi à R2 impossible ce passage — GitHub Pages publie encore tout le site."
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.r2.outcome == 'success' && '_pages' || '_site' }}
      # 24/11/2026 (paquet 406) : « Found 0 artifact(s) » une seconde après un envoi réussi (GitHub n'avait pas encore
      # enregistré l'artefact) — un second essai 30 s plus tard. Le site réel (Cloudflare R2) est envoyé avant, à part.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Pages — attendre avant le second essai
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
