# .github/workflows/pages.yml
#
# Prérequis (déjà fait) : Settings > Pages > Source = "GitHub Actions".
#
# Contenu vérifié directement dans le repo :
#   site    -> index.html, division10.html, confidence.js
#   données -> les 8 fichiers lus par le front en relatif
#              (window.location.origin + pathname + '<fichier>?t=' + Date.now())
# Tout le reste (parts/ 244 Mo, clv_history 26 Mo, closing_lines 6 Mo,
# scripts/, tests/, les .md, les .zip) n'est PAS publié : le front ne le
# lit jamais. C'est ce qui rend le déploiement rapide.

name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'division10.html'
      - 'confidence.js'
      - '.github/workflows/pages.yml'
      - 'Tennis_Edge_Lab/**'
  # Rafraîchit les données publiées sans dépendre des pushs de capture.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            index.html
            division10.html
            confidence.js
            matches_oddspapi.json
            resultats.json
            resultats_fast.json
            players_data.json
            elo_ratings_atp.json
            elo_ratings_wta.json
            confidence_calib.json
            backtest_tennis.csv
            Tennis_Edge_Lab/index.html
            Tennis_Edge_Lab/style.css
            Tennis_Edge_Lab/app.js
            Tennis_Edge_Lab/data.js
            Tennis_Edge_Lab/manifest.json
            Tennis_Edge_Lab/build_data.py
            Tennis_Edge_Lab/build_from_repo.py
            Tennis_Edge_Lab/fetch_worker_snapshot.py
            Tennis_Edge_Lab/autoresearch.py
            Tennis_Edge_Lab/research.html
            Tennis_Edge_Lab/research.css
            Tennis_Edge_Lab/research.js
            Tennis_Edge_Lab/research_v61.js
            Tennis_Edge_Lab/research_v63.js
            Tennis_Edge_Lab/research_v632.css
            Tennis_Edge_Lab/freshness.js
            Tennis_Edge_Lab/publish_guard.py
            Tennis_Edge_Lab/v4.js
            Tennis_Edge_Lab/v6.js
            Tennis_Edge_Lab/candidate_registry.py
            Tennis_Edge_Lab/source_catalog.py
            Tennis_Edge_Lab/cache
            Tennis_Edge_Lab/live/bookmakers_sets.json
            Tennis_Edge_Lab/live/bookmakers_sets_audit.json
            Tennis_Edge_Lab/live/bookmakers_sets_prospective.json
            Tennis_Edge_Lab/live/candidate_watch_v61_prospective.json
            Tennis_Edge_Lab/live/candidate_watch_v62_prospective.json
            Tennis_Edge_Lab/live/archive/bookmakers_sets_v61/current
            Tennis_Edge_Lab/registry
            scripts/validation_report.py
            set_results.json
            moves_detail_hist.csv
            moves_detail.csv
            paper_trades_canal.jsonl
            paper_trades_match.jsonl
            canal_clv_detail.csv
            closing_lines.json
            resultats_oddspapi.json
            resultats_derived.json
            pipeline_status.json
            book_index.json
            paper_canal_report.json
            h13_signal_log.jsonl
            h15_signal_log.jsonl
            h16_signal_log.jsonl
            h16b_signal_log.jsonl
            h17_signal_log.jsonl
            h18_signal_log.jsonl

      - name: Reconstruire les données Tennis Edge Lab
        env:
          LAB_CHECK_PREVIOUS: '1'
        run: |
          python Tennis_Edge_Lab/build_from_repo.py .
          python - <<'PYCODE'
          import json, pathlib, hashlib
          p=pathlib.Path('Tennis_Edge_Lab')
          manifest=json.loads((p/'manifest.json').read_text(encoding='utf8'))
          data=(p/'data.json').read_bytes()
          assert hashlib.sha256(data).hexdigest()==manifest['dataset_sha256']
          assert manifest['row_count']>=200
          print('✅ Jeu vérifié:',manifest['row_count'],'observations, hash',manifest['dataset_sha256'][:12])
          PYCODE

      - name: Recherche statistique autonome (lecture seule)
        run: |
          if python3 Tennis_Edge_Lab/autoresearch.py . && python3 -c "import json,pathlib; p=pathlib.Path('Tennis_Edge_Lab/live/research.json'); x=json.loads(p.read_text()); assert x['schema_version']==1 and x['row_counts']['settled_quality_ok']>=200 and len(x['frozen_hypotheses'])==7"; then
            echo 'Analyse autonome valide.'
          else
            # Aucun stub : publish_guard conserve la version publiée valide ou signale l'erreur.
            echo '::warning::Analyse autonome indisponible ; rapport précédent conservé si valide.'
            rm -f Tennis_Edge_Lab/live/research.json Tennis_Edge_Lab/live/matches_index.json
          fi

      - name: Évaluer les pistes gelées uniquement sur les nouveaux matchs
        run: |
          python3 Tennis_Edge_Lab/candidate_registry.py evaluate --root .
          python3 - <<'PY'
          import json
          o=json.load(open('Tennis_Edge_Lab/live/prospective.json'))
          assert o['schema_version']==1 and isinstance(o['models'],list)
          print('✅ Pistes prospectives:',len(o['models']))
          PY

      - name: Capturer le bilan public D1 (lecture seule, sans bloquer Pages)
        run: python Tennis_Edge_Lab/fetch_worker_snapshot.py Tennis_Edge_Lab/worker_hypotheses.json

      - name: Construire _site
        env:
          GITHUB_EVENT_REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -e
          mkdir -p _site
          touch _site/.nojekyll

          # --- Pages et script ---
          for f in index.html division10.html confidence.js; do
            cp -f "$f" _site/ || echo "❌ MANQUANT (fichier de site) : $f"
          done

          # --- Données lues par le front (relevées dans index.html/confidence.js) ---
          for f in \
            matches_oddspapi.json \
            resultats.json \
            resultats_fast.json \
            players_data.json \
            elo_ratings_atp.json \
            elo_ratings_wta.json \
            confidence_calib.json \
            backtest_tennis.csv \
          ; do
            cp -f "$f" _site/ || echo "⚠️ absent : $f"
          done

          # --- Analyse indépendante en sous-répertoire, sans écraser le site existant ---
          mkdir -p _site/Tennis_Edge_Lab
          for f in index.html style.css app.js data.js; do
            cp "Tennis_Edge_Lab/$f" "_site/Tennis_Edge_Lab/$f"
          done
          for f in research.html research.js research_v61.js research_v63.js freshness.js research.css research_v632.css v4.js v6.js; do
            cp "Tennis_Edge_Lab/$f" "_site/Tennis_Edge_Lab/$f"
          done
          # Rapports : copie fidèle, état de fraîcheur explicite, jamais de remplacement
          # d'un rapport valide déjà publié par un fichier absent, vide, pending ou error.
          python Tennis_Edge_Lab/publish_guard.py --root . --site _site \
            --previous-base "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_EVENT_REPO_NAME}/Tennis_Edge_Lab/live"

          echo "--- contenu publié ---"
          du -sh _site
          ls -la _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
