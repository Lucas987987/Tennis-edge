name: Fiches joueurs

# Quotidien, apres steam_pipeline : build_profiles lit moves_detail_hist.csv,
# qui est reconstruit par move_audit. Le lancer avant produirait une fiche
# sur l'historique de la veille.
on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * *'

permissions:
  contents: write

jobs:
  profils:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # AJOUTÉ LE 10/10/2026. build_profiles lit le classement officiel
      # ATP/WTA dans les fichiers Excel tennis-data de historique/. Sans
      # openpyxl il tourne quand même, sans la ligne « Classement ATP ».
      - name: Installer openpyxl
        run: pip install --quiet openpyxl || true

      # AJOUTÉ LE 10/10/2026. Les partitions de courbes anciennes sont
      # archivées en Releases pour alléger le dépôt ; sans les restaurer,
      # player_form ne retrouve pas la date d'un résultat (set_results ne se
      # date que par sa courbe) et le match disparaît des fiches. Constaté :
      # Buse – Halys du 01/10 absent, « dernier match il y a 32 jours » ; sur
      # la semaine du 28/09, jusqu'à 25 matchs sur 38 par jour sans courbe.
      # Même étape que dans courbes_alertes.yml.
      - name: Restaurer les partitions de courbes archivées
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/restore_curves.py || true

      # AJOUTÉ LE 08/10/2026. player_form.py n'était lancé par aucun
      # workflow : player_form.json datait du 05/10 et une fiche annonçait
      # « dernier match : hier » pour un match du 04/10.
      #
      # Ici et pas ailleurs : build_profiles.py LIT ce fichier à l'étape
      # suivante. Producteur et consommateur dans le même job, dans cet
      # ordre — aucun décalage d'âge possible entre les deux.
      #
      # rebuild d'abord : les courbes plates ne sont plus commitées, et
      # player_form les lit pour ses résidus de marché. Sans elles il tourne
      # quand même, en perdant cette seule section.
      - name: Forme et fatigue des joueurs
        run: |
          python scripts/curves_parts.py rebuild || true
          python scripts/player_form.py || true

      # build_profiles ne lit QUE des fichiers plats a la racine : ni
      # partitions, ni releases. Pas de restore_curves a prevoir.
      - name: Construire les fiches
        run: python scripts/build_profiles.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players_profile.json player_form.json
          git diff --cached --quiet && { echo "fiches inchangees"; exit 0; }
          git commit -m "Fiches joueurs ($(date -u +%Y-%m-%d))"
          attente=2
          for essai in 1 2 3 4 5 6; do
            git fetch origin main || true
            if ! git merge origin/main --no-edit; then
              if python scripts/merge_json_state.py; then
                git commit --no-edit || true
              else
                git merge --abort 2>/dev/null || true
                [ "$essai" -lt 6 ] && { sleep "$attente"; attente=$((attente*2)); }
                continue
              fi
            fi
            if git push; then echo "✅ PUSH OK (tentative $essai)"; exit 0; fi
            [ "$essai" -lt 6 ] && { sleep "$attente"; attente=$((attente*2)); }
          done
          echo "❌ PUSH ÉCHOUÉ après 6 tentatives (62 s cumulées)"
          exit 1
