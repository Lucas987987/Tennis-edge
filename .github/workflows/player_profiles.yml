name: Fiches joueurs

# Quotidien, apres steam_pipeline : build_profiles lit moves_detail_hist.csv,
# qui est reconstruit par move_audit. Le lancer avant produirait une fiche
# sur l'historique de la veille.
on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * *'

permissions:
  contents: write

env:
  # Étape 4 (16/10/2026) : l'historique FIGÉ des courbes (parts/hist_*) est
  # servi par R2 ; les lecteurs rapatrient ce qui manque (scripts/hist_r2.py).
  R2_HIST_MATERIALIZE: '1'
  # R2 (15/10/2026) — voir README_MIGRATION_R2.md. off | double | on ;
  # sans variable de dépôt : double (git fait foi, R2 reçoit une copie).
  R2_PRIMARY: ${{ vars.R2_PRIMARY || 'double' }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

jobs:
  profils:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 22/11/2026 (paquet 351) — COTES EN PRIVÉ, ÉTAPE 3b : en mode ETAT_CHAUD=prive, les fichiers de cotes (dont
      # moves_detail*.csv, suivi_direct/resultats.json, resultats_oddspapi.json) ne sont plus dans le dépôt public ;
      # rapatriés ici depuis R2 (lecture). Dans les autres modes, rien ne change.
      - name: Cotes privées — rapatrier (paquet 351)
        env:
          ETAT_CHAUD: ${{ vars.ETAT_CHAUD || 'double' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python3 scripts/cotes_privees.py pull || true

      # AJOUTÉ LE 10/10/2026. build_profiles lit le classement officiel
      # ATP/WTA dans les fichiers Excel tennis-data de historique/. Sans
      # openpyxl il tourne quand même, sans la ligne « Classement ATP ».
      - name: Installer openpyxl
        run: pip install --quiet openpyxl || true

      # AJOUTÉ LE 10/10/2026. Les partitions de courbes anciennes sont
      # archivées en Releases pour alléger le dépôt ; sans les restaurer,
      # player_form ne retrouve pas la date d'un résultat (set_results ne se
      # date que par sa courbe) et le match disparaît des fiches. Constaté :
      # Buse – Halys du 01/10 absent, « dernier match il y a 32 jours » ; sur
      # la semaine du 28/09, jusqu'à 25 matchs sur 38 par jour sans courbe.
      # Même étape que dans courbes_alertes.yml.
      - name: Restaurer les partitions de courbes archivées
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/restore_curves.py || true

      # AJOUTÉ LE 08/10/2026. player_form.py n'était lancé par aucun
      # workflow : player_form.json datait du 05/10 et une fiche annonçait
      # « dernier match : hier » pour un match du 04/10.
      #
      # Ici et pas ailleurs : build_profiles.py LIT ce fichier à l'étape
      # suivante. Producteur et consommateur dans le même job, dans cet
      # ordre — aucun décalage d'âge possible entre les deux.
      #
      # rebuild d'abord : les courbes plates ne sont plus commitées, et
      # player_form les lit pour ses résidus de marché. Sans elles il tourne
      # quand même, en perdant cette seule section.
      # 24/11/2026 (paquet 402) : « env » vide = fichier refusé par GitHub. Les courbes se reconstruisent
      # sans les clés R2 (comportement d'avant) ; le script suit, dans sa propre étape, avec les clés du journal privé.
      - name: Reconstruire les courbes
        run: python scripts/curves_parts.py rebuild || true

      - name: Forme et fatigue des joueurs
        env:   # 393 : journal complet de scripts/discret.py → coffre privé (échec : Telegram)
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/discret.py -- python scripts/player_form.py || true

      # build_profiles ne lit QUE des fichiers plats a la racine : ni
      # partitions, ni releases. Pas de restore_curves a prevoir.
      - name: Construire les fiches
        env:   # 393 : journal complet de scripts/discret.py → coffre privé (échec : Telegram)
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/discret.py -- python scripts/build_profiles.py

      # 22/11/2026 (paquet 348) : les fiches (construites sur les cotes) vont au coffre privé ; le worker « joueurs »
      # les lit dans R2, derrière connexion. Sorties du dépôt public dès que le coffre en a une copie identique.
      - name: Coffre privé — fiches joueurs
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          python scripts/coffre.py push --groupe profils || true
          python scripts/coffre.py retirer --groupe profils || true

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player_form.json
          # 348 : players_profile.json est au coffre — ajouté seulement tant qu'il est encore suivi par git
          if git ls-files --error-unmatch players_profile.json >/dev/null 2>&1; then git add players_profile.json; fi
          git diff --cached --quiet && { echo "fiches inchangees"; exit 0; }
          git commit -m "Fiches joueurs ($(date -u +%Y-%m-%d))"
          attente=2
          for essai in 1 2 3 4 5 6; do
            git fetch origin main || true
            if ! git merge origin/main --no-edit; then
              if python scripts/merge_json_state.py; then
                git commit --no-edit || true
              else
                git merge --abort 2>/dev/null || true
                [ "$essai" -lt 6 ] && { sleep "$attente"; attente=$((attente*2)); }
                continue
              fi
            fi
            if git push; then echo "✅ PUSH OK (tentative $essai)"; exit 0; fi
            [ "$essai" -lt 6 ] && { sleep "$attente"; attente=$((attente*2)); }
          done
          echo "❌ PUSH ÉCHOUÉ après 6 tentatives (62 s cumulées)"
          exit 1
