name: Polymarket Collector

on:
  repository_dispatch:
    types: [polymarket_collector]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polymarket-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests websocket-client

      - name: Polymarket collector
        run: |
          python scripts/polymarket_collector_scripts.py \
            --duration-seconds 240 \
            --refresh-seconds 180

      - name: Commit Polymarket data (robuste)
        shell: bash
        run: |
          set -u

          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name '*.pyc' -delete 2>/dev/null || true

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add polymarket_markets.json polymarket_ticks.jsonl polymarket_collector_state.json

          if git diff --staged --quiet; then
            echo 'Aucune nouvelle donnée Polymarket à commit.'
            exit 0
          fi

          git commit -m "Polymarket collector ($(date -u +%H:%MZ))"

          # Même logique robuste que le pipeline capture_closing : on récupère
          # les commits arrivés pendant la collecte avant de pousser.
          for attempt in 1 2 3; do
            echo "--- synchronisation Git (tentative $attempt/3) ---"
            git fetch origin main || true

            if git merge origin/main --no-edit; then
              if git push origin HEAD:main; then
                echo 'Push Polymarket OK.'
                exit 0
              fi
            else
              echo 'Merge non automatique. Abandon du run pour éviter d écraser main.'
              exit 1
            fi

            sleep 3
          done

          echo 'ERREUR: impossible de pousser les données Polymarket après 3 tentatives.'
          exit 1
