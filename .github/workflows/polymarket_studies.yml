name: Etudes Polymarket/Kalshi (analyse des ticks collectes)

# CRÉÉ LE 27/08/2026 suite à l'audit du 27/08 (§4.1) : les collecteurs
# tournent (~105 Mo/jour de tickets pm_ticks+kx_ticks) mais AUCUN workflow
# n'appelait les 5 scripts d'analyse écrits pour les lire — le plus gros
# poste de dépense (stockage + temps de runner) du dépôt pour zéro sortie.
# Quotidien plutôt qu'à chaque cycle : ces études lisent des journées
# entières de ticks, coûteux en I/O, pas besoin de fraîcheur à 5 minutes.

env:
  PYTHONDONTWRITEBYTECODE: '1'

on:
  schedule:
    - cron: '20 4 * * *'      # tôt le matin, avant la compression nocturne
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polymarket-studies
  cancel-in-progress: false

jobs:
  etudes:
    runs-on: ubuntu-latest
    # CORRIGÉ LE 27/08/2026 (audit v2 §H) : 5 scripts x 600s pouvaient
    # atteindre 50 min sous un budget de 30 -- mathématiquement intenable,
    # le job se faisait tuer avant la fin, rapport tronqué, commit jamais
    # atteint. 300s/script x 5 = 25 min max, large marge sous 60.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          # AJOUTÉ (audit v2 §H) : dépôt à 675+ Mo, ces études ne lisent que
          # les scripts et les ticks pm/kx -- inutile de rapatrier le reste.
          sparse-checkout: |
            /*
            !/parts
            /parts/pm_ticks_*
            /parts/kx_ticks_*
            /parts/hist_book_*
          # CORRIGÉ LE 28/08/2026 (audit v7 §AJ) : /parts/hist_book_* manquait
          # -- les 5 études croisent les ticks Polymarket/Kalshi avec les
          # courbes Pinnacle, c'est tout leur objet, et sans ces partitions
          # elles chargent 2,3 millions de ticks pour les comparer à zéro
          # courbe. Ironie assumée : c'est ma propre recommandation de la
          # passe 2 (réduire le sparse-checkout pour tenir le budget temps)
          # qui a cassé les études qu'elle devait rendre exécutables --
          # ~300 Mo ajoutés, large marge sous les 60 minutes.
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exécuter les 5 études
        run: |
          # CORRIGÉ (audit v2 §H) : écriture INCRÉMENTALE (>> après chaque
          # script), pas un seul bloc redirigé à la fin -- si le job est
          # tué en cours de route, ce qui est déjà sur disque reste
          # committable, au lieu d'un fichier vide ou tronqué en mémoire.
          echo "# Études Polymarket/Kalshi — rapport du $(date -u +%F)" > polymarket_studies_report.md
          echo >> polymarket_studies_report.md
          echo '```' >> polymarket_studies_report.md
          # RETIRÉ LE 03/09/2026 : polymarket_flow. Ce script mesure le flux
          # d'ARGENT (trade_notional / trade_size) avant un mouvement Pinnacle.
          # Or le collecteur n'enregistre AUCUN volume -- mesuré : 0 échange
          # horodaté sur 2,4 millions de ticks. Le script ne peut donc rien
          # produire, quelle que soit la durée qu'on lui accorde : il consommait
          # 300 s pour finir en timeout (code 124) chaque jour.
          #
          # Sans conséquence tant que l'échec était noté ⚠️. Depuis que les
          # timeouts sont correctement comptés comme des échecs (❌) et que
          # `alerte` bloque --strict, ce script cassait TOUT steam_pipeline --
          # dont les 9 autres livrables étaient pourtant tous ✅ OK.
          #
          # À REMETTRE le jour où le collecteur Polymarket enregistrera les
          # volumes (champs trade_notional / trade_size dans les ticks). D'ici
          # là, le garder dans la boucle revient à faire échouer un pipeline
          # sain pour une question qu'on ne peut pas encore poser.
          for s in polymarket_leadlag polymarket_studies pm_calibration_track pm_observations; do
            echo "--- $s ---" >> polymarket_studies_report.md
            # CORRIGÉ LE 30/08/2026 (validation externe, point 2) : ⚠️ pour
            # un ÉCHEC RÉEL (code 124 = timeout, ou toute autre sortie non
            # nulle) -- avant le correctif d'hier (audit v9-v10) qui a
            # séparé n_echecs (❌, bloquant) de n_avertissements (⚠️, info),
            # les deux symboles étaient comptés ensemble et cette erreur ne
            # portait pas à conséquence. Une fois séparés, un script qui
            # timeout TOUS LES JOURS (mesuré : polymarket_flow > 8 min
            # contre un timeout de 300s) tombait dans le compteur qui ne
            # bloque JAMAIS --strict, vert en continu.
            PYTHONPATH=scripts timeout 300 python scripts/${s}.py >> polymarket_studies_report.md 2>&1 \
              || echo "❌ ${s}.py EN ÉCHEC (code $?)" >> polymarket_studies_report.md
            echo >> polymarket_studies_report.md
          done
          echo '```' >> polymarket_studies_report.md
          test -s polymarket_studies_report.md
          # AJOUTÉ LE 28/08/2026 (audit v7 §AJ) : `test -s` vérifie que le
          # fichier n'est pas vide -- un rapport avec 5 ❌ le passe sans
          # problème, et le commit part silencieusement. Même motif que Q3
          # avant son propre correctif, sauf qu'ici l'info est déjà écrite
          # en clair dans le rapport ; il manquait juste quelqu'un pour la
          # compter. Écrit dans un fichier committé, relu par
          # pipeline_status.py -- même schéma que q3_status.json.
          # genere_le ajouté : ce statut est écrit par CE workflow (04h20
          # UTC), relu par steam_pipeline.yml (00h15 UTC) -- sans date,
          # pipeline_status.py ne peut pas savoir si le statut affiché a
          # 20 minutes ou 20 jours si ce workflow s'arrête de tourner.
          # CORRIGÉ LE 28/08/2026 (audit v9 §AR, URGENT avant le run de
          # 04h20) : ❌|⚠️ compte AUSSI les avertissements de fonctionnement
          # normal ("historique tronqué", émis par 4 des 5 scripts dès que
          # parts/ARCHIVE_INDEX.json est non vide -- 6 partitions désormais,
          # donc DÉSORMAIS TOUJOURS). Branché sur --strict hier soir, ça
          # aurait rendu steam_pipeline rouge à CHAQUE run à partir de
          # demain matin -- simulé sur un rapport à 0 échec réel : n_echecs
          # comptait 7. Deux compteurs distincts maintenant : n_echecs
          # (❌ seul, bloquant) et n_avertissements (⚠️ en plus, affiché
          # seulement -- jamais passé à alerte).
          n_echecs=$(grep -c "❌" polymarket_studies_report.md || true)
          n_avertissements=$(grep -c "⚠️" polymarket_studies_report.md || true)
          alerte=$(python3 -c "print($n_echecs > 0)")
          genere_le=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 -c "import json; json.dump({'n_echecs': $n_echecs, 'n_avertissements': $n_avertissements, 'alerte': $alerte, 'genere_le': '$genere_le'}, open('polymarket_studies_status.json', 'w'), ensure_ascii=False, indent=1)"
      - name: Committer le rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- polymarket_studies_report.md polymarket_studies_status.json
          git diff --staged --quiet && { echo "rien de neuf"; exit 0; }
          git commit -m "Études Polymarket/Kalshi ($(date -u +%F))"
          for essai in 1 2 3; do
            git fetch origin main || true
            git merge origin/main --no-edit || { git merge --abort 2>/dev/null || true; sleep 8; continue; }
            git push && exit 0
            sleep 8
          done
          exit 1
