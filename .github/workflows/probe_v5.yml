name: Probe OddsPapi v5

# Sonde de migration v5 — a lancer manuellement (Actions > Probe OddsPapi v5 > Run workflow).
# Elle imprime les vraies reponses v5 (sports, marches, match tennis, cotes Pinnacle,
# historique) dans les logs. Colle le log a Claude pour finaliser le client v5.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run probe
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/discret.py -- python scripts/probe_v5.py
