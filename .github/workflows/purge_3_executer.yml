name: Purge 3/3 — EXECUTER (DESTRUCTIF, force-push)

# ═══════════════════════════════════════════════════════════════════════════
#  ÉTAPE 3 SUR 3 — LA SEULE QUI DÉTRUIT QUELQUE CHOSE.
#
#  Réécrit les 18 854 commits et force-push sur main. Irréversible sans la
#  sauvegarde de l'étape 1. Tous les clones existants deviennent inutilisables.
#
#  NE PAS LANCER SANS :
#    1. « Purge 1/3 — SAUVEGARDE » passée au vert, artefact bundle
#       TÉLÉCHARGÉ HORS DE GITHUB (téléphone, Drive, disque) ;
#    2. « Purge 2/3 — LISTE » passée, et purge_chemins.txt RELU à la racine ;
#    3. le secret GH_PAT_WORKFLOW recréé (voir plus bas).
#
#  POURQUOI UN PAT : la réécriture change le SHA de TOUS les commits, y
#  compris ceux qui touchent .github/workflows/. GITHUB_TOKEN n'a pas le
#  droit de pousser des fichiers de workflow — c'est ce qui a fait échouer
#  le bump du 04/09. Jeton fine-grained sur Tennis-edge, permissions
#  Contents = Read and write ET Workflows = Read and write, secret nommé
#  GH_PAT_WORKFLOW. À révoquer juste après.
#
#  SI main EST PROTÉGÉE (Settings > Branches), le force-push sera refusé.
#  Il faut lever la protection le temps de l'opération, puis la remettre.
#
#  APRÈS LA PURGE, LA TAILLE NE BAISSERA PAS TOUT DE SUITE. GitHub conserve
#  les objets devenus inatteignables jusqu'à son propre ramasse-miettes, qui
#  n'est pas déclenchable par l'utilisateur. Le dépôt peut afficher 4 Go
#  encore plusieurs jours. Pour accélérer, ouvrir un ticket au support
#  GitHub en demandant un `gc` sur le dépôt. Ne concluez pas à un échec sur
#  la mesure du lendemain.
# ═══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Taper exactement : JE CONFIRME LA PURGE"
        required: true
        default: ""

permissions:
  contents: write
  actions: write      # pour suspendre puis réactiver les autres workflows

concurrency:
  group: purge-historique
  cancel-in-progress: false

jobs:
  purger:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Vérifier la confirmation et le jeton
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "JE CONFIRME LA PURGE" ]; then
            echo "❌ Confirmation absente ou incorrecte. Rien n'a été fait."
            echo "   Attendu, exactement : JE CONFIRME LA PURGE"
            exit 1
          fi
          if [ -z "${{ secrets.GH_PAT_WORKFLOW }}" ]; then
            echo "❌ secret GH_PAT_WORKFLOW absent."
            echo "   La réécriture change le SHA des commits touchant"
            echo "   .github/workflows/ ; GITHUB_TOKEN ne peut pas les pousser."
            echo "   Le force-push échouerait APRÈS la réécriture locale."
            exit 1
          fi
          echo "✅ confirmation et jeton présents."

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT_WORKFLOW }}

      - name: Vérifier que la SAUVEGARDE existe
        run: |
          set -euo pipefail
          # Refuser de purger si l'étape 1 n'a pas laissé de branche de
          # sauvegarde. C'est la garde la plus importante du fichier : sans
          # elle, une erreur ici est définitive.
          git fetch origin '+refs/heads/backup-avant-purge-*:refs/remotes/origin/backup-avant-purge-*' || true
          BR=$(git branch -r | grep -c 'backup-avant-purge-' || true)
          if [ "$BR" -eq 0 ]; then
            echo "❌ Aucune branche backup-avant-purge-* sur le dépôt."
            echo "   Lancer « Purge 1/3 — SAUVEGARDE » d'abord."
            exit 1
          fi
          echo "✅ $BR branche(s) de sauvegarde trouvée(s) :"
          git branch -r | grep 'backup-avant-purge-'

      - name: Vérifier la LISTE
        id: liste
        run: |
          set -euo pipefail
          if [ ! -s purge_chemins.txt ]; then
            echo "❌ purge_chemins.txt absent ou vide."
            echo "   Lancer « Purge 2/3 — LISTE » d'abord."
            exit 1
          fi
          N=$(grep -vc '^#' purge_chemins.txt || true)
          [ "$N" -gt 0 ] || { echo "❌ liste sans aucun chemin."; exit 1; }
          echo "✅ $N chemins à purger."
          echo
          echo "─── rappel des 15 premiers ───"
          grep -v '^#' purge_chemins.txt | head -15

          # Dernière vérification avant l'irréversible : AUCUN chemin de la
          # liste ne doit exister dans HEAD. L'étape 2 l'a déjà contrôlé,
          # mais le dépôt a pu bouger entre-temps — un fichier restauré
          # depuis, par exemple, comme canal_public.py l'a été aujourd'hui.
          ERR=0
          while IFS= read -r c; do
            case "$c" in \#*|'') continue ;; esac
            if git cat-file -e "HEAD:$c" 2>/dev/null; then
              echo "❌ $c EXISTE dans HEAD — la liste est périmée."
              ERR=1
            fi
          done < purge_chemins.txt
          [ "$ERR" -eq 0 ] || { echo "Relancer l'étape 2/3."; exit 1; }
          echo "✅ aucun chemin de la liste n'existe dans HEAD."

      - name: Suspendre tous les autres workflows
        env:
          # CORRIGÉ LE 05/09/2026 : la version précédente passait ici
          # GH_PAT_WORKFLOW. Un jeton fine-grained avec Contents + Workflows
          # n'a PAS la permission Actions : les 50 appels ont répondu
          # « HTTP 403: Resource not accessible by personal access token »
          # et AUCUN workflow n'a été suspendu. capture_closing a continué de
          # committer, main a bougé, le force-push a été rejeté après une
          # heure de travail. C'est GITHUB_TOKEN qu'il faut : le bloc
          # `permissions: actions: write` en tête de fichier est pour lui.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow list --all --limit 200 --json name,id,state > /tmp/workflows.json
          python3 - <<'PY' > /tmp/a_suspendre.txt
          import json
          moi = "Purge 3/3"
          for w in json.load(open('/tmp/workflows.json')):
              if w['state'] == 'active' and not w['name'].startswith(moi):
                  print(w['id'])
          PY
          echo "$(wc -l < /tmp/a_suspendre.txt) workflow(s) à suspendre."

          # CORRIGÉ LE 05/09/2026 : l'échec n'est plus avalé. La version
          # précédente faisait `|| echo "⚠️"` puis affichait « ✅ workflows
          # suspendus » quoi qu'il arrive -- un message qui ment est pire que
          # pas de message, on lance l'irréversible en se croyant protégé.
          ECHECS=0
          while read -r id; do
            if gh workflow disable "$id"; then
              echo "  suspendu $id"
            else
              echo "  ❌ ÉCHEC sur $id"
              ECHECS=$((ECHECS + 1))
            fi
          done < /tmp/a_suspendre.txt
          if [ "$ECHECS" -gt 0 ]; then
            echo "❌ $ECHECS suspension(s) en échec — ON ARRÊTE ICI."
            echo "   Purger sans suspendre, c'est laisser capture_closing"
            echo "   committer pendant la réécriture : soit le push est"
            echo "   rejeté, soit il écrase des commits."
            exit 1
          fi
          echo "✅ tous les workflows sont suspendus (vérifié, pas supposé)."

      - name: Attendre la fin des runs déjà lancés
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Suspendre empêche les NOUVEAUX déclenchements ; un run déjà en vol
          # continue et committera. On attend qu'il n'en reste aucun.
          for i in $(seq 1 30); do
            N=$(gh run list --status in_progress --limit 100 --json databaseId,name \
                | python3 -c "import json,sys; print(sum(1 for r in json.load(sys.stdin) if not r['name'].startswith('Purge 3/3')))")
            [ "$N" -eq 0 ] && { echo "✅ aucun run en cours."; break; }
            echo "  $N run(s) encore en cours, attente 20 s ($i/30)..."
            sleep 20
          done

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Installer git-filter-repo
        run: |
          python3 -m pip install --quiet git-filter-repo
          git filter-repo --version

      - name: Mesurer AVANT
        run: du -sh .git

      - name: RÉÉCRIRE l'historique
        run: |
          set -euo pipefail
          grep -v '^#' purge_chemins.txt | grep . > /tmp/chemins.txt
          cp /tmp/chemins.txt /tmp/chemins-sauvegarde.txt
          echo "$(wc -l < /tmp/chemins.txt) chemins."
          # --force : filter-repo refuse un dépôt non fraîchement cloné.
          # C'est ici, et ici seulement, qu'il est légitime.
          git filter-repo --invert-paths --paths-from-file /tmp/chemins.txt --force
          echo "✅ réécriture terminée."

      - name: Mesurer APRÈS
        run: |
          git reflog expire --expire=now --all || true
          # CORRIGÉ LE 05/09/2026 : `--aggressive` a pris 52 MINUTES sur les
          # 19 000 commits (06:34 -> 07:26), pendant lesquelles main a bougé.
          # Il est de toute façon redondant : filter-repo repacke déjà lui-
          # même (« Repacking your repo... finished after 29.38 seconds »).
          # Le gain de compression ne valait pas une heure de fenêtre de
          # course sur un dépôt qui commite toutes les 5 minutes.
          git gc --prune=now
          echo "=== .git après purge et gc ==="
          du -sh .git
          echo "=== commits conservés ==="
          git rev-list --count --all

      - name: Force-push
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_WORKFLOW }}
        run: |
          set -euo pipefail
          # filter-repo supprime le remote origin par sécurité : il faut le
          # remettre explicitement, ce qui est une garde de plus (aucun push
          # accidentel pendant la réécriture).
          git remote remove origin 2>/dev/null || true
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # AJOUTÉ LE 05/09/2026 : le push a été rejeté par « cannot lock
          # ref » -- une mise à jour concurrente de main. Avec la suspension
          # réparée la fenêtre est réduite à ~2 min, mais un réessai coûte
          # trois lignes et évite de refaire une heure de travail.
          for essai in 1 2 3; do
            if git push --force origin HEAD:main; then
              echo "✅ force-push effectué (essai $essai)."
              exit 0
            fi
            echo "  ⚠️ essai $essai rejeté, nouvelle tentative dans 15 s..."
            sleep 15
          done
          echo "❌ FORCE-PUSH ÉCHOUÉ après 3 essais."
          echo "   Le dépôt distant est INTACT — rien n'a été détruit."
          echo "   Vérifier qu'aucun workflow ne pousse encore, puis relancer"
          echo "   l'étape 2/3 (la liste a pu se périmer) et cette étape."
          exit 1"

      - name: Réactiver les workflows
        if: always()
        env:
          # CORRIGÉ LE 05/09/2026, même cause que la suspension : le PAT
          # n'a pas la permission Actions. Cette étape aurait donc échoué
          # elle aussi -- et APRÈS une purge réussie, elle aurait laissé les
          # 50 workflows éteints. Panne totale et silencieuse du pipeline,
          # au moment précis où on croit avoir fini.
          GH_TOKEN: ${{ github.token }}
        run: |
          # `always()` : même si la purge a échoué, le dépôt ne doit pas
          # rester figé. Un pipeline suspendu qu'on a oublié de rallumer est
          # une panne silencieuse de plus.
          if [ ! -f /tmp/a_suspendre.txt ]; then
            echo "rien à réactiver (échec avant la suspension)."
            exit 0
          fi
          ECHECS=0
          while read -r id; do
            if gh workflow enable "$id"; then
              echo "  réactivé $id"
            else
              echo "  ❌ ÉCHEC de réactivation : $id"
              ECHECS=$((ECHECS + 1))
            fi
          done < /tmp/a_suspendre.txt
          if [ "$ECHECS" -gt 0 ]; then
            echo
            echo "🆘 $ECHECS workflow(s) SONT RESTÉS SUSPENDUS."
            echo "   Les réactiver à la main : onglet Actions, sélectionner"
            echo "   chaque workflow désactivé, menu ··· > Enable workflow."
            exit 1
          fi
          echo "✅ tous les workflows sont réactivés (vérifié).".

      - name: Suite
        if: success()
        run: |
          echo "═══════════════════════════════════════════════════"
          echo " PURGE TERMINÉE."
          echo
          echo " 1. La taille affichée par GitHub NE BAISSERA PAS tout"
          echo "    de suite : les objets devenus inatteignables restent"
          echo "    jusqu'au ramasse-miettes de GitHub, non déclenchable"
          echo "    par l'utilisateur. Ouvrir un ticket au support en"
          echo "    demandant un gc pour accélérer."
          echo " 2. Vérifier qu'un run de capture_closing repart bien."
          echo " 3. Révoquer le PAT et supprimer le secret."
          echo " 4. GARDER la branche backup-avant-purge-* et le bundle"
          echo "    au moins quelques semaines."
          echo " 5. Supprimer les 3 workflows de purge."
          echo "═══════════════════════════════════════════════════"
