name: Qualité des données (contrôle quotidien)

# AJOUTÉ LE 18/11/2026 (paquet 272). simulateur/controle_donnees.py : chaque match de la veille et des 30 derniers jours
# est rangé par cause (résolu, doublon reprogrammé, adversaire remplacé, abandon / forfait, aucune feuille…). Le détail
# part sur le Telegram PRIVÉ, avec une alerte si les défauts dépassent 10 % ; seul le rapport public (des comptes, sans
# nom ni cote) est commité. Push normal, jamais forcé.

on:
  workflow_dispatch:
  schedule:
    - cron: '41 7 * * *'

permissions:
  contents: write

concurrency:
  group: qualite-donnees
  cancel-in-progress: false

jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /simulateur/
            /feuilles/
            /Tennis_Edge_Lab/live/pronostics_resultats.json
            /algo/donnees.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Contrôle (détail sur le Telegram privé)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python simulateur/controle_donnees.py . --telegram
      - name: Commit du rapport public (push normal, jamais forcé)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- simulateur/rapport_qualite_donnees.json
          if git diff --staged --quiet; then echo "Rien à committer."; exit 0; fi
          git commit -m "Qualité des données : rapport du jour (paquet 272)"
          attente=2
          for essai in 1 2 3 4 5 6; do
            git fetch origin main || true
            if git merge origin/main --no-edit; then :; else
              git merge --abort 2>/dev/null || true
              sleep "$attente"; attente=$((attente*2)); continue
            fi
            if git push origin HEAD:main; then echo "✅ PUSH OK"; exit 0; fi
            sleep "$attente"; attente=$((attente*2))
          done
          echo "❌ push impossible — relancer le workflow."
          exit 1
