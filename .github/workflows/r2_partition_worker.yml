name: R2 V6.4 partition worker

run-name: R2 partition worker ${{ inputs.mode }} #${{ github.run_id }}

# Manual only. No schedule and no workflow_run trigger: it can never fire
# alongside, or because of, a collector.
#
# Writes are authorised PER RUN, never by a persistent setting. A real write
# (mode=sync) needs, in the same dispatch: confirm_write=true, max_partitions=1,
# one exact partition version (provider + day + Git blob id) and an allowed
# root (parts/v64-archive or parts/v64-archive-test/<name>). The worker
# re-checks all of it and refuses otherwise. Default: dry-run, no write.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (no R2 writes) | sync (create-only archive of ONE targeted partition) | verify (read-only comparison)"
        type: choice
        options: [dry-run, sync, verify]
        default: dry-run
      confirm_write:
        description: "mode=sync only: authorise create-only R2 writes for THIS run"
        type: boolean
        default: false
      root_prefix:
        description: "R2 prefix root; parts/v64-archive-test/<name> is a sandbox"
        type: string
        default: parts/v64-archive
      max_partitions:
        description: "Maximum partitions processed in this run (must be 1 for sync)"
        type: string
        default: "1"
      provider:
        description: "polymarket or kalshi (required with a target; empty = both, dry-run/verify only)"
        type: string
        default: ""
      partition_day:
        description: "Target day YYYY-MM-DD (required for sync)"
        type: string
        default: ""
      partition_blob:
        description: "Target Git blob id, 40 hex (required for sync). Must match the file published on main."
        type: string
        default: ""
      source_commit:
        description: "Optional 40-hex commit of main to read the partition from (needed once the day left main's 7-day window). Must be an ancestor of main (<=30 days) and contain the exact blob."
        type: string
        default: ""

permissions:
  contents: read

# Own group: never shares a concurrency group with any collector.
concurrency:
  group: r2-partition-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Write gate (mode=sync only)
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm_write }}
          ROOT: ${{ inputs.root_prefix }}
          MAXP: ${{ inputs.max_partitions }}
          PROVIDER: ${{ inputs.provider }}
          DAY: ${{ inputs.partition_day }}
          BLOB: ${{ inputs.partition_blob }}
        run: |
          if [ "$MODE" != "sync" ]; then
            echo "mode=$MODE: no R2 write can happen in this run."
            exit 0
          fi
          fail() { echo "Blocked: $1"; exit 1; }
          [ "$CONFIRM" = "true" ] || fail "confirm_write must be true for mode=sync."
          [ "$MAXP" = "1" ] || fail "max_partitions must be exactly 1 for mode=sync."
          case "$PROVIDER" in polymarket|kalshi) ;; *) fail "provider must be polymarket or kalshi." ;; esac
          [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || fail "partition_day must be YYYY-MM-DD."
          [[ "$BLOB" =~ ^[0-9a-f]{40}$ ]] || fail "partition_blob must be a 40-hex Git blob id."
          case "$ROOT" in
            parts/v64-archive|parts/v64-archive-test/*) ;;
            *) fail "root_prefix must be parts/v64-archive or parts/v64-archive-test/<name>." ;;
          esac
          case "$ROOT" in *..*) fail "root_prefix must not contain '..'." ;; esac
          echo "Write authorised for this run only: $PROVIDER $DAY $BLOB -> $ROOT"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/partitioned_store.py
            /scripts/r2_partition_worker.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Fetch published partitions (main, read-only snapshot)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source_commit }}
          DAY: ${{ inputs.partition_day }}
          BLOB: ${{ inputs.partition_blob }}
        run: |
          if [ -z "$SOURCE" ]; then
            git fetch --depth 1 --filter=blob:none origin main
            exit 0
          fi
          fail() { echo "Blocked: $1"; exit 1; }
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]] || fail "source_commit must be a 40-hex commit id."
          [ -n "$DAY" ] && [ -n "$BLOB" ] || fail "source_commit needs partition_day and partition_blob."
          git fetch --filter=tree:0 --shallow-since="30 days ago" origin main
          git rev-parse --verify "$SOURCE^{commit}" >/dev/null 2>&1 || fail "source_commit is not in the last 30 days of main."
          git merge-base --is-ancestor "$SOURCE" FETCH_HEAD || fail "source_commit is not an ancestor of main."
          git update-ref refs/r2-source "$SOURCE"
          echo "Reading partitions from main commit $SOURCE (ancestor of main)."
      - name: Install R2 client
        run: python -m pip install --disable-pip-version-check boto3
      - name: Run worker
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm_write }}
          ROOT: ${{ inputs.root_prefix }}
          MAXP: ${{ inputs.max_partitions }}
          PROVIDER: ${{ inputs.provider }}
          DAY: ${{ inputs.partition_day }}
          BLOB: ${{ inputs.partition_blob }}
          SOURCE: ${{ inputs.source_commit }}
        run: |
          GITREF=FETCH_HEAD; if [ -n "$SOURCE" ]; then GITREF=refs/r2-source; fi
          args=(--mode "$MODE" --git-ref "$GITREF" --root "$ROOT" --max-partitions "$MAXP" \
                --max-seconds 1200 --report-file r2-partition-worker-report.json)
          if [ -n "$PROVIDER" ]; then args+=(--provider "$PROVIDER"); fi
          if [ -n "$DAY" ]; then args+=(--day "$DAY"); fi
          if [ -n "$BLOB" ]; then args+=(--blob "$BLOB"); fi
          if [ "$MODE" = "sync" ] && [ "$CONFIRM" = "true" ]; then args+=(--confirm-write); fi
          python scripts/r2_partition_worker.py "${args[@]}"
      - name: Git/R2 comparison against latest main (read-only)
        if: inputs.mode == 'sync'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          ROOT: ${{ inputs.root_prefix }}
          PROVIDER: ${{ inputs.provider }}
          DAY: ${{ inputs.partition_day }}
          BLOB: ${{ inputs.partition_blob }}
          SOURCE: ${{ inputs.source_commit }}
        run: |
          if [ -n "$SOURCE" ]; then GITREF=refs/r2-source; else
            git fetch --depth 1 --filter=blob:none origin main; GITREF=FETCH_HEAD; fi
          python scripts/r2_partition_worker.py --mode verify --git-ref "$GITREF" \
            --root "$ROOT" --provider "$PROVIDER" --day "$DAY" --blob "$BLOB" \
            --report-file r2-partition-verify-report.json
      - name: Retain reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-partition-worker-${{ github.run_id }}-${{ github.run_attempt }}
          path: r2-partition-*.json
          if-no-files-found: warn
          retention-days: 30
