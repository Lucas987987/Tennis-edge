name: R2 V6.4 partition worker

run-name: R2 partition worker ${{ inputs.mode }} #${{ github.run_id }}

# Manual only. No schedule and no workflow_run trigger: it can never fire
# alongside, or because of, a collector. Production writes (mode=sync on the
# default root) additionally require the repository variable
# R2_PARTITION_WORKER_ENABLED=true and the explicit confirmation input.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (no R2 writes) | sync (create-only archive) | verify (read-only comparison)"
        type: choice
        options: [dry-run, sync, verify]
        default: dry-run
      confirm_sync:
        description: "Required for mode=sync: confirm create-only writes to R2"
        type: boolean
        default: false
      root_prefix:
        description: "R2 prefix root; parts/v64-archive-test/<name> is a sandbox"
        type: string
        default: parts/v64-archive
      max_partitions:
        description: "Maximum partitions processed in this run"
        type: string
        default: "5"
      provider:
        description: "Optional provider filter: polymarket or kalshi (empty = both)"
        type: string
        default: ""

permissions:
  contents: read

# Own group: never shares a concurrency group with any collector.
concurrency:
  group: r2-partition-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Activation gate
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm_sync }}
          ROOT: ${{ inputs.root_prefix }}
          ENABLED: ${{ vars.R2_PARTITION_WORKER_ENABLED }}
        run: |
          if [ "$MODE" = "sync" ]; then
            case "$ROOT" in
              parts/v64-archive-test/*) ;;
              *)
                if [ "$ENABLED" != "true" ]; then
                  echo "Blocked: R2_PARTITION_WORKER_ENABLED is not 'true' (worker disabled by default)."
                  exit 1
                fi ;;
            esac
            if [ "$CONFIRM" != "true" ]; then
              echo "Blocked: confirm_sync must be true for mode=sync."
              exit 1
            fi
          fi
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/partitioned_store.py
            /scripts/r2_partition_worker.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install R2 client
        if: inputs.mode != 'dry-run' || vars.R2_PARTITION_WORKER_ENABLED == 'true'
        run: python -m pip install --disable-pip-version-check boto3
      - name: Run worker
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          MODE: ${{ inputs.mode }}
          ROOT: ${{ inputs.root_prefix }}
          MAXP: ${{ inputs.max_partitions }}
          PROVIDER: ${{ inputs.provider }}
        run: |
          args=(--mode "$MODE" --git-ref HEAD --root "$ROOT" --max-partitions "$MAXP" \
                --max-seconds 1200 --report-file r2-partition-worker-report.json)
          if [ -n "$PROVIDER" ]; then args+=(--provider "$PROVIDER"); fi
          python scripts/r2_partition_worker.py "${args[@]}"
      - name: Git/R2 comparison against latest main (read-only)
        if: inputs.mode == 'sync'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          ROOT: ${{ inputs.root_prefix }}
          PROVIDER: ${{ inputs.provider }}
        run: |
          git fetch --depth 1 --filter=blob:none origin main
          args=(--mode verify --git-ref FETCH_HEAD --root "$ROOT" \
                --report-file r2-partition-verify-report.json)
          if [ -n "$PROVIDER" ]; then args+=(--provider "$PROVIDER"); fi
          python scripts/r2_partition_worker.py "${args[@]}"
      - name: Retain reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-partition-worker-${{ github.run_id }}-${{ github.run_attempt }}
          path: r2-partition-*.json
          if-no-files-found: warn
          retention-days: 30
