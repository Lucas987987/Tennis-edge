name: R2 V6.4 probe
run-name: R2 final validation #${{ github.run_id }}
on:
  workflow_dispatch:
    inputs:
      confirm_isolated_r2_writes:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: r2-final-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/partitioned_store.py
            /scripts/r2_partition_worker.py
            /scripts/_validate_r2_final.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: git fetch --depth 1 --filter=blob:none origin main
      - run: python -m pip install --disable-pip-version-check boto3
      - name: Validate
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python scripts/_validate_r2_final.py 2>&1 | tee validation.log; exit ${PIPESTATUS[0]}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-final-validation
          path: |
            inventory.json
            validation.log
            rep_*.json
