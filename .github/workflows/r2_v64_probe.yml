name: R2 V6.4 limited connectivity probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-v64-connectivity-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/partitioned_store.py
            /scripts/r2_storage.py
            /scripts/r2_probe.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install R2 client
        run: pip install --quiet boto3
      - name: Write and verify one isolated R2 probe
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python scripts/r2_probe.py
