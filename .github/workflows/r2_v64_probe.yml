name: R2 V6.4 isolated validation

run-name: R2 V6.4 validation #${{ github.run_id }}-${{ github.run_attempt }}

on:
  workflow_dispatch:
    inputs:
      confirm_isolated_r2_writes:
        description: "Confirm synthetic objects will be written to an isolated R2 namespace and retained"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: r2-v64-isolated-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/partitioned_store.py
            /scripts/r2_storage.py
            /scripts/r2_probe.py
            /scripts/r2_partition_worker.py
      - name: Require explicit write confirmation
        if: inputs.confirm_isolated_r2_writes != true
        run: |
          echo "Validation stopped: confirm isolated R2 writes in the workflow input."
          exit 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install R2 client
        run: python -m pip install --disable-pip-version-check boto3
      - name: Worker sandbox sequence (dry-run, sync, resync, verify, restore)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -u
          git fetch --depth 1 --filter=blob:none origin main
          ROOT="parts/v64-archive-test/worker-38436063302-1"
          BLOB=e49ed8b622b03d89ffc8a26914520a7a0849445c
          python scripts/r2_partition_worker.py --mode restore --root $ROOT --provider polymarket --day 2026-10-06 --blob $BLOB --destination /tmp/restore --report-file r2-validation-5-restore.json > /dev/null
          git cat-file blob $BLOB | sha256sum
          sha256sum /tmp/restore/pm_ticks_2026-10-06.jsonl.gz
          cmp <(git cat-file blob $BLOB) /tmp/restore/pm_ticks_2026-10-06.jsonl.gz && echo BYTE_IDENTICAL
          python scripts/r2_partition_worker.py --mode restore --root $ROOT --provider polymarket --day 2026-10-06 --blob $BLOB --destination /tmp/restore > /dev/null 2>&1 || echo OVERWRITE_REFUSED
      - name: Retain validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-v64-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: r2-validation-*.json
          if-no-files-found: warn
          retention-days: 30
