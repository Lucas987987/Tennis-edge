name: R2 V6.4 isolated validation

run-name: R2 V6.4 validation #${{ github.run_id }}-${{ github.run_attempt }}

on:
  workflow_dispatch:
    inputs:
      confirm_isolated_r2_writes:
        description: "Confirm synthetic objects will be written to an isolated R2 namespace and retained"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: r2-v64-isolated-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/partitioned_store.py
            /scripts/r2_storage.py
            /scripts/r2_probe.py
            /scripts/r2_replay_validation.py
            /parts/pm_ticks_2026-10-12.jsonl.gz
      - name: Require explicit write confirmation
        if: inputs.confirm_isolated_r2_writes != true
        run: |
          echo "Validation stopped: confirm isolated R2 writes in the workflow input."
          exit 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install R2 client
        run: python -m pip install --disable-pip-version-check boto3
      - name: Replay frozen Polymarket partition into isolated R2 prefix
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_V64_VALIDATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          python scripts/r2_replay_validation.py
          --source parts/pm_ticks_2026-10-12.jsonl.gz
          --validation-id "$R2_V64_VALIDATION_ID"
          --expected-sha256 7f88a1957ce2a47112ad1d2bad016e1ad469fdb5188f7db5f8c96f463b38d5be
          --git-ref-path HEAD:parts/pm_ticks_2026-10-12.jsonl.gz
          --expected-blob 1f048a9fe646c99b1d93b31030a6b376e40e5670
          --report-file r2-v64-validation-report.json
      - name: Confirm main still holds the same Git blob
        run: |
          git fetch --depth 1 origin main
          test "$(git rev-parse FETCH_HEAD:parts/pm_ticks_2026-10-12.jsonl.gz)" = 1f048a9fe646c99b1d93b31030a6b376e40e5670
      - name: Retain validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-v64-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: r2-v64-validation-report.json
          if-no-files-found: warn
          retention-days: 30
