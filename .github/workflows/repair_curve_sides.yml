name: Repair Curve Sides (one-shot)

# Reparation ponctuelle du bug d'orientation v4 (12/06) : courbes home/away
# inversees dans clv_history.jsonl et book_curves.jsonl pour les matchs de
# l'ere The Odds API. Realigne contre l'history de closing_lines.json.
# A lancer UNE fois. Idempotent (les lignes traitees sont marquees side_check).
#
# ⚠️ book_curves.jsonl (référence dans repair_curve_sides.py) n'existe plus
# depuis la migration en partitions du 14/08/2026 -- si ce script n'a pas
# encore été lancé (réparation "une fois" jamais faite), il faudra d'abord
# l'adapter pour lire via iter_hist_lines('book') (oddspapi_v5.py). Si la
# réparation a déjà eu lieu avant la migration, ce workflow n'a plus lieu
# d'être relancé.

# PYTHONDONTWRITEBYTECODE : aucun .pyc n'est plus genere. Les .pyc
# regeneres a chaque run faisaient echouer le merge puis le push
# (panne du 16/08/2026). Portee workflow = toutes les etapes.
env:
  PYTHONDONTWRITEBYTECODE: '1'

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tennis-results
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reparation orientation des courbes
        run: python scripts/repair_curve_sides.py
      - name: Commit
        run: |
          rm -f clv_history.jsonl.bak book_curves.jsonl.bak
          # PANNE DU 16/08/2026 -- cause exacte, tracee par pipeline_status.
          # Les .pyc sont SUIVIS par git (ajoutes avant le .gitignore, qui ne
          # s'applique plus une fois un fichier suivi). capture_closing tourne
          # toutes les 5-10 min avec "git add -A" et republie donc des .pyc
          # neufs en continu. Quand un autre workflow tourne, il regenere les
          # siens localement -> "git merge" ABANDONNE ("Your local changes to
          # the following files would be overwritten") -> branche en retard ->
          # push rejete en non-fast-forward. Resultat observe : 7 fichiers
          # commites localement (dont 830 lignes de moves_detail_hist), jamais
          # pousses. On efface donc les .pyc du disque avant toute action git.
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name '*.pyc' -delete 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in clv_history.jsonl book_curves.jsonl; do
            [ -f "$f" ] && git add -- "$f"
          done
          git diff --staged --quiet || git commit -m "repair: orientation courbes v4 (swap home/away)"
          git fetch origin main 2>&1 || echo "⚠️ fetch échoué"
          git merge origin/main --no-edit 2>&1 || echo "⚠️ merge en conflit -- le commit local n'est pas perdu"
          # UN PUSH QUI ÉCHOUE DOIT FAIRE ÉCHOUER LE RUN. « git push || echo »
          # rendait le job VERT alors que rien n'était poussé — c'est ainsi que
          # hist_curves_meta.json est resté figé 54 h sans alerte (20/08/2026).
          if git push 2>&1; then
            echo "✅ PUSH OK"
          else
            echo "❌ PUSH ÉCHOUÉ — le commit local sera perdu avec le runner."
            exit 1
          fi
