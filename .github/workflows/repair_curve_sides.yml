name: Repair Curve Sides (one-shot)

# Reparation ponctuelle du bug d'orientation v4 (12/06) : courbes home/away
# inversees dans clv_history.jsonl et book_curves.jsonl pour les matchs de
# l'ere The Odds API. Realigne contre l'history de closing_lines.json.
# A lancer UNE fois. Idempotent (les lignes traitees sont marquees side_check).
#
# ⚠️ book_curves.jsonl (référence dans repair_curve_sides.py) n'existe plus
# depuis la migration en partitions du 14/08/2026 -- si ce script n'a pas
# encore été lancé (réparation "une fois" jamais faite), il faudra d'abord
# l'adapter pour lire via iter_hist_lines('book') (oddspapi_v5.py). Si la
# réparation a déjà eu lieu avant la migration, ce workflow n'a plus lieu
# d'être relancé.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tennis-results
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reparation orientation des courbes
        run: python scripts/repair_curve_sides.py
      - name: Commit
        run: |
          rm -f clv_history.jsonl.bak book_curves.jsonl.bak
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in clv_history.jsonl book_curves.jsonl; do
            [ -f "$f" ] && git add -- "$f"
          done
          git diff --staged --quiet || git commit -m "repair: orientation courbes v4 (swap home/away)"
          git fetch origin main 2>&1 || echo "⚠️ fetch échoué"
          git merge origin/main --no-edit 2>&1 || echo "⚠️ merge en conflit -- le commit local n'est pas perdu"
          git push 2>&1 || echo "❌ PUSH ÉCHOUÉ -- voir message ci-dessus"
