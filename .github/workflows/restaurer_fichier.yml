name: Restaurer un fichier supprime (one-shot)

# CRÉÉ LE 04/09/2026. `scripts/canal_public.py` a disparu du dépôt : le canal
# public ne publie plus depuis le 04/09 10h48, et le track record qui lui est
# aligné (paper_trades_canal.jsonl) est figé d'autant.
#
# Pourquoi un workflow plutôt qu'un copier-coller depuis la vue « Raw » :
# depuis un téléphone, copier plusieurs centaines de lignes de Python est
# faisable mais une troncature silencieuse ne se voit pas. Le runner, lui, a
# l'historique git complet — il retrouve le commit de suppression et remet le
# fichier À L'OCTET PRÈS.
#
# Pas besoin de PAT : la restriction `workflows` de GITHUB_TOKEN ne concerne
# que .github/workflows/. Un fichier sous scripts/ se pousse normalement.
#
# MODE D'EMPLOI
#   1. Lancer avec appliquer=false  -> montre le commit trouvé, la taille, les
#      30 premières lignes, et NE COMMITTE RIEN
#   2. Vérifier que c'est bien le bon fichier
#   3. Relancer avec appliquer=true
#   4. Supprimer ce workflow

on:
  workflow_dispatch:
    inputs:
      chemin:
        description: "Chemin du fichier à restaurer"
        required: true
        default: "scripts/canal_public.py"
      appliquer:
        description: "false = simulation seule ; true = restaure et committe"
        required: true
        default: "false"

permissions:
  contents: write

concurrency:
  group: restaurer-fichier
  cancel-in-progress: false

jobs:
  restaurer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # fetch-depth: 0 OBLIGATOIRE — sans l'historique complet, `git log`
          # ne peut pas remonter au commit de suppression. blob:none garde le
          # coût raisonnable (les blobs sont récupérés à la demande) et le
          # sparse-checkout laisse les 328 Mo de partitions au vestiaire :
          # ce job ne touche qu'un fichier de scripts/.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/parts
          sparse-checkout-cone-mode: false

      - name: Retrouver le fichier dans l'historique
        id: chercher
        run: |
          set -euo pipefail
          F="${{ github.event.inputs.chemin }}"

          if [ -f "$F" ]; then
            echo "✅ $F existe déjà — rien à restaurer."
            echo "trouve=deja_la" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Commit qui a SUPPRIMÉ le fichier (le plus récent si plusieurs
          # cycles suppression/ajout). Son parent est le dernier état où le
          # fichier existait.
          SUPPR=$(git log --diff-filter=D --format=%H -1 -- "$F" || true)
          if [ -z "$SUPPR" ]; then
            echo "❌ Aucun commit de suppression trouvé pour $F."
            echo "   Soit le chemin est mal orthographié, soit ce fichier"
            echo "   n'a jamais été commité (créé localement puis jamais"
            echo "   poussé, ou ignoré par .gitignore)."
            echo "   Fichiers connus de l'historique dans ce dossier :"
            git log --diff-filter=D --name-only --format= -- "$(dirname "$F")" \
              | sort -u | grep . | head -40 || echo "   (aucun)"
            exit 1
          fi

          echo "Commit de suppression : $SUPPR"
          git log -1 --format='  %ad  %s' --date=short "$SUPPR"
          echo "Dernier état connu    : ${SUPPR}^"

          git checkout "${SUPPR}^" -- "$F"
          echo "trouve=oui" >> "$GITHUB_OUTPUT"
          echo "suppr=$SUPPR" >> "$GITHUB_OUTPUT"

          echo
          echo "─── $F restauré : $(wc -c < "$F") octets, $(wc -l < "$F") lignes ───"
          echo
          head -30 "$F"
          echo
          echo "─── (aperçu limité aux 30 premières lignes) ───"

      - name: Contrôle de cohérence
        if: ${{ steps.chercher.outputs.trouve == 'oui' }}
        run: |
          set -euo pipefail
          F="${{ github.event.inputs.chemin }}"
          # Un fichier restauré depuis l'historique doit au minimum compiler.
          # S'il ne compile pas, c'est qu'on a remonté à un état cassé : mieux
          # vaut le savoir AVANT de le committer et de le voir échouer toutes
          # les 5 minutes derrière un `|| true`.
          case "$F" in
            *.py) python3 -m py_compile "$F" && echo "✅ $F compile" ;;
            *)    echo "ℹ️ pas de contrôle de syntaxe pour ce type de fichier" ;;
          esac

      - name: Simulation — rien n'est committé
        if: ${{ steps.chercher.outputs.trouve == 'oui' && github.event.inputs.appliquer != 'true' }}
        run: |
          echo "=== SIMULATION ==="
          git --no-pager diff --staged --stat
          echo
          echo "Relire l'aperçu ci-dessus, puis relancer avec appliquer=true."

      - name: Restaurer
        if: ${{ steps.chercher.outputs.trouve == 'oui' && github.event.inputs.appliquer == 'true' }}
        run: |
          set -euo pipefail
          F="${{ github.event.inputs.chemin }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "$F"
          git diff --staged --quiet && { echo "rien de neuf"; exit 0; }
          git commit -m "Restaure $F depuis ${{ steps.chercher.outputs.suppr }}^"
          for essai in 1 2 3; do
            git fetch origin main || true
            git merge origin/main --no-edit || { git merge --abort 2>/dev/null || true; sleep 8; continue; }
            git push && { echo "✅ $F restauré et poussé."; exit 0; }
            sleep 8
          done
          echo "❌ PUSH ÉCHOUÉ — le commit local reste récupérable au prochain run."
          exit 1
