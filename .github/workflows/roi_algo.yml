name: ROI de l'algo (Telegram privé)

# AJOUTÉ LE 23/10/2026. ROI de l'algorithme aux cotes Pinnacle de clôture, envoyé sur le Telegram PRIVÉ.
# Règles fixées le 23/10/2026 avant tout résultat (simulateur/roi_algo.py) :
#   R1 : 1 unité sur le joueur que l'algo donne gagnant ; R2 : 1 unité si % de l'algo × cote ≥ 1,05.
# Envoyé aussi chaque lundi avec le bilan de la semaine (workflow « Pronostic : test du modèle »).
# Lecture seule : le rapport JSON est recalculé mais n'est pas commité ici, aucune requête d'API.
# La version hebdomadaire est publiée par le workflow « Pronostic - test du modèle ».

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            /simulateur/
            /scripts/closing_store.py
            /Tennis_Edge_Lab/books.py
            /Tennis_Edge_Lab/live/pronostics_resultats.json
            /closing_lines.json
            /closing_lines/
            /feuilles/
            /set_results.json
            /scripts/cotes_privees.py
            /scripts/etat_chaud.py
            /scripts/merge_json_state.py
            /scripts/coffre.py
            /scripts/r2_io.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # 22/11/2026 (paquet 346) — COTES EN PRIVÉ : en mode ETAT_CHAUD=prive, closing_lines, matches_oddspapi,
      # live_odds et les archives de clôtures ne sont plus dans le dépôt public ; rapatriés ici depuis R2 (lecture).
      # Dans les autres modes, rien ne change (seul ce qui manquerait au dépôt est rapatrié).
      - name: Cotes privées — rapatrier (paquet 346)
        env:
          ETAT_CHAUD: ${{ vars.ETAT_CHAUD || 'double' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python3 scripts/cotes_privees.py pull || true

      - name: ROI (Telegram privé)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python simulateur/roi_algo.py . --telegram
