name: Scan de cohérence du dispositif

# Quotidien, à 5h UTC — avant que la journée de captures ne commence.
# Volontairement SÉPARÉ de audit_qa : celui-ci surveille la fraîcheur des
# données, le scan surveille l'intégrité du dispositif de mesure. Deux
# questions différentes, deux rouges différents.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # L'historique n'est pas nécessaire : le scan ne lit que des
          # fichiers du working tree. Pas de fetch-depth: 0 — inutile de
          # rapatrier 3 Go pour vérifier des constantes.
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: pip install --quiet pyyaml

      - name: Scan
        id: scan
        run: python scripts/scan_coherence.py

      # L'empreinte évolue quand une hypothèse est gelée : il faut la
      # republier, sinon le scan suivant la recréerait et perdrait la
      # référence. `if: always()` : on commite même quand le scan a
      # échoué, car l'empreinte peut avoir été enrichie avant l'échec.
      - name: Publier l'empreinte
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coherence_empreinte.json 2>/dev/null || true
          git diff --cached --quiet && { echo "empreinte inchangée"; exit 0; }
          git commit -m "Empreinte de cohérence ($(date -u +%Y-%m-%d))"
          attente=2
          for essai in 1 2 3 4 5 6; do
            git fetch origin main || true
            if ! git merge origin/main --no-edit; then
              if python scripts/merge_json_state.py; then
                git commit --no-edit || true
              else
                git merge --abort 2>/dev/null || true
                [ "$essai" -lt 6 ] && { sleep "$attente"; attente=$((attente*2)); }
                continue
              fi
            fi
            if git push; then echo "✅ PUSH OK (tentative $essai)"; exit 0; fi
            [ "$essai" -lt 6 ] && { sleep "$attente"; attente=$((attente*2)); }
          done
          echo "⚠️ empreinte non publiée — sans gravité, elle sera recommitée demain"
