name: Simulateur - marchés set 1

# 21/10/2026 — le moteur (forme du jour, σ = 0,15) traduit la cote Pinnacle du
# match en probabilité du set 1 ; comparaison avec la cote set 1 de Pinnacle et
# des books mous, 30 min avant le début, sur TOUT l'historique (R2 compris).
# 0 requête d'API. Écrit simulateur/rapport_marches_sets.json.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  R2_HIST_MATERIALIZE: '1'
  R2_PRIMARY: ${{ vars.R2_PRIMARY || 'double' }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

concurrency:
  group: simulateur
  cancel-in-progress: false

jobs:
  marches:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /simulateur/
            /scripts/
            /Tennis_Edge_Lab/books.py
            /set_results.json
            /parts/hist_set1_*
            /parts/hist_book_*
            /parts/ARCHIVE_INDEX.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test set 1 (historique complet)
        run: python simulateur/marches_sets.py .
      - name: Publier le rapport
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- simulateur/rapport_marches_sets.json
          if git diff --cached --quiet; then echo 'Rien de nouveau.'; exit 0; fi
          git commit -m 'Simulateur : test des marchés set 1'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; echo '::error::Conflit avec main'; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 10))
          done
          echo '::error::Push impossible après 5 essais'; exit 1
