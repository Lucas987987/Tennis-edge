name: Soft open detector

# Le SEUL angle qui respire encore : l'ouverture molle (unibet vs bwin dévigé),
# avec ouverture ROBUSTE (anti-artefact de tick). Recalcule tout depuis
# book_curves.jsonl, écrit soft_openings.jsonl, et met le résumé (garde-fou n>=30)
# dans le récap du run. Lancé chaque semaine + à la main.
#
# Pré-requis : scripts/soft_open_detector.py, book_curves.jsonl à la racine.
#
# ⚠️ book_curves.jsonl N'EXISTE PLUS depuis la migration en partitions du
# 14/08/2026 (140,73 Mo -> limite GitHub, remplacé par parts/hist_book_*.jsonl).
# La garde ci-dessous ("if [ ! -f book_curves.jsonl ]") fait donc probablement
# sortir ce job en silence (exit 0) à CHAQUE run depuis -- ce n'est PAS corrigé
# ici : ça nécessite d'adapter scripts/soft_open_detector.py pour lire via
# iter_hist_lines('book') (oddspapi_v5.py) au lieu d'un chemin de fichier fixe.
# Voir avec Claude en fournissant scripts/soft_open_detector.py pour ce correctif.

# PYTHONDONTWRITEBYTECODE : aucun .pyc n'est plus genere. Les .pyc
# regeneres a chaque run faisaient echouer le merge puis le push
# (panne du 16/08/2026). Portee workflow = toutes les etapes.
env:
  PYTHONDONTWRITEBYTECODE: '1'

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"          # tous les lundis 06:00 UTC

permissions:
  contents: write

concurrency:
  group: soft-open
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Détecter les ouvertures molles
        env:
          SOFT_BOOK: unibet
          SHARP_BOOK: bwin
          OPEN_WINDOW_MIN: "90"
          OPEN_MIN_POINTS: "3"
        run: |
          if [ ! -f book_curves.jsonl ] && [ ! -d parts ]; then
            echo "Ni book_curves.jsonl ni parts/ -- rien à analyser."; exit 0
          fi
          python scripts/soft_open_detector.py

      - name: Committer le log des flags
        run: |
          # PANNE DU 16/08/2026 -- cause exacte, tracee par pipeline_status.
          # Les .pyc sont SUIVIS par git (ajoutes avant le .gitignore, qui ne
          # s'applique plus une fois un fichier suivi). capture_closing tourne
          # toutes les 5-10 min avec "git add -A" et republie donc des .pyc
          # neufs en continu. Quand un autre workflow tourne, il regenere les
          # siens localement -> "git merge" ABANDONNE ("Your local changes to
          # the following files would be overwritten") -> branche en retard ->
          # push rejete en non-fast-forward. Resultat observe : 7 fichiers
          # commites localement (dont 830 lignes de moves_detail_hist), jamais
          # pousses. On efface donc les .pyc du disque avant toute action git.
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name '*.pyc' -delete 2>/dev/null || true
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f soft_openings.jsonl ] && git add -- soft_openings.jsonl
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "soft-open: maj flags $(date -u +%Y-%m-%dT%H:%MZ)"
            git fetch origin main 2>&1 || echo "⚠️ fetch échoué"
            git merge origin/main --no-edit 2>&1 || echo "⚠️ merge en conflit -- le commit local n'est pas perdu"
          # UN PUSH QUI ÉCHOUE DOIT FAIRE ÉCHOUER LE RUN. « git push || echo »
          # rendait le job VERT alors que rien n'était poussé — c'est ainsi que
          # hist_curves_meta.json est resté figé 54 h sans alerte (20/08/2026).
          if git push 2>&1; then
            echo "✅ PUSH OK"
          else
            echo "❌ PUSH ÉCHOUÉ — le commit local sera perdu avec le runner."
            exit 1
          fi
          fi
