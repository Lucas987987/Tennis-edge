name: Sonde infos tennis et badminton (lecture seule)

# 26/11/2026 — Quelles infos tennis le fournisseur donne-t-il que nous n'utilisons pas encore ?
# Et le badminton ? AllSportsApi (formule gratuite), 50 requêtes au plus, aucune
# nouvelle tentative, ni cote ni quota TennisApi. Rien n'est écrit dans le dépôt.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Sonde
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python scripts/sonde_infos_tennis.py
