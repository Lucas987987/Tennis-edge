name: Sonde marchés (2 requêtes)

# 21/10/2026 — quels marchés OddsPapi cote-t-il sur un match (total de jeux,
# handicap de jeux, score exact en sets…) ? 2 requêtes au plus, aucune
# nouvelle tentative. Résultat dans le journal du run et sonde_marches.json
# (non commité : à lire dans le journal).
on:
  workflow_dispatch:
    inputs:
      jour:
        description: 'Jour du match (AAAA-MM-JJ), vide = avant-hier'
        default: ''
      book:
        description: 'Book'
        default: 'pinnacle'

permissions:
  contents: read

env:
  R2_PRIMARY: ${{ vars.R2_PRIMARY || 'double' }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  ODDS_RETRIES: '0'

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts
            closing_lines.json
            closing_lines
            simulateur/telegram_envoi.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # 22/11/2026 (paquet 346) — COTES EN PRIVÉ : en mode ETAT_CHAUD=prive, closing_lines, matches_oddspapi,
      # live_odds et les archives de clôtures ne sont plus dans le dépôt public ; rapatriés ici depuis R2 (lecture).
      # Dans les autres modes, rien ne change (seul ce qui manquerait au dépôt est rapatrié).
      - name: Cotes privées — rapatrier (paquet 346)
        env:
          ETAT_CHAUD: ${{ vars.ETAT_CHAUD || 'double' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python3 scripts/cotes_privees.py pull || true

      - name: Deux requêtes au plus
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          JOUR: ${{ github.event.inputs.jour }}
          BOOK: ${{ github.event.inputs.book }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$JOUR" ]; then python scripts/discret.py -- python scripts/sonde_marches.py "$JOUR" "$BOOK"; else python scripts/discret.py -- python scripts/sonde_marches.py; fi
          # 393 : le fichier n'est plus recopié dans le journal (public) ; il part au coffre privé
          python3 - <<'PY' || true
          import os, sys
          sys.path.insert(0, 'scripts')
          import r2_io
          c = r2_io.client(quiet=True)
          if c and os.path.exists('sonde_marches.json'):
              c.put('prive/site/Tennis_Edge_Lab/journaux/sonde_marches.json', open('sonde_marches.json', 'rb').read())
              print('sonde_marches.json : au coffre privé (/lab/journaux/sonde_marches.json)')
          PY
