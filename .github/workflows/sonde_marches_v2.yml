name: Sonde des marchés v2 (bookmakers, TennisApi)

# AJOUTÉ LE 29/10/2026 — LECTURE SEULE, à lancer à la main. Quels marchés tennis sont cotés, et par quels
# bookmakers (OddsPapi), et ce que propose le fournisseur de TennisApi. ≈ 3 requêtes OddsPapi + ≈ 6 TennisApi.
# Rien n'est collecté ni commité : le rapport est un artefact du run, et le résumé est dans le journal.
# Les cotes ne servent qu'à comparer nos lignes ; elles n'entrent jamais dans l'algo.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/oddspapi_v5.py
            /scripts/feuilles_match.py
            /scripts/sonde_marches_v2.py
            scripts/discret.py
            scripts/r2_io.py
            simulateur/telegram_envoi.py
            scripts/vers_coffre.py

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Sonde
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ODDS_RETRIES: '0'
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/discret.py -- python scripts/sonde_marches_v2.py

      # 393 : au coffre privé (un artefact de dépôt public est public)
      - name: Garder la sonde (coffre privé)
        if: always()
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python scripts/vers_coffre.py --nom sonde_marches_v2 sonde_marches_v2.json || true
