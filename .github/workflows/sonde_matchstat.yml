name: Sonde Matchstat (historique, 12 requêtes)

# 22/11/2026 (paquet 331) — l'historique de Matchstat peut-il remplacer l'archive Sackmann (licence non
# commerciale) avant une offre payante ? Statistiques de match d'un Challenger, d'un match ATP et d'un match WTA
# passés, comparées à Sackmann ; point par point ; nombre de requêtes pour tout récupérer 2018–2025 face au
# quota de la formule. 12 requêtes par défaut, arrêt si le quota restant passe sous 30, la clé n'est jamais
# affichée. Résultat dans le journal du run et l'artefact sonde_matchstat (rien n'est commité).
on:
  workflow_dispatch:
    inputs:
      budget:
        description: 'Requêtes au plus (12 conseillé, 40 maximum)'
        default: '12'
      chemins:
        description: 'Facultatif : chemins exacts de la documentation à essayer (point par point…), 3 max, séparés par des virgules ; {tour} {tid} {p1} {p2} {mid} sont remplacés'
        default: ''

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/sonde_stats.py
            scripts/sonde_matchstat.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Archive Sackmann 2018–2025 (pour comparer et compter)
        continue-on-error: true
        run: |
          set -euo pipefail
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/Aneeshers/tennis-sackmann-archive.git /tmp/sackmann
          cd /tmp/sackmann
          git sparse-checkout set --no-cone 'atp_matches_20*.csv' 'atp_matches_qual_chall_20*.csv' 'wta_matches_20*.csv' 'wta_matches_qual_itf_20*.csv'
      - name: Sonde (budget limité)
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          BUDGET: ${{ github.event.inputs.budget }}
          CHEMINS: ${{ github.event.inputs.chemins }}
        run: python scripts/sonde_matchstat.py --budget "${BUDGET:-12}" --sackmann /tmp/sackmann --chemins "$CHEMINS"
      - name: Rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonde_matchstat
          path: sonde_matchstat.json
          if-no-files-found: warn
          retention-days: 14
