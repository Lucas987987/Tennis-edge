name: Sonde — outsiders peu documentés (TennisApi)

# 23/11/2026 — paquet 397. À lancer à la main, quand le quota TennisApi du jour est frais (le matin) : pour chaque
# outsider « peu documenté » des matchs jugés depuis le 21/10, TennisApi connaît-il des matchs récents que notre
# classement n'a pas ? + liste des identités à vérifier (même nom, prénom proche). Règle fixée avant : voir l'en-tête de
# scripts/sonde_outsiders_inconnus.py. ≈ 2 à 4 requêtes par joueur ; arrêt si le quota restant passe sous la réserve (3 500 par défaut).
on:
  workflow_dispatch:
    inputs:
      budget:
        description: 'Requêtes au plus (défaut 500)'
        default: '500'
      reserve:
        description: 'Arrêt si le quota restant passe sous (défaut 3 500 : la collecte du jour garde 1 500 à 3 000)'
        default: '3500'

permissions:
  contents: write

concurrency:
  group: sonde-outsiders
  cancel-in-progress: false

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /simulateur/
            /scripts/feuilles_match.py
            /scripts/sonde_peu_documentes.py
            /scripts/sonde_outsiders_inconnus.py
            /feuilles/
            /Tennis_Edge_Lab/live/pronostics_resultats.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Sonde
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          FEUILLES_RESERVE: ${{ github.event.inputs.reserve || '3500' }}
          BUDGET: ${{ github.event.inputs.budget || '500' }}
        run: python scripts/sonde_outsiders_inconnus.py . "$BUDGET"
      - name: Publier le rapport
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- simulateur/sonde_outsiders_inconnus.json
          if git diff --cached --quiet; then echo 'Rien de nouveau.'; exit 0; fi
          git commit -q -m 'Sonde : outsiders peu documentés'
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main || { git rebase --abort || true; echo '::error::Conflit avec main'; exit 1; }
            if git push -q origin HEAD:main; then echo 'Poussé.'; exit 0; fi
            sleep $((i * 10))
          done
          echo '::error::Push impossible après 5 essais'; exit 1
