name: Sonde — joueurs Challenger peu documentés (TennisApi)

# AJOUTÉ LE 28/10/2026. À lancer UNE fois à la main (Actions → « Sonde — joueurs Challenger peu documentés » → Run).
# Avant toute collecte historique : pour les joueurs Challenger pronostiqués qui ont moins de 1 500 balles de
# service effectives, TennisApi a-t-il des feuilles de match que nous n'avons pas (surtout leurs matchs ITF) ?
# ≈ 600 requêtes sur ~15 000 par jour ; arrêt si le quota restant passe sous 6 000 (la collecte du jour garde le sien).
# Règle de décision fixée AVANT la sonde : voir scripts/sonde_peu_documentes.py. Sortie publique (aucune cote) :
# simulateur/sonde_peu_documentes.json ; résumé dans le journal du run.

on:
  workflow_dispatch:
    inputs:
      budget:
        description: 'Requêtes au plus (défaut 800)'
        default: '800'

permissions:
  contents: write

concurrency:
  group: sonde-peu-documentes
  cancel-in-progress: false

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /simulateur/
            /scripts/feuilles_match.py
            /scripts/sonde_peu_documentes.py
            /feuilles/
            /Tennis_Edge_Lab/live/pronostics_resultats.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Archive Sackmann (fichiers de matchs seulement)
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Aneeshers/tennis-sackmann-archive.git /tmp/sackmann
          cd /tmp/sackmann
          git sparse-checkout set --no-cone 'atp_matches_20*.csv' 'atp_matches_qual_chall_20*.csv' 'wta_matches_20*.csv' 'wta_matches_qual_itf_20*.csv'

      - name: Sonde
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          FEUILLES_RESERVE: '6000'
          BUDGET: ${{ github.event.inputs.budget || '800' }}
        run: python scripts/sonde_peu_documentes.py /tmp/sackmann . "$BUDGET"

      - name: Publier le rapport
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- simulateur/sonde_peu_documentes.json
          if git diff --cached --quiet; then echo 'Rien de nouveau.'; exit 0; fi
          git commit -q -m 'Sonde : joueurs Challenger peu documentés'
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main || { git rebase --abort || true; echo '::error::Conflit avec main'; exit 1; }
            if git push -q origin HEAD:main; then echo 'Poussé.'; exit 0; fi
            sleep $((i * 10))
          done
          echo '::error::Push impossible après 5 essais'; exit 1
