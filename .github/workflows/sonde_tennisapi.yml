# 06/11/2026 — Sonde TennisApi (lieu exact des matchs, tableau du tournoi) : à lancer à la main, une fois.
# ~12 à 20 requêtes. Écrit sondes/tennisapi_AAAA-MM-JJ.json (réponses raccourcies, jamais la clé) sur main.
name: Sonde TennisApi
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'lieu (1re sonde) ou tableau (2e sonde, paquet 208)'
        default: 'tableau'
permissions:
  contents: write
concurrency:
  group: sonde-tennisapi
  cancel-in-progress: false
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /scripts/feuilles_match.py
            /scripts/sonde_tennisapi.py
            /simulateur/elo.py
            /feuilles/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Sonde
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$MODE" = "lieu" ]; then python scripts/sonde_tennisapi.py; else python scripts/sonde_tennisapi.py --tableau; fi
      - name: Publier
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git sparse-checkout add /sondes/ || true
          git add -- sondes
          if git diff --cached --quiet; then echo 'Rien de nouveau.'; exit 0; fi
          git commit -q -m "Sonde TennisApi $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; echo '::error::Conflit avec main'; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 10))
          done
          echo '::error::Push impossible après 5 essais'; exit 1
