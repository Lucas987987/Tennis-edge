name: Steam Pipeline (résultats set + journal CLV/ROI)

# ──────────────────────────────────────────────────────────────────────────
# Les ALERTES forward (match/set1/set2) sont gérées à chaque cycle par
# capture_closing.yml (sur les courbes live). Ce workflow quotidien :
#   1. fetch_set_results.py -> set_results.json (vainqueurs match + set 1/2, via API)
#   2. paper_journal.py x3  -> journaux forward CLV+ROI (ouvre les signaux à venir,
#      dénoue ceux finis) sur les courbes live
#   3. validation_report.py -> verdict CLV/ROI avec intervalles de confiance
# Puis commit des résultats + journaux.
# Lancement manuel BACKFILL=1 = estimation historique (sur book_curves.jsonl etc.).
#
# NB : source de résultats = API oddspapi (settlement_result donne match + set1 + set2).
# Sackmann a été retiré : injoignable sur ce runner (egress) et redondant ici.
# fetch_results_sackmann.py reste dans le repo si un jour tu ajoutes un PAT.
# ──────────────────────────────────────────────────────────────────────────

# PYTHONDONTWRITEBYTECODE : aucun .pyc n'est plus genere. Les .pyc
# regeneres a chaque run faisaient echouer le merge puis le push
# (panne du 16/08/2026). Portee workflow = toutes les etapes.
env:
  PYTHONDONTWRITEBYTECODE: '1'

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: "1 = rejouer l'historique (estimation, ne persiste pas)"
        default: "0"
  schedule:
    - cron: '15 0 * * *'

permissions:
  contents: write

concurrency:
  group: steam-pipeline
  cancel-in-progress: false

jobs:
  journal:
    runs-on: ubuntu-latest
    # AJOUTÉ LE 29/08/2026 (optimisation des requêtes, §7) : seul workflow
    # lourd du dépôt sans timeout-minutes -- défaut GitHub Actions 6h. Le
    # run tourne 12-13 min ; 45 laisse toute la marge nécessaire et évite
    # qu'un blocage réseau consomme des heures de runner sans que personne
    # ne le remarque (l'observateur externe ne le verrait qu'après 30h).
    timeout-minutes: 45
    env:
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
      BACKFILL: ${{ github.event.inputs.backfill || '0' }}
      # Sert à pipeline_status.py pour distinguer un livrable PRODUIT ce run
      # d'un livrable simplement PRÉSENT depuis un run précédent.
      RUN_STARTED: ${{ github.event.repository.updated_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          # AJOUTÉ LE 29/08/2026 (§7) : seul workflow lourd sans ce filtre
          # (10 autres l'ont déjà) -- ce job lit trop de fichiers dispersés
          # à la racine pour restreindre le sparse-checkout sans risque
          # sous pression ce soir, mais blob:none reste sûr seul : les
          # objets sont récupérés à la demande plutôt que tous d'un coup.
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Les fichiers plats *_curves_live.jsonl sont dans .gitignore : ils ne
      # sont PAS dans le checkout, ils sont reconstruits depuis parts/live_*.jsonl.
      # Sans cette étape, TOUS les scripts ci-dessous lisaient un fichier absent
      # et produisaient des sorties vides EN SILENCE (constaté : moves_detail.csv
      # et moves_detail_hist.csv réduits à leur ligne d'en-tête).
      - name: Reconstruire les courbes live depuis les partitions
        run: |
          python scripts/curves_parts.py rebuild || echo "❌ REBUILD ÉCHOUÉ"
          for f in book_curves_live.jsonl set1_curves_live.jsonl set2_curves_live.jsonl; do
            if [ -s "$f" ]; then echo "  ✅ $f : $(wc -l < $f) courbes"
            else echo "  ❌ $f ABSENT OU VIDE -- tout ce qui suit produira du vide"; fi
          done

      - name: Résultats match + set (API oddspapi)
        run: python scripts/fetch_set_results.py || true

      # En forward (BACKFILL=0) : journaux sur les COURBES LIVE.
      # En BACKFILL=1 : retirer les CURVES=*_live ci-dessous pour rejouer l'historique
      #   (valeurs par défaut book_curves.jsonl / set*_curves.jsonl).
      - name: Journal — match
        run: CURVES=book_curves_live.jsonl TRACK_CURVES=book_curves.jsonl MARKET=match python scripts/paper_journal.py || true
      - name: Journal — set 1
        run: CURVES=set1_curves_live.jsonl TRACK_CURVES=set1_curves.jsonl MARKET=set1 python scripts/paper_journal.py || true
      - name: Journal — set 2
        run: CURVES=set2_curves_live.jsonl TRACK_CURVES=set2_curves.jsonl MARKET=set2 python scripts/paper_journal.py || true

      - name: Tableau de validation forward (CLV/ROI + IC95)
        run: python scripts/validation_report.py || true

      - name: Pont CLV -> P&L (le postulat central, mesuré en continu)
        # AJOUTÉ LE 27/08/2026 (audit v2 §I) : pnl_vs_clv_study.py teste la
        # prémisse qui justifie le CLV comme juge de tout ce dispositif --
        # jusqu'ici jamais exécuté qu'à la main.
        run: python scripts/pnl_vs_clv_study.py || true

      - name: CLV vs book médian, hors ligne sur l'historique (répond au §E)
        # AJOUTÉ LE 28/08/2026 (audit v5 §AC), APRÈS les correctifs §AB
        # (côté par les noms, troncature pré-match sur toutes les courbes)
        # -- "un script qui publie une conclusion non soutenue à chaque run
        # est pire qu'un script qui ne tourne pas" (l'audit lui-même).
        # CORRIGÉ LE 28/08/2026 (audit v6 §AE) : le garde-fou "if date -u
        # +%H = 05" ne pouvait JAMAIS se déclencher -- steam_pipeline.yml
        # n'a qu'UN SEUL cron, à 00h15 UTC (ligne 31), jamais 05h. Le
        # commentaire d'hier ("QUOTIDIEN, pas à chaque cycle") était déjà
        # satisfait par le cron lui-même -- le garde-fou était à la fois
        # inutile (le fichier tourne déjà une fois par jour) et faux
        # (l'heure ne correspondait à rien). 5e occurrence du même motif
        # aujourd'hui : un correctif écrit, commenté, jamais exécuté --
        # voir §AE de l'audit pour la liste complète et pipeline_status.py
        # plus bas, qui ferme maintenant ce trou pour de bon.
        run: python scripts/clv_vs_median_offline.py || true

      - name: Qualité de la mesure de clôture (Q3 triangulation)
        # AJOUTÉ LE 27/08/2026 (audit v2 §L) : capture_quality.py contient
        # ce diagnostic depuis le 14 juin, tournait seulement en
        # workflow_dispatch manuel -- le rapport committé annonçait encore
        # "75 écarts > 3%" deux mois et demi après que le vrai chiffre ait
        # doublé. Seuil d'alerte : le compte d'écarts, pas juste la médiane
        # (une médiane à 0% ne dit rien de la queue, qui porte le signal).
        # CORRIGÉ LE 27/08/2026 (audit v3 §S) : un echo dans un log de run
        # n'alerte personne -- c'est le même mode de panne qui a laissé le
        # rapport de juin non lu deux mois et demi. Écrit maintenant dans
        # q3_status.json (committé, lu par pipeline_status.py juste après,
        # visible dans pipeline_status.md sur GitHub).
        run: |
          # AJOUTÉ LE 29/08/2026 (audit v10 §AV) : plusieurs affectations
          # plus bas (pct_ecarts, alerte, le json.dump) n'avaient pas de
          # `|| true` -- sous bash -e (le défaut GitHub Actions), n'importe
          # laquelle qui échoue tue CETTE ÉTAPE, ce qui arrête tout le job
          # avant le commit plus bas. `set +e` protège tout le bloc d'un
          # coup, plus sûr qu'un `|| true` oublié sur une ligne future.
          set +e
          python scripts/capture_quality.py | tee /tmp/capture_quality.txt || true
          n_ecarts=$(grep -oP '\d+(?= ecarts > 3%)' /tmp/capture_quality.txt | head -1)
          n_ecarts=${n_ecarts:-0}
          # CORRIGÉ LE 28/08/2026 (audit v6 §AI) : seuil ABSOLU (200) choisi
          # quand le compte était à 150 -- à +5/jour, franchi dans quelques
          # semaines par simple croissance de la population comparée, sans
          # que la qualité se dégrade. Seuil RELATIF : proportion des
          # comparaisons qui divergent, stable même si le dépôt grossit.
          n_total=$(grep -oP 'clv vs snapshot\s+n=\K\d+' /tmp/capture_quality.txt | head -1)
          n_total=${n_total:-1}
          # CORRIGÉ LE 29/08/2026 (audit v10 §AV) : ${n_total:-1} protège
          # contre une chaîne VIDE, pas contre le littéral "0" -- or
          # capture_quality.py imprime "n=0 (pas de recouvrement)" quand
          # une comparaison n'a aucun chevauchement, ce que grep capture
          # tel quel. Reproduit : n_ecarts=0 n_total=0 -> ZeroDivisionError
          # -> bash -e (le défaut GitHub Actions) tue l'étape -> tout le
          # travail des étapes précédentes (résultats, journaux,
          # moves_detail_hist.csv) est perdu, jamais committé.
          [ "$n_total" -gt 0 ] 2>/dev/null || n_total=1
          pct_ecarts=$(python3 -c "print(round(100*$n_ecarts/$n_total, 1))")
          seuil_pct=30.0
          alerte=$(python3 -c "print($pct_ecarts >= $seuil_pct)")
          python3 -c "import json; json.dump({'ecarts_gt_3pct': $n_ecarts, 'n_total': $n_total, 'pct_ecarts': $pct_ecarts, 'seuil_pct': $seuil_pct, 'alerte': $alerte}, open('q3_status.json', 'w'), ensure_ascii=False, indent=1)"
          # CORRIGÉ LE 28/08/2026 (audit v4 §V) : "True" (littéral Python,
          # nécessaire pour que l'injection dans python3 -c produise du JSON
          # valide) comparé à "true" (minuscule) -- ne matchait JAMAIS. Le
          # bloc écrit ce matin même pour corriger "un echo dans un log
          # n'alerte personne" produisait un echo qui ne s'affichait jamais.
          # q3_status.json restait correct (c'est lui qui compte), seul le
          # log du run était mort.
          if [ "$alerte" = "True" ]; then
            # CORRIGÉ LE 29/08/2026 (audit v10, remarqué en repassant sur ce
            # bloc) : $n et $seuil n'existent dans aucune portée ici --
            # variables non définies, le message sortait vide/tronqué. Les
            # bons noms sont $n_ecarts, $pct_ecarts, $seuil_pct.
            echo "⚠️⚠️ $n_ecarts écarts > 3% (${pct_ecarts}%, seuil ${seuil_pct}%) entre les sources de clôture -- la précision de mesure du CLV s'est dégradée, à inspecter."
          fi

      - name: Baromètre des opérateurs (hebdo dimanche · mensuel le 1er)
        env:
          FOCUS: "winamax.fr,zebet.fr,unibet.fr,netbet.fr,bet365.fr,bwin.fr,genybet.fr,pmu,vbet.fr"
        run: |
          if [ "$(date -u +%u)" = "7" ]; then PERIOD=week python scripts/barometre.py || true; fi
          if [ "$(date -u +%d)" = "01" ]; then PERIOD=month python scripts/barometre.py || true; fi

      - name: Récap hebdo canal public (dimanche)
        run: |
          if [ "$(date -u +%u)" = "7" ]; then python scripts/canal_recap.py || true; fi
          # CLV réalisé des écarts publiés = le track record du canal
          python scripts/canal_clv.py || true

      # REPO_URL retirée (16/08/2026) : elle ajoutait un lien GitHub en clair
      # dans les messages publics du canal. canal_suivi.py et
      # canal_clv_recap.py n'ajoutent la ligne QUE si REPO_URL est
      # renseignée -- la retirer suffit, aucun script à modifier.
      # Pour la réactiver un jour : remettre le bloc env ci-dessous.
      - name: Suivi quotidien des écarts publiés (canal public)
        run: python scripts/canal_suivi.py || true

      - name: Bilan hebdo du CLV réalisé (dimanche)
        run: |
          if [ "$(date -u +%u)" = "7" ]; then python scripts/canal_clv_recap.py || true; fi

      - name: Audit des moves (détail par move + agrégats par ampleur)
        run: |
          python scripts/move_audit.py || true
          CURVES=book_curves.jsonl OUT=moves_detail_hist.csv python scripts/move_audit.py || true

      # Écrit l'état de CHAQUE livrable dans un fichier commité : l'état du
      # pipeline devient lisible depuis GitHub, sans ouvrir un seul log.
      - name: État du run (rendu visible depuis le repo)
        if: always()
        run: python scripts/pipeline_status.py || true

      - name: Commit résultats + journaux
        if: always()
        run: |
          # PANNE DU 16/08/2026 -- cause exacte, tracee par pipeline_status.
          # Les .pyc sont SUIVIS par git (ajoutes avant le .gitignore, qui ne
          # s'applique plus une fois un fichier suivi). capture_closing tourne
          # toutes les 5-10 min avec "git add -A" et republie donc des .pyc
          # neufs en continu. Quand un autre workflow tourne, il regenere les
          # siens localement -> "git merge" ABANDONNE ("Your local changes to
          # the following files would be overwritten") -> branche en retard ->
          # push rejete en non-fast-forward. Resultat observe : 7 fichiers
          # commites localement (dont 830 lignes de moves_detail_hist), jamais
          # pousses. On efface donc les .pyc du disque avant toute action git.
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name '*.pyc' -delete 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          echo "── DIAGNOSTIC avant commit ──────────────────────────────"
          echo "set_results.json : $(wc -l < set_results.json 2>/dev/null || echo absent) lignes, $(python3 -c "import json; print(len(json.load(open('set_results.json'))))" 2>/dev/null || echo '?') entrées, $(stat -c%s set_results.json 2>/dev/null || echo '?') octets"
          for f in set_results.json paper_trades_match.jsonl paper_trades_set1.jsonl paper_trades_set2.jsonl moves_detail.csv moves_detail_hist.csv barometre_hebdo.md barometre_mensuel.md canal_clv_detail.csv canal_clv_exclus.csv verdicts_geles.json q3_status.json clv_vs_median_report.json; do
            [ -f "$f" ] || echo "  ⚠️ absent ce run : $f"
          done
          echo "───────────────────────────────────────────────────────"
          # --ignore-errors ne couvre PAS "pathspec did not match any files"
          # (erreur de RÉSOLUTION du pathspec) -- seulement les erreurs
          # D'INDEXATION sur des fichiers qui existent déjà (permissions,
          # liens cassés). Un fichier absent (ex. barometre_hebdo.md, créé
          # seulement le dimanche) fait donc toujours échouer TOUT le
          # "git add" en un seul appel, MÊME avec --ignore-errors -- constaté
          # concrètement : set_results.json avait 1622 entrées prêtes, mais
          # rien n'a été stagé car barometre_hebdo.md n'existait pas ce jour.
          # Seule solution robuste : ajouter chaque fichier INDIVIDUELLEMENT,
          # seulement s'il existe.
          for f in set_results.json paper_trades_match.jsonl paper_trades_set1.jsonl paper_trades_set2.jsonl \
                   moves_detail.csv moves_detail_hist.csv \
                   barometre_hebdo.md barometre_mensuel.md canal_clv_detail.csv \
                   canal_clv_exclus.csv \
                   pipeline_status.json pipeline_status.md \
                   verdicts_geles.json q3_status.json clv_vs_median_report.json; do
            # CORRIGÉ LE 27/08/2026 (audit v2 §B) : verdicts_geles.json
            # n'était committé par AUCUN workflow -- le mécanisme de lecture
            # unique par hypothèse (audit 1, §3.3) ne servait donc à rien :
            # le fichier ne survivait jamais à la fin du runner.
            [ -f "$f" ] && git add -- "$f"
          done
          echo "état git APRÈS add (diff --cached) :"
          git diff --cached --stat || true
          # COMMIT D'ABORD, toujours : ça met les changements locaux en lieu
          # sûr dans l'historique git AVANT toute tentative de synchro -- s'ils
          # ne sont jamais committés, aucune stratégie de sync ne peut les
          # perdre plus facilement que ça.
          git diff --cached --quiet || git commit -m "steam journal $(date -u +%FT%TZ)"
          # "merge" et non "rebase" : un rebase qui rencontre un conflit peut,
          # selon la résolution, écarter silencieusement le commit qu'on vient
          # de créer -- exactement le symptôme constaté (set_results.json figé
          # depuis 1 semaine malgré des écritures locales réussies chaque
          # jour : "Already up to date"/"Everything up-to-date" au commit
          # alors que fetch_set_results.py venait d'ajouter 62 lignes). Un
          # "merge" en conflit ÉCHOUE BRUYAMMENT au lieu de perdre le commit
          # local en silence -- le commit reste dans l'historique local même
          # si le push suivant échoue, récupérable au prochain run.
          git fetch origin main 2>&1 || echo "⚠️ fetch échoué"
          git merge origin/main --no-edit 2>&1 || echo "⚠️ merge en conflit -- le commit local N'EST PAS perdu, voir prochain run"
          if git push 2>&1; then
            echo "✅ PUSH OK"
          else
            echo "❌ PUSH ÉCHOUÉ -- le commit local reste dans l'historique, récupérable au prochain run."
            echo "   Si pipeline_status.md n'apparaît pas sur GitHub alors que ce run s'est"
            echo "   terminé, c'est ICI que ça bloque (et nulle part ailleurs)."
            exit 1
          fi

      # VERROU QUALITÉ (25/08/2026) — le contrepoids aux 17 « || true » de ce
      # job. Chaque étape reste tolérante (une étude qui rate ne doit pas
      # empêcher les suivantes ni le commit), mais le RUN, lui, n'a plus le
      # droit d'être vert si un livrable critique est ABSENT ou VIDE.
      # Placé APRÈS le commit/push : les données sont déjà persistées quand le
      # job rougit. paper_trades_set2 (souvent vide, peu d'alertes set 2) est
      # marqué « optionnel » dans pipeline_status.py et ne déclenche pas.
      - name: Verrou qualité (échec si livrable critique manquant)
        if: always()
        env:
          # Le verrou tourne APRÈS le commit : il écrit son état dans /tmp
          # pour ne pas réécrire pipeline_status.json/.md post-commit (la
          # version réécrite ne serait jamais poussée — divergence garantie
          # le jour où un champ dépend de l'heure). Le fichier COMMITÉ reste
          # celui de l'étape « État du run ».
          OUT_JSON: /tmp/pipeline_status.json
          OUT_MD: /tmp/pipeline_status.md
        run: python scripts/pipeline_status.py --strict
