name: Suivi collecteurs (lecture seule)

run-name: Suivi collecteurs ${{ github.run_id }}

# Rapport de suivi Kalshi/Polymarket publié comme artifact (90 jours) : il
# survit à l'arrêt du Codespace. Lecture seule : aucune écriture Git/R2, aucun
# dispatch. Se déclenche à la main ou toutes les 4 h ; sans effet sur les
# collecteurs (groupe de concurrence distinct, cadences inchangées).
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Horodatage UTC du déploiement du watchdog (référence)
        default: '2026-10-14T09:14:44Z'
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: suivi-collecteurs
  cancel-in-progress: false

env:
  # R2 (15/10/2026) — voir README_MIGRATION_R2.md. off | double | on ;
  # sans variable de dépôt : double (git fait foi, R2 reçoit une copie).
  R2_PRIMARY: ${{ vars.R2_PRIMARY || 'double' }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

jobs:
  rapport:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/suivi_collecteurs.py
            /scripts/r2_io.py
            /scripts/r2_parts.py
            /parts/
            /monitoring/
      - name: Historique main (pour la dernière publication)
        run: git fetch -q --depth=400 --filter=blob:none origin main
      # R2 (15/10/2026) : en mode R2_PRIMARY=on, rapatrie dans parts/ les
      # partitions (ticks) que git ne contient plus. No-op en double/off.
      - name: R2 — rapatrier les partitions (ticks)
        run: |
          python scripts/r2_parts.py pull --kinds ticks || true

      - name: Rapport
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY: ${{ inputs.deploy || '2026-10-14T09:14:44Z' }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%dT%H%MZ)
          python scripts/suivi_collecteurs.py . --deploy "$DEPLOY" --json "suivi-$stamp.json"
      - uses: actions/upload-artifact@v4
        with:
          name: suivi-collecteurs-${{ github.run_id }}
          path: suivi-*.json
          retention-days: 90
          if-no-files-found: error
