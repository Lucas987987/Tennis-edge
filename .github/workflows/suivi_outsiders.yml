name: Suivi outsiders (pré-enregistré)

# CRÉÉ LE 09/10/2026. Lance chaque lundi scripts/etude_outsiders_alertes.py —
# les règles gelées le 09/10 : R1 et R2 (alertes sur les outsiders cotés
# 2,40–4,00), R3 (cote 1,60–2,00 qui baisse de 3 à 6 % -> jouer l'autre) —
# et R4 (gelée le 10/10 : outsider du 75-90e centile de % de victoires
# sur 365 jours, favori coté 1,60–2,00), et envoie le résultat sur Telegram.
#
# LECTURE SEULE : ne commite rien, n'ajoute pas un octet au dépôt. La sortie
# complète reste 30 jours dans les « artifacts » du run.

on:
  workflow_dispatch:
  schedule:
    # Lundi 07:12 UTC : après les fiches (06:20) et les pistes du dimanche,
    # loin du :00 où tout se bouscule.
    - cron: '12 7 * * 1'

permissions:
  contents: read

concurrency:
  group: suivi-outsiders
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  suivi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # numpy : les scripts d'étude dont dépend le suivi l'importent
      # (ajouté le 09/10 après le premier run : ModuleNotFoundError).
      - name: Installer numpy
        run: pip install --quiet numpy

      # Les courbes plates ne sont plus commitées : on les reconstruit depuis
      # parts/, exactement comme le workflow « Fiches joueurs ».
      - name: Reconstruire les courbes
        run: python scripts/curves_parts.py rebuild || true

      - name: Lancer le suivi
        run: |
          set -o pipefail
          PYTHONPATH=scripts python scripts/etude_outsiders_alertes.py | tee suivi_outsiders.txt

      - name: Envoyer sur Telegram
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import html, json, os, urllib.request
          tok, chat = os.environ.get('TELEGRAM_TOKEN'), os.environ.get('TELEGRAM_CHAT_ID')
          if not tok or not chat:
              raise SystemExit('secrets Telegram absents')
          try:
              t = open('suivi_outsiders.txt', encoding='utf-8').read()
          except OSError:
              t = ''
          if 'LE VERDICT' in t:
              # Seulement le verdict et le rappel : pas l'en-tête.
              corps = t[t.index('LE VERDICT'):].replace('-' * 78 + '\n', '')
              texte = ('📊 <b>Suivi des règles gelées (R1, R2, R3 le 09/10 · R4 le 10/10)</b>\n'
                       f'<pre>{html.escape(corps.strip())[:3500]}</pre>')
          else:
              texte = ('❌ <b>Suivi outsiders : le script a échoué</b>\n'
                       f'<pre>{html.escape(t[-1500:])}</pre>\n'
                       f'{os.environ["RUN_URL"]}')
          req = urllib.request.Request(
              f'https://api.telegram.org/bot{tok}/sendMessage',
              data=json.dumps({'chat_id': chat, 'text': texte,
                               'parse_mode': 'HTML',
                               'disable_web_page_preview': True}).encode(),
              headers={'Content-Type': 'application/json'})
          print(urllib.request.urlopen(req, timeout=30).read()[:200])
          PY

      - name: Garder la sortie complète
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suivi-outsiders
          path: suivi_outsiders.txt
          retention-days: 30
          if-no-files-found: ignore
