name: Suivi — une position par match (gelé le 20/11/2026)

# Paquet 307 (20/11/2026, décision de Lucas). Lecture « une position par match » des journaux de suivi match et set 1,
# gelée le 20/11/2026 à 15 h 30 UTC : seuls les matchs postérieurs jugent. Règle dans l'en-tête de
# scripts/suivi_une_par_match.py (CLV seule validation, rien avant 30 matchs, ROI descriptif). Bilan chaque lundi sur le
# Telegram PRIVÉ ; rien n'est écrit dans le dépôt. 0 requête d'API.
on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suivi:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /paper_trades_match.jsonl
            /paper_trades_set1.jsonl
            /scripts/suivi_une_par_match.py
            /scripts/coffre.py
            /scripts/r2_io.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # 22/11/2026 (paquet 334) : les journaux de suivi sont au coffre privé (R2), plus dans le dépôt public
      - name: Coffre privé — rapatrier (journaux de suivi, lecture seule)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python scripts/coffre.py pull --groupe suivi || true
      - name: Bilan (Telegram privé)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/suivi_une_par_match.py . --telegram
