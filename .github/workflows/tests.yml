name: Tests unitaires

# CRÉÉ LE 25/08/2026 — la protection contre les régressions silencieuses des
# fonctions pures (wilson, dévig Shin, trim_history, clés de jointure, fusion
# JSON, formule CLV). Une inversion de côté a déjà coûté un mois de données :
# ces invariants l'auraient attrapée au commit, pas un mois plus tard.
# AUCUN « || true » ici : un test rouge doit se voir.

on:
  push:
    paths:
      - 'scripts/**.py'
      - 'tests/**.py'
      - 'Tennis_Edge_Lab/**'
      - 'requirements.txt'
      - 'workers/tennis-edge-db/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # Les tests n'ont besoin QUE du code — pas des 600 Mo de partitions.
          sparse-checkout: |
            /*
            !/parts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v
      - run: python3 -m unittest discover -s Tennis_Edge_Lab/tests -v
      - run: node --check Tennis_Edge_Lab/app.js && node --check Tennis_Edge_Lab/research.js && node --check Tennis_Edge_Lab/research_v61.js && node --check Tennis_Edge_Lab/research_v63.js && node --check Tennis_Edge_Lab/research_v66.js && node --check Tennis_Edge_Lab/research_explorer.js && node --check Tennis_Edge_Lab/research_profils.js && node --check Tennis_Edge_Lab/research_reconciliation.js && node --check Tennis_Edge_Lab/research_direct.js && node --check Tennis_Edge_Lab/research_registre.js && node --check Tennis_Edge_Lab/freshness.js && node --check Tennis_Edge_Lab/v4.js && node --check Tennis_Edge_Lab/v6.js
      - run: node --test Tennis_Edge_Lab/tests/test_v5_ui.js Tennis_Edge_Lab/tests/test_v6_ui.js Tennis_Edge_Lab/tests/test_v61_ui.js Tennis_Edge_Lab/tests/test_v63_ui.js Tennis_Edge_Lab/tests/test_v66_ui.js Tennis_Edge_Lab/tests/test_v67_explorer_ui.js Tennis_Edge_Lab/tests/test_v69_explorer_ui.js Tennis_Edge_Lab/tests/test_v70_reconciliation_ui.js Tennis_Edge_Lab/tests/test_v72_direct_ui.js Tennis_Edge_Lab/tests/test_v73_registre_ui.js Tennis_Edge_Lab/tests/test_freshness_ui.js
      - run: node --test workers/tennis-edge-db/test_worker.mjs
      - run: node --test workers/tennis-edge-closing/test_worker.mjs
