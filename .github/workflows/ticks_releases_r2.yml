name: Ticks Releases → R2

# AJOUTÉ LE 16/10/2026 (étape 4). Copie dans R2 (parts/ticks/<fichier>, même
# disposition que les collecteurs) les ticks archivés en GitHub Releases
# (ticks-AAAA-MM), vérifiés par re-téléchargement (SHA-256). Les Releases ne
# sont JAMAIS supprimées ici. Progression : parts/RELEASES_R2_STATE.json.
#
#   inventaire  lecture seule : fichiers indexés, releases/assets ABSENTS,
#               état R2. Rapport JSON en artefact.
#   copier      un lot de `max` fichiers (10 par défaut), rejouable.
#
# Option : variable de dépôt TICKS_RELEASES_AUTO=true -> un lot de 10 par jour.

on:
  workflow_dispatch:
    inputs:
      etape:
        description: "inventaire | copier"
        type: choice
        default: inventaire
        options:
          - inventaire
          - copier
      max:
        description: "copier : nombre maximum de fichiers par run"
        default: "10"
  schedule:
    - cron: '41 3 * * *'

permissions:
  contents: write

concurrency:
  group: ticks-releases-r2
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  GH_TOKEN: ${{ github.token }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  ETAPE: ${{ inputs.etape || 'copier' }}
  MAX: ${{ inputs.max || '10' }}

jobs:
  releases:
    if: github.event_name == 'workflow_dispatch' || vars.TICKS_RELEASES_AUTO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /parts/ARCHIVE_INDEX.json
            /parts/RELEASES_R2_STATE.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Client R2
        run: pip install --quiet boto3 || true

      - name: Étape ${{ env.ETAPE }}
        run: |
          if [ "$ETAPE" = "inventaire" ]; then
            python scripts/ticks_releases_r2.py inventaire
          else
            python scripts/ticks_releases_r2.py copier --max "$MAX"
          fi

      - name: Rapport d'inventaire
        if: env.ETAPE == 'inventaire'
        uses: actions/upload-artifact@v4
        with:
          name: ticks-releases-inventaire-${{ github.run_id }}
          path: ticks_releases_inventaire.json
          retention-days: 30

      - name: Committer la progression (push normal)
        if: always() && env.ETAPE == 'copier'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f parts/RELEASES_R2_STATE.json ] && git add -- parts/RELEASES_R2_STATE.json
          if git diff --staged --quiet; then echo "Rien à committer."; exit 0; fi
          git commit -m "Ticks Releases → R2 : progression ($(date -u +%F))"
          for essai in 1 2 3 4 5 6; do
            git fetch origin main || true
            if git merge origin/main --no-edit; then
              git push origin HEAD:main && { echo "✅ PUSH OK"; exit 0; }
            else
              git merge --abort 2>/dev/null || true
            fi
            sleep $((2 * essai))
          done
          echo "❌ push impossible — la copie R2 est faite, relancer pour l'état."
          exit 1
