name: Update Players Data

# ──────────────────────────────────────────────────────────────────────────
# ⚠️ DÉPRIORITISÉ. Ce workflow alimente l'Elo / modèle joueurs depuis Sackmann.
#  - Le modèle (pa_elo) a été diagnostiqué SANS edge (la clôture Pinnacle le bat) ;
#    ta stratégie steam n'en dépend pas.
#  - Sackmann est INJOIGNABLE sur ce runner (egress : raw/api 404, clone anonyme
#    refusé). Il faut un PAT (secret SACKMANN_PAT, scope public_repo / read-only)
#    pour cloner les repos publics tiers.
# Donc : passé en MANUEL uniquement (plus de cron -> plus d'échec hebdo inutile).
# Ne le lance que si tu as ajouté SACKMANN_PAT et que tu veux rafraîchir l'Elo.
# Sans le secret, l'étape clone échouera proprement (aucune donnée écrasée : le
# script conserve players_data.json intact si 0 joueur récupéré).
# ──────────────────────────────────────────────────────────────────────────

# PYTHONDONTWRITEBYTECODE : aucun .pyc n'est plus genere. Les .pyc
# regeneres a chaque run faisaient echouer le merge puis le push
# (panne du 16/08/2026). Portee workflow = toutes les etapes.
env:
  PYTHONDONTWRITEBYTECODE: '1'

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cloner les données Sackmann (nécessite le secret SACKMANN_PAT)
        env:
          PAT: ${{ secrets.SACKMANN_PAT }}
        run: |
          git clone --depth 1 "https://x-access-token:${PAT}@github.com/JeffSackmann/tennis_atp.git" /tmp/satp
          git clone --depth 1 "https://x-access-token:${PAT}@github.com/JeffSackmann/tennis_wta.git" /tmp/swta
          echo "--- fichiers ATP récupérés ---"; ls /tmp/satp/*.csv | head

      - name: Update players Elo and stats
        env:
          SACKMANN_ATP: /tmp/satp
          SACKMANN_WTA: /tmp/swta
        run: python scripts/update_players.py

      - name: Commit and push players data
        run: |
          # PANNE DU 16/08/2026 -- cause exacte, tracee par pipeline_status.
          # Les .pyc sont SUIVIS par git (ajoutes avant le .gitignore, qui ne
          # s'applique plus une fois un fichier suivi). capture_closing tourne
          # toutes les 5-10 min avec "git add -A" et republie donc des .pyc
          # neufs en continu. Quand un autre workflow tourne, il regenere les
          # siens localement -> "git merge" ABANDONNE ("Your local changes to
          # the following files would be overwritten") -> branche en retard ->
          # push rejete en non-fast-forward. Resultat observe : 7 fichiers
          # commites localement (dont 830 lignes de moves_detail_hist), jamais
          # pousses. On efface donc les .pyc du disque avant toute action git.
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name '*.pyc' -delete 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f players_data.json ] && git add -- players_data.json
          git diff --staged --quiet || git commit -m "🎾 Mise à jour joueurs Elo $(date -u '+%Y-%m-%d')"
          # BOUCLE DE REPRISE AVEC FUSION DES CONFLITS JSON.
          # Ce workflow tourne toutes les 5-10 min : deux exécutions se
          # chevauchent régulièrement, et git tombe en conflit sur les JSON
          # d'état (closing_lines, capture_state, matches_oddspapi...). Le run
          # entier était alors perdu, y compris les partitions live qui,
          # elles, avaient fusionné sans problème via merge=union.
          # merge_json_state.py fusionne ces objets JSON clé par clé, sans rien
          # perdre : closing_lines est un ACCUMULATEUR, prendre une version au
          # hasard effacerait les matchs ajoutés par l'autre exécution.
          for essai in 1 2 3; do
            git fetch origin main || true
            if git merge origin/main --no-edit; then
              :
            else
              echo "⚠️ conflit — tentative de fusion JSON (essai $essai)"
              if python scripts/merge_json_state.py; then
                git commit --no-edit || true
              else
                git merge --abort 2>/dev/null || true
                sleep 5
                continue
              fi
            fi
            if git push; then echo "✅ PUSH OK"; exit 0; fi
            sleep 5
          done
          echo "❌ PUSH ÉCHOUÉ après 3 tentatives — commit local perdu avec le runner."
          exit 1
