name: Update Results Fast

# PYTHONDONTWRITEBYTECODE : aucun .pyc n'est plus genere. Les .pyc
# regeneres a chaque run faisaient echouer le merge puis le push
# (panne du 16/08/2026). Portee workflow = toutes les etapes.
env:
  PYTHONDONTWRITEBYTECODE: '1'

on:
  schedule:
    - cron: '15 4,16 * * *'    # 2×/jour (04h15 et 16h15 UTC), décalé des autres workflows
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backtest-write
  cancel-in-progress: false

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Discover active tournaments (RapidAPI IDs)
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python scripts/discover_rapidapi_tournaments.py

      - name: Run fast results
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python scripts/fetch_results_fast.py

      - name: Commit and push
        run: |
          # PANNE DU 16/08/2026 -- cause exacte, tracee par pipeline_status.
          # Les .pyc sont SUIVIS par git (ajoutes avant le .gitignore, qui ne
          # s'applique plus une fois un fichier suivi). capture_closing tourne
          # toutes les 5-10 min avec "git add -A" et republie donc des .pyc
          # neufs en continu. Quand un autre workflow tourne, il regenere les
          # siens localement -> "git merge" ABANDONNE ("Your local changes to
          # the following files would be overwritten") -> branche en retard ->
          # push rejete en non-fast-forward. Resultat observe : 7 fichiers
          # commites localement (dont 830 lignes de moves_detail_hist), jamais
          # pousses. On efface donc les .pyc du disque avant toute action git.
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name '*.pyc' -delete 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Ajout fichier par fichier : un "git add A B C" échoue en BLOC si UN
          # SEUL des fichiers listés est absent (constaté sur steam_pipeline.yml,
          # --ignore-errors ne couvre pas ce cas -- seule une garde par fichier
          # protège vraiment).
          for f in backtest_tennis.csv resultats_fast.json tournois_ids.json; do
            [ -f "$f" ] && git add -- "$f"
          done
          git diff --staged --quiet || git commit -m "🎾 Résultats rapides + tournois $(date -u +%Y-%m-%dT%H:%MZ)"
          # COMMIT D'ABORD (ci-dessus), SYNCHRO APRÈS : ce workflow poussait
          # sans jamais synchroniser au préalable -- le premier push qui
          # arrivait après un autre writer (plusieurs autres workflows
          # touchent aussi backtest_tennis.csv) était TOUJOURS rejeté
          # ("fetch first"), perdant le run entier. "merge" et non "rebase" :
          # un rebase en conflit peut écarter silencieusement le commit
          # qu'on vient de créer -- un merge en conflit échoue bruyamment,
          # sans perdre le commit local (récupérable au prochain run).
          git fetch origin main 2>&1 || echo "⚠️ fetch échoué"
          git merge origin/main --no-edit 2>&1 || echo "⚠️ merge en conflit -- le commit local n'est pas perdu"
          # UN PUSH QUI ÉCHOUE DOIT FAIRE ÉCHOUER LE RUN. « git push || echo »
          # rendait le job VERT alors que rien n'était poussé — c'est ainsi que
          # hist_curves_meta.json est resté figé 54 h sans alerte (20/08/2026).
          if git push 2>&1; then
            echo "✅ PUSH OK"
          else
            echo "❌ PUSH ÉCHOUÉ — le commit local sera perdu avec le runner."
            exit 1
          fi
