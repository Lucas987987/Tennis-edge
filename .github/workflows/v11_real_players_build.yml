name: V11 - Préparer les vrais personnages 3D
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: blender/blender:4.2.3
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier Blender préinstallé
        run: blender --version
      - name: Télécharger les modèles existants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v11source /tmp/v11output
          python3 - <<'PYDL'
          import urllib.request,pathlib,time
          base='https://raw.githubusercontent.com/s0ck3t/VideoIntoBlenderModel/main/assets/rigs/'
          out=pathlib.Path('/tmp/v11source')
          for name in ('nathan','sophia'):
              for ext in ('fbx','png'):
                  file=f'renderpeople_{name}.{ext}'
                  for attempt in range(3):
                      try:
                          urllib.request.urlretrieve(base+file,out/file)
                          break
                      except Exception:
                          if attempt==2: raise
                          time.sleep(3)
                  print(file,(out/file).stat().st_size,flush=True)
          PYDL
      - name: Convertir les personnages en GLB
        run: blender -b -t 2 --python scripts/build_real_players.py -- /tmp/v11source /tmp/v11output
      - name: Vérifier les GLB
        shell: bash
        run: |
          python3 - <<'PYVERIFY'
          import pathlib,json,struct
          files=sorted(pathlib.Path('/tmp/v11output').glob('*.glb'))
          assert len(files)==2,files
          for p in files:
              b=p.read_bytes(); assert b[:4]==b'glTF' and len(b)>100000
              assert struct.unpack_from('<I',b,8)[0]==len(b)
              n=struct.unpack_from('<I',b,12)[0]
              d=json.loads(b[20:20+n]); assert d.get('meshes') and d.get('skins'),p
              print(p.name,len(b),'meshes',len(d['meshes']),'skins',len(d['skins']),flush=True)
          PYVERIFY
      - uses: actions/upload-artifact@v4
        with:
          name: tennis-edge-v11-real-players-glb
          path: /tmp/v11output/*.glb
          retention-days: 7
