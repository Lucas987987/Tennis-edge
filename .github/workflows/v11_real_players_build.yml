name: V11 - Préparer les vrais personnages 3D
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Installer Blender officiel sans Docker
        shell: bash
        run: |
          set -euo pipefail
          URL="https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz"
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 1200 "$URL" -o "$RUNNER_TEMP/blender.tar.xz"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/blender/blender" --version
      - name: Télécharger Nathan et Sophia
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v11source" "$RUNNER_TEMP/v11output"
          for name in nathan sophia; do
            for ext in fbx png; do
              file="renderpeople_${name}.${ext}"
              curl -fL --retry 5 --retry-delay 4 "https://raw.githubusercontent.com/s0ck3t/VideoIntoBlenderModel/main/assets/rigs/${file}" -o "$RUNNER_TEMP/v11source/$file"
              test -s "$RUNNER_TEMP/v11source/$file"
              ls -lh "$RUNNER_TEMP/v11source/$file"
            done
          done
      - name: Convertir les personnages en GLB
        shell: bash
        run: |
          set -euo pipefail
          blender -b -t 2 --python scripts/build_real_players.py -- "$RUNNER_TEMP/v11source" "$RUNNER_TEMP/v11output"
      - name: Vérifier les GLB
        shell: bash
        run: |
          python3 - <<'PYVERIFY'
          import pathlib,json,struct,os
          files=sorted(pathlib.Path(os.environ['RUNNER_TEMP'],'v11output').glob('*.glb'))
          assert {p.name for p in files}=={'player_a.glb','player_b.glb'},files
          for p in files:
              b=p.read_bytes(); assert b[:4]==b'glTF' and len(b)>100000
              assert struct.unpack_from('<I',b,8)[0]==len(b)
              n=struct.unpack_from('<I',b,12)[0]
              d=json.loads(b[20:20+n]); assert d.get('meshes') and d.get('skins'),p
              print(p.name,len(b),'meshes',len(d['meshes']),'skins',len(d['skins']),flush=True)
          PYVERIFY
      - uses: actions/upload-artifact@v4
        with:
          name: tennis-edge-v11-real-players-glb
          path: ${{ runner.temp }}/v11output/*.glb
          retention-days: 7
