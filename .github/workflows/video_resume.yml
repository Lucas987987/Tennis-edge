name: Vidéo — résumé 3D d'un match terminé

# AJOUTÉ LE 20/11/2026 (paquet 308). Résumé en 3D (1080×1920, MP4, 30–45 s) d'un VRAI match terminé, en français et
# en anglais, prêt à poster sur X : 4 à 6 points clés rejoués dans le stade 3D du site, avec le vrai score à l'écran.
# Le déroulé (qui gagne chaque point, qui sert) vient de la feuille et du point par point TennisApi déjà stockés
# (feuilles/, feuilles_points/) : 0 requête d'API. Seuls les échanges (trajectoires, coups) sont reconstitués.
# Lancement À LA MAIN : bouton « 🎞️ Résumé 3D du match » de la fiche (worker algo, mode « resume »), ou Run workflow
# avec l'uid du site. Jamais d'ITF. Depuis le paquet 446, la signature de la vidéo est l'adresse gamesetalgo.com. Les vidéos arrivent sur le Telegram PRIVÉ
# (TELEGRAM_CHAT_ID) et nulle part ailleurs : pas d'artefact, rien de commité.
# La feuille et le point par point arrivent quelques heures après la fin du match (feuilles_match.yml, toutes les 2 h),
# parfois le lendemain : avant, le résumé est refusé et un message le dit sur le Telegram privé.
# 20/11/2026 (paquet 312) : AUSSI CHAQUE MATIN à 06:12 UTC, le résumé du match du jour de LA VEILLE (match_du_jour_veille
# du site), après la carte bilan de 05:37 (bilan_match_du_jour.yml) : les deux arrivent ensemble sur le Telegram privé.
# Fin du résumé : les vraies stats du match (aces, doubles fautes, 1res balles, balles de break, points gagnés).
# Retrait : supprimer ce fichier et scripts/resume_match.py, remettre algo/index.html, scripts/video_simulation.py et
# workers/algo/worker.js du paquet 307.

on:
  workflow_dispatch:
    inputs:
      uid:
        description: "Match terminé (uid du site ; vide = le match du jour de la veille)"
        required: false
        default: ''
  # 22/11/2026 (paquet 363) : relancé aussi par le worker Cloudflare si le cron saute
  repository_dispatch:
    types: [video_resume]
  schedule:
    - cron: '12 6 * * *'

permissions:
  contents: read

concurrency:
  group: video-resume
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        lang: [fr, en]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /algo/
            /feuilles/
            /feuilles_points/
            /scripts/video_simulation.py
            /scripts/pronostics_prives.py
            /scripts/r2_io.py
            /scripts/site_leger.py
            /scripts/installer_video.sh
            /scripts/sons.py
            /scripts/sons_stade.py
            /scripts/voix.py
            /scripts/resume_match.py
            /scripts/resultats_feuilles.py
            /sons/

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 23/11/2026 (paquet 378) : le dépôt public n'a plus que les matchs commencés ; la version complète est au coffre
      - name: Pronostics complets — rapatrier du coffre (paquet 378)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python scripts/pronostics_prives.py pull . --seulement algo/donnees.json || echo "::warning::pronostics complets non rapatriés, copie publique seulement"
      - name: Le vrai déroulé du match
        id: r
        env:
          UID_DEMANDE: ${{ inputs.uid }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          chemin, uid = 'algo/donnees.json', (os.environ.get('UID_DEMANDE') or '').strip()
          with open(chemin, encoding='utf-8') as f:
              d = json.load(f)
          if not uid:                         # lancement du matin : le match du jour de la veille
              uid = (d.get('match_du_jour_veille') or {}).get('uid') or ''
              print('Match du jour de la veille :', uid or 'aucun')
          trouver = lambda doc: next((x for x in doc.get('matchs', []) if x.get('uid') == uid and x.get('simulation')), None)
          m = trouver(d)
          if not m:   # match publié mais pas encore commité dans main : recharger le catalogue public
              for url in ('https://algo.tennis-edge.workers.dev/donnees.json',
                          'https://lucas987987.github.io/Tennis-edge/algo/donnees.json'):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Tennis-Edge-Video/1.0'})
                      with urllib.request.urlopen(req, timeout=45) as r:
                          public = json.load(r)
                      m = trouver(public)
                      if m:
                          with open(chemin, 'w', encoding='utf-8') as f:
                              json.dump(public, f, ensure_ascii=False, separators=(',', ':'))
                          print('Catalogue public rechargé :', url)
                          break
                  except Exception as e:
                      print('Catalogue public indisponible :', url, type(e).__name__)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"uid={uid}\n")
              f.write(f"titre={(m['home'] + ' – ' + m['away']) if m else uid}\n")
              f.write(f"tournoi={m['tournoi'] if m else ''}\n")
          PY
          UID_MATCH="$(grep '^uid=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)"
          if [ -z "$UID_MATCH" ]; then echo "ok=0" >> "$GITHUB_OUTPUT"; echo "raison=Pas de match du jour la veille." >> "$GITHUB_OUTPUT"; exit 0; fi
          set +e
          sortie="$(python scripts/resume_match.py "$UID_MATCH")"; code=$?
          set -e
          echo "$sortie"
          if [ "$code" = "0" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
            python -c "import json;print('score='+json.load(open('algo/resume_match.json'))['score'])" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "raison=$(echo "$sortie" | tail -n 1)" >> "$GITHUB_OUTPUT"
            echo "::notice::$(echo "$sortie" | tail -n 1)"
          fi

      - name: Résumé refusé → message sur le Telegram privé
        if: steps.r.outputs.ok != '1' && matrix.lang == 'fr'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TITRE: ${{ steps.r.outputs.titre }}
          RAISON: ${{ steps.r.outputs.raison }}
        run: |
          if [ -z "${TELEGRAM_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then exit 0; fi
          curl --fail-with-body -sS -o /dev/null -w "Telegram : HTTP %{http_code}\n" \
            --form-string chat_id="${TELEGRAM_CHAT_ID}" \
            --form-string text="🎞️ ${TITRE} — ${RAISON} Feuille et point par point arrivent quelques heures après la fin (parfois le lendemain) : relancer plus tard." \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"

      - name: Navigateur (Chromium)
        if: steps.r.outputs.ok == '1'
        run: bash scripts/installer_video.sh
        env:
          TE_SON_STADE: '1'

      - name: Enregistrer
        if: steps.r.outputs.ok == '1'
        env:
          TE_SON_STADE: '1'
        run: |
          python scripts/video_simulation.py --resume --lang "${{ matrix.lang }}" --uid "${{ steps.r.outputs.uid }}" --rendu 3d --ips 25 --echelle 0.85 --sortie videos
          ls -la videos

      - name: Envoyer sur le Telegram privé
        if: steps.r.outputs.ok == '1'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TITRE: ${{ steps.r.outputs.titre }}
          TOURNOI: ${{ steps.r.outputs.tournoi }}
          SCORE: ${{ steps.r.outputs.score }}
        run: |
          if [ -z "${TELEGRAM_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then echo '::error::Telegram non configuré : vidéo non envoyée.'; exit 1; fi
          lang="${{ matrix.lang }}"
          test -s "videos/resume_${lang}.mp4"
          curl --fail-with-body -sS -o /dev/null -w "Telegram ${lang} : HTTP %{http_code}\n" \
            --form-string chat_id="${TELEGRAM_CHAT_ID}" --form-string supports_streaming=true \
            --form-string caption="🎬 Résumé (${lang}) — ${TITRE} · ${TOURNOI} · ${SCORE}" \
            -F video=@"videos/resume_${lang}.mp4" \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendVideo"
