name: Vidéo — simulation du match du jour

# AJOUTÉ LE 23/10/2026. Vidéo verticale (1080×1920, MP4, ~25 s) du match du jour rejoué point par point par
# l'algo, en français et en anglais, prête à poster sur X. Fin de vidéo : % sur 5 000 simulations.
# 24/10/2026 : la vidéo montre le SCÉNARIO LE PLUS FRÉQUENT des 5 000 simulations (score exact le plus probable),
# rejoué point par point ; un autre tirage seulement si un numéro est donné au lancement à la main.
# 24/10/2026 : AUCUNE adresse dans la vidéo par défaut (personne ne remonte la piste) ; l'adresse neutre
# algo.tennis-edge.workers.dev ne s'affiche que si « adresse = oui » est choisi au lancement à la main.
# Chaque matin à 07:05 UTC (09:05 à Paris) : le match du jour est choisi au premier passage des pronostics
# de la journée. Les deux vidéos arrivent sur le Telegram PRIVÉ (TELEGRAM_CHAT_ID) et nulle part ailleurs :
# pas d'artefact (le dépôt est public, les artefacts de ses runs se téléchargent), rien de commité. 0 requête d'API.
# 24/10/2026 : + une CARTE DE STATS (PNG 1080×1350, FR et EN) à poster en réponse à la vidéo (X ne mélange pas
# vidéo et image dans un même post).
# Lancement à la main : choisir la langue, un autre match (uid du site) ou un autre tirage (seed).

on:
  workflow_dispatch:
    inputs:
      uid:
        description: "Match (uid, vide = match du jour)"
        required: false
        default: ''
      adresse:
        description: "Afficher l'adresse du site à la fin de la vidéo"
        type: boolean
        default: false
      seed:
        description: "Vide = le scénario le plus fréquent des 5 000 simulations (défaut). Un nombre = un autre tirage."
        required: false
        default: ''
  schedule:
    - cron: '5 7 * * *'

permissions:
  contents: read

concurrency:
  group: video-simulation
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /algo/
            /scripts/video_simulation.py
            /scripts/sons.py

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Navigateur (Chromium)
        run: |
          pip install --quiet playwright==1.48.0
          python -m playwright install --with-deps chromium
          # 24/10/2026 : ffmpeg (conversion MP4 + bande-son) n'est pas garanti sur l'image ubuntu-latest
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          ffmpeg -version | head -1

      - name: Y a-t-il un match du jour ?
        id: mdj
        run: |
          python - <<'PY'
          import json, os, urllib.request
          chemin = 'algo/donnees.json'
          with open(chemin, encoding='utf-8') as f:
              d = json.load(f)
          uid_demande = (os.environ.get('UID_DEMANDE') or '').strip()
          uid = uid_demande or (d.get('match_du_jour') or {}).get('uid') or ''
          def trouver(doc):
              return next((x for x in doc.get('matchs', []) if x.get('uid') == uid and x.get('simulation')), None)
          m = trouver(d)
          # Un lancement manuel peut viser un match déjà publié mais pas encore commité dans main.
          # Recharger alors le catalogue public ; ne jamais replacer silencieusement l'UID par le match du jour.
          if uid_demande and not m:
              for url in ('https://algo.tennis-edge.workers.dev/donnees.json',
                          'https://lucas987987.github.io/Tennis-edge/algo/donnees.json'):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Tennis-Edge-Video/1.0'})
                      with urllib.request.urlopen(req, timeout=45) as r:
                          public = json.load(r)
                      m = trouver(public)
                      if m:
                          d = public
                          with open(chemin, 'w', encoding='utf-8') as f:
                              json.dump(d, f, ensure_ascii=False, separators=(',', ':'))
                          print('Catalogue public rechargé :', url)
                          break
                  except Exception as e:
                      print('Catalogue public indisponible :', url, type(e).__name__)
          if uid_demande and not m:
              raise SystemExit(f"UID demandé introuvable ou sans simulation : {uid_demande}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"ok={'1' if m else '0'}\n")
              f.write(f"titre={(m['home'] + ' – ' + m['away']) if m else ''}\n")
              f.write(f"tournoi={m['tournoi'] if m else ''}\n")
          print('Match :', uid or 'aucun', '(simulation disponible)' if m else '(pas de simulation)')
          PY
        env:
          UID_DEMANDE: ${{ inputs.uid }}

      - name: Enregistrer (FR puis EN)
        if: steps.mdj.outputs.ok == '1'
        run: |
          for lang in fr en; do
            python scripts/video_simulation.py --lang "$lang" --uid "${{ inputs.uid }}" --seed "${{ inputs.seed }}" ${{ inputs.adresse && '--adresse' || '' }} --sortie videos
            # 24/10/2026 : carte de stats du match (PNG pour X, en réponse à la vidéo)
            python scripts/video_simulation.py --lang "$lang" --uid "${{ inputs.uid }}" --carte --sortie videos || echo "::warning::carte ${lang} non faite"
          done
          ls -la videos

      - name: Envoyer sur le Telegram privé
        if: steps.mdj.outputs.ok == '1'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TITRE: ${{ steps.mdj.outputs.titre }}
          TOURNOI: ${{ steps.mdj.outputs.tournoi }}
        run: |
          if [ -z "${TELEGRAM_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then echo '::error::Telegram non configuré : vidéos non envoyées.'; exit 1; fi
          for lang in fr en; do
            test -s "videos/simulation_${lang}.mp4"
            curl --fail-with-body -sS -o /dev/null -w "Telegram ${lang} : HTTP %{http_code}\n" \
              -F chat_id="${TELEGRAM_CHAT_ID}" -F supports_streaming=true \
              -F caption="🎬 Simulation (${lang}) — ${TITRE} · ${TOURNOI}" \
              -F video=@"videos/simulation_${lang}.mp4" \
              "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendVideo"
            if [ -f "videos/stats_${lang}.png" ]; then
              curl --fail-with-body -sS -o /dev/null -w "Telegram carte ${lang} : HTTP %{http_code}\n" \
                -F chat_id="${TELEGRAM_CHAT_ID}" -F caption="📊 Stats du match (${lang}) — à poster en réponse à la vidéo" \
                -F photo=@"videos/stats_${lang}.png" \
                "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto"
            fi
          done
