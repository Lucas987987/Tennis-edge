*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--bg2),var(--bg) 420px) var(--bg);color:var(--ink);font:400 17px/1.6 "Barlow",system-ui,sans-serif}
.page{max-width:760px;margin:0 auto;padding:22px 18px 60px}
.haut{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}
.marque{font-family:var(--disp);font-size:1.05rem;color:var(--ink);text-decoration:none;letter-spacing:.02em}
.marque b{color:var(--p1);font-weight:400}
.retour{color:var(--dim);font-family:var(--cond);font-weight:600;text-decoration:none;font-size:1rem}

h1 em{font-style:normal;color:var(--p1)}
.chapo{color:var(--dim);font-size:1.08rem;margin:0 0 28px}
.etape{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px 64px;margin:0 0 14px}
.etape .n{position:absolute;left:16px;top:16px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-size:.95rem;background:var(--bg);border:2px solid var(--p1);color:var(--p1)}
.etape:nth-of-type(2n) .n{border-color:var(--p2);color:var(--p2)}
h2{font-family:var(--cond);font-weight:700;font-size:1.35rem;margin:0 0 6px;letter-spacing:.01em}
h3{font-family:var(--cond);font-weight:700;font-size:1.5rem;margin:34px 0 10px}
p{margin:0 0 10px}
.etape p:last-child{margin-bottom:0}
.dim{color:var(--dim)}
.chiffres{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}

.chiffre{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.chiffre b{display:block;font-family:var(--disp);font-weight:400;font-size:1.45rem;color:var(--ball);line-height:1.2}
.chiffre span{font-family:var(--cond);font-weight:500;color:var(--dim);font-size:.95rem;line-height:1.25;display:block}
.calib{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:10px 0}
.ligne{display:grid;grid-template-columns:84px 1fr 58px;gap:10px;align-items:center;font-family:var(--cond);font-weight:500;font-size:.98rem;margin:7px 0}
.barres{position:relative;height:18px;background:rgba(255,255,255,.06);border-radius:9px;overflow:hidden}
.barres i{position:absolute;left:0;top:0;bottom:0;background:var(--p1);opacity:.85;border-radius:9px}
.barres u{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--ball);text-decoration:none}
.legende{font-family:var(--cond);color:var(--dim);font-size:.95rem;margin-top:8px}
.legende i{display:inline-block;width:14px;height:10px;background:var(--p1);border-radius:3px;vertical-align:middle;margin-right:4px}
.legende u{display:inline-block;width:3px;height:14px;background:var(--ball);vertical-align:middle;margin:0 4px 0 12px}
ul.non{list-style:none;padding:0;margin:0}
ul.non li{padding:10px 0 10px 30px;border-bottom:1px solid var(--line);position:relative}
ul.non li:before{content:"✕";position:absolute;left:4px;top:10px;color:var(--p2);font-weight:700}
.cta{display:inline-block;margin-top:26px;background:var(--p1);color:var(--bg);font-family:var(--disp);font-size:.95rem;padding:12px 18px;border-radius:12px;text-decoration:none}
footer{margin-top:40px;color:var(--dim);font-size:.9rem;border-top:1px solid var(--line);padding-top:16px}
footer a{color:var(--dim)}
a{color:var(--p1)}

<style>
/* 25/11/2026 (paquet 442) — « Notre projet » : savoir-faire, différenciants, comparaison ; thème clair */
html[data-theme="light"]{--bg:#F4F2FB;--bg2:#E9E3FB;--panel:#FFFFFF;--line:rgba(30,20,80,.14);--ink:#1B1640;--dim:#5C5788;--p1:#0A7FA3;--p2:#C21F78;--ball:#6F9500;--ok:#0E8A57;color-scheme:light}
html[data-theme="light"] .principe,html[data-theme="light"] .atout,html[data-theme="light"] .chiffre{box-shadow:0 6px 22px rgba(40,20,120,.07)}
.haut{flex-wrap:wrap;row-gap:10px}.haut .th{order:3;margin-left:auto}
.th{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.th button{background:transparent;color:var(--dim);border:0;font:600 .78rem "Barlow",system-ui;padding:6px 9px;cursor:pointer;min-height:32px}
.th button[aria-pressed="true"]{background:var(--ball);color:var(--bg)}
.atouts{display:grid;gap:10px;margin:8px 0 6px;grid-template-columns:1fr 1fr;align-items:stretch}

.atout .acc{color:var(--dim);font-size:.88rem;line-height:1.3}.atout[open]{grid-column:1/-1}.atout[open] .acc{display:none}.atout p{margin-top:8px}
.atout summary::after{content:'+';position:absolute;right:12px;top:10px;color:var(--dim);font-family:var(--cond);font-weight:600;font-size:1.1rem}.atout[open] summary::after{content:'−'}
.atout{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px;position:relative;overflow:hidden}
.atout:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--p1))}
.atout .ic{display:block;font-size:1.25rem;line-height:1;margin-bottom:6px}
.atout b{display:block;font-family:var(--cond);font-weight:700;font-size:1.08rem;line-height:1.2;color:var(--c,var(--p1))}
.atout p{margin:0;color:var(--ink);font-size:.98rem}.atout small{display:block;margin-top:8px;color:var(--dim);font-family:var(--cond);font-size:.95rem}
.savoir{counter-reset:s;display:grid;gap:10px;margin:6px 0}
.savoir div{counter-increment:s;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px 14px 56px;position:relative}
.savoir div:before{content:counter(s);position:absolute;left:14px;top:14px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-size:.85rem;border:2px solid var(--ball);color:var(--ball)}
.savoir b{display:block;font-family:var(--cond);font-weight:700;font-size:1.15rem;margin-bottom:2px}.savoir p{margin:0;font-size:.97rem}
.cmp{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;font-size:.95rem}
.cmp th,.cmp td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}.cmp tr:last-child td{border-bottom:0}
.cmp th{font-family:var(--cond);font-weight:700;font-size:1rem}.cmp td:first-child{font-family:var(--cond);font-weight:600;color:var(--dim);width:30%}
.cmp td:nth-child(2){color:var(--dim)}.cmp td:nth-child(3){font-weight:600}.cmp th:nth-child(3){color:var(--ball)}
.chiffre b.v{color:var(--p1)}

.scen{background:linear-gradient(160deg,rgba(46,230,255,.10),rgba(255,79,174,.08)) var(--panel);border:1.5px solid var(--p1);border-radius:20px;padding:18px 18px 16px;margin:8px 0 6px}
html[data-theme="light"] .scen{background:linear-gradient(160deg,rgba(10,127,163,.08),rgba(194,31,120,.05)) var(--panel);box-shadow:0 8px 26px rgba(40,20,120,.08)}
.scen h2{font-family:var(--disp);font-weight:400;font-size:1.25rem;line-height:1.2;margin:0 0 8px}.scen h2 em{font-style:normal;color:var(--p1)}
.scen>p{margin:0 0 12px}
.crit{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:0;list-style:none}
.crit li{border:1px solid var(--line);background:rgba(127,127,127,.06);border-radius:999px;padding:4px 10px;font-family:var(--cond);font-weight:600;font-size:.92rem}
.ex{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px}
html[data-theme="light"] .ex{background:#F8F6FE}
.ex .lab{font-family:var(--cond);font-weight:600;color:var(--dim);font-size:.92rem;margin:0 0 4px}
.ex .res{font-family:var(--cond);font-weight:700;font-size:1.35rem;line-height:1.25;margin:0 0 2px}.ex .res b{color:var(--ball)}
.ex .sous{color:var(--dim);font-size:.92rem;margin:0 0 10px}
.ex table{width:100%;border-collapse:collapse;font-size:.92rem}.ex th,.ex td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
.ex th:first-child,.ex td:first-child{text-align:left;color:var(--dim);font-family:var(--cond);font-weight:600}.ex th{font-family:var(--cond);font-weight:700}
.ex .note{color:var(--dim);font-size:.85rem;margin:10px 0 0}
</style>
