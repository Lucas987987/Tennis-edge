<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E0A24">
<title>Qui sommes-nous — Game Set Algo</title>
<meta name="description" content="Game Set Algo, projet indépendant né en France : un algorithme de tennis qui publie chaque % avant le match et tout son bilan, erreurs comprises. Pas de ticket sûr, pas de promesse de gain.">
<link rel="canonical" href="https://gamesetalgo.com/apropos.html"><meta property="og:url" content="https://gamesetalgo.com/apropos.html"><meta property="og:site_name" content="Game Set Algo">
<meta property="og:title" content="Qui sommes-nous — Game Set Algo">
<meta property="og:description" content="Un projet indépendant : chaque % publié avant le match, tout le bilan, erreurs comprises.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://gamesetalgo.com/partage.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E0A24'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%23D4FF3A'/%3E%3Cpath d='M17 20c12 4 12 20 0 24M47 20c-12 4-12 20 0 24' fill='none' stroke='%230E0A24' stroke-width='3'/%3E%3C/svg%3E">
<style>
@font-face{font-family:"Bungee";font-weight:400;font-display:swap;src:url(polices/bungee-400.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(polices/barlow-400.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(polices/barlow-500.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(polices/barlow-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:500;font-display:swap;src:url(polices/barlow-condensed-500.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(polices/barlow-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(polices/barlow-condensed-700.woff2) format("woff2")}
:root{--bg:#0E0A24;--bg2:#160F38;--panel:#1B1342;--line:rgba(255,255,255,.12);--ink:#F4F1FF;--dim:#ABA3D6;--p1:#2EE6FF;--p2:#FF4FAE;--ball:#D4FF3A;--ok:#45F0A0;
  --disp:"Bungee","Russo One","Arial Black",Impact,sans-serif;--cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--bg2),var(--bg) 420px) var(--bg);color:var(--ink);font:400 17px/1.6 "Barlow",system-ui,sans-serif}
.page{max-width:760px;margin:0 auto;padding:22px 18px 60px}
.haut{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}
.marque{font-family:var(--disp);font-size:1.05rem;color:var(--ink);text-decoration:none;letter-spacing:.02em}
.marque b{color:var(--p1);font-weight:400}
.retour{color:var(--dim);font-family:var(--cond);font-weight:600;text-decoration:none;font-size:1rem}
h1{font-family:var(--disp);font-weight:400;font-size:clamp(1.7rem,6vw,2.5rem);line-height:1.15;margin:0 0 12px}
h1 em{font-style:normal;color:var(--p1)}
.chapo{color:var(--dim);font-size:1.08rem;margin:0 0 28px}
.etape{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px 64px;margin:0 0 14px}
.etape .n{position:absolute;left:16px;top:16px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-size:.95rem;background:var(--bg);border:2px solid var(--p1);color:var(--p1)}
.etape:nth-of-type(2n) .n{border-color:var(--p2);color:var(--p2)}
h2{font-family:var(--cond);font-weight:700;font-size:1.35rem;margin:0 0 6px;letter-spacing:.01em}
h3{font-family:var(--cond);font-weight:700;font-size:1.5rem;margin:34px 0 10px}
p{margin:0 0 10px}
.etape p:last-child{margin-bottom:0}
.dim{color:var(--dim)}
.chiffres{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
@media(min-width:620px){.chiffres{grid-template-columns:repeat(4,1fr)}}
.chiffre{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.chiffre b{display:block;font-family:var(--disp);font-weight:400;font-size:1.45rem;color:var(--ball);line-height:1.2}
.chiffre span{font-family:var(--cond);font-weight:500;color:var(--dim);font-size:.95rem;line-height:1.25;display:block}
.calib{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:10px 0}
.ligne{display:grid;grid-template-columns:84px 1fr 58px;gap:10px;align-items:center;font-family:var(--cond);font-weight:500;font-size:.98rem;margin:7px 0}
.barres{position:relative;height:18px;background:rgba(255,255,255,.06);border-radius:9px;overflow:hidden}
.barres i{position:absolute;left:0;top:0;bottom:0;background:var(--p1);opacity:.85;border-radius:9px}
.barres u{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--ball);text-decoration:none}
.legende{font-family:var(--cond);color:var(--dim);font-size:.95rem;margin-top:8px}
.legende i{display:inline-block;width:14px;height:10px;background:var(--p1);border-radius:3px;vertical-align:middle;margin-right:4px}
.legende u{display:inline-block;width:3px;height:14px;background:var(--ball);vertical-align:middle;margin:0 4px 0 12px}
ul.non{list-style:none;padding:0;margin:0}
ul.non li{padding:10px 0 10px 30px;border-bottom:1px solid var(--line);position:relative}
ul.non li:before{content:"✕";position:absolute;left:4px;top:10px;color:var(--p2);font-weight:700}
.cta{display:inline-block;margin-top:26px;background:var(--p1);color:var(--bg);font-family:var(--disp);font-size:.95rem;padding:12px 18px;border-radius:12px;text-decoration:none}
footer{margin-top:40px;color:var(--dim);font-size:.9rem;border-top:1px solid var(--line);padding-top:16px}
footer a{color:var(--dim)}
a{color:var(--p1)}
</style>
<style>
.principes{display:grid;gap:12px;margin:6px 0 10px}
@media(min-width:620px){.principes{grid-template-columns:1fr 1fr}}
.principe{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.principe b{display:block;font-family:var(--disp);font-weight:400;font-size:1.05rem;margin-bottom:6px}
.principe:nth-child(1) b{color:var(--p1)}.principe:nth-child(2) b{color:var(--ball)}.principe:nth-child(3) b{color:var(--p2)}.principe:nth-child(4) b{color:var(--ok)}
.encadre{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--p1);border-radius:14px;padding:16px;margin:10px 0}
</style>
</head>
<body>
<div class="page" id="page"></div>
<script>
// 22/11/2026 (paquet 330) — qui fait le site, pourquoi, et ce qu'il ne fera jamais.
// Aucune donnée personnelle ici : le contact vient de editeur.json (vide = message au compte X).
const Q = new URLSearchParams(location.search);
let L = 'fr';
try { L = Q.get('lang') || localStorage.getItem('te_lang') || ((navigator.language || 'fr').toLowerCase().startsWith('fr') ? 'fr' : 'en'); } catch (e) {}
if (L !== 'en') L = 'fr';
document.documentElement.lang = L;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const T = {
 fr: {
  titre: 'Qui sommes-nous — Game Set Algo', retour: '← Les matchs du jour',
  h1: 'Un algo qui montre <em>tout</em>',
  chapo: 'Game Set Algo est un projet indépendant, conçu et développé en France par un développeur seul. Pas d’agence, pas d’investisseur, pas de partenaire caché : un algorithme, des matchs, et des chiffres que chacun peut vérifier.',
  pourquoi_t: 'Pourquoi ce site',
  pourquoi: ['Les pronostics de tennis qu’on trouve en ligne sont presque toujours des avis : on ne sait pas d’où ils viennent, ni combien se sont trompés. Les gagnants sont montrés, les perdants disparaissent.',
             'Ici, c’est l’inverse. Chaque % est calculé par un algorithme, publié avant le match, et ne bouge plus. Après le match, il entre dans un bilan public, qu’il soit juste ou faux. Vous pouvez juger l’algo sur pièces, pas sur une promesse.'],
  principes_t: 'Nos quatre principes',
  principes: [['Indépendant', 'L’algorithme ne s’appuie que sur les matchs joués. Le match du jour est choisi par une règle fixe, jamais selon ce qui arrange.'],
              ['Transparent', 'Tout le bilan est public, erreurs comprises, avec la comparaison entre les % annoncés et les % réellement arrivés. Chaque changement de l’algo est daté dans un journal.'],
              ['Prudent', 'Rien n’est conclu sur une poignée de matchs. Une idée nouvelle est jugée sur des milliers de matchs qu’elle n’a jamais vus avant d’être gardée, et retirée si elle déçoit.'],
              ['Responsable', 'Des probabilités, pas des certitudes. Aucun conseil de pari, aucune promesse de gain, pas de pronostic sur les tournois ITF.']],
  jamais_t: 'Ce que vous ne verrez jamais ici',
  jamais: ['de « ticket sûr », de « coup du jour » ou de « VIP garanti » ;', 'de capture de gains ou de train de vie pour vous convaincre ;', 'de pourcentage de réussite trié, qui oublierait les mauvaises semaines ;', 'de pression pour jouer : le tennis se regarde très bien sans parier.'],
  methode: 'Comment l’algo calcule ses % →',
  contact_t: 'Nous écrire', contact: c => `Une question, une erreur repérée, une idée ? ${c}`, contact_x: 'Écrivez-nous par message au compte X « Game Set Algo ».',
  cta: 'Voir les matchs du jour', jeu: 'Les paris sportifs sont interdits aux mineurs. Jouer comporte des risques : endettement, isolement, dépendance. Pour être aidé : 09 74 75 13 13 (appel non surtaxé).',
  liens: ['Mentions légales', 'Confidentialité', 'Conditions d’utilisation']
 },
 en: {
  titre: 'About — Game Set Algo', retour: '← Today’s matches',
  h1: 'An algorithm that shows <em>everything</em>',
  chapo: 'Game Set Algo is an independent project, designed and built in France by a single developer. No agency, no investor, no hidden partner: an algorithm, matches, and numbers anyone can check.',
  pourquoi_t: 'Why this site',
  pourquoi: ['Most tennis tips online are opinions: you never know where they come from or how many were wrong. Winners are shown, losers vanish.',
             'Here it is the other way round. Every % is computed by an algorithm, published before the match and never changed. After the match it goes into a public record, right or wrong. You judge the algorithm on evidence, not on a promise.'],
  principes_t: 'Our four principles',
  principes: [['Independent', 'The algorithm relies only on matches played. The match of the day is picked by a fixed rule, never by convenience.'],
              ['Transparent', 'The full record is public, misses included, with published % compared to what actually happened. Every change to the algorithm is dated in a log.'],
              ['Careful', 'Nothing is concluded from a handful of matches. A new idea is judged on thousands of matches it has never seen before it is kept, and removed if it disappoints.'],
              ['Responsible', 'Probabilities, not certainties. No betting advice, no promise of winnings, no forecasts on ITF events.']],
  jamais_t: 'What you will never see here',
  jamais: ['“sure bets”, “bet of the day” or “guaranteed VIP”;', 'screenshots of winnings or a lavish lifestyle to win you over;', 'a cherry-picked success rate that forgets the bad weeks;', 'pressure to gamble: tennis is great to watch without betting.'],
  methode: 'How the algorithm gets its % →',
  contact_t: 'Contact', contact: c => `A question, a mistake spotted, an idea? ${c}`, contact_x: 'Send a message to the “Game Set Algo” X account.',
  cta: 'See today’s matches', jeu: 'Sports betting is for adults only. Gambling carries risks: debt, isolation, addiction.',
  liens: ['Legal notice', 'Privacy', 'Terms of use']
 }
}[L];
const suf = L === 'en' ? '?lang=en' : '', acc = './' + suf;
document.title = T.titre;
document.getElementById('page').innerHTML = `
 <div class="haut"><a class="marque" href="${acc}">GAME SET <b>ALGO</b></a><a class="retour" href="${acc}">${T.retour}</a></div>
 <h1>${T.h1}</h1><p class="chapo">${T.chapo}</p>
 <h3>${T.pourquoi_t}</h3>${T.pourquoi.map(p => `<p>${p}</p>`).join('')}
 <h3>${T.principes_t}</h3><div class="principes">${T.principes.map(p => `<div class="principe"><b>${p[0]}</b>${p[1]}</div>`).join('')}</div>
 <p><a href="methode.html${suf}">${T.methode}</a></p>
 <h3>${T.jamais_t}</h3><ul class="non">${T.jamais.map(x => `<li>${x}</li>`).join('')}</ul>
 <h3>${T.contact_t}</h3><div class="encadre" id="contact">${T.contact(T.contact_x)}</div>
 <a class="cta" href="${acc}">${T.cta} →</a>
 <footer><p>${T.jeu}</p><p><a href="${acc}#mentions">${T.liens[0]}</a> · <a href="${acc}#confidentialite">${T.liens[1]}</a> · <a href="${acc}#cgu">${T.liens[2]}</a></p></footer>`;
fetch('editeur.json?v=' + Math.floor(Date.now() / 60000)).then(r => r.ok ? r.json() : {}).then(e => {
  if (e && e.email) document.getElementById('contact').innerHTML = T.contact(`<a href="mailto:${esc(e.email)}">${esc(e.email)}</a>`);
}).catch(() => {});
</script>
</body>
</html>
