  if(j===auj)return L.aujourdhui;if(j===dem)return L.demain;if(j===hie)return L.hier;
  return new Date(t*1000).toLocaleDateString(lang==='fr'?'fr-FR':'en-GB',{weekday:'short',day:'numeric',month:'short'});}
function tournoi(m){const L=T[lang];let s=String(m.tournoi||'').replace(/,\s*(MS|WS|MD|WD|XD|Men|Women|Mixed)[^,]*$/i,'');
  return s+' · '+(L.ep[m.epreuve]||m.epreuve||'')+(m.tour?' · '+m.tour:'');}
function dateLongue(iso){try{return new Date(iso).toLocaleString(lang==='fr'?'fr-FR':'en-GB',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});}catch(e){return iso;}}
function jourCourt(j){try{return new Date(j+'T12:00:00').toLocaleDateString(lang==='fr'?'fr-FR':'en-GB',{day:'numeric',month:'long',year:'numeric'});}catch(e){return j;}}
function scoreDe(m){const M=m.manches||[];let a=0,b=0;M.forEach(x=>{if(x[0]>x[1])a++;else if(x[1]>x[0])b++;});return [a,b];}

function ligneMatch(m){
  const L=T[lang],a_p='p_h' in m;
  const fm=FAV.m.has(km(m.id));
  let h=`<div class="m" data-id="${esc(m.id)}"><div class="m-haut"><button class="etoile" type="button" data-fav="match" data-cle="${esc(km(m.id))}" aria-pressed="${fm}" aria-label="${esc(L.etoileM)}">${fm?'⭐':'☆'}</button><span class="h">${heure(m.t)}</span><span class="tr">${esc(tournoi(m))}</span>`;
  if(m.statut==='termine'||m.statut==='en_cours'){const s=scoreDe(m);if(s[0]+s[1])h+=`<span class="res">${s[0]}-${s[1]}</span>`;}
  h+='</div><div class="duel" role="button" tabindex="0">';
  if(a_p){const p=m.p_h,fh=p>=.5;
    h+=`<span class="j ${fh?'f':'o'}">${esc(m.h)}</span><span class="pc pc1">${pc(p)} %</span>`
     +`<span class="j ${fh?'o':'f'}">${esc(m.a)}</span><span class="pc pc2">${100-pc(p)} %</span>`
     +`<span class="barre"><span style="width:${(p*100).toFixed(1)}%"></span></span>`;}
  else{h+=`<span class="j f">${esc(m.h)}</span><span></span><span class="j f">${esc(m.a)}</span><span></span>`;
    if(m.verrou)h+=`<span class="verrou">🔒 ${L.verrou}</span>`;}
  h+='</div>';
  if(m.statut==='termine'&&'bon' in m){const fav=m.p_h>=.5?m.h:m.a;
    h+=`<div class="note"><span class="${m.bon?'ok':'ko'}">${m.bon?'✓ '+L.bon:'✗ '+L.faux}</span> · ${esc(L.annonce(fav,pc(Math.max(m.p_h,1-m.p_h))))}`+(m.score_trouve?` · ${L.scoreTrouve}`:'')+'</div>';}
  const suivre=`<div class="suivre">`+[m.h,m.a].map(n=>{const on=FAV.j.has(kj(n));
    return `<button class="btn" type="button" data-fav="joueur" data-cle="${esc(kj(n))}" aria-pressed="${on}">${esc(on?L.suivi(n):L.suivre(n))}</button>`;}).join('')+'</div>';
  h+=`<div class="det" ${ouverts.has(String(m.id))?'':'hidden'}>`
    +(a_p?`<div>${esc(L.fav(m.p_h>=.5?m.h:m.a,pc(Math.max(m.p_h,1-m.p_h))))}</div>`
      +(m.scores?`<div class="note">${L.scoreProb}</div><div class="sc">${m.scores.map((x,i)=>`<span class="${i?'':'top'}">${x[0]}-${x[1]} · ${pc(x[2])} %</span>`).join('')}</div><div>${esc(L.decisive(pc(m.decisive)))}</div>`:'')
      +(m.n_h!=null?`<div class="note">${esc(L.suivis(m.n_h.toLocaleString(lang),m.n_a.toLocaleString(lang)))}</div>`:'')
      +(m.epreuve==='double dames'?`<div class="note">${esc(L.ddames)}</div>`:''):'')
    +(m.statut==='a_venir'?`<div class="note">${esc(L.prog)}</div>`:'')+suivre+'</div>';
  return h+'</div>';}

function section(titre,L,cle,groupe){
  if(!L.length)return '';
  const max=montres[cle]||(cle==='avenir'?25:15),voir=L.slice(0,max);let h=`<h2>${titre}</h2><div class="panel">`,j=null;
  voir.forEach(m=>{const e=etiquetteJour(m.t);if(groupe&&e!==j){j=e;h+=`<div class="note" style="margin-top:6px">${esc(e)}</div>`;}h+=ligneMatch(m);});
  if(L.length>max)h+=`<button class="btn plusde" data-plus="${cle}">${T[lang].plusde(Math.min(L.length-max,cle==='avenir'?25:15))}</button>`;
  return h+'</div>';}

function bilan(){const L=T[lang],B=(D.bilan||{})[onglet];let h=`<h2>${L.bilanT}${onglet!=='tout'?' · '+esc(L.ep[onglet]||onglet):''}</h2><div class="panel">`;
  if(!B){return h+`<p class="vide">${L.rienBilan}</p></div>`;}
  h+=`<p class="note">${L.depuis(jourCourt(D.depuis))}</p><div class="chiffres">`
   +`<div><b>${B.matchs.toLocaleString(lang)}</b><small>${L.matchs}</small></div>`
   +`<div><b>${B.bons_pct} %</b><small>${L.bons} · ${L.annonceMoy} ${B.annonce_pct} %</small></div>`
   +(B.avec_score?`<div><b>${B.scores_trouves_pct} %</b><small>${L.scores}</small></div>`:'')+'</div>'
   +(B.avec_score?`<p class="note">${L.dec(B.decisive_annoncee_pct,B.decisive_reelle_pct)}</p>`:'');
  if(B.matchs<30)h+=`<p class="note">${L.tot}</p>`;
  if((B.tranches||[]).length){h+=`<table><tr><th>${L.tranche}</th><th>${L.matchs}</th><th>${L.annonceCol}</th><th>${L.reel}</th></tr>`;
    B.tranches.forEach(t=>{h+=`<tr><td>${t.de}–${t.de===80?100:t.de+10} %</td><td>${t.matchs}</td><td>${t.annonce_pct} %</td><td>${t.reel_pct} %</td></tr>`;});
    h+='</table>';}
  return h+'</div>';}

function rendre(){const L=T[lang];document.documentElement.lang=lang;
  $('titre').innerHTML=L.titre;$('sous').textContent=L.sous;$('b-lang').textContent=lang==='fr'?'EN':'FR';
  $('pied').textContent=L.pied;$('methode').innerHTML=`<h2 style="margin-top:0">${L.methodeT}</h2><p style="margin:0">${esc(L.methode)}</p>`;
  if(!D){$('contenu').innerHTML=`<p class="vide">${L.charge}</p>`;return;}
  $('maj').textContent=L.maj(dateLongue(D.genere_le));
  $('bandeau').innerHTML=D.acces==='plus'?'':`<div class="panel plus"><p>${esc(L.bandeau)}</p><a class="btn" href="#plus">${L.sabonner}</a></div>`;
  rendPlus();rendPost();
  $('b-fav').textContent=L.favF;$('b-fav').setAttribute('aria-pressed',String(FILTRE));
  const eps=['tout'].concat(D.epreuves||[]);if(!eps.includes(onglet))onglet='tout';
  const tous=D.matchs||[];
  $('onglets').innerHTML=eps.map(k=>{const n=tous.filter(m=>(k==='tout'||m.epreuve===k)&&m.statut!=='termine').length;
    return `<button role="tab" aria-selected="${k===onglet}" data-o="${esc(k)}" style="flex:1 1 30%">${esc(k==='tout'?L.tout:(L.ep[k]||k))} · ${n}</button>`;}).join('');
  const M=tous.filter(m=>(onglet==='tout'||m.epreuve===onglet)&&(!FILTRE||estFav(m)));
  const off=M.filter(m=>m.offert&&m.statut!=='termine');
  const cache=m=>m.offert&&D.acces!=='plus';
  const av=M.filter(m=>m.statut==='a_venir'&&!cache(m)),ec=M.filter(m=>m.statut==='en_cours'&&!cache(m)),te=M.filter(m=>m.statut==='termine').reverse();
  let h='';
  if(off.length&&D.acces!=='plus')h+=`<h2>${L.offert}</h2><div class="panel offert">`+off.map(ligneMatch).join('')+'</div>';
  h+=section(L.encours,ec,'encours',false)+section(L.avenir,av,'avenir',true)+section(L.termines,te,'termines',true);
  if(!M.length)h+=`<p class="vide">${FILTRE?esc(L.favVide):L.aucun}</p>`;
  if(FILTRE&&MOI&&MOI.compte&&(FAV.j.size||FAV.m.size))h+=`<p class="note">${esc(L.favNotif)}</p>`;
  $('bilan-haut').innerHTML=bilan();
  $('contenu').innerHTML=h;}

function rendPlus(){const L=T[lang],z=$('plus');
  if(!D||D.acces==='plus'){z.hidden=true;return;}
  const e=v=>lang==='fr'?Number(v).toFixed(2).replace('.',',')+' €':'€'+Number(v).toFixed(2);
  const tf=MOI&&MOI.tarifs,c=MOI&&MOI.compte;
  const n=(D.matchs||[]).filter(m=>m.statut!=='termine').length,B=(D.bilan||{}).tout;
  const preuve=n?L.preuve(n,B&&B.matchs>=30?{n:B.matchs.toLocaleString(lang),p:String(B.bons_pct).replace('.',lang==='fr'?',':'.'),d:jourCourt(D.depuis)}:null):'';
  const cel=(v,cl)=>v===true?`<td class="${cl} oui">✓</td>`:v===false?`<td class="${cl} non">—</td>`:`<td class="${cl}"><small>${esc(v[0])}</small></td>`;
  const tete=L.compTete;
  const boutons=c?`<a class="btn go" href="/?compte=connexion">${esc(L.abonner)}</a>`
    :`<a class="btn go" href="/?compte=inscription">${esc(L.creer)}</a><a class="btn" href="/?compte=connexion">${esc(L.connexion)}</a>`;
  z.innerHTML=`<h2>${esc(L.plusT)}</h2><p style="margin:0">${esc(L.plusTexte)}</p>`
    +(tf&&tf.mois!=null?`<p class="prix">${L.prix(tf,e)}</p>`:'')
    +(preuve?`<p class="preuve">${preuve}</p>`:'')
    +`<table class="comp"><thead><tr><th>${esc(tete[0])}</th><th>${esc(tete[1])}</th><th class="p">${esc(tete[2])}</th></tr></thead><tbody>`
    +L.comp.map(r=>`<tr><td>${esc(r[0])}</td>${cel(r[1],'')}${cel(r[2],'p')}</tr>`).join('')+'</tbody></table>'
    +`<div class="actions">${boutons}</div>`
    +`<h3 style="margin:16px 0 6px">${esc(L.fdT)}</h3><p style="margin:0">${esc(L.fd)}</p>`;
  z.hidden=false;}
// 521 (Lucas : « le post du jour ») — l'administrateur voit le post du jour, prêt à copier (il part aussi chaque matin sur
// son Telegram privé). Personne d'autre ne le voit.
function rendPost(){const z=$('post-admin'),adm=MOI&&(MOI.admin||(MOI.compte&&MOI.compte.admin));
  if(!adm||!D||!D.post_du_jour){z.innerHTML='';delete z.dataset.v;return;}
  if(z.dataset.v===D.post_du_jour)return;z.dataset.v=D.post_du_jour;
  z.innerHTML=`<div class="panel"><h2 style="margin-top:0">📝 Post du jour · X et Telegram</h2><textarea id="post-txt" rows="12" readonly style="width:100%;box-sizing:border-box;background:rgba(var(--wv),.04);color:inherit;border:1px solid var(--line2);border-radius:12px;padding:10px;font:inherit;font-size:.88rem"></textarea><p style="display:flex;gap:10px;align-items:center;margin:8px 0 0"><button class="btn" type="button" id="post-copier">Copier</button><small id="post-nb"></small></p></div>`;
  $('post-txt').textContent=D.post_du_jour;$('post-nb').textContent=D.post_du_jour.length+' caractères';
  $('post-copier').onclick=()=>{try{navigator.clipboard.writeText(D.post_du_jour).then(()=>{$('post-nb').textContent='Copié ✓';});}catch(e){$('post-txt').select();}};}
function chargerMoi(){fetch('/compte/api/moi',{credentials:'same-origin',cache:'no-store'}).then(r=>r.json()).then(o=>{if(o&&o.ok!==false){MOI=o;
  lireFavoris(o.compte&&o.compte.favoris);if(D)rendre();else rendPlus();}}).catch(()=>{});}
function charger(){fetch('/bad.json',{credentials:'same-origin',cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
  .then(d=>{D=d;rendre();}).catch(()=>{if(!D)$('contenu').innerHTML=`<p class="vide">${T[lang].erreur}</p>`;});}

document.addEventListener('click',e=>{
  const f=e.target.closest('[data-fav]');if(f){e.stopPropagation();basculerFav(f.dataset.fav,f.dataset.cle);return;}
  if(e.target.closest('#b-fav')){FILTRE=!FILTRE;$('fav-msg').textContent='';rendre();return;}
  const o=e.target.closest('[data-o]');if(o){onglet=o.dataset.o;rendre();return;}
  const p=e.target.closest('[data-plus]');if(p){const k=p.dataset.plus;montres[k]=(montres[k]||(k==='avenir'?25:15))+(k==='avenir'?25:15);rendre();return;}
  const d=e.target.closest('.duel');if(d){const m=d.closest('.m'),x=m&&m.querySelector('.det');if(x){x.hidden=!x.hidden;
    const id=m.dataset.id;x.hidden?ouverts.delete(id):ouverts.add(id);}}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('duel')){e.preventDefault();e.target.click();}});
$('b-lang').addEventListener('click',()=>{lang=lang==='fr'?'en':'fr';try{localStorage.setItem('te_lang',lang);}catch(e){}rendre();});
$('b-theme').addEventListener('click',()=>{const c=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',c);try{localStorage.setItem('te_theme',c);}catch(e){}});
rendre();charger();chargerMoi();setInterval(charger,5*60*1000);
})();
</script>
</body>
