<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E0A24">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E0A24'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%23D4FF3A'/%3E%3Cpath d='M17 20c12 4 12 20 0 24M47 20c-12 4-12 20 0 24' fill='none' stroke='%230E0A24' stroke-width='3'/%3E%3C/svg%3E">
<title>Tennis Edge — l'algo</title>
<meta name="description" content="Chaque match de tennis simulé 20 000 fois par un algorithme indépendant du marché : % de victoire, cote juste, et un bilan public, pertes comprises.">
<meta property="og:title" content="Tennis Edge — l'algo">
<meta property="og:description" content="Chaque match simulé 20 000 fois. % de victoire, cote juste, bilan public.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Tennis Edge — l'algo · thème « arcade » (24/10/2026)
   Un seul thème, sombre, comme une borne d'arcade : fond violet nuit, néons cyan (joueur 1) et magenta
   (joueur 2), vert balle de tennis pour l'action. Le Bungee ne sert qu'aux titres et aux gros chiffres ;
   tout le texte courant reste en Barlow, pour la lisibilité. */
:root{
  --bg:#0E0A24; --bg2:#160F38; --panel:#1B1342; --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.2);
  --ink:#F4F1FF; --dim:#ABA3D6; --p1:#2EE6FF; --p2:#FF4FAE; --ball:#D4FF3A; --ok:#45F0A0; --ko:#FF6B86;
  --disp:"Bungee","Russo One","Arial Black",Impact,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --r-lg:18px; --r-sm:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:16px;background:var(--bg)}
body{margin:0;color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 520px at 50% -120px,#3A1F8F 0%,transparent 70%),var(--bg);min-height:100vh}
a{color:var(--p1)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ball);outline-offset:3px}
.num{font-family:var(--cond);font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}

/* en-tête */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 6px}
.logo{display:flex;align-items:center;gap:10px;margin:0;font-family:var(--disp);font-weight:400;font-size:1.35rem;letter-spacing:.01em;line-height:1}
.logo .b{width:16px;height:16px;border-radius:50%;background:var(--ball);box-shadow:0 0 14px var(--ball);flex:none}
.logo small{font-family:Barlow;font-size:.95rem;color:var(--dim);font-weight:500;letter-spacing:0}
.reglages{display:flex;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ico{border:1px solid var(--line2);background:none;border-radius:999px;width:36px;height:34px;cursor:pointer;display:grid;place-items:center}
.ico svg{width:18px;height:18px}
.lede{font-size:1.06rem;color:var(--dim);max-width:62ch;margin:6px 0 26px}

/* sections */
section{margin:40px 0}
h2{font-family:var(--disp);font-weight:400;font-size:1.45rem;line-height:1.15;margin:0 0 6px;letter-spacing:.01em}
.sub{color:var(--dim);margin:0 0 16px;max-width:64ch}
.panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r-lg)}
.empty{padding:18px;color:var(--dim)}

/* match du jour : borne d'arcade + détails */
.mdj{display:grid;gap:16px}
@media (min-width:820px){.mdj{grid-template-columns:minmax(320px,420px) 1fr;align-items:start}}
.borne{border-radius:var(--r-lg);padding:10px;background:linear-gradient(160deg,#2A1A6E,#120B30);border:1px solid var(--line2);box-shadow:0 0 0 1px rgba(46,230,255,.08),0 20px 50px rgba(0,0,0,.45)}
.ecran-jeu{aspect-ratio:9/15;border-radius:12px;overflow:hidden}
.commandes{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:1px solid var(--line2);background:rgba(255,255,255,.04);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:.95rem}
.btn:hover{border-color:var(--ink)}
.btn.go{background:var(--ball);border-color:var(--ball);color:#160E33;font-family:var(--disp);font-weight:400;font-size:.9rem;letter-spacing:.02em}
.btn[disabled]{opacity:.45;cursor:default}
.final{min-height:1.5em;margin:10px 4px 0;color:var(--ink)}
.aide{color:var(--dim);font-size:.88rem;margin:6px 4px 0}
.fiche{display:grid;gap:12px}
.duelx{padding:16px}
.duelx .ctx{color:var(--dim);font-size:.92rem;margin:0 0 10px}
.duelx .ligne{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:8px}
.duelx .nm{font-weight:600;font-size:1.08rem}
.duelx .pc{font-family:var(--disp);font-size:2.2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.duelx .l1 .pc{color:var(--p1);text-shadow:0 0 18px rgba(46,230,255,.45)} .duelx .l2 .pc{color:var(--p2);text-shadow:0 0 18px rgba(255,79,174,.45)}
.duelx .cj{color:var(--dim);font-size:.9rem;font-family:var(--cond);font-variant-numeric:tabular-nums}
.fiab{display:flex;align-items:center;gap:7px;margin-top:10px;color:var(--dim);font-size:.86rem;flex-wrap:wrap}
.fiab b{color:var(--ball);font-family:var(--cond);font-size:1rem}.fiab small{flex-basis:100%;font-size:.78rem}
.tir{display:flex;height:12px;border-radius:999px;overflow:hidden;margin:12px 0 8px;background:var(--p2);box-shadow:0 0 14px rgba(255,79,174,.35)}
.tir i{display:block;height:100%;background:var(--p1);box-shadow:0 0 14px rgba(46,230,255,.5)}
.fiche h3{font-size:1rem;margin:14px 16px 4px;font-weight:600}
.bars{padding:8px 16px 14px}
.bar{display:grid;grid-template-columns:3.2em 1fr 3.4em;align-items:center;gap:10px;margin:7px 0;font-variant-numeric:tabular-nums}
.bar .t{height:8px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--p1)}
.bar.away .t i{background:var(--p2)}
.duo{display:grid;gap:12px}
@media (min-width:560px){.duo{grid-template-columns:1fr 1fr}}
table.sheet{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.sheet td,table.sheet th{padding:8px 16px;border-top:1px solid var(--line);text-align:right}
table.sheet th{font-weight:500;color:var(--dim);text-align:left}
table.sheet thead th{border-top:0;font-size:.9rem;text-align:right}
table.sheet thead th:first-child{text-align:left}
table.sheet thead th.c1{color:var(--p1)} table.sheet thead th.c2{color:var(--p2)}

/* catalogue : chaque ligne ouvre le même détail et la même borne que le match du jour */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.retour{margin:0 0 16px}
.filtres{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 8px}
.filtres input{flex:1 1 240px;min-height:44px;border:1px solid var(--line2);border-radius:10px;background:var(--panel);color:var(--ink);padding:10px 12px;font:inherit}
.filtres input::placeholder{color:var(--dim)}
.circuits button{min-height:44px;min-width:44px}
.compte{min-height:1.5em;margin:0 0 8px;color:var(--dim);font-size:.9rem}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line);transition:background-color .18s ease-out}
.list li:first-child{border-top:0}
.match-open{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:4px 12px;width:100%;padding:14px 16px;border:0;background:transparent;text-align:left;cursor:pointer;color:inherit;text-decoration:none;transition:transform .18s ease-out,background-color .18s ease-out}
.match-open:hover,.match-open:focus-visible{background:rgba(255,255,255,.035)}
.match-open:active{transform:scale(.995)}
.list .time{font-family:var(--cond);font-weight:600;font-size:1.1rem;color:var(--dim);padding-top:2px}
.list .tour{font-size:.85rem;color:var(--dim)}
.list .pl{display:flex;justify-content:space-between;gap:10px;font-weight:500}
.list .pl b{font-family:var(--disp);font-weight:400;font-size:1.05rem;font-variant-numeric:tabular-nums}
.list .pl.a b{color:var(--p1)} .list .pl.b b{color:var(--p2)}
.list .mini{height:6px;border-radius:999px;background:var(--p2);overflow:hidden;margin:7px 0 3px;display:flex;opacity:.9}
.list .mini i{display:block;height:100%;background:var(--p1)}
.list .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.85rem;color:var(--dim);flex-wrap:wrap}
.list .ouvrir{color:var(--p1);font-weight:600;transition:opacity .18s ease-out,transform .18s ease-out}
.match-open:hover .ouvrir,.match-open:focus-visible .ouvrir{transform:translateX(3px)}
.list li.star{background:linear-gradient(90deg,rgba(212,255,58,.08),transparent 60%);box-shadow:inset 3px 0 0 var(--ball)}
.list li.selectionne{background:rgba(46,230,255,.07)}
.badge{display:inline-block;font-family:var(--disp);font-size:.7rem;padding:2px 8px;border-radius:999px;background:var(--ball);color:#160E33;letter-spacing:.02em;vertical-align:middle;margin-left:6px}

/* tableau des scores (bilan) */
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.scores > div{padding:16px 18px;border-top:1px solid var(--line)}
.scores > div:first-child{border-top:0}
@media (min-width:560px){.scores > div{border-top:0;border-left:1px solid var(--line)}.scores > div:first-child{border-left:0}}
.scores .k{color:var(--dim);font-size:.9rem}
.scores .v{font-family:var(--disp);font-size:2.1rem;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--ball);text-shadow:0 0 18px rgba(212,255,58,.35)}
.circ{padding:12px 18px;border-top:1px solid var(--line);font-size:.95rem}
svg.curve{width:100%;height:auto;display:block}
.res{list-style:none;margin:0;padding:0}
.res li{display:grid;grid-template-columns:1.8em 1fr auto;gap:10px;padding:10px 16px;border-top:1px solid var(--line);align-items:center;font-size:.96rem}
.res li:first-child{border-top:0}
.res .m{display:grid;place-items:center;width:1.6em;height:1.6em;border-radius:6px;font-weight:700;font-size:.85rem}
.res .ok{background:rgba(69,240,160,.16);color:var(--ok)} .res .ko{background:rgba(255,107,134,.16);color:var(--ko)}
.res .d{color:var(--dim);font-size:.86rem}
.res .sc{white-space:nowrap}
.res .p{font-family:var(--cond);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.more{display:block;margin:0;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;color:var(--p1);font-weight:600}
.calib{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.calib th,.calib td{padding:9px 12px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.calib th:first-child,.calib td:first-child{text-align:left}
.calib thead th{border-top:0;color:var(--dim);font-weight:500;font-size:.9rem}
.calib td b{color:var(--ball)}
.suivi{padding:18px}
.suivi .statut{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
.suivi .statut strong{font-family:var(--cond);font-size:2rem;font-weight:600;color:var(--ball);font-variant-numeric:tabular-nums}
.suivi .statut span{color:var(--dim)}
.suivi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.suivi-circuit{padding:10px 0;border-top:1px solid var(--line)}
.suivi-circuit b{display:block;font-weight:600}.suivi-circuit span{font-family:var(--cond);font-size:1.35rem;font-variant-numeric:tabular-nums}.suivi-circuit small{display:block;color:var(--dim)}
.suivi .note{margin:14px 0 0;color:var(--dim);font-size:.88rem;max-width:72ch}
.fiab-detail{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:.86rem;color:var(--dim)}
.fiab-detail summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--ink)}
.fiab-detail dl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:6px 0}.fiab-detail dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.styles-descriptifs{padding:16px}
.styles-descriptifs h3{margin:0;font-size:1rem}.styles-intro{margin:4px 0 14px;color:var(--dim);font-size:.88rem;max-width:72ch}
.styles-joueurs{display:grid;gap:16px}.btn-x{margin:16px 0 2px;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:rgba(212,255,58,.1);color:var(--ink);font:600 .95rem Barlow,system-ui,sans-serif;cursor:pointer}.btn-x:disabled{opacity:.5}.style-joueur{min-width:0;border-top:1px solid var(--line);padding-top:12px}
.style-tete{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}.style-tete h4{margin:0;font-size:1rem}.style-etiquette{font-family:var(--cond);font-weight:600;color:var(--ball)}
.style-contre{margin:3px 0 10px;color:var(--dim);font-size:.88rem}.style-chiffres{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.style-chiffre{min-width:0;border-top:1px solid var(--line);padding-top:8px}.style-chiffre>span{display:block;color:var(--dim);font-size:.82rem}.style-chiffre strong{display:block;font-family:var(--cond);font-size:1.8rem;line-height:1.2;font-variant-numeric:tabular-nums}
.style-joueur.home .style-chiffre strong{color:var(--p1)}.style-joueur.away .style-chiffre strong{color:var(--p2)}
.style-chiffre .style-att{display:block;color:var(--ink);font-size:.8rem;margin:2px 0}.style-att b{font-weight:700;color:var(--dim)}.style-att b.plus{color:var(--ok)}.style-att b.moins{color:var(--ko)}
.sv-phrase{margin:0 0 10px;padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.04);border-left:3px solid var(--dim);font-size:.9rem;line-height:1.45}.sv-phrase b{font-weight:700}.sv-phrase.plus{border-left-color:var(--ok)}.sv-phrase.info{border-left-color:var(--ball)}.sv-phrase.moins{border-left-color:var(--ko)}
.sv-barre{position:relative;height:12px;margin:8px 0 2px;border-radius:6px;background:rgba(255,255,255,.08)}.sv-barre i{position:absolute;top:0;bottom:0}.sv-ic{background:rgba(255,255,255,.18);border-radius:6px}.sv-att{width:2px;margin-left:-1px;top:-3px!important;bottom:-3px!important;background:var(--ink)}.sv-reel{width:10px;height:10px;margin:1px 0 0 -5px;border-radius:50%;background:currentColor}.style-joueur.home .sv-reel,.style-joueur.home .sv-pt{color:var(--p1)}.style-joueur.away .sv-reel,.style-joueur.away .sv-pt{color:var(--p2)}.sv-legende{display:flex;gap:12px;color:var(--dim);font-size:.72rem;margin-bottom:2px}.sv-legende span{display:flex;align-items:center;gap:4px}.sv-pt{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor}.sv-tr{display:inline-block;width:2px;height:10px;background:var(--ink)}
.style-chiffre .style-diff{display:block;color:var(--dim);font-size:.78rem;margin:1px 0 2px}
.rythme .ry-duree{font-family:var(--cond);font-size:1.25rem;margin:4px 0 2px;color:var(--ink)}.rythme .ry-pts{color:var(--dim);font-size:.85rem;margin:0 0 10px}
.marches .mk-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.marches h4{margin:6px 0;font-size:.9rem;color:var(--dim);font-weight:600}
.mk-l{position:relative;display:flex;justify-content:space-between;gap:8px;padding:5px 8px;margin:3px 0;border-radius:6px;overflow:hidden;font-size:.86rem;background:rgba(255,255,255,.03)}
.mk-l i{position:absolute;left:0;top:0;bottom:0;background:var(--p1);opacity:.14;pointer-events:none}.mk-l b{font-variant-numeric:tabular-nums}
.duel-sr .du-l{border-top:1px solid var(--line);padding:8px 0}.duel-sr .du-l p{margin:0 0 4px;font-size:.88rem;color:var(--dim)}
.du-v{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.du-v b{font-family:var(--cond);font-size:1.5rem}.du-v .c1 b{color:var(--p1)}.du-v .c2 b{color:var(--p2)}.du-v em{color:var(--dim);font-style:normal}.duel-sr small{color:var(--ball)}
.style-chiffre .style-ic{color:var(--dim);font-size:.78rem}.style-alerte{display:block;color:var(--ball);font-size:.76rem;margin-top:2px}.style-vide{font-size:1.15rem!important;color:var(--dim)!important}
.style-details{margin-top:10px;border-top:1px solid var(--line)}.style-details summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600;font-size:.9rem}
.style-matchs{list-style:none;margin:0;padding:0}.style-matchs li{display:grid;grid-template-columns:1.5em minmax(0,1fr) auto;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:.86rem;align-items:start}
.style-matchs .issue{font-weight:700}.style-matchs .issue.v{color:var(--ok)}.style-matchs .issue.d{color:var(--ko)}.style-matchs small{display:block;color:var(--dim)}.style-matchs .score{white-space:nowrap;font-variant-numeric:tabular-nums}
.styles-note{margin:14px 0 0;color:var(--dim);font-size:.82rem;max-width:72ch}
@media (min-width:650px){.styles-joueurs{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}}
@media(max-width:420px){.style-chiffres{grid-template-columns:1fr}.style-matchs li{grid-template-columns:1.5em minmax(0,1fr)}.style-matchs .score{grid-column:2}}
.qualite{padding:18px}.qualite-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.qualite-grid b{display:block;font-family:var(--cond);font-size:1.6rem;color:var(--ball);font-variant-numeric:tabular-nums}.qualite-grid span{color:var(--dim);font-size:.88rem}.qualite p{color:var(--dim);font-size:.88rem;max-width:72ch;margin:14px 0 0;overflow-wrap:anywhere}
@media(max-width:520px){.suivi-grid,.qualite-grid{grid-template-columns:1fr}.suivi-circuit{display:grid;grid-template-columns:1fr auto;align-items:baseline}.suivi-circuit small{grid-column:1/-1}}
.plus{padding:18px}
.plus ul{margin:10px 0 0;padding-left:1.1em}
.plus li{margin:4px 0}
.plus .soon{display:inline-block;margin-top:12px}
footer{color:var(--dim);font-size:.86rem;padding:22px 0 44px;border-top:1px solid var(--line);margin-top:44px}
footer p{max-width:72ch}

/* ── la borne d'arcade : même composant sur le site (dans .ecran-jeu) et dans la vidéo (plein écran 9:16) ──
   Toutes les tailles sont en cqw (largeur du conteneur) : la scène s'adapte à n'importe quelle largeur. */
.arcade{--ar-bg:#0E0A24;--ar-p1:#2EE6FF;--ar-p2:#FF4FAE;--ar-ball:#D4FF3A;--ar-ink:#F4F1FF;--ar-dim:#ABA3D6;--ar-disp:var(--disp);
  container-type:inline-size;position:relative;width:100%;height:100%;overflow:hidden;color:var(--ar-ink);font-family:var(--cond);
  background:radial-gradient(120cqw 80cqw at 50% 0%,#3A1F8F 0%,transparent 60%),radial-gradient(90cqw 70cqw at 50% 105%,#0F5C66 0%,transparent 60%),var(--ar-bg)}
.arcade .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:6cqw 6cqw;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 70%,transparent)}
.arcade .scene{position:absolute;inset:0;display:flex;flex-direction:column;padding:6cqw 5cqw 5cqw}
.arcade .tag{display:flex;justify-content:space-between;align-items:center;gap:2cqw;font-size:3.4cqw;color:var(--ar-dim);font-weight:600}
.arcade .tag > span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arcade .tag b{color:var(--ar-ball);font-family:var(--ar-disp);font-weight:400}

  const tbServ = (k,s0) => k===0 ? s0 : ((((k-1)>>1)%2)===0 ? 1-s0 : s0);
  function pTB(i,j,s0,cible){                    // P(home gagne le jeu décisif) depuis i-j
    if (i>=cible && i-j>=2) return 1; if (j>=cible && j-i>=2) return 0;
    if (i===j && i>=cible-1){ const k=i+j, p1=pServ(tbServ(k,s0)), p2=pServ(tbServ(k+1,s0)); const w=p1*p2, l=(1-p1)*(1-p2); return w/(w+l); }
    const key='t'+i+','+j+','+s0+','+cible; if (memo.has(key)) return memo.get(key);
    const p=pServ(tbServ(i+j,s0)); const v=p*pTB(i+1,j,s0,cible)+(1-p)*pTB(i,j+1,s0,cible); memo.set(key,v); return v;
  }
  // distribution de fin de set : [home gagne & sert ensuite 0, home gagne & 1, away gagne & 0, away gagne & 1]
  function setDist(gh,ga,srv,fin){
    if ((gh>=6 && gh-ga>=2) || gh===7) return [srv===0?1:0, srv===1?1:0, 0,0];
    if ((ga>=6 && ga-gh>=2) || ga===7) return [0,0, srv===0?1:0, srv===1?1:0];
    const key='s'+gh+','+ga+','+srv+','+fin; if (memo.has(key)) return memo.get(key);
    let v;
    if (gh===6 && ga===6){ const p=pTB(0,0,srv,fin?TBF:7); v = srv===0 ? [0,p,0,1-p] : [p,0,1-p,0]; }
    else { const pg = srv===0 ? pGame(A,0,0) : 1-pGame(B,0,0);
      const x=setDist(gh+1,ga,1-srv,fin), y=setDist(gh,ga+1,1-srv,fin); v=x.map((e,i)=>pg*e+(1-pg)*y[i]); }

  function pMatch(sh,sa,srv){

    if (S.fini) return S.vainqueur===0 ? 1 : 0;
    const sh=S.sets[0], sa=S.sets[1], fin = sh===N-1 && sa===N-1, gh=S.jeux[0], ga=S.jeux[1];
    let d;
    if (S.tb){ const p=pTB(S.pts[0],S.pts[1],S.tbS0,S.tbCible); const nx=1-S.tbS0; d = nx===0 ? [p,0,1-p,0] : [0,p,0,1-p]; }
    else {
      const ps = S.srv===0 ? pGame(A,S.pts[0],S.pts[1]) : 1-pGame(B,S.pts[1],S.pts[0]);
      const x=setDist(gh+1,ga,1-S.srv,fin), y=setDist(gh,ga+1,1-S.srv,fin); d=x.map((e,i)=>ps*e+(1-ps)*y[i]);
    }
    return d[0]*pMatch(sh+1,sa,0)+d[1]*pMatch(sh+1,sa,1)+d[2]*pMatch(sh,sa+1,0)+d[3]*pMatch(sh,sa+1,1);
  }
  function etat(premier){ return {sets:[0,0], jeux:[0,0], pts:[0,0], srv:premier, tb:false, tbS0:0, tbCible:7, histo:[], fini:false, vainqueur:null}; }
  function point(S, r){                          // joue un point ; r ∈ [0,1)
    const serveur = S.tb ? tbServ(S.pts[0]+S.pts[1], S.tbS0) : S.srv;
    const h = r < pServ(serveur) ? 0 : 1;
    S.pts[h]++;

    if (S.tb){
      if ((a>=S.tbCible || b>=S.tbCible) && Math.abs(a-b)>=2){ S.jeux[h]++; finSet(S,h); S.srv = 1-S.tbS0; }
      return h;
    }
    if ((a>=4 || b>=4) && Math.abs(a-b)>=2){
      S.jeux[h]++; S.pts=[0,0]; S.srv=1-S.srv;
      const [gh,ga]=S.jeux, fin = S.sets[0]===N-1 && S.sets[1]===N-1;
      if ((gh>=6||ga>=6) && Math.abs(gh-ga)>=2) finSet(S, gh>ga?0:1);

const logit = p => Math.log(p/(1-p)), sig = z => 1/(1+Math.exp(-z));

}

/* Les probabilités au service (a, b) sont décalées d'un même δ (a + δ, b − δ) pour que le match simulé
   donne exactement le % publié : la simulation rejouée raconte la même histoire que le pronostic. */
function calibre(sim, p){
  const f = d => Moteur({...sim, a: sim.a + d, b: sim.b - d}).pLive(Moteur(sim).etat(0)) - p;
  let lo = -0.2, hi = 0.2;
  if (f(lo) > 0 || f(hi) < 0) return sim;
  for (let k=0;k<40;k++){ const mid=(lo+hi)/2; if (f(mid) < 0) lo = mid; else hi = mid; }
  const d=(lo+hi)/2; return {...sim, a: sim.a + d, b: sim.b - d};
}

function scoreTxt(S, inverse){ return S.histo.map(h=> inverse ? `${h[1]}-${h[0]}` : `${h[0]}-${h[1]}`).join(' '); }
const dort = ms => new Promise(r => setTimeout(r, ms));

/* ───────────── bruitages du site (Web Audio, synthétisés, coupés par défaut) ─────────────
   Les mêmes sons que la vidéo, en plus court. Rien n'est téléchargé : tout est fabriqué par le navigateur. */
const Bruit = (() => {
  let ctx = null, actif = false;
  try { actif = localStorage.getItem('te_son') === '1'; } catch(e){}
  function c(){ if (!ctx){ const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; ctx = new A(); } if (ctx.state === 'suspended') ctx.resume(); return ctx; }
  function note(f, t0, d, type, vol, f2){
    const a = c(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, a.currentTime + t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, a.currentTime + t0 + d);
    g.gain.setValueAtTime(0.0001, a.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.08, a.currentTime + t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + t0 + d);
    o.connect(g).connect(a.destination); o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + d + 0.02);
  }
  const jeux = {
    vs: () => note(160, 0, 0.6, 'sine', 0.25, 40),
    frappe0: () => note(260, 0, 0.06, 'triangle', 0.12, 160),
    frappe1: () => note(220, 0, 0.06, 'triangle', 0.12, 140),
    annonce: () => note(300, 0, 0.5, 'square', 0.05, 1200),
    balle_match: () => { note(300, 0, 0.7, 'square', 0.06, 1400); note(120, 0.1, 0.5, 'sine', 0.2, 40); },
    break: () => [392, 523, 659].forEach((f, i) => note(f, i * 0.07, 0.25, 'square', 0.06)),
    set: () => [523, 659, 784, 1047].forEach((f, i) => note(f, i * 0.08, 0.35, 'square', 0.06)),
    jeu_decisif: () => note(300, 0, 0.45, 'square', 0.05, 900),
    combo: () => { note(988, 0, 0.08, 'square', 0.05); note(1319, 0.07, 0.15, 'square', 0.05); },
    fin: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => note(f, i * 0.12, 0.5, 'square', 0.07)),
  };
  return {
    get actif(){ return actif; },
    basculer(){ actif = !actif; try { localStorage.setItem('te_son', actif ? '1' : '0'); } catch(e){} if (actif) { c(); jeux.combo(); } return actif; },
    jouer(type){ if (actif && jeux[type]) try { jeux[type](); } catch(e){} },
  };
})();

/* ───────────── la borne d'arcade ─────────────
   Écran VS, barres de vie = probabilité de gagner en direct, court vu de haut avec la balle, annonces
   (BREAK !, BALLE DE MATCH…), combos, ralenti sur les points importants, confettis à la fin.
   Le match simulé est calé sur le % publié (calibre) : il raconte la même histoire que le pronostic.
   opts : video (plein écran, lancement automatique), seed, vitesse, duree (s), son(type), onFin(S). */
function Arcade(root, m, opts){
  const p = m.p_home, M = Moteur(calibre(m.simulation, p)), noms = [court(m.home), court(m.away)];
  const son = opts.son || (()=>{});
  let jeton = 0, accel = 1;
  root.classList.add('arcade');
  const $ = s => root.querySelector(s);
  const coul = i => i === 0 ? 'var(--ar-p1)' : 'var(--ar-p2)';

  // Nouveau format : un match réellement tiré par Python, avec chaque point dans l'ordre.
  // L'ancien repli par recherche de score reste disponible pour les archives déjà publiées.
  const scenario = m.simulation && m.simulation.scenario;
  const traceTop = scenario && /^[01]+$/.test(scenario.points || '') ? scenario.points : null;
  const scoreTop = traceTop ? (m.scores_probables || []).find(x => x[0] === scenario.score) : null;
  const nSim = Math.max(1, Math.round(Number(m.simulation.n) || Number(D.simulations) || 0));
  const cible = traceTop ? [scenario.score, scoreTop ? scoreTop[1] : null] : (m.scores_probables || [])[0] || null;
  let tirageTop;
  function chercherTop(){
    if (tirageTop !== undefined) return tirageTop;
    tirageTop = null;
    if (!cible) return null;
    const vise = String(cible[0]).trim(), setsVises = vise.split(' ').length;
    let repli = null;
    for (let k = 1; k <= 20000; k++){
      const X = M.etat(k % 2), Rk = rng(k); let n = 0;
      while (!X.fini && n < 800){ M.point(X, Rk()); n++; }
      const sc = scoreTxt(X, false);
      if (sc === vise){ tirageTop = k; break; }
      if (repli === null && X.histo.length === setsVises && (X.vainqueur === 0) === (vise.split(' ').filter(x=>{ const [a,b]=x.split('-').map(Number); return a>b; }).length * 2 > setsVises)) repli = k;
    }
    if (tirageTop === null) tirageTop = repli;
    return tirageTop;
  }
  let enCoursTop = false;
  function squelette(){
    root.innerHTML = `<div class="grid"></div><div class="scene">
      <div class="tag"><span class="live"><i></i>${esc(t('a_live'))}</span><span>${esc(m.tournoi)}</span><span><b>${esc(t('a_sim'))}</b> ${esc(t('a_fois', nSim))}</span></div>
      <div class="duel">${[0,1].map(i=>`<div class="pj p${i+1}" data-pj="${i}"><div class="nom">${esc(noms[i])}</div>
        <div class="pct" data-pc="${i}"></div><div class="lbl">${esc(t('a_chance'))}</div><div class="vie"><i data-vie="${i}"></i></div></div>`).join('')}</div>
      <div class="score"><table><tbody><tr class="r1" data-sr="0"></tr><tr class="r2" data-sr="1"></tr></tbody></table></div>
      <div class="arene"><div class="court"><div class="cote haut" data-cote="1"></div><div class="cote bas" data-cote="0"></div>
        <div class="filet"></div><div class="balle"></div></div></div>
      <div class="pied">${esc(t('a_pied', nSim))}</div></div>
      <div class="annonce"></div><div class="combo"></div><div class="ralenti">${esc(t('a_ralenti'))}</div>
      <div class="ecran intro"><div class="vs-n a">${esc(m.home)}</div><div class="vs-x">VS</div>
        <div class="vs-n b">${esc(m.away)}</div><div class="vs-t">${t(enCoursTop ? 'a_vs_top' : 'a_vs_t', nSim)}</div>
        ${opts.video ? '' : `<button type="button" class="start">▶ ${esc(t('jouer'))}</button>`}</div>`;
    const b = $('.start'); if (b) b.onclick = () => jouer();
  }
  let S, R, pPrec;
  function jauges(q){
    [q, 1-q].forEach((v,i)=>{ $(`[data-pc="${i}"]`).textContent = pc0(v); $(`[data-vie="${i}"]`).style.width = (v*100).toFixed(1)+'%'; });
    if (Math.abs(q - pPrec) > 0.06 && !MOINS_ANIM){ const d = $(`[data-pj="${q > pPrec ? 0 : 1}"]`); d.classList.remove('secoue'); void d.offsetWidth; d.classList.add('secoue'); }
    pPrec = q;
  }
  function tableau(){
    const srv = S.fini ? -1 : M.serveur(S);
    [0,1].forEach(i=>{
      $(`[data-sr="${i}"]`).innerHTML = `<td class="n"><span class="srv ${srv===i?'on':''}"></span>${esc(noms[i])}</td>`
        + S.histo.map(h=>`<td class="s">${h[i]}</td>`).join('')
        + (S.fini ? '' : `<td>${S.jeux[i]}</td><td class="pt">${affPts(S,i)}</td>`);
    });
  }
  function frappe(h, ms){
    const b = $('.balle'), perdant = 1 - h, alea = (a,z) => a + (z-a) * R();
    b.style.transition = `left ${ms}ms cubic-bezier(.3,.1,.3,1), top ${ms}ms cubic-bezier(.3,.1,.3,1)`;
    b.style.left = alea(14, 86).toFixed(1) + '%';
    b.style.top = (perdant === 0 ? alea(60, 92) : alea(8, 40)).toFixed(1) + '%';
    const c = $(`[data-cote="${perdant}"]`), base = 'cote ' + (perdant ? 'haut' : 'bas');
    c.className = base + ' eclat-p' + (h+1); setTimeout(()=>{ c.className = base; }, Math.max(120, ms));
    const pj = $(`[data-pj="${h}"]`); pj.classList.add('flash'); setTimeout(()=>pj.classList.remove('flash'), Math.max(120, ms));
    son('frappe' + h);
  }
  function annonce(txt, sous, ms, couleur){
    const a = $('.annonce'); a.classList.remove('pop'); void a.offsetWidth;
    a.innerHTML = esc(txt) + (sous ? `<small>${esc(sous)}</small>` : '');
    a.style.color = couleur || ''; a.style.setProperty('--duree', ms + 'ms'); a.classList.add('pop');
  }
  function enjeu(X){                                   // point important : match > set > break (pour qui)
    let best = null;
    for (const h of [0,1]){
      const C = JSON.parse(JSON.stringify(X)), srv = M.serveur(X), tb = X.tb;
      M.point(C, h === 0 ? 0 : 0.9999999);
      const set = C.sets[0]+C.sets[1] > X.sets[0]+X.sets[1], jeu = set || C.jeux[0]+C.jeux[1] > X.jeux[0]+X.jeux[1];
      const k = C.fini ? 3 : set ? 2 : (jeu && !tb && h !== srv) ? 1 : 0;
      if (k && (!best || k > best.k)) best = {k, h};
    }
    return best;
  }
  function preparer(seed, premier){
    S = M.etat(premier == null ? seed % 2 : premier); R = rng(seed); pPrec = p;
    const decal = logit(Math.min(.995,Math.max(.005,p))) - logit(Math.min(.995,Math.max(.005,M.pLive(S))));
    return () => { const q = M.pLive(S); return (q<=0||q>=1) ? q : sig(logit(q)+decal); };
  }
  async function jouer(seedVoulu){
    const mon = ++jeton, vivant = () => mon === jeton;
    let seed = seedVoulu != null ? seedVoulu : (opts.seed != null && mon === 1 ? opts.seed : null);
    enCoursTop = false;
    if (seed == null && traceTop){ seed = (scenario.simulation_index || 0) + 1; enCoursTop = true; }
    if (seed == null && !traceTop){ const k = chercherTop(); if (k != null){ seed = k; enCoursTop = true; } }
    if (seed == null) seed = Math.floor(Math.random()*1e9);
    const traceActive = enCoursTop && traceTop;
    const premier = traceActive ? scenario.premier_serveur : seed % 2;
    let iTrace = 0, iBlanc = 0;
    const pointSuivant = (X, Rng, blanc) => {
      const i = blanc ? iBlanc++ : iTrace++;
      return M.point(X, traceActive ? (Number(traceTop[i]) === 0 ? 0 : 0.9999999) : Rng());
    };
    const vit = opts.vitesse || 1; accel = 1;
    const z = ms => dort(ms / (vit * accel));
    if (!opts.video || mon > 1 || enCoursTop) squelette();
    opts.onDebut && opts.onDebut();
    const pAff = preparer(seed, premier);
    jauges(p); tableau();
    son('vs', opts.video ? 450 : 0);
    if (opts.video){
      await Promise.race([(document.fonts && document.fonts.load ? document.fonts.load('40px Bungee') : Promise.resolve()), dort(3000)]);
      window.__pret = true;
      await z(Number(Q.get('attente') || 2600));
    } else await z(1300);
    if (!vivant()) return;
    $('.intro').classList.add('cache');
    await z(500);
    // Rythme calé sur une durée cible : le match est d'abord joué « à blanc » (même tirage) pour compter ses
    // points et ses moments forts ; vitesse et ralentis sont dosés en conséquence.
    const CIBLE = (opts.duree || 27) * 1000;
    const blanc = (() => { const Rb = rng(seed), X = M.etat(premier); let n = 0, ev = 0;
      while (!X.fini){ const e = enjeu(X); const a = {s: X.sets[0]+X.sets[1], j: X.jeux[0]+X.jeux[1], v: M.serveur(X), tb: X.tb};
        const h = pointSuivant(X, Rb, true); n++; if (e) ev += 930;
        if (!X.fini && X.sets[0]+X.sets[1] > a.s) ev += 1100; else if (!X.fini && X.jeux[0]+X.jeux[1] > a.j && !a.tb && h !== a.v) ev += 700;
        if (X.tb && !a.tb) ev += 950; }

    const fixe = 3100 + 5100;
    const f = Math.max(0.45, Math.min(1, 0.55 * (CIBLE - fixe) / Math.max(1, blanc.ev)));
    const base = Math.max(28, Math.min(64, (CIBLE - fixe - f * blanc.ev) / Math.max(1, blanc.n)));

    while (!S.fini){
      if (!vivant()) return;
      const e = enjeu(S);
      let ms = base;
      if (e && accel < 10){
        annonce([null, t('a_bb'), t('a_bs'), t('a_bm')][e.k], noms[e.h], 950 * f / (vit * accel), coul(e.h));
        $('.ralenti').classList.add('on'); son(e.k === 3 ? 'balle_match' : 'annonce');
        await z(600 * f); ms = 330 * f;
        if (!vivant()) return;
      }
      const avant = { sets: S.sets[0]+S.sets[1], jeux: S.jeux[0]+S.jeux[1], srv: M.serveur(S), tb: S.tb };
      const h = pointSuivant(S, R, false);
      frappe(h, Math.min(ms * 0.9 / (vit * accel), 380));
      serie = h === dernier ? serie + 1 : 1; dernier = h;
      if (serie >= 4 && serie % 2 === 0) son('combo');
      const cb = $('.combo'); if (serie >= 4){ cb.textContent = t('a_combo', serie); cb.style.color = coul(h); cb.classList.add('on'); } else cb.classList.remove('on');
      jauges(pAff()); tableau();
      await z(ms);
      if (!vivant()) return;
      $('.ralenti').classList.remove('on');
      if (S.fini) break;
      if (accel >= 10) continue;
      const sets = S.sets[0]+S.sets[1], jeux = S.jeux[0]+S.jeux[1];
      if (sets > avant.sets){ nset++; annonce(t('a_set', nset - 1), t('a_pour', noms[h]), 1150 * f / (vit * accel), coul(h)); son('set'); await z(1100 * f); }
      else if (jeux > avant.jeux && !avant.tb && h !== avant.srv){ annonce(t('a_break'), noms[h], 800 * f / (vit * accel), coul(h)); son('break'); await z(700 * f); }
      if (S.tb && !avant.tb){ annonce(t('a_tb'), '', 1000 * f / (vit * accel)); son('jeu_decisif'); await z(950 * f); }
    }
    if (!vivant()) return;
    const w = S.vainqueur, fav = p >= .5 ? 0 : 1;
    await z(500);
    const fin = document.createElement('div'); fin.className = 'ecran';
    fin.innerHTML = `<div class="fin-t">${esc(t('a_fin'))}</div>
      <div class="fin-w" style="color:${coul(w)};text-shadow:0 0 5cqw ${coul(w)}">${esc(t('a_gagne', noms[w]))}</div>
      <div class="fin-s">${esc(scoreTxt(S, w === 1))}</div>
      <div class="fin-p">${t('a_fin_p', esc(noms[fav]), Math.max(p,1-p)*100, nSim)}</div>
      ${enCoursTop && cible && cible[1] != null ? `<div class="fin-p">${t('a_fin_top', esc(cible[0]), cible[1]*100, nSim)}</div>` : ''}
      ${opts.video && Q.get('adresse') === '1' ? `<div class="fin-url">${esc(t('v_url'))}</div>` : ''}
      ${opts.video ? '' : `<button type="button" class="start">↻ ${esc(t('rejouer'))}</button>`}`;
    root.appendChild(fin); son('fin');
    const b = fin.querySelector('.start'); if (b) b.onclick = () => jouer();
    if (!MOINS_ANIM){
      const cols = ['#2EE6FF','#FF4FAE','#D4FF3A','#F4F1FF','#9B6BFF'], H = root.offsetHeight + 60;
      for (let i=0;i<(opts.video?70:36);i++){ const c = document.createElement('i'); c.className='confetti';
        c.style.cssText = `left:${(R()*100).toFixed(1)}%;background:${cols[i%cols.length]};--d:${(2.2+R()*1.6).toFixed(2)}s;--r:${(R()*0.8).toFixed(2)}s;--rot:${Math.round(R()*720-360)}deg;--h:${H}px`;
        root.appendChild(c); }

function courbeSvg(c){

  return `<svg class="curve" viewBox="0 0 ${w} ${h+32}" role="img" aria-label="${esc(t('courbe_aria'))}">${grid}${dates}

  const tab = (rows) => `<div class="cv-wrap"><table class="calib cv ds-t"><thead><tr><th></th><th>Elo</th><th>${esc(t('ds_sim'))}</th><th>${esc(t('ds_aff'))}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  const dir = X.en_direct || {}, ref = X.reference || {}, ordre = ['TOUS','ATP','WTA','CH'];
  const rd = ordre.filter(k=>dir[k] && dir[k].desaccords).map(k=>lig(k==='TOUS'?t('tous_circuits'):(CIRC[k]||k), dir[k], dir[k].matchs)).join('');
  const rr_ = ordre.filter(k=>ref[k]).map(k=>lig(k==='TOUS'?t('tous_circuits'):(CIRC[k]||k), ref[k], ref[k].matchs)).join('');
  const T_ = ref.TOUS;
  return `<h3 class="cv-h">${esc(t('ds_titre'))}</h3><p class="cv-p">${esc(t('ds_sous'))}</p>
    ${rd ? `<p class="cv-p"><b>${esc(t('ds_direct'))}</b></p>${tab(rd)}` : `<p class="cv-p">${esc(t('ds_vide'))}</p>`}
    ${rr_ ? `<p class="cv-p"><b>${esc(t('ds_ref'))}</b>${T_ ? ' — '+esc(t('ds_ref_txt', T_.part_pct, T_.accord_pct)) : ''}</p>${tab(rr_)}` : ''}`;
}
function rendQualite(){
  const q = D.qualite_donnees, el = document.getElementById('qualite-donnees');
  if (!q){ el.innerHTML = `<div class="empty">${esc(t('bilan_vide'))}</div>`; return; }
  const b = q.balles_effectives || {}, anomalies = Object.values(q.anomalies||{}).reduce((a,n)=>a+Number(n||0),0);
  // 29/10/2026 : en tête, les joueurs ACTIFS (feuille ATP, WTA ou Challenger ces 30 derniers jours) ; le total des profils
  // (surtout ITF, retraités, anciens de l'archive) passe en petit dessous.
  const A = q.actifs;
  const tete = A ? `<div class="qualite-grid">
    <div><b>${fmt(A.joueurs)}</b><span>${esc(t('qa_joueurs', A.jours))}</span></div>
    <div><b>${fmt(A.mediane)}</b><span>${esc(t('qa_mediane'))}</span></div>
    <div><b>${pc(A.pct_au_moins_500)}</b><span>${esc(t('qa_500'))}</span></div>
  </div><p class="cv-p">${esc(t('qa_total', q.profils, b.mediane, b.pct_au_moins_500))}</p>` : `<div class="qualite-grid">
    <div><b>${fmt(q.profils)}</b><span>${esc(t('qualite_profils'))}</span></div>
    <div><b>${b.mediane==null?'—':fmt(b.mediane)}</b><span>${esc(t('qualite_balles'))}</span></div>
    <div><b>${b.pct_au_moins_500==null?'—':pc(b.pct_au_moins_500)}</b><span>${esc(t('qualite_500'))}</span></div>
  </div>`;
  el.innerHTML = `${tete}${rendCouverture(q.pronostiques)}<p>${esc(t('qualite_source',q))}<br>${esc(t('qualite_anomalies',anomalies))}</p><p>${esc(t('qualite_limite'))}</p>`;
}
function rendCouverture(c){
  if (!c || !c.circuits) return '';
  const circ = Object.entries(c.circuits).sort((a,b)=>b[1].joueurs_matchs-a[1].joueurs_matchs).map(([k,v])=>
    `<tr><td>${esc(CIRC[k]||k)}<br><span class="cv-n">${esc(t('cv_n',v.joueurs_matchs))}</span></td><td>${fmt(v.mediane)}</td><td>${pc(v.pct_moins_500)}</td><td>${pc(v.pct_moins_1500)}</td></tr>`).join('');
  const tr = (c.tranches||[]).map((r,i)=>`<tr><td>${esc(t('cv_tranches')[i]||r.tranche)}<br><span class="cv-n">${esc(t('cv_m',r.n))}</span></td>
    <td>${r.n?`<b>${pc(r.vainqueurs_pct)}</b>`:'—'}</td><td>${r.n?pc(r.confiance_pct):'—'}</td><td>${r.n?dec(r.brier,3):'—'}</td></tr>`).join('');
  return `<h3 class="cv-h">${esc(t('cv_titre'))}</h3><p class="cv-p">${esc(t('cv_sous'))}</p>
  <div class="cv-wrap"><table class="calib cv"><thead><tr><th>${esc(t('cv_circuit'))}</th><th>${esc(t('cv_med'))}</th><th>&lt; 500</th><th>&lt; 1 500</th></tr></thead><tbody>${circ}</tbody></table></div>
  <h3 class="cv-h">${esc(t('cv_titre2'))}</h3><p class="cv-p">${esc(t('cv_sous2'))}</p>
  <div class="cv-wrap"><table class="calib cv"><thead><tr><th>${esc(t('cv_moins_doc'))}</th><th>${esc(t('cv_trouves'))}</th><th>${esc(t('cv_conf'))}</th><th>Brier</th></tr></thead><tbody>${tr}</tbody></table></div>`;
}
function tableCalib(c){
  return `<table class="calib"><thead><tr><th>${esc(t('tranche'))}</th><th>${esc(t('annonce'))}</th><th>${esc(t('reel'))}</th><th>${esc(t('matchs'))}</th></tr></thead><tbody>
  ${c.map(r=>`<tr><td>${Math.round(r.de*100)}–${Math.round(r.a*100)}${L==='fr'?' %':'%'}</td><td>${pc(r.prevu)}</td><td><b>${pc(r.reel)}</b></td><td>${fmt(r.n)}</td></tr>`).join('')}</tbody></table>`;
}
function rendCalib(){
  const B=D.bilan||{}, c=B.calibration||[], el=document.getElementById('calib');
  el.innerHTML = c.length >= 4 ? tableCalib(c) : `<div class="empty">${esc(t('calib_attente', (B.global||{}).n||0))}</div>`;
  const r=D.rejoue, er=document.getElementById('calib-rejoue'), sr=document.getElementById('rejoue-sous');
  if (r && r.global){ sr.textContent=t('rejoue_sous', r); er.innerHTML=tableCalib(r.calibration||[]); } else { sr.textContent=''; er.innerHTML=''; er.hidden=true; }
}
function ouvrirMatch(uid, aller=true){
  const m = D && D.matchs.find(x=>x.uid===uid && x.simulation);
  if (!m) return false;
  const jour = D.match_du_jour && D.match_du_jour.uid;
  selectionId = uid;
  try{
    const url = new URL(location.href);
    url.searchParams.delete('match');
    if (uid===jour) url.hash = ''; else url.hash = 'match='+encodeURIComponent(uid);
    history.replaceState(null,'',url);
  }catch(e){}
  // L'URL est déjà à jour : rendMdj relit le fragment et ne peut pas afficher l'ancien match.
  rendMdj(); rendListe();
  if (aller) document.getElementById('mdj').scrollIntoView({block:'start',behavior:MOINS_ANIM?'auto':'smooth'});
  return true;
}
function rendTout(){
  rendTextes(); if (!D) return;
  rendMdj(); rendListe(); rendBilan(); rendFiabStats(); rendJournal(); rendSuivi(); rendQualite(); rendCalib();
  document.getElementById('maj').textContent = t('maj', D.pronostics_du || D.genere_le);
}
document.querySelectorAll('.seg button[data-lang]').forEach(b=>b.addEventListener('click',()=>{
  L=b.dataset.lang; try{ localStorage.setItem('te_lang',L); }catch(e){} rendTout(); }));
document.getElementById('b-son').addEventListener('click', () => { Bruit.basculer(); boutonSon(); });
document.getElementById('list').addEventListener('click', e=>{
  const a = e.target.closest('a[data-uid]');
  if (!a || e.button!==0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
  if (ouvrirMatch(a.dataset.uid)) e.preventDefault();
});
document.getElementById('liste-more').addEventListener('click',()=>{ nListe+=30; rendListe(); });
document.getElementById('retour-mdj').addEventListener('click',()=>{
  const id = D && D.match_du_jour && D.match_du_jour.uid; if (id) ouvrirMatch(id);
});
document.getElementById('recherche').addEventListener('input',e=>{
  recherche=e.target.value; nListe=30; rendListe();
});
document.querySelectorAll('.fs-circ button').forEach(b=>b.addEventListener('click',()=>{ circFs=b.dataset.fc; rendFiabStats(); }));
document.querySelectorAll('.bilan-circ button').forEach(b=>b.addEventListener('click',()=>{
  circBilan=b.dataset.bc; nRes=12; rendBilan();
}));
document.querySelectorAll('.circuits button').forEach(b=>b.addEventListener('click',()=>{
  circuit=b.dataset.circuit; nListe=30; rendTextes(); rendListe();
}));
window.addEventListener('hashchange',()=>{
  if (!D || Q.get('carte') || Q.get('video')) return;
  selectionId = matchDemande() || (D.match_du_jour && D.match_du_jour.uid);
  rendMdj(); rendListe();
});

/* ───────────── mode vidéo (?video=1) : la borne seule, plein écran ─────────────
   La bande-son est faite après coup (scripts/sons.py) : chaque événement est noté ici avec son heure. */
function modeVideo(){
  document.body.classList.add('video');
  const id = Q.get('uid') || (D.match_du_jour && D.match_du_jour.uid);
  const m = D.matchs.find(x=>x.uid===id && x.simulation);
  const V = document.getElementById('video');
  if (!m){ V.innerHTML = '<p style="padding:10vw;color:#fff">—</p>'; window.__fini = true; return; }
  window.__sons = [];
  const son = (type, delai) => window.__sons.push({ t: Date.now() + (delai || 0), type });
  // sans « seed » : le scénario représentatif réellement tiré ; avec : le tirage demandé
  const sd = Q.get('seed') ? Number(Q.get('seed')) : null;
  const a = Arcade(V, m, { video: true, seed: sd, vitesse: Number(Q.get('vitesse') || 1),
                           duree: Number(Q.get('duree') || 27), son });
  a.jouer(sd);
}

/* ───────────── carte de stats (?carte=1) : image 1080×1350 pour X, capturée par scripts/video_simulation.py ───────────── */
function modeCarte(){
  document.body.classList.add('carte');
  const id = Q.get('uid') || (D.match_du_jour && D.match_du_jour.uid);
  const m = D.matchs.find(x=>x.uid===id && x.sets);
  const V = document.getElementById('video');
  if (!m){ V.innerHTML = '<p style="padding:60px;color:#fff">—</p>'; window.__fini = true; return; }
  const p = m.p_home, n1 = court(m.home), n2 = court(m.away);
  const quand = utc(m.debut).toLocaleString(loc(), {weekday:'long', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit', timeZone:'Europe/Paris'});
  const sets = Object.entries(m.sets || {}).map(([k,v])=>{ const [h,a]=k.split('-').map(Number);
    return `<div class="l ${a>h?'x':''}"><span>${esc(k)}</span><span class="t"><i style="width:${(v*100).toFixed(1)}%"></i></span><span class="v">${pc0(v)}</span></div>`; }).join('');
  const scores = (m.scores_probables||[]).slice(0,3).map(([sc,v])=>`<div class="sc"><b>${esc(sc)}</b><span>${dec(v*100,1)}${L==='fr'?'\u202f%':'%'}</span></div>`).join('');
  const f = m.feuille_prevue;
  const lignes = f ? [['aces','aces'],['doubles_fautes','df'],['breaks','breaks'],['premiere_pct','prem'],['jeux_service_gagnes_pct','jsg']]
     .filter(([k])=>f[0]&&f[0][k]!=null).map(([k,lib])=>`<tr><th>${esc(t(lib))}</th><td>${dec(f[0][k],1)}</td><td>${dec(f[1][k],1)}</td></tr>`).join('') : '';
  V.innerHTML = `<div class="ca">
    <div class="haut"><span>${esc(t('c_titre'))}</span><span><b>${esc(t('a_sim'))}</b> ${esc(t('a_fois', D.simulations))}</span></div>
    <h1 style="font-size:${(n1+n2).length > 30 ? 38 : (n1+n2).length > 20 ? 46 : 56}px">${esc(n1)} – ${esc(n2)}</h1>
    <p class="ctx">${esc(m.tournoi)} · ${esc(SURF[L][m.surface]||m.surface||'')} · ${esc(quand)}</p>
    <div class="duel"><div class="pj a"><div class="n">${esc(m.home)}</div><div class="p">${pc0(p)}</div><div class="c">${esc(t('c_victoire'))}</div></div>
      <div class="pj b"><div class="n">${esc(m.away)}</div><div class="p">${pc0(1-p)}</div><div class="c">${esc(t('c_victoire'))}</div></div></div>
    <div class="tir"><i style="width:${(p*100).toFixed(1)}%"></i></div>
    <div class="blocs"><div class="bloc"><h2>${esc(t('c_sets'))}</h2>${sets}</div><div class="bloc"><h2>${esc(t('c_scores'))}</h2>${scores}</div></div>
    ${lignes ? `<div class="bloc" style="margin-top:20px"><h2>${esc(t('c_feuille'))}</h2><table><thead><tr><th></th><th class="a">${esc(n1)}</th><th class="b">${esc(n2)}</th></tr></thead><tbody>${lignes}</tbody></table></div>` : ''}
    <div class="pied">${t('c_pied', D.simulations)}</div></div>`;
  Promise.race([(document.fonts && document.fonts.ready) || Promise.resolve(), dort(3000)]).then(()=>{ window.__fini = true; });
}

rendTextes();
fetch('donnees.json?v=' + Date.now()).then(r=>r.json()).then(d=>{
  D = d;
  selectionId = matchDemande() || (D.match_du_jour && D.match_du_jour.uid);
  if (Q.get('carte')) modeCarte(); else if (Q.get('video')) modeVideo(); else rendTout();
}).catch(()=>{ document.getElementById('mdj-zone').innerHTML = '<div class="panel empty">Données indisponibles / Data unavailable.</div>'; });
})();
</script>
</body>
</html>
