<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tennis Edge — l'algo</title>
<meta name="description" content="Chaque match de tennis simulé 5 000 fois par un algorithme indépendant du marché : % de victoire, cote juste, et un bilan public, pertes comprises.">
<meta property="og:title" content="Tennis Edge — l'algo">
<meta property="og:description" content="Chaque match simulé 5 000 fois. % de victoire, cote juste, bilan public.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F1; --panel:#FFFFFF; --ink:#13211B; --muted:#5A6A62; --rule:#D7DED9;
  --court:#1C5C42; --court-ink:#FFFFFF; --court-line:rgba(255,255,255,.55);
  --home:#1C5C42; --away:#2F56A6; --ok:#1F7A4C; --ko:#B3261E; --ball:#E9E35B;
  --radius-lg:14px; --radius-sm:6px;
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1612; --panel:#14201A; --ink:#E4ECE7; --muted:#93A69C; --rule:#26352D;
    --court:#1F6B4C; --court-ink:#F4FAF6; --court-line:rgba(255,255,255,.4);
    --home:#46B184; --away:#7E9CEB; --ok:#4DBE84; --ko:#F0706A;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1612; --panel:#14201A; --ink:#E4ECE7; --muted:#93A69C; --rule:#26352D;
  --court:#1F6B4C; --court-ink:#F4FAF6; --court-line:rgba(255,255,255,.4);
  --home:#46B184; --away:#7E9CEB; --ok:#4DBE84; --ko:#F0706A;
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.num,.cond{font-family:var(--cond);font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--away);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 8px}
.mark{font-family:var(--cond);font-weight:700;font-size:1.45rem;letter-spacing:.01em;margin:0}
.mark span{color:var(--muted);font-weight:500}
.lang{display:flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;padding:5px 12px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lede{font-size:1.06rem;color:var(--muted);max-width:60ch;margin:4px 0 22px}

/* match du jour : le court */
.court{background:var(--court);color:var(--court-ink);border-radius:var(--radius-lg);padding:20px 18px 18px;position:relative;overflow:hidden}
.court::before{content:"";position:absolute;inset:10px;border:2px solid var(--court-line);border-radius:4px;pointer-events:none}
.court > *{position:relative;z-index:1}
.court .ctx{font-size:.9rem;opacity:.85;margin:0 0 10px}
.duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px}
.duel .who{font-family:var(--cond);font-weight:600;font-size:1.35rem;line-height:1.1}
.duel .who.r{text-align:right}
.duel .pct{font-family:var(--cond);font-weight:700;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.duel .vs{opacity:.6;font-size:.85rem;padding-bottom:8px}
.fair{display:flex;justify-content:space-between;font-size:.92rem;opacity:.9;margin-top:4px}
.split{height:10px;border-radius:999px;background:rgba(255,255,255,.22);overflow:hidden;margin:12px 0 4px;display:flex}
.split i{display:block;height:100%;background:var(--ball)}
.court .note{font-size:.85rem;opacity:.8;margin:10px 0 0}

/* tableau de score simulé */
.sim{margin-top:16px;background:color-mix(in srgb,var(--court) 55%,#000);border-radius:10px;padding:12px}
.board{width:100%;border-collapse:collapse;font-family:var(--cond);font-variant-numeric:tabular-nums}
.board td{padding:4px 6px;font-size:1.25rem;font-weight:600}
.board td.name{width:100%;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0}
.board td.set{color:rgba(255,255,255,.75);text-align:center;min-width:1.6em}
.board td.games{text-align:center;min-width:1.6em}
.board td.pts{text-align:center;min-width:2.4em;background:var(--ball);color:#13211B;border-radius:5px}
.srv{display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--ball);margin-right:6px;visibility:hidden;vertical-align:middle}
.srv.on{visibility:visible}
.liveline{display:flex;justify-content:space-between;font-size:.85rem;opacity:.85;margin:10px 2px 2px}
svg.momentum{width:100%;height:84px;display:block}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--court-line);background:rgba(255,255,255,.08);color:var(--court-ink);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.92rem}
.btn.primary{background:var(--ball);border-color:var(--ball);color:#13211B}
.final{font-size:.95rem;margin:10px 2px 0;min-height:1.5em}

/* sections */
section{margin:34px 0}
h2{font-family:var(--cond);font-weight:700;font-size:1.6rem;margin:0 0 4px;line-height:1.15}
.sub{color:var(--muted);margin:0 0 14px;max-width:62ch}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius-lg)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0}
.facts > div{padding:14px 16px;border-top:1px solid var(--rule)}
.facts > div:first-child{border-top:0}
@media (min-width:560px){.facts > div{border-top:0;border-left:1px solid var(--rule)}.facts > div:first-child{border-left:0}}
.facts .k{color:var(--muted);font-size:.88rem}
.facts .v{font-family:var(--cond);font-weight:700;font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1.1}
.bars{padding:12px 16px}
.bar{display:grid;grid-template-columns:3.2em 1fr 3.4em;align-items:center;gap:10px;margin:6px 0;font-variant-numeric:tabular-nums}
.bar .t{height:8px;background:var(--rule);border-radius:999px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--home)}
.bar.away .t i{background:var(--away)}
.mdj-detail{display:grid;gap:12px;margin-top:12px}
@media (min-width:640px){.mdj-detail{grid-template-columns:1fr 1fr}}
.mdj-detail h3{font-size:1rem;margin:12px 16px 0;font-weight:600}
table.sheet{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.sheet td,table.sheet th{padding:7px 16px;border-top:1px solid var(--rule);text-align:right}
table.sheet th{font-weight:500;color:var(--muted);text-align:left}
table.sheet thead th{border-top:0;font-size:.9rem;text-align:right}
table.sheet thead th:first-child{text-align:left}

/* liste des matchs */
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:3.4em 1fr;gap:4px 12px;padding:12px 16px;border-top:1px solid var(--rule)}
.list li:first-child{border-top:0}
.list .time{font-family:var(--cond);font-weight:600;font-size:1.05rem;color:var(--muted);padding-top:2px}
.list .tour{font-size:.85rem;color:var(--muted)}
.list .pl{display:flex;justify-content:space-between;gap:10px;font-weight:500}
.list .pl b{font-family:var(--cond);font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.list .mini{height:6px;border-radius:999px;background:var(--away);overflow:hidden;margin:6px 0 2px;display:flex}
.list .mini i{display:block;height:100%;background:var(--home)}
.list .meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.lock{font-size:.82rem;color:var(--muted)}
.list li.star{background:color-mix(in srgb,var(--court) 7%,transparent)}

/* bilan */
svg.curve{width:100%;height:auto;display:block}
.res{list-style:none;margin:0;padding:0}
.res li{display:grid;grid-template-columns:1.6em 1fr auto;gap:10px;padding:9px 16px;border-top:1px solid var(--rule);align-items:center;font-size:.95rem}
.res li:first-child{border-top:0}
.res .mark-ok{color:var(--ok);font-weight:700}
.res .mark-ko{color:var(--ko);font-weight:700}
.res .d{color:var(--muted);font-size:.85rem}
.res .sc{white-space:nowrap}
.res .p{font-variant-numeric:tabular-nums;text-align:right}
.more{display:block;margin:0;padding:10px 16px;border:0;border-top:1px solid var(--rule);background:none;width:100%;text-align:left;cursor:pointer;color:var(--muted);font-weight:600}
.calib{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.calib th,.calib td{padding:8px 12px;white-space:nowrap;border-top:1px solid var(--rule);text-align:right}
.calib th:first-child,.calib td:first-child{text-align:left}
.calib thead th{border-top:0;color:var(--muted);font-weight:500;font-size:.9rem}
.plus{padding:18px 16px}
.plus ul{margin:8px 0 0;padding-left:1.1em}
.plus .soon{display:inline-block;font-weight:600;color:var(--court);margin-top:10px}
footer{color:var(--muted);font-size:.85rem;padding:20px 0 40px;border-top:1px solid var(--rule);margin-top:40px}
.empty{padding:16px;color:var(--muted)}

/* mode vidéo (format vertical 9:16, enregistré pour X) */
/* ── mode vidéo « arcade » (24/10/2026) : format vertical 9:16 pour X, rendu par scripts/video_simulation.py ── */
body.video{--ar-bg:#0E0A24;--ar-bg2:#1B1146;--ar-p1:#2EE6FF;--ar-p2:#FF3EA5;--ar-ball:#D4FF3A;--ar-ink:#F4F1FF;--ar-dim:#9C93C8;
  --ar-disp:"Bungee","Russo One","Arial Black",Impact,sans-serif;background:var(--ar-bg);overflow:hidden;margin:0}
body.video .page{display:none}
#video{display:none}
body.video #video{display:block;position:relative;width:100vw;height:100vh;overflow:hidden;color:var(--ar-ink);font-family:var(--cond);
  background:radial-gradient(120vw 80vw at 50% 0%,#3A1F8F 0%,transparent 60%),radial-gradient(90vw 70vw at 50% 105%,#0F5C66 0%,transparent 60%),var(--ar-bg)}
#video .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:6vw 6vw;mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 70%,transparent)}
#video .scene{position:absolute;inset:0;display:flex;flex-direction:column;padding:7vw 6vw 6vw}
#video .tag{display:flex;justify-content:space-between;align-items:center;font-size:3.6vw;letter-spacing:.04em;color:var(--ar-dim);font-weight:600}
#video .tag b{color:var(--ar-ball);font-family:var(--ar-disp);font-weight:400;letter-spacing:.02em}
#video .live{display:inline-flex;align-items:center;gap:1.6vw;padding:1vw 2.4vw;border-radius:99vw;background:rgba(255,62,165,.16);color:#FF8CC8;font-family:var(--ar-disp);font-size:3vw}
#video .live i{width:1.8vw;height:1.8vw;border-radius:50%;background:var(--ar-p2);box-shadow:0 0 2vw var(--ar-p2);animation:clign 1s steps(2) infinite}
@keyframes clign{50%{opacity:.2}}
/* fiches joueurs + barres de vie (probabilité de gagner, en direct) */
#video .duel{display:grid;grid-template-columns:1fr 1fr;gap:3vw;margin-top:5vw}
#video .pj{padding:3vw;border-radius:3vw;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:.4vw solid rgba(255,255,255,.12);transition:box-shadow .15s,border-color .15s}
#video .pj.p1{--c:var(--ar-p1)} #video .pj.p2{--c:var(--ar-p2);text-align:right}
#video .pj .nom{font-family:var(--ar-disp);font-size:5.6vw;line-height:1.05;color:var(--c);text-shadow:0 0 3vw color-mix(in srgb,var(--c) 60%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#video .pj .pct{font-family:var(--ar-disp);font-size:11vw;line-height:1;margin-top:1.5vw;font-variant-numeric:tabular-nums}
#video .pj .lbl{font-size:3vw;color:var(--ar-dim);font-weight:600;letter-spacing:.03em}
#video .vie{height:3.2vw;border-radius:2vw;background:rgba(255,255,255,.1);margin-top:2vw;overflow:hidden;position:relative}
#video .vie i{position:absolute;top:0;bottom:0;background:var(--c);box-shadow:0 0 3vw var(--c);transition:width .25s ease-out}
#video .p1 .vie i{left:0} #video .p2 .vie i{right:0}
#video .pj.flash{border-color:var(--c);box-shadow:0 0 6vw color-mix(in srgb,var(--c) 70%,transparent)}
#video .secoue{animation:secoue .35s}
@keyframes secoue{20%{transform:translate(-1.2vw,.6vw)}40%{transform:translate(1.2vw,-.6vw)}60%{transform:translate(-.8vw,.4vw)}80%{transform:translate(.6vw,0)}}
/* tableau de score */
#video .score{margin-top:4vw;border-radius:3vw;background:rgba(5,3,20,.65);border:.4vw solid rgba(255,255,255,.12);padding:2vw 3vw}
#video .score table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
#video .score td{font-family:var(--ar-disp);font-size:6.4vw;padding:.8vw 1.4vw;text-align:center}
#video .score td.n{text-align:left;font-size:5.4vw;width:100%;white-space:nowrap}
#video .score tr.r1 td.n{color:var(--ar-p1)} #video .score tr.r2 td.n{color:var(--ar-p2)}
#video .score td.s{color:var(--ar-dim)}
#video .score td.pt{min-width:2.6em;background:var(--ar-ball);color:#160E33;border-radius:1.4vw}
#video .score .srv{display:inline-block;width:2.2vw;height:2.2vw;border-radius:50%;background:var(--ar-ball);box-shadow:0 0 2vw var(--ar-ball);margin-right:2vw;vertical-align:middle;visibility:hidden}
#video .score .srv.on{visibility:visible}
/* court vu de haut, en perspective, avec la balle */
#video .arene{flex:1;display:flex;align-items:center;justify-content:center;perspective:140vw;margin-top:2vw;min-height:0}
#video .court{position:relative;width:62vw;height:92vw;transform:rotateX(38deg);background:linear-gradient(#1D6B8C,#15506A);border:.7vw solid #E9F6FF;border-radius:.6vw;box-shadow:0 4vw 10vw rgba(0,0,0,.55),0 0 6vw rgba(46,230,255,.25)}
#video .court::before{content:"";position:absolute;left:12%;right:12%;top:0;bottom:0;border-left:.4vw solid rgba(233,246,255,.8);border-right:.4vw solid rgba(233,246,255,.8)}
#video .court::after{content:"";position:absolute;left:12%;right:12%;top:25%;bottom:25%;border-top:.4vw solid rgba(233,246,255,.8);border-bottom:.4vw solid rgba(233,246,255,.8);background:linear-gradient(90deg,transparent calc(50% - .2vw),rgba(233,246,255,.8) calc(50% - .2vw),rgba(233,246,255,.8) calc(50% + .2vw),transparent calc(50% + .2vw))}
#video .filet{position:absolute;left:-3vw;right:-3vw;top:calc(50% - .5vw);height:1vw;background:#F4F1FF;box-shadow:0 1vw 2vw rgba(0,0,0,.4);z-index:2}
#video .balle{position:absolute;width:4.4vw;height:4.4vw;margin:-2.2vw 0 0 -2.2vw;border-radius:50%;background:radial-gradient(circle at 35% 35%,#F6FFB0,var(--ar-ball) 55%,#9DBF10);box-shadow:0 0 4vw var(--ar-ball),0 0 9vw rgba(212,255,58,.5);z-index:3;left:50%;top:80%}
#video .court .cote{position:absolute;left:0;right:0;height:50%;transition:background .2s}
#video .court .cote.haut{top:0} #video .court .cote.bas{bottom:0}
#video .court .cote.eclat-p1{background:rgba(46,230,255,.35)} #video .court .cote.eclat-p2{background:rgba(255,62,165,.35)}
/* annonces (BREAK !, BALLE DE MATCH…) */
#video .annonce{position:absolute;left:4vw;right:4vw;top:63%;transform-origin:50% 50%;text-align:center;font-family:var(--ar-disp);font-size:13vw;line-height:1;pointer-events:none;z-index:10;opacity:0;
  color:var(--ar-ball);-webkit-text-stroke:.25vw #160E33;paint-order:stroke fill;text-shadow:0 1vw 0 #160E33,0 0 6vw currentColor}
#video .annonce small{display:block;font-size:5.4vw;margin-top:2vw;-webkit-text-stroke:0;text-shadow:0 .6vw 0 #160E33;color:var(--ar-ink)}
#video .annonce.pop{animation:pop var(--duree,900ms) cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-8deg)}18%{opacity:1;transform:scale(1.12) rotate(2deg)}30%{transform:scale(1) rotate(-1deg)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
#video .combo{position:absolute;right:6vw;bottom:15vw;font-family:var(--ar-disp);font-size:6vw;color:var(--ar-ball);opacity:0;transition:opacity .2s;text-shadow:0 0 3vw var(--ar-ball)}
#video .combo.on{opacity:1}
#video .ralenti{position:absolute;left:6vw;bottom:15vw;font-family:var(--ar-disp);font-size:4vw;color:#FF8CC8;opacity:0;transition:opacity .2s}
#video .ralenti.on{opacity:1;animation:clign .5s steps(2) infinite}
#video .pied{font-size:3.4vw;color:var(--ar-dim);text-align:center;font-weight:600;margin-top:2vw}
/* écran d'intro VS et écran de fin */
#video .ecran{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vw;background:rgba(14,10,36,.92);text-align:center;padding:8vw}
#video .ecran.cache{opacity:0;transition:opacity .4s;pointer-events:none}
#video .vs-n{font-family:var(--ar-disp);font-size:9vw;line-height:1.05}
#video .vs-n.a{color:var(--ar-p1);text-shadow:0 0 5vw var(--ar-p1);animation:gauche .5s cubic-bezier(.2,1.3,.4,1) both}
#video .vs-n.b{color:var(--ar-p2);text-shadow:0 0 5vw var(--ar-p2);animation:droite .5s .15s cubic-bezier(.2,1.3,.4,1) both}
#video .vs-x{font-family:var(--ar-disp);font-size:20vw;color:var(--ar-ball);-webkit-text-stroke:.6vw #160E33;text-shadow:0 1.2vw 0 #160E33,0 0 8vw var(--ar-ball);animation:slam .45s .45s cubic-bezier(.2,1.6,.4,1) both}
#video .vs-t{font-size:4.6vw;color:var(--ar-dim);font-weight:600;animation:fondu .4s .8s both}
#video .vs-t b{color:var(--ar-ball);font-family:var(--ar-disp);font-weight:400}
@keyframes gauche{from{transform:translateX(-120vw)}} @keyframes droite{from{transform:translateX(120vw)}}
@keyframes slam{from{transform:scale(4);opacity:0}} @keyframes fondu{from{opacity:0;transform:translateY(3vw)}}
#video .fin-t{font-family:var(--ar-disp);font-size:12vw;line-height:1;color:var(--ar-ball);-webkit-text-stroke:.5vw #160E33;text-shadow:0 1vw 0 #160E33,0 0 6vw var(--ar-ball);animation:slam .5s cubic-bezier(.2,1.6,.4,1) both}
#video .fin-w{font-family:var(--ar-disp);font-size:8vw;animation:fondu .4s .35s both}
#video .fin-s{font-family:var(--ar-disp);font-size:7vw;color:var(--ar-ink);animation:fondu .4s .5s both;font-variant-numeric:tabular-nums}
#video .fin-p{font-size:5vw;font-weight:600;color:var(--ar-dim);animation:fondu .4s .9s both;max-width:22ch;line-height:1.25}
#video .fin-p b{color:var(--ar-ink);font-family:var(--ar-disp);font-weight:400}
#video .fin-url{font-size:4vw;color:var(--ar-dim);margin-top:3vw}
#video .confetti{position:absolute;top:-4vw;width:2vw;height:3.4vw;border-radius:.4vw;z-index:21;animation:tombe var(--d) linear var(--r) forwards}
@keyframes tombe{to{transform:translateY(110vh) rotate(var(--rot))}}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="page">
<div class="wrap">
  <header class="top">
    <p class="mark">Tennis Edge <span data-t="marque"></span></p>
    <div class="lang" role="group" aria-label="Langue / Language">
      <button type="button" data-lang="fr" aria-pressed="true">FR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>
  <p class="lede" data-t="lede"></p>

  <section id="mdj" aria-labelledby="mdj-h" style="margin-top:0">
    <h2 id="mdj-h" data-t="mdj_titre"></h2>
    <p class="sub" data-t="mdj_sous"></p>
    <div id="mdj-court"></div>
    <div class="mdj-detail" id="mdj-detail"></div>
  </section>

if (!T[L]) L = 'fr';
const t = (k, ...a) => { const v = T[L][k]; return typeof v === 'function' ? v(...a) : v; };
const loc = () => L === 'fr' ? 'fr-FR' : 'en-GB';
function fmt(n){ return Number(n).toLocaleString(loc()); }
function dec(x,d){ return Number(x).toLocaleString(loc(),{minimumFractionDigits:d,maximumFractionDigits:d}); }
function pc(x){ return L==='fr' ? dec(x,1)+'\u202f%' : dec(x,1)+'%'; }
function pc0(p){ return L==='fr' ? Math.round(p*100)+'\u202f%' : Math.round(p*100)+'%'; }
function odds(c){ return c ? dec(c,2) : '—'; }
const utc = s => new Date(/Z|[+-]\d\d:?\d\d$/.test(s) ? s : s + 'Z');
function dateLong(s){ return new Date(s+'T12:00:00Z').toLocaleDateString(loc(),{day:'numeric',month:'long',year:'numeric'}); }
function dateHeure(s){ return utc(s).toLocaleString(loc(),{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
function heure(s){ return utc(s).toLocaleTimeString(loc(),{hour:'2-digit',minute:'2-digit'}); }
function jourCourt(s){ return utc(s).toLocaleDateString(loc(),{weekday:'short',day:'numeric'}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function court(n){ const p = String(n).trim().split(/\s+/); return p.length>1 ? p.slice(1).join(' ') : n; }
const CIRC = {ATP:'ATP', WTA:'WTA', CH:'Challenger'};
const SURF = {fr:{Hard:'dur',Clay:'terre battue',Grass:'gazon',Carpet:'moquette'}, en:{Hard:'hard',Clay:'clay',Grass:'grass',Carpet:'carpet'}};

/* ───────────── moteur de simulation (points) ───────────── */
function rng(seed){ let a = seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function Moteur(sim){
  const A = sim.a, B = sim.b, N = sim.sets_gagnants, TBF = sim.tb_final || 7;
  const pServ = s => s===0 ? A : 1-B;          // P(home gagne le point) selon le serveur
  const memo = new Map();
  function pGame(p,a,b){                        // P(serveur gagne le jeu) depuis a-b points
    if (a>=4 && a-b>=2) return 1; if (b>=4 && b-a>=2) return 0;
    if (a>=3 && b>=3){ const d = p*p/(p*p+(1-p)*(1-p)); return a===b ? d : (a>b ? p+(1-p)*d : p*d); }
    return p*pGame(p,a+1,b)+(1-p)*pGame(p,a,b+1);
  }
  const tbServ = (k,s0) => k===0 ? s0 : ((((k-1)>>1)%2)===0 ? 1-s0 : s0);
  function pTB(i,j,s0,cible){                    // P(home gagne le jeu décisif) depuis i-j
    if (i>=cible && i-j>=2) return 1; if (j>=cible && j-i>=2) return 0;
    if (i===j && i>=cible-1){ const k=i+j, p1=pServ(tbServ(k,s0)), p2=pServ(tbServ(k+1,s0)); const w=p1*p2, l=(1-p1)*(1-p2); return w/(w+l); }
    const key='t'+i+','+j+','+s0+','+cible; if (memo.has(key)) return memo.get(key);
    const p=pServ(tbServ(i+j,s0)); const v=p*pTB(i+1,j,s0,cible)+(1-p)*pTB(i,j+1,s0,cible); memo.set(key,v); return v;
  }
  // distribution de fin de set : [home gagne & sert ensuite 0, home gagne & 1, away gagne & 0, away gagne & 1]
  function setDist(gh,ga,srv,fin){
    if ((gh>=6 && gh-ga>=2) || gh===7) return [srv===0?1:0, srv===1?1:0, 0,0];
    if ((ga>=6 && ga-gh>=2) || ga===7) return [0,0, srv===0?1:0, srv===1?1:0];
    const key='s'+gh+','+ga+','+srv+','+fin; if (memo.has(key)) return memo.get(key);
    let v;
    if (gh===6 && ga===6){ const p=pTB(0,0,srv,fin?TBF:7); v = srv===0 ? [0,p,0,1-p] : [p,0,1-p,0]; }
    else { const pg = srv===0 ? pGame(A,0,0) : 1-pGame(B,0,0);
      const x=setDist(gh+1,ga,1-srv,fin), y=setDist(gh,ga+1,1-srv,fin); v=x.map((e,i)=>pg*e+(1-pg)*y[i]); }
    memo.set(key,v); return v;
  }
  function pMatch(sh,sa,srv){
    if (sh>=N) return 1; if (sa>=N) return 0;
    const key='m'+sh+','+sa+','+srv; if (memo.has(key)) return memo.get(key);
    const d=setDist(0,0,srv,sh===N-1&&sa===N-1);
    const v=d[0]*pMatch(sh+1,sa,0)+d[1]*pMatch(sh+1,sa,1)+d[2]*pMatch(sh,sa+1,0)+d[3]*pMatch(sh,sa+1,1);
    memo.set(key,v); return v;
  }
  function pLive(S){                             // P(home gagne le match) depuis l'état S
    if (S.fini) return S.vainqueur===0 ? 1 : 0;
    const sh=S.sets[0], sa=S.sets[1], fin = sh===N-1 && sa===N-1, gh=S.jeux[0], ga=S.jeux[1];
    let d;
    if (S.tb){ const p=pTB(S.pts[0],S.pts[1],S.tbS0,S.tbCible); const nx=1-S.tbS0; d = nx===0 ? [p,0,1-p,0] : [0,p,0,1-p]; }
    else {
      const ps = S.srv===0 ? pGame(A,S.pts[0],S.pts[1]) : 1-pGame(B,S.pts[1],S.pts[0]);
      const x=setDist(gh+1,ga,1-S.srv,fin), y=setDist(gh,ga+1,1-S.srv,fin); d=x.map((e,i)=>ps*e+(1-ps)*y[i]);
    }
    return d[0]*pMatch(sh+1,sa,0)+d[1]*pMatch(sh+1,sa,1)+d[2]*pMatch(sh,sa+1,0)+d[3]*pMatch(sh,sa+1,1);
  }
  function etat(premier){ return {sets:[0,0], jeux:[0,0], pts:[0,0], srv:premier, tb:false, tbS0:0, tbCible:7, histo:[], fini:false, vainqueur:null}; }
  function point(S, r){                          // joue un point ; r ∈ [0,1)
    const serveur = S.tb ? tbServ(S.pts[0]+S.pts[1], S.tbS0) : S.srv;
    const h = r < pServ(serveur) ? 0 : 1;
    S.pts[h]++;
    const [a,b]=S.pts;
    if (S.tb){
      if ((a>=S.tbCible || b>=S.tbCible) && Math.abs(a-b)>=2){ S.jeux[h]++; finSet(S,h); S.srv = 1-S.tbS0; }
      return h;
    }
    if ((a>=4 || b>=4) && Math.abs(a-b)>=2){
      S.jeux[h]++; S.pts=[0,0]; S.srv=1-S.srv;
      const [gh,ga]=S.jeux, fin = S.sets[0]===N-1 && S.sets[1]===N-1;
      if ((gh>=6||ga>=6) && Math.abs(gh-ga)>=2) finSet(S, gh>ga?0:1);
      else if (gh===6 && ga===6){ S.tb=true; S.tbS0=S.srv; S.tbCible = fin ? TBF : 7; }
    }
    return h;
  }
  function finSet(S,h){ S.histo.push([...S.jeux]); S.sets[h]++; S.jeux=[0,0]; S.pts=[0,0]; S.tb=false;
    if (S.sets[h]>=N){ S.fini=true; S.vainqueur=h; } }
  const serveur = S => S.tb ? tbServ(S.pts[0]+S.pts[1], S.tbS0) : S.srv;
  return {etat, point, pLive, serveur};
}
const logit = p => Math.log(p/(1-p)), sig = z => 1/(1+Math.exp(-z));
const PTS = ['0','15','30','40'];
function affPts(S,i){
  if (S.fini) return '';
  if (S.tb) return String(S.pts[i]);
  const [a,b]=S.pts;
  if (a>=3 && b>=3){ if (a===b) return '40'; return (i===0)===(a>b) ? 'AD' : '40'; }
  return PTS[S.pts[i]];
}

/* Lecteur : anime une simulation dans un conteneur donné. */
/* Les probabilités au service (a, b) sont décalées d'un même δ (a + δ, b − δ) pour que le match simulé
   donne exactement le % publié : la simulation rejouée raconte la même histoire que le pronostic. */
function calibre(sim, p){
  const f = d => Moteur({...sim, a: sim.a + d, b: sim.b - d}).pLive(Moteur(sim).etat(0)) - p;
  let lo = -0.2, hi = 0.2;
  if (f(lo) > 0 || f(hi) < 0) return sim;
  for (let k=0;k<40;k++){ const mid=(lo+hi)/2; if (f(mid) < 0) lo = mid; else hi = mid; }
  const d=(lo+hi)/2; return {...sim, a: sim.a + d, b: sim.b - d};
}
function Lecteur(root, m, opts){
  const sim = calibre(m.simulation, m.p_home), M = Moteur(sim);
  let seed = opts.seed != null ? opts.seed : Math.floor(Math.random()*1e9);
  let S, R, serie, timer = null, vitesse = opts.vitesse || 1, decal = 0;
  const premier = (seed % 2);
  root.innerHTML = `
    <table class="board" aria-live="off"><tbody>
      <tr data-j="0"><td class="name"><span class="srv"></span>${esc(opts.court ? court(m.home) : m.home)}</td></tr>
      <tr data-j="1"><td class="name"><span class="srv"></span>${esc(opts.court ? court(m.away) : m.away)}</td></tr>
    </tbody></table>
    <div class="liveline"><span>${esc(t('proba_direct'))}</span><span class="lp"></span></div>
    <svg class="momentum" viewBox="0 0 300 80" preserveAspectRatio="none" role="img" aria-label="${esc(t('proba_direct'))}">
      <line x1="0" y1="40" x2="300" y2="40" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>
      <polyline fill="none" stroke="var(--ball)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    </svg>`;
  const rows=[...root.querySelectorAll('tr')], lp=root.querySelector('.lp'), poly=root.querySelector('polyline');
  function reset(){
    S = M.etat(premier); R = rng(seed); serie = [];
    decal = logit(Math.min(.995,Math.max(.005,m.p_home))) - logit(Math.min(.995,Math.max(.005,M.pLive(S))));
    serie.push(m.p_home); dessine();
  }
  function pAff(){ const p=M.pLive(S); if (p<=0||p>=1) return p; return sig(logit(p)+decal); }
  function dessine(){
    const nbs = Math.max(S.histo.length + (S.fini?0:1), 1);
    rows.forEach((tr,i)=>{
      [...tr.querySelectorAll('td:not(.name)')].forEach(td=>td.remove());
      S.histo.forEach(h=>{ const td=document.createElement('td'); td.className='set'; td.textContent=h[i]; tr.appendChild(td); });
      if (!S.fini){
        const g=document.createElement('td'); g.className='games'; g.textContent=S.jeux[i]; tr.appendChild(g);
        const p=document.createElement('td'); p.className='pts'; p.textContent=affPts(S,i); tr.appendChild(p);
      }
      tr.querySelector('.srv').classList.toggle('on', !S.fini && M.serveur(S)===i);
      tr.style.fontWeight = S.fini && S.vainqueur===i ? '700' : '';
    });
    const p = serie[serie.length-1];
    lp.textContent = `${court(m.home)} ${pc0(p)}`;
    const n = serie.length, w = 300;
    poly.setAttribute('points', serie.map((v,i)=>`${(n<2?0:i*w/(n-1)).toFixed(1)},${(78-v*76).toFixed(1)}`).join(' '));
  }
  function pointJoue(){ M.point(S, R()); serie.push(pAff()); dessine(); if (S.fini){ stop(); opts.onFin && opts.onFin(S); } }
  function delai(){ return Math.max(12, 140/vitesse); }
  function lance(){ stop(); if (S.fini) return; timer = setInterval(pointJoue, delai()); }
  function stop(){ if (timer){ clearInterval(timer); timer=null; } }
  reset();
  return {
    rejouer(){ seed = Math.floor(Math.random()*1e9); vitesse = opts.vitesse || 1; reset(); lance(); },
    lance, stop,
    accelerer(){ vitesse = Math.min(vitesse*3, 27); if (timer) lance(); },
    finir(){ stop(); let k=0; while(!S.fini && k<2000){ pointJoue(); k++; } },
    etat:()=>S
  };
}

/* ───────────── mode vidéo « arcade » (?video=1) — 24/10/2026 ─────────────
   Écran VS, barres de vie = probabilité de gagner en direct, court vu de haut avec la balle, annonces
   (BREAK !, BALLE DE MATCH…), combos, ralenti sur les points importants, confettis à la fin.
   Le match simulé est calé sur le % publié (calibre) : la vidéo raconte la même histoire que le pronostic. */
const dort = ms => new Promise(r => setTimeout(r, ms));
async function modeVideo(){
  document.body.classList.add('video');
  try { const l = document.createElement('link'); l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=Bungee&display=block'; document.head.appendChild(l); } catch(e){}
  const id = Q.get('uid') || (D.match_du_jour && D.match_du_jour.uid);
  const m = D.matchs.find(x=>x.uid===id && x.simulation);
  const V = document.getElementById('video');
  if (!m){ V.innerHTML = '<p style="padding:10vw">—</p>'; window.__fini = true; return; }
  const p = m.p_home, seed = Number(Q.get('seed') || 7), vit = Number(Q.get('vitesse') || 1);
  const R = rng(seed), M = Moteur(calibre(m.simulation, p)), S = M.etat(seed % 2);
  const noms = [court(m.home), court(m.away)];
  const decal = logit(Math.min(.995,Math.max(.005,p))) - logit(Math.min(.995,Math.max(.005,M.pLive(S))));
  const pAff = () => { const q = M.pLive(S); return (q<=0||q>=1) ? q : sig(logit(q)+decal); };
  V.innerHTML = `<div class="grid"></div><div class="scene">
    <div class="tag"><span class="live"><i></i>${esc(t('a_live'))}</span><span>${esc(m.tournoi)}</span><span><b>${esc(t('a_sim'))}</b> ${esc(t('a_fois', D.simulations))}</span></div>
    <div class="duel">${[0,1].map(i=>`<div class="pj p${i+1}" id="pj${i}"><div class="nom">${esc(noms[i])}</div>
      <div class="pct" id="pc${i}"></div><div class="lbl">${esc(t('a_chance'))}</div><div class="vie"><i id="vie${i}"></i></div></div>`).join('')}</div>
    <div class="score"><table><tbody><tr class="r1" id="sr0"></tr><tr class="r2" id="sr1"></tr></tbody></table></div>
    <div class="arene"><div class="court"><div class="cote haut" id="cote1"></div><div class="cote bas" id="cote0"></div>
      <div class="filet"></div><div class="balle" id="balle"></div></div></div>
    <div class="pied">${esc(t('a_pied', D.simulations))}</div></div>
    <div class="annonce" id="ann"></div><div class="combo" id="combo"></div><div class="ralenti" id="ral">${esc(t('a_ralenti'))}</div>
    <div class="ecran" id="intro"><div class="vs-n a">${esc(m.home)}</div><div class="vs-x">VS</div>
      <div class="vs-n b">${esc(m.away)}</div><div class="vs-t">${t('a_vs_t', D.simulations)}</div></div>`;
  const $ = id => document.getElementById(id);
  // bande-son : chaque événement est noté avec son heure ; scripts/sons.py le place sur la piste audio
  window.__sons = [];
  const son = (type, delai) => window.__sons.push({ t: Date.now() + (delai || 0), type });
  son('vs', 450);
  let pPrec = p;
  function jauges(q){
    [q, 1-q].forEach((v,i)=>{ $('pc'+i).textContent = pc0(v); $('vie'+i).style.width = (v*100).toFixed(1)+'%'; });
    if (Math.abs(q - pPrec) > 0.06){ const d = $(q > pPrec ? 'pj0' : 'pj1'); d.classList.remove('secoue'); void d.offsetWidth; d.classList.add('secoue'); }
    pPrec = q;
  }
  function tableau(){
    const srv = S.fini ? -1 : M.serveur(S);
    [0,1].forEach(i=>{
      $('sr'+i).innerHTML = `<td class="n"><span class="srv ${srv===i?'on':''}"></span>${esc(noms[i])}</td>`
        + S.histo.map(h=>`<td class="s">${h[i]}</td>`).join('')
        + (S.fini ? '' : `<td>${S.jeux[i]}</td><td class="pt">${affPts(S,i)}</td>`);
    });
  }
  const alea = (a,b) => a + (b-a) * R();
  function frappe(h, ms){
    const b = $('balle'), perdant = 1 - h;            // la balle finit dans la moitié du perdant
    b.style.transition = `left ${ms}ms cubic-bezier(.3,.1,.3,1), top ${ms}ms cubic-bezier(.3,.1,.3,1)`;
    b.style.left = alea(14, 86).toFixed(1) + '%';
    b.style.top = (perdant === 0 ? alea(60, 92) : alea(8, 40)).toFixed(1) + '%';
    const c = $('cote'+perdant); c.className = 'cote ' + (perdant ? 'haut' : 'bas') + ' eclat-p' + (h+1);
    setTimeout(()=>{ c.className = 'cote ' + (perdant ? 'haut' : 'bas'); }, Math.max(120, ms));
    son('frappe' + h);
    const pj = $('pj'+h); pj.classList.add('flash'); setTimeout(()=>pj.classList.remove('flash'), Math.max(120, ms));
  }
  function annonce(txt, sous, ms, couleur){
    const a = $('ann'); a.classList.remove('pop'); void a.offsetWidth;
    a.innerHTML = esc(txt) + (sous ? `<small>${esc(sous)}</small>` : '');
    a.style.color = couleur || ''; a.style.setProperty('--duree', ms + 'ms'); a.classList.add('pop');
  }
  const coul = i => i === 0 ? 'var(--ar-p1)' : 'var(--ar-p2)';
  function enjeu(X){                                  // point important : match > set > break (pour qui)
    X = X || S;
    let best = null;
    for (const h of [0,1]){
      const C = JSON.parse(JSON.stringify(X)), srv = M.serveur(X), tb = X.tb;
      M.point(C, h === 0 ? 0 : 0.9999999);
      const set = C.sets[0]+C.sets[1] > X.sets[0]+X.sets[1], jeu = set || C.jeux[0]+C.jeux[1] > X.jeux[0]+X.jeux[1];
      const k = C.fini ? 3 : set ? 2 : (jeu && !tb && h !== srv) ? 1 : 0;
      if (k && (!best || k > best.k)) best = {k, h};
    }
    return best;
  }
  jauges(p); tableau();
  await Promise.race([ (document.fonts && document.fonts.load ? document.fonts.load('40px Bungee') : Promise.resolve()), dort(3000) ]);
  window.__pret = true;
  await dort(Number(Q.get('attente') || 2600) / vit);
  $('intro').classList.add('cache');
  await dort(500 / vit);
  // Rythme calé sur une durée cible (~32 s) : le même match est d'abord joué « à blanc » (même tirage) pour
  // compter ses points et ses moments forts, puis la vitesse et les ralentis sont dosés en conséquence.
  const CIBLE = Number(Q.get('duree') || 27) * 1000;
  const blanc = (() => { const Rb = rng(seed), X = M.etat(seed % 2); let n = 0, ev = 0;
    while (!X.fini){ const e = enjeu(X); const a = {s: X.sets[0]+X.sets[1], j: X.jeux[0]+X.jeux[1], v: M.serveur(X), tb: X.tb};
      const h = M.point(X, Rb()); n++; if (e) ev += 930;
      if (!X.fini && X.sets[0]+X.sets[1] > a.s) ev += 1100; else if (!X.fini && X.jeux[0]+X.jeux[1] > a.j && !a.tb && h !== a.v) ev += 700;
      if (X.tb && !a.tb) ev += 950; }
    return {n, ev}; })();
  const fixe = 3100 + 5100;
  const f = Math.max(0.45, Math.min(1, 0.55 * (CIBLE - fixe) / Math.max(1, blanc.ev)));   // dosage des ralentis
  const base = Math.max(28, Math.min(64, (CIBLE - fixe - f * blanc.ev) / Math.max(1, blanc.n))) / vit;
  let serie = 0, dernier = -1, nset = 1;
  while (!S.fini){
    const e = enjeu();
    let ms = base;
    if (e){
      const lib = [null, t('a_bb'), t('a_bs'), t('a_bm')][e.k];
      annonce(lib, noms[e.h], 950 * f / vit, coul(e.h)); $('ral').classList.add('on'); son(e.k === 3 ? 'balle_match' : 'annonce');
      await dort(600 * f / vit); ms = 330 * f / vit;
    }
    const avant = { sets: S.sets[0]+S.sets[1], jeux: S.jeux[0]+S.jeux[1], srv: M.serveur(S), tb: S.tb };
    const h = M.point(S, R());
    frappe(h, Math.min(ms * 0.9, 380));
    serie = h === dernier ? serie + 1 : 1; dernier = h;
    if (serie >= 4 && serie % 2 === 0) son('combo');
    const cb = $('combo'); if (serie >= 4){ cb.textContent = t('a_combo', serie); cb.style.color = coul(h); cb.classList.add('on'); } else cb.classList.remove('on');
    jauges(pAff()); tableau();
    await dort(ms);
    $('ral').classList.remove('on');
    if (S.fini) break;
    const sets = S.sets[0]+S.sets[1], jeux = S.jeux[0]+S.jeux[1];
    if (sets > avant.sets){ nset++; annonce(t('a_set', nset - 1), t('a_pour', noms[h]), 1150 * f / vit, coul(h)); son('set'); await dort(1100 * f / vit); }
    else if (jeux > avant.jeux && !avant.tb && h !== avant.srv){ annonce(t('a_break'), noms[h], 800 * f / vit, coul(h)); son('break'); await dort(700 * f / vit); }
    if (S.tb && !avant.tb){ annonce(t('a_tb'), '', 1000 * f / vit); son('jeu_decisif'); await dort(950 * f / vit); }
  }
  const w = S.vainqueur, fav = p >= .5 ? 0 : 1;
  await dort(500 / vit);
  const fin = document.createElement('div'); fin.className = 'ecran';
  fin.innerHTML = `<div class="fin-t">${esc(t('a_fin'))}</div>
    <div class="fin-w" style="color:${coul(w)};text-shadow:0 0 5vw ${coul(w)}">${esc(t('a_gagne', noms[w]))}</div>
    <div class="fin-s">${esc(scoreTxt(S, w === 1))}</div>
    <div class="fin-p">${t('a_fin_p', esc(noms[fav]), Math.max(p,1-p)*100, D.simulations)}</div>
    ${Q.get('adresse') === '1' ? `<div class="fin-url">${esc(t('v_url'))}</div>` : ''}`;
  V.appendChild(fin); son('fin');
  const cols = ['#2EE6FF','#FF3EA5','#D4FF3A','#F4F1FF','#9B6BFF'];
  for (let i=0;i<70;i++){ const c = document.createElement('i'); c.className='confetti';
    c.style.cssText = `left:${(R()*100).toFixed(1)}vw;background:${cols[i%cols.length]};--d:${(2.2+R()*1.6).toFixed(2)}s;--r:${(R()*0.8).toFixed(2)}s;--rot:${Math.round(R()*720-360)}deg`;
    V.appendChild(c); }
  await dort(4600 / Math.min(vit, 1));
  window.__fini = true;
}
