<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E0A24">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E0A24'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%23D4FF3A'/%3E%3Cpath d='M17 20c12 4 12 20 0 24M47 20c-12 4-12 20 0 24' fill='none' stroke='%230E0A24' stroke-width='3'/%3E%3C/svg%3E">
<title>Tennis Edge — l'algo</title>
<meta name="description" content="Chaque match de tennis simulé 20 000 fois par un algorithme indépendant du marché : % de victoire, cote juste, et un bilan public, pertes comprises.">
<meta property="og:title" content="Tennis Edge — l'algo">
<meta property="og:description" content="Chaque match simulé 20 000 fois. % de victoire, cote juste, bilan public.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Tennis Edge — l'algo · thème « arcade » (24/10/2026)
   Un seul thème, sombre, comme une borne d'arcade : fond violet nuit, néons cyan (joueur 1) et magenta
   (joueur 2), vert balle de tennis pour l'action. Le Bungee ne sert qu'aux titres et aux gros chiffres ;
   tout le texte courant reste en Barlow, pour la lisibilité. */
:root{
  --bg:#0E0A24; --bg2:#160F38; --panel:#1B1342; --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.2);
  --ink:#F4F1FF; --dim:#ABA3D6; --p1:#2EE6FF; --p2:#FF4FAE; --ball:#D4FF3A; --ok:#45F0A0; --ko:#FF6B86;
  --disp:"Bungee","Russo One","Arial Black",Impact,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --r-lg:18px; --r-sm:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:16px;background:var(--bg)}
body{margin:0;color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 520px at 50% -120px,#3A1F8F 0%,transparent 70%),var(--bg);min-height:100vh}
a{color:var(--p1)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ball);outline-offset:3px}
.num{font-family:var(--cond);font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}

/* en-tête */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 6px}
.logo{display:flex;align-items:center;gap:10px;margin:0;font-family:var(--disp);font-weight:400;font-size:1.35rem;letter-spacing:.01em;line-height:1}
.logo .b{width:16px;height:16px;border-radius:50%;background:var(--ball);box-shadow:0 0 14px var(--ball);flex:none}
.logo small{font-family:Barlow;font-size:.95rem;color:var(--dim);font-weight:500;letter-spacing:0}
.reglages{display:flex;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ico{border:1px solid var(--line2);background:none;border-radius:999px;width:36px;height:34px;cursor:pointer;display:grid;place-items:center}
.ico svg{width:18px;height:18px}
.lede{font-size:1.06rem;color:var(--dim);max-width:62ch;margin:6px 0 26px}

/* sections */
section{margin:40px 0}
h2{font-family:var(--disp);font-weight:400;font-size:1.45rem;line-height:1.15;margin:0 0 6px;letter-spacing:.01em}
.sub{color:var(--dim);margin:0 0 16px;max-width:64ch}
.panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r-lg)}
.empty{padding:18px;color:var(--dim)}

/* match du jour : borne d'arcade + détails */
.mdj{display:grid;gap:16px}
@media (min-width:820px){.mdj{grid-template-columns:minmax(320px,420px) 1fr;align-items:start}}
.borne{border-radius:var(--r-lg);padding:10px;background:linear-gradient(160deg,#2A1A6E,#120B30);border:1px solid var(--line2);box-shadow:0 0 0 1px rgba(46,230,255,.08),0 20px 50px rgba(0,0,0,.45)}
.ecran-jeu{aspect-ratio:9/15;border-radius:12px;overflow:hidden}
.commandes{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:1px solid var(--line2);background:rgba(255,255,255,.04);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:.95rem}
.btn:hover{border-color:var(--ink)}
.btn.go{background:var(--ball);border-color:var(--ball);color:#160E33;font-family:var(--disp);font-weight:400;font-size:.9rem;letter-spacing:.02em}
.btn[disabled]{opacity:.45;cursor:default}
.final{min-height:1.5em;margin:10px 4px 0;color:var(--ink)}
.aide{color:var(--dim);font-size:.88rem;margin:6px 4px 0}
.fiche{display:grid;gap:12px}
.duelx{padding:16px}
.duelx .ctx{color:var(--dim);font-size:.92rem;margin:0 0 10px}
.duelx .ligne{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:8px}
.duelx .nm{font-weight:600;font-size:1.08rem}
.duelx .pc{font-family:var(--disp);font-size:2.2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.duelx .l1 .pc{color:var(--p1);text-shadow:0 0 18px rgba(46,230,255,.45)} .duelx .l2 .pc{color:var(--p2);text-shadow:0 0 18px rgba(255,79,174,.45)}
.duelx .cj{color:var(--dim);font-size:.9rem;font-family:var(--cond);font-variant-numeric:tabular-nums}
.fiab{display:flex;align-items:center;gap:7px;margin-top:10px;color:var(--dim);font-size:.86rem;flex-wrap:wrap}
.fiab b{color:var(--ball);font-family:var(--cond);font-size:1rem}.fiab small{flex-basis:100%;font-size:.78rem}
.tir{display:flex;height:12px;border-radius:999px;overflow:hidden;margin:12px 0 8px;background:var(--p2);box-shadow:0 0 14px rgba(255,79,174,.35)}
.tir i{display:block;height:100%;background:var(--p1);box-shadow:0 0 14px rgba(46,230,255,.5)}
.fiche h3{font-size:1rem;margin:14px 16px 4px;font-weight:600}
.bars{padding:8px 16px 14px}
.bar{display:grid;grid-template-columns:3.2em 1fr 3.4em;align-items:center;gap:10px;margin:7px 0;font-variant-numeric:tabular-nums}
.bar .t{height:8px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--p1)}
.bar.away .t i{background:var(--p2)}
.duo{display:grid;gap:12px}
@media (min-width:560px){.duo{grid-template-columns:1fr 1fr}}
table.sheet{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.sheet td,table.sheet th{padding:8px 16px;border-top:1px solid var(--line);text-align:right}
table.sheet th{font-weight:500;color:var(--dim);text-align:left}
table.sheet thead th{border-top:0;font-size:.9rem;text-align:right}
table.sheet thead th:first-child{text-align:left}
table.sheet thead th.c1{color:var(--p1)} table.sheet thead th.c2{color:var(--p2)}

/* catalogue : chaque ligne ouvre le même détail et la même borne que le match du jour */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.retour{margin:0 0 16px}
.filtres{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 8px}
.filtres input{flex:1 1 240px;min-height:44px;border:1px solid var(--line2);border-radius:10px;background:var(--panel);color:var(--ink);padding:10px 12px;font:inherit}
.filtres input::placeholder{color:var(--dim)}
.circuits button{min-height:44px;min-width:44px}
.compte{min-height:1.5em;margin:0 0 8px;color:var(--dim);font-size:.9rem}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line);transition:background-color .18s ease-out}
.list li:first-child{border-top:0}
.match-open{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:4px 12px;width:100%;padding:14px 16px;border:0;background:transparent;text-align:left;cursor:pointer;color:inherit;transition:transform .18s ease-out,background-color .18s ease-out}
.match-open:hover,.match-open:focus-visible{background:rgba(255,255,255,.035)}
.match-open:active{transform:scale(.995)}
.list .time{font-family:var(--cond);font-weight:600;font-size:1.1rem;color:var(--dim);padding-top:2px}
.list .tour{font-size:.85rem;color:var(--dim)}
.list .pl{display:flex;justify-content:space-between;gap:10px;font-weight:500}
.list .pl b{font-family:var(--disp);font-weight:400;font-size:1.05rem;font-variant-numeric:tabular-nums}
.list .pl.a b{color:var(--p1)} .list .pl.b b{color:var(--p2)}
.list .mini{height:6px;border-radius:999px;background:var(--p2);overflow:hidden;margin:7px 0 3px;display:flex;opacity:.9}
.list .mini i{display:block;height:100%;background:var(--p1)}
.list .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.85rem;color:var(--dim);flex-wrap:wrap}
.list .ouvrir{color:var(--p1);font-weight:600;transition:opacity .18s ease-out,transform .18s ease-out}
.match-open:hover .ouvrir,.match-open:focus-visible .ouvrir{transform:translateX(3px)}
.list li.star{background:linear-gradient(90deg,rgba(212,255,58,.08),transparent 60%);box-shadow:inset 3px 0 0 var(--ball)}
.list li.selectionne{background:rgba(46,230,255,.07)}
.badge{display:inline-block;font-family:var(--disp);font-size:.7rem;padding:2px 8px;border-radius:999px;background:var(--ball);color:#160E33;letter-spacing:.02em;vertical-align:middle;margin-left:6px}

/* tableau des scores (bilan) */
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.scores > div{padding:16px 18px;border-top:1px solid var(--line)}
.scores > div:first-child{border-top:0}
@media (min-width:560px){.scores > div{border-top:0;border-left:1px solid var(--line)}.scores > div:first-child{border-left:0}}
.scores .k{color:var(--dim);font-size:.9rem}
.scores .v{font-family:var(--disp);font-size:2.1rem;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--ball);text-shadow:0 0 18px rgba(212,255,58,.35)}
.circ{padding:12px 18px;border-top:1px solid var(--line);font-size:.95rem}
svg.curve{width:100%;height:auto;display:block}
.res{list-style:none;margin:0;padding:0}
.res li{display:grid;grid-template-columns:1.8em 1fr auto;gap:10px;padding:10px 16px;border-top:1px solid var(--line);align-items:center;font-size:.96rem}
.res li:first-child{border-top:0}
.res .m{display:grid;place-items:center;width:1.6em;height:1.6em;border-radius:6px;font-weight:700;font-size:.85rem}
.res .ok{background:rgba(69,240,160,.16);color:var(--ok)} .res .ko{background:rgba(255,107,134,.16);color:var(--ko)}
.res .d{color:var(--dim);font-size:.86rem}
.res .sc{white-space:nowrap}
.res .p{font-family:var(--cond);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.more{display:block;margin:0;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;color:var(--p1);font-weight:600}
.calib{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.calib th,.calib td{padding:9px 12px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.calib th:first-child,.calib td:first-child{text-align:left}
.calib thead th{border-top:0;color:var(--dim);font-weight:500;font-size:.9rem}
.calib td b{color:var(--ball)}
.plus{padding:18px}
.plus ul{margin:10px 0 0;padding-left:1.1em}
.plus li{margin:4px 0}
.plus .soon{display:inline-block;margin-top:12px}
footer{color:var(--dim);font-size:.86rem;padding:22px 0 44px;border-top:1px solid var(--line);margin-top:44px}
footer p{max-width:72ch}

/* ── la borne d'arcade : même composant sur le site (dans .ecran-jeu) et dans la vidéo (plein écran 9:16) ──
   Toutes les tailles sont en cqw (largeur du conteneur) : la scène s'adapte à n'importe quelle largeur. */
.arcade{--ar-bg:#0E0A24;--ar-p1:#2EE6FF;--ar-p2:#FF4FAE;--ar-ball:#D4FF3A;--ar-ink:#F4F1FF;--ar-dim:#ABA3D6;--ar-disp:var(--disp);
  container-type:inline-size;position:relative;width:100%;height:100%;overflow:hidden;color:var(--ar-ink);font-family:var(--cond);
  background:radial-gradient(120cqw 80cqw at 50% 0%,#3A1F8F 0%,transparent 60%),radial-gradient(90cqw 70cqw at 50% 105%,#0F5C66 0%,transparent 60%),var(--ar-bg)}
.arcade .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:6cqw 6cqw;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 70%,transparent)}
.arcade .scene{position:absolute;inset:0;display:flex;flex-direction:column;padding:6cqw 5cqw 5cqw}
.arcade .tag{display:flex;justify-content:space-between;align-items:center;gap:2cqw;font-size:3.4cqw;color:var(--ar-dim);font-weight:600}
.arcade .tag > span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arcade .tag b{color:var(--ar-ball);font-family:var(--ar-disp);font-weight:400}
.arcade .live{display:inline-flex;align-items:center;gap:1.6cqw;padding:1cqw 2.4cqw;border-radius:99cqw;background:rgba(255,79,174,.16);color:#FF9ACF;font-family:var(--ar-disp);font-size:2.9cqw;white-space:nowrap}
.arcade .live i{width:1.8cqw;height:1.8cqw;border-radius:50%;background:var(--ar-p2);box-shadow:0 0 2cqw var(--ar-p2);animation:clign 1s steps(2) infinite}
@keyframes clign{50%{opacity:.2}}
.arcade .duel{display:grid;grid-template-columns:1fr 1fr;gap:3cqw;margin-top:4.5cqw}
.arcade .pj{padding:3cqw;border-radius:3cqw;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:.4cqw solid rgba(255,255,255,.12);transition:box-shadow .15s,border-color .15s;min-width:0}
.arcade .pj.p1{--c:var(--ar-p1)} .arcade .pj.p2{--c:var(--ar-p2);text-align:right}
.arcade .pj .nom{font-family:var(--ar-disp);font-size:5.2cqw;line-height:1.05;color:var(--c);text-shadow:0 0 3cqw color-mix(in srgb,var(--c) 60%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arcade .pj .pct{font-family:var(--ar-disp);font-size:10.5cqw;line-height:1;margin-top:1.5cqw;font-variant-numeric:tabular-nums}
.arcade .pj .lbl{font-size:3cqw;color:var(--ar-dim);font-weight:600}
.arcade .vie{height:3cqw;border-radius:2cqw;background:rgba(255,255,255,.1);margin-top:2cqw;overflow:hidden;position:relative}
.arcade .vie i{position:absolute;top:0;bottom:0;background:var(--c);box-shadow:0 0 3cqw var(--c);transition:width .25s ease-out}
.arcade .p1 .vie i{left:0} .arcade .p2 .vie i{right:0}
.arcade .pj.flash{border-color:var(--c);box-shadow:0 0 6cqw color-mix(in srgb,var(--c) 70%,transparent)}
.arcade .secoue{animation:secoue .35s}
@keyframes secoue{20%{transform:translate(-1.2cqw,.6cqw)}40%{transform:translate(1.2cqw,-.6cqw)}60%{transform:translate(-.8cqw,.4cqw)}80%{transform:translate(.6cqw,0)}}
.arcade .score{margin-top:3.5cqw;border-radius:3cqw;background:rgba(5,3,20,.65);border:.4cqw solid rgba(255,255,255,.12);padding:1.6cqw 3cqw}
.arcade .score table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.arcade .score td{font-family:var(--ar-disp);font-size:6cqw;padding:.7cqw 1.3cqw;text-align:center}
.arcade .score td.n{text-align:left;font-size:5cqw;width:100%;white-space:nowrap;max-width:0;overflow:hidden;text-overflow:ellipsis}
.arcade .score tr.r1 td.n{color:var(--ar-p1)} .arcade .score tr.r2 td.n{color:var(--ar-p2)}
.arcade .score td.s{color:var(--ar-dim)}
.arcade .score td.pt{min-width:2.6em;background:var(--ar-ball);color:#160E33;border-radius:1.4cqw}
.arcade .score .srv{display:inline-block;width:2.2cqw;height:2.2cqw;border-radius:50%;background:var(--ar-ball);box-shadow:0 0 2cqw var(--ar-ball);margin-right:2cqw;vertical-align:middle;visibility:hidden}
.arcade .score .srv.on{visibility:visible}
.arcade .arene{flex:1;display:flex;align-items:center;justify-content:center;perspective:140cqw;margin-top:2cqw;min-height:0}
.arcade .court{position:relative;height:100%;max-height:92cqw;aspect-ratio:62/92;transform:rotateX(38deg);background:linear-gradient(#1D6B8C,#15506A);border:.7cqw solid #E9F6FF;border-radius:.6cqw;box-shadow:0 4cqw 10cqw rgba(0,0,0,.55),0 0 6cqw rgba(46,230,255,.25)}
.arcade .court::before{content:"";position:absolute;left:12%;right:12%;top:0;bottom:0;border-left:.4cqw solid rgba(233,246,255,.8);border-right:.4cqw solid rgba(233,246,255,.8)}
.arcade .court::after{content:"";position:absolute;left:12%;right:12%;top:25%;bottom:25%;border-top:.4cqw solid rgba(233,246,255,.8);border-bottom:.4cqw solid rgba(233,246,255,.8);background:linear-gradient(90deg,transparent calc(50% - .2cqw),rgba(233,246,255,.8) calc(50% - .2cqw),rgba(233,246,255,.8) calc(50% + .2cqw),transparent calc(50% + .2cqw))}
.arcade .filet{position:absolute;left:-3cqw;right:-3cqw;top:calc(50% - .5cqw);height:1cqw;background:#F4F1FF;box-shadow:0 1cqw 2cqw rgba(0,0,0,.4);z-index:2}
.arcade .balle{position:absolute;width:4.4cqw;height:4.4cqw;margin:-2.2cqw 0 0 -2.2cqw;border-radius:50%;background:radial-gradient(circle at 35% 35%,#F6FFB0,var(--ar-ball) 55%,#9DBF10);box-shadow:0 0 4cqw var(--ar-ball),0 0 9cqw rgba(212,255,58,.5);z-index:3;left:50%;top:80%}
.arcade .court .cote{position:absolute;left:0;right:0;height:50%;transition:background .2s}
.arcade .court .cote.haut{top:0} .arcade .court .cote.bas{bottom:0}
.arcade .court .cote.eclat-p1{background:rgba(46,230,255,.35)} .arcade .court .cote.eclat-p2{background:rgba(255,79,174,.35)}
.arcade .annonce{position:absolute;left:4cqw;right:4cqw;top:62%;text-align:center;font-family:var(--ar-disp);font-size:12cqw;line-height:1;pointer-events:none;z-index:10;opacity:0;
  color:var(--ar-ball);-webkit-text-stroke:.25cqw #160E33;paint-order:stroke fill;text-shadow:0 1cqw 0 #160E33,0 0 6cqw currentColor}
.arcade .annonce small{display:block;font-size:5.2cqw;margin-top:2cqw;-webkit-text-stroke:0;text-shadow:0 .6cqw 0 #160E33;color:var(--ar-ink)}
.arcade .annonce.pop{animation:pop var(--duree,900ms) cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-8deg)}18%{opacity:1;transform:scale(1.12) rotate(2deg)}30%{transform:scale(1) rotate(-1deg)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
.arcade .combo{position:absolute;right:5cqw;bottom:13cqw;font-family:var(--ar-disp);font-size:5.6cqw;color:var(--ar-ball);opacity:0;transition:opacity .2s;text-shadow:0 0 3cqw currentColor}
.arcade .combo.on{opacity:1}
.arcade .ralenti{position:absolute;left:5cqw;bottom:13cqw;font-family:var(--ar-disp);font-size:3.8cqw;color:#FF9ACF;opacity:0;transition:opacity .2s}
.arcade .ralenti.on{opacity:1;animation:clign .5s steps(2) infinite}
.arcade .pied{font-size:3.2cqw;color:var(--ar-dim);text-align:center;font-weight:600;margin-top:2cqw}
.arcade .ecran{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.6cqw;background:rgba(14,10,36,.9);text-align:center;padding:8cqw}
.arcade .ecran.cache{opacity:0;transition:opacity .4s;pointer-events:none}
.arcade .vs-n{font-family:var(--ar-disp);font-size:8.6cqw;line-height:1.05;max-width:100%;overflow-wrap:anywhere}
.arcade .vs-n.a{color:var(--ar-p1);text-shadow:0 0 5cqw var(--ar-p1);animation:gauche .5s cubic-bezier(.2,1.3,.4,1) both}
.arcade .vs-n.b{color:var(--ar-p2);text-shadow:0 0 5cqw var(--ar-p2);animation:droite .5s .15s cubic-bezier(.2,1.3,.4,1) both}
.arcade .vs-x{font-family:var(--ar-disp);font-size:19cqw;line-height:1;color:var(--ar-ball);-webkit-text-stroke:.6cqw #160E33;paint-order:stroke fill;text-shadow:0 1.2cqw 0 #160E33,0 0 8cqw var(--ar-ball);animation:slam .45s .45s cubic-bezier(.2,1.6,.4,1) both}
.arcade .vs-t{font-size:4.4cqw;color:var(--ar-dim);font-weight:600;animation:fondu .4s .8s both;line-height:1.3}
.arcade .vs-t b{color:var(--ar-ball);font-family:var(--ar-disp);font-weight:400}
.arcade .start{margin-top:2cqw;border:0;border-radius:99cqw;padding:3cqw 6cqw;background:var(--ar-ball);color:#160E33;font-family:var(--ar-disp);font-size:4.6cqw;cursor:pointer;box-shadow:0 0 6cqw rgba(212,255,58,.55);animation:fondu .4s 1s both}
.arcade .start:hover{transform:translateY(-1px)}
@keyframes gauche{from{transform:translateX(-120cqw)}} @keyframes droite{from{transform:translateX(120cqw)}}
@keyframes slam{from{transform:scale(4);opacity:0}} @keyframes fondu{from{opacity:0;transform:translateY(3cqw)}}
.arcade .fin-t{font-family:var(--ar-disp);font-size:11cqw;line-height:1.02;color:var(--ar-ball);-webkit-text-stroke:.5cqw #160E33;paint-order:stroke fill;text-shadow:0 1cqw 0 #160E33,0 0 6cqw var(--ar-ball);animation:slam .5s cubic-bezier(.2,1.6,.4,1) both}
.arcade .fin-w{font-family:var(--ar-disp);font-size:7.4cqw;animation:fondu .4s .35s both}
.arcade .fin-s{font-family:var(--ar-disp);font-size:6.6cqw;color:var(--ar-ink);animation:fondu .4s .5s both;font-variant-numeric:tabular-nums}
.arcade .fin-p{font-size:4.8cqw;font-weight:600;color:var(--ar-dim);animation:fondu .4s .9s both;max-width:24ch;line-height:1.25}
.arcade .fin-p b{color:var(--ar-ink);font-family:var(--ar-disp);font-weight:400}
.arcade .fin-url{font-size:4cqw;color:var(--ar-dim);margin-top:3cqw}
.arcade .confetti{position:absolute;top:-4cqw;width:2cqw;height:3.4cqw;border-radius:.4cqw;z-index:21;animation:tombe var(--d) linear var(--r) forwards}
@keyframes tombe{to{transform:translateY(var(--h,1100px)) rotate(var(--rot))}}

/* mode vidéo (?video=1) : la borne seule, en plein écran 9:16 */
body.video{background:#0E0A24;overflow:hidden;margin:0}
body.video .page{display:none}
#video{display:none}
body.video #video{display:block;width:100vw;height:100vh}


/* carte de stats (?carte=1) : image 1080×1350 (format portrait de X), même thème arcade (24/10/2026) */
body.carte{background:#0E0A24;margin:0;overflow:hidden}
body.carte .page{display:none}
body.carte #video{display:block;width:1080px;height:1350px}
.ca{position:relative;width:1080px;height:1350px;overflow:hidden;color:#F4F1FF;font-family:Barlow,system-ui,sans-serif;padding:50px 56px 40px;box-sizing:border-box;
  background:radial-gradient(1200px 700px at 50% -120px,#3A1F8F 0%,transparent 65%),radial-gradient(900px 600px at 50% 1450px,#0F5C66 0%,transparent 60%),#0E0A24;display:flex;flex-direction:column}
.ca::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.ca > *{position:relative}
.ca .haut{display:flex;justify-content:space-between;align-items:center;font-size:30px;color:#ABA3D6;font-weight:600}
.ca .haut b{font-family:var(--disp);font-weight:400;color:#D4FF3A}
.ca h1{font-family:var(--disp);font-weight:400;font-size:56px;line-height:1.05;margin:20px 0 4px}
.ca .ctx{font-size:27px;color:#ABA3D6;margin:0 0 22px}
.ca .duel{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.ca .pj{border-radius:24px;padding:18px 24px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:3px solid rgba(255,255,255,.12)}
.ca .pj.b{text-align:right}
.ca .pj .n{font-family:var(--disp);font-size:34px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ca .pj .p{font-family:var(--disp);font-size:88px;line-height:1;margin-top:6px}
.ca .pj.a .n,.ca .pj.a .p{color:#2EE6FF;text-shadow:0 0 30px rgba(46,230,255,.5)}
.ca .pj.b .n,.ca .pj.b .p{color:#FF4FAE;text-shadow:0 0 30px rgba(255,79,174,.5)}
.ca .pj .c{font-size:26px;color:#ABA3D6;margin-top:6px}
.ca .tir{display:flex;height:18px;border-radius:99px;overflow:hidden;margin:20px 0 22px;background:#FF4FAE;box-shadow:0 0 24px rgba(255,79,174,.4)}
.ca .tir i{display:block;height:100%;background:#2EE6FF;box-shadow:0 0 24px rgba(46,230,255,.6)}
.ca .blocs{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.ca .bloc{border-radius:22px;padding:16px 24px;background:rgba(5,3,20,.55);border:3px solid rgba(255,255,255,.1)}
.ca .bloc h2{font-family:Barlow,sans-serif;font-weight:600;font-size:26px;margin:0 0 6px;color:#F4F1FF}
.ca .l{display:grid;grid-template-columns:70px 1fr 86px;align-items:center;gap:14px;margin:7px 0;font-family:var(--cond);font-size:30px;font-variant-numeric:tabular-nums}
.ca .l .t{height:14px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.ca .l .t i{display:block;height:100%;background:#2EE6FF}
.ca .l.x .t i{background:#FF4FAE}
.ca .l .v{text-align:right}
.ca .sc{display:flex;justify-content:space-between;font-family:var(--cond);font-size:32px;margin:9px 0;font-variant-numeric:tabular-nums}
.ca .sc:first-of-type b{color:#D4FF3A}
.ca table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:2px}
.ca td,.ca th{font-size:27px;padding:6px 6px;border-top:2px solid rgba(255,255,255,.1);text-align:right}
.ca th{font-weight:500;color:#ABA3D6;text-align:left}
.ca thead th{border-top:0;font-size:26px;text-align:right}
.ca thead th.a{color:#2EE6FF} .ca thead th.b{color:#FF4FAE}
.ca td{font-family:var(--cond);font-size:30px}
.ca .pied{margin-top:auto;padding-top:14px;font-size:24px;color:#ABA3D6;text-align:center}
.ca .pied b{color:#D4FF3A;font-family:var(--disp);font-weight:400}
@media (prefers-reduced-motion: reduce){
  .arcade .secoue,.arcade .live i,.arcade .ralenti.on{animation:none}
  .arcade .vs-n.a,.arcade .vs-n.b,.arcade .vs-x,.arcade .vs-t,.arcade .start,.arcade .fin-t,.arcade .fin-w,.arcade .fin-s,.arcade .fin-p{animation:none}
  .arcade .confetti{display:none}
  .arcade .annonce.pop{animation-name:popdoux}
  @keyframes popdoux{0%,100%{opacity:0}15%,80%{opacity:1}}
}

<body>
<div class="page">
<div class="wrap">
  <header class="top">
    <p class="logo"><span class="b" aria-hidden="true"></span>Tennis Edge <small data-t="marque"></small></p>
    <div class="reglages">
      <button type="button" class="ico" id="b-son" aria-pressed="false"></button>
      <div class="seg" role="group" aria-label="Langue / Language">
        <button type="button" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>
  <p class="lede" data-t="lede"></p>

  <section id="mdj" aria-labelledby="mdj-h" style="margin-top:0">
    <h2 id="mdj-h" data-t="mdj_titre"></h2>
    <p class="sub" id="mdj-sous" data-t="mdj_sous"></p>
    <button type="button" class="btn retour" id="retour-mdj" hidden></button>
    <div id="mdj-zone"></div>
  </section>

  <section aria-labelledby="list-h">
    <h2 id="list-h" data-t="liste_titre"></h2>
    <p class="sub" data-t="liste_sous"></p>
    <div class="filtres">
      <label class="sr-only" for="recherche" data-t="recherche_label"></label>
      <input type="search" id="recherche" autocomplete="off" data-t-placeholder="recherche_placeholder">
      <div class="seg circuits" role="group" aria-label="Circuit">
        <button type="button" data-circuit="TOUS" aria-pressed="true" data-t="tous_circuits"></button>
        <button type="button" data-circuit="ATP" aria-pressed="false">ATP</button>
        <button type="button" data-circuit="WTA" aria-pressed="false">WTA</button>
        <button type="button" data-circuit="CH" aria-pressed="false">CH</button>
      </div>
    </div>
    <p class="compte" id="liste-compte" aria-live="polite"></p>
    <div class="panel"><ul class="list" id="list"></ul><button type="button" class="more" id="liste-more" hidden></button></div>
  </section>

  <section aria-labelledby="bilan-h">
    <h2 id="bilan-h" data-t="bilan_titre"></h2>
    <p class="sub" id="bilan-sous"></p>
    <div class="panel" id="bilan-facts"></div>
    <div class="panel" style="margin-top:12px;padding:14px 10px 6px" id="bilan-curve"></div>
    <div class="panel" style="margin-top:12px"><ul class="res" id="bilan-res"></ul><button class="more" id="bilan-more" hidden></button></div>
  </section>

  <section aria-labelledby="calib-h">
    <h2 id="calib-h" data-t="calib_titre"></h2>
    <p class="sub" data-t="calib_sous"></p>
    <div class="panel" id="calib"></div>
    <p class="sub" style="margin-top:14px" id="rejoue-sous"></p>
    <div class="panel" id="calib-rejoue"></div>
  </section>

  <section aria-labelledby="plus-h">
    <h2 id="plus-h" data-t="plus_titre"></h2>
    <div class="panel plus">
      <p style="margin:0" data-t="plus_texte"></p>
      <ul id="plus-list"></ul>
      <span class="badge soon" data-t="plus_bientot"></span>
    </div>
  </section>

  <footer>
    <p data-t="pied_methode"></p>
    <p data-t="pied_jeu"></p>
    <p id="maj"></p>
  </footer>
</div>
</div>

/* Les probabilités au service (a, b) sont décalées d'un même δ (a + δ, b − δ) pour que le match simulé

function calibre(sim, p){
  const f = d => Moteur({...sim, a: sim.a + d, b: sim.b - d}).pLive(Moteur(sim).etat(0)) - p;
  let lo = -0.2, hi = 0.2;
  if (f(lo) > 0 || f(hi) < 0) return sim;
  for (let k=0;k<40;k++){ const mid=(lo+hi)/2; if (f(mid) < 0) lo = mid; else hi = mid; }
  const d=(lo+hi)/2; return {...sim, a: sim.a + d, b: sim.b - d};
}

    const base = Math.max(28, Math.min(64, (CIBLE - fixe - f * blanc.ev) / Math.max(1, blanc.n)));
    let serie = 0, dernier = -1, nset = 1;
    while (!S.fini){
      if (!vivant()) return;
      const e = enjeu(S);
      let ms = base;
      if (e && accel < 10){
        annonce([null, t('a_bb'), t('a_bs'), t('a_bm')][e.k], noms[e.h], 950 * f / (vit * accel), coul(e.h));
        $('.ralenti').classList.add('on'); son(e.k === 3 ? 'balle_match' : 'annonce');
        await z(600 * f); ms = 330 * f;
        if (!vivant()) return;
      }
      const avant = { sets: S.sets[0]+S.sets[1], jeux: S.jeux[0]+S.jeux[1], srv: M.serveur(S), tb: S.tb };
      const h = pointSuivant(S, R, false);
      frappe(h, Math.min(ms * 0.9 / (vit * accel), 380));
      serie = h === dernier ? serie + 1 : 1; dernier = h;
      if (serie >= 4 && serie % 2 === 0) son('combo');
      const cb = $('.combo'); if (serie >= 4){ cb.textContent = t('a_combo', serie); cb.style.color = coul(h); cb.classList.add('on'); } else cb.classList.remove('on');
      jauges(pAff()); tableau();
      await z(ms);
      if (!vivant()) return;
      $('.ralenti').classList.remove('on');
      if (S.fini) break;
      if (accel >= 10) continue;
      const sets = S.sets[0]+S.sets[1], jeux = S.jeux[0]+S.jeux[1];
      if (sets > avant.sets){ nset++; annonce(t('a_set', nset - 1), t('a_pour', noms[h]), 1150 * f / (vit * accel), coul(h)); son('set'); await z(1100 * f); }
      else if (jeux > avant.jeux && !avant.tb && h !== avant.srv){ annonce(t('a_break'), noms[h], 800 * f / (vit * accel), coul(h)); son('break'); await z(700 * f); }
      if (S.tb && !avant.tb){ annonce(t('a_tb'), '', 1000 * f / (vit * accel)); son('jeu_decisif'); await z(950 * f); }
    }
    if (!vivant()) return;
    const w = S.vainqueur, fav = p >= .5 ? 0 : 1;
    await z(500);
    const fin = document.createElement('div'); fin.className = 'ecran';
    fin.innerHTML = `<div class="fin-t">${esc(t('a_fin'))}</div>
      <div class="fin-w" style="color:${coul(w)};text-shadow:0 0 5cqw ${coul(w)}">${esc(t('a_gagne', noms[w]))}</div>
      <div class="fin-s">${esc(scoreTxt(S, w === 1))}</div>
      <div class="fin-p">${t('a_fin_p', esc(noms[fav]), Math.max(p,1-p)*100, nSim)}</div>
      ${enCoursTop && cible && cible[1] != null ? `<div class="fin-p">${t('a_fin_top', esc(cible[0]), cible[1]*100, nSim)}</div>` : ''}
      ${opts.video && Q.get('adresse') === '1' ? `<div class="fin-url">${esc(t('v_url'))}</div>` : ''}
      ${opts.video ? '' : `<button type="button" class="start">↻ ${esc(t('rejouer'))}</button>`}`;
    root.appendChild(fin); son('fin');
    const b = fin.querySelector('.start'); if (b) b.onclick = () => jouer();
    if (!MOINS_ANIM){
      const cols = ['#2EE6FF','#FF4FAE','#D4FF3A','#F4F1FF','#9B6BFF'], H = root.offsetHeight + 60;
      for (let i=0;i<(opts.video?70:36);i++){ const c = document.createElement('i'); c.className='confetti';
        c.style.cssText = `left:${(R()*100).toFixed(1)}%;background:${cols[i%cols.length]};--d:${(2.2+R()*1.6).toFixed(2)}s;--r:${(R()*0.8).toFixed(2)}s;--rot:${Math.round(R()*720-360)}deg;--h:${H}px`;
        root.appendChild(c); }
    }
    opts.onFin && opts.onFin(S);
    if (opts.video){ await dort(4600); window.__fini = true; }
  }
  squelette();
  S = M.etat(0); R = rng(1); pPrec = p; jauges(p); tableau();
  return {
    jouer,
    stop(){ jeton++; },
    accelerer(){ accel = Math.min(accel * 3, 27); },
    finir(){ accel = 1000; },
  };
}

  const scores = (m.scores_probables||[]).slice(0,3).map(([sc,v])=>`<div class="sc"><b>${esc(sc)}</b><span>${dec(v*100,1)}${L==='fr'?'\u202f%':'%'}</span></div>`).join('');
  const f = m.feuille_prevue;
  const lignes = f ? [['aces','aces'],['doubles_fautes','df'],['breaks','breaks'],['premiere_pct','prem'],['jeux_service_gagnes_pct','jsg']]
     .filter(([k])=>f[0]&&f[0][k]!=null).map(([k,lib])=>`<tr><th>${esc(t(lib))}</th><td>${dec(f[0][k],1)}</td><td>${dec(f[1][k],1)}</td></tr>`).join('') : '';
  V.innerHTML = `<div class="ca">
    <div class="haut"><span>${esc(t('c_titre'))}</span><span><b>${esc(t('a_sim'))}</b> ${esc(t('a_fois', D.simulations))}</span></div>
    <h1 style="font-size:${(n1+n2).length > 30 ? 38 : (n1+n2).length > 20 ? 46 : 56}px">${esc(n1)} – ${esc(n2)}</h1>
    <p class="ctx">${esc(m.tournoi)} · ${esc(SURF[L][m.surface]||m.surface||'')} · ${esc(quand)}</p>
    <div class="duel"><div class="pj a"><div class="n">${esc(m.home)}</div><div class="p">${pc0(p)}</div><div class="c">${esc(t('c_victoire'))}</div></div>
      <div class="pj b"><div class="n">${esc(m.away)}</div><div class="p">${pc0(1-p)}</div><div class="c">${esc(t('c_victoire'))}</div></div></div>
    <div class="tir"><i style="width:${(p*100).toFixed(1)}%"></i></div>
    <div class="blocs"><div class="bloc"><h2>${esc(t('c_sets'))}</h2>${sets}</div><div class="bloc"><h2>${esc(t('c_scores'))}</h2>${scores}</div></div>
    ${lignes ? `<div class="bloc" style="margin-top:20px"><h2>${esc(t('c_feuille'))}</h2><table><thead><tr><th></th><th class="a">${esc(n1)}</th><th class="b">${esc(n2)}</th></tr></thead><tbody>${lignes}</tbody></table></div>` : ''}
    <div class="pied">${t('c_pied', D.simulations)}</div></div>`;
  Promise.race([(document.fonts && document.fonts.ready) || Promise.resolve(), dort(3000)]).then(()=>{ window.__fini = true; });
}

rendTextes();
fetch('donnees.json?v=' + Date.now()).then(r=>r.json()).then(d=>{
  D = d;
  selectionId = Q.get('match') || (D.match_du_jour && D.match_du_jour.uid);
  if (Q.get('carte')) modeCarte(); else if (Q.get('video')) modeVideo(); else rendTout();
}).catch(()=>{ document.getElementById('mdj-zone').innerHTML = '<div class="panel empty">Données indisponibles / Data unavailable.</div>'; });
})();
</script>
</body>
</html>
