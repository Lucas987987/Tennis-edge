/* Tennis Edge — l'algo · thème « arcade » (24/10/2026)
   Un seul thème, sombre, comme une borne d'arcade : fond violet nuit, néons cyan (joueur 1) et magenta
   (joueur 2), vert balle de tennis pour l'action. Le Bungee ne sert qu'aux titres et aux gros chiffres ;
   tout le texte courant reste en Barlow, pour la lisibilité. */
:root{
  --bg:#0E0A24; --bg2:#160F38; --panel:#1B1342; --line:rgba(var(--wv),.12); --line2:rgba(var(--wv),.2);
  --ink:#F4F1FF; --dim:#ABA3D6; --p1:#2EE6FF; --p2:#FF4FAE; --ball:#D4FF3A; --ok:#45F0A0; --ko:#FF6B86;
  --disp:"Bungee","Russo One","Arial Black",Impact,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --r-lg:18px; --r-sm:10px;
  color-scheme:dark;
}
/* 07/11/2026 (paquet 217) — thème clair / sombre / auto. La borne de simulation, les cartes des joueurs, le terrain et les images X restent sombres dans les deux thèmes. */
:root{--wv:255,255,255}
html[data-theme="light"]{--bg:#F4F2FB;--bg2:#ECE8F8;--panel:#FFFFFF;--line:rgba(30,20,80,.14);--line2:rgba(30,20,80,.26);--ink:#1B1640;--dim:#5C5788;--p1:#0A7FA3;--p2:#C21F78;--ball:#6F9500;--ok:#0E8A57;--ko:#C92A4D;--wv:30,20,80;color-scheme:light}
html[data-theme="light"] body{background:radial-gradient(900px 520px at 50% -120px,#DAD1FB 0%,transparent 70%),var(--bg)}
html[data-theme="light"] .typem.fiable{color:#0E7A4C}html[data-theme="light"] .typem.fragile{color:#C2412D}
html[data-theme="light"] .panel{box-shadow:0 6px 22px rgba(40,20,120,.08)}
.borne,.cj-c,.arcade{color:#F4F1FF;--wv:255,255,255;--ink:#F4F1FF;--dim:#ABA3D6;--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.2);--bg:#0E0A24;--ok:#45F0A0;--ko:#FF6B86;--ball:#D4FF3A}
header.top{flex-wrap:wrap}.reglages{flex-wrap:wrap;justify-content:flex-end}
@media (max-width:520px){.seg button{padding:6px 9px}}
/* 08/11/2026 (paquet 218) — tiroirs de la fiche : le direct et les statistiques ouverts, le reste replié */
.fiche>.tiroir{border:1px solid var(--line);border-radius:var(--r-lg);background:linear-gradient(180deg,var(--panel),var(--bg2))}
.tiroir>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 16px;min-height:48px}
.tiroir>summary::-webkit-details-marker{display:none}
.tiroir>summary .tt{font-family:var(--disp);font-size:1rem;flex:0 1 auto;min-width:0;overflow-wrap:anywhere}  /* 358 : un titre long (« Feuille de match prévue (moyenne des 20 000 simulations) ») débordait : page plus large que l'écran */
.tiroir>summary .ti{min-width:4.5em}

.tiroir>summary .tc{color:var(--dim);transition:transform .15s;margin-left:auto}.tiroir>summary .ti+.tc{margin-left:0}
.tiroir[open]>summary .tc{transform:rotate(90deg)}
.tiroir:has(>[hidden]){display:none}
.tiroir>.panel{border:0;background:none;box-shadow:none;border-radius:0;margin:0}
.tiroir>.panel>h3:first-child{display:none}

.circ{padding:12px 18px;border-top:1px solid var(--line);font-size:.95rem}

@media (max-width:360px){.calib th,.calib td{padding:8px 6px;font-size:.86rem}}  /* 358 : plus de débordement sur petit écran */
.suivi{padding:18px}

.fiab-detail dl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:6px 0}.fiab-detail dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.styles-descriptifs{padding:16px}
.styles-descriptifs h3{margin:0;font-size:1rem}.styles-intro{margin:4px 0 14px;color:var(--dim);font-size:.88rem;max-width:72ch}
.styles-joueurs{display:grid;gap:16px}.btn-x{margin:16px 0 2px;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:rgba(212,255,58,.1);color:var(--ink);font:600 .95rem Barlow,system-ui,sans-serif;cursor:pointer}.btn-x:disabled{opacity:.5}.xt-barre{margin:0;padding:4px 16px 16px;display:flex;justify-content:flex-end}.btn-xt{min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:none;color:var(--dim);font:600 .85rem Barlow,system-ui,sans-serif;cursor:pointer}.btn-xt:disabled{opacity:.5}.style-joueur{min-width:0;border-top:1px solid var(--line);padding-top:12px}
.style-tete{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}.style-tete h4{margin:0;font-size:1rem}.style-etiquette{font-family:var(--cond);font-weight:600;color:var(--ball)}
.style-contre{margin:3px 0 10px;color:var(--dim);font-size:.88rem}.style-chiffres{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.style-chiffre{min-width:0;border-top:1px solid var(--line);padding-top:8px}.style-chiffre>span{display:block;color:var(--dim);font-size:.82rem}.style-chiffre strong{display:block;font-family:var(--cond);font-size:1.8rem;line-height:1.2;font-variant-numeric:tabular-nums}
.style-joueur.home .style-chiffre strong{color:var(--p1)}.style-joueur.away .style-chiffre strong{color:var(--p2)}
.style-chiffre .style-att{display:block;color:var(--ink);font-size:.8rem;margin:2px 0}.style-att b{font-weight:700;color:var(--dim)}.style-att b.plus{color:var(--ok)}.style-att b.moins{color:var(--ko)}
.sv-phrase{margin:0 0 10px;padding:9px 11px;border-radius:10px;background:rgba(var(--wv),.04);border-left:3px solid var(--dim);font-size:.9rem;line-height:1.45}.sv-phrase b{font-weight:700}.sv-phrase.plus{border-left-color:var(--ok)}.sv-phrase.info{border-left-color:var(--ball)}.sv-phrase.moins{border-left-color:var(--ko)}
.sv-barre{position:relative;height:12px;margin:8px 0 2px;border-radius:6px;background:rgba(var(--wv),.08)}.sv-barre i{position:absolute;top:0;bottom:0}.sv-ic{background:rgba(var(--wv),.18);border-radius:6px}.sv-att{width:2px;margin-left:-1px;top:-3px!important;bottom:-3px!important;background:var(--ink)}.sv-reel{width:10px;height:10px;margin:1px 0 0 -5px;border-radius:50%;background:currentColor}.style-joueur.home .sv-reel,.style-joueur.home .sv-pt{color:var(--p1)}.style-joueur.away .sv-reel,.style-joueur.away .sv-pt{color:var(--p2)}.sv-legende{display:flex;gap:12px;color:var(--dim);font-size:.72rem;margin-bottom:2px}.sv-legende span{display:flex;align-items:center;gap:4px}.sv-pt{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor}.sv-tr{display:inline-block;width:2px;height:10px;background:var(--ink)}
.style-chiffre .style-diff{display:block;color:var(--dim);font-size:.78rem;margin:1px 0 2px}
.rythme .ry-duree{font-family:var(--cond);font-size:1.25rem;margin:4px 0 2px;color:var(--ink)}.rythme .ry-pts{color:var(--dim);font-size:.85rem;margin:0 0 10px}
.marches .mk-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.marches h4{margin:6px 0;font-size:.9rem;color:var(--dim);font-weight:600}
.mk-l{position:relative;display:flex;justify-content:space-between;gap:8px;padding:5px 8px;margin:3px 0;border-radius:6px;overflow:hidden;font-size:.86rem;background:rgba(var(--wv),.03)}
.mk-l i{position:absolute;left:0;top:0;bottom:0;background:var(--p1);opacity:.14;pointer-events:none}.mk-l b{font-variant-numeric:tabular-nums}
.duel-sr .du-l{border-top:1px solid var(--line);padding:8px 0}.duel-sr .du-l p{margin:0 0 4px;font-size:.88rem;color:var(--dim)}
.du-v{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.du-v b{font-family:var(--cond);font-size:1.5rem}.du-v .c1 b{color:var(--p1)}.du-v .c2 b{color:var(--p2)}.du-v em{color:var(--dim);font-style:normal}.duel-sr small{color:var(--ball)}
.style-chiffre .style-ic{color:var(--dim);font-size:.78rem}.style-alerte{display:block;color:var(--ball);font-size:.76rem;margin-top:2px}.style-vide{font-size:1.15rem!important;color:var(--dim)!important}
.style-details{margin-top:10px;border-top:1px solid var(--line)}.style-details summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600;font-size:.9rem}
.style-matchs{list-style:none;margin:0;padding:0}.style-matchs li{display:grid;grid-template-columns:1.5em minmax(0,1fr) auto;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:.86rem;align-items:start}
.style-matchs .issue{font-weight:700}.style-matchs .issue.v{color:var(--ok)}.style-matchs .issue.d{color:var(--ko)}.style-matchs small{display:block;color:var(--dim)}.style-matchs .score{white-space:nowrap;font-variant-numeric:tabular-nums}
.styles-note{margin:14px 0 0;color:var(--dim);font-size:.82rem;max-width:72ch}
@media (min-width:650px){.styles-joueurs{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}}
@media(max-width:420px){.style-chiffres{grid-template-columns:1fr}.style-matchs li{grid-template-columns:1.5em minmax(0,1fr)}.style-matchs .score{grid-column:2}}
.qualite{padding:18px}.qualite-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.qualite-grid b{display:block;font-family:var(--cond);font-size:1.6rem;color:var(--ball);font-variant-numeric:tabular-nums}.qualite-grid span{color:var(--dim);font-size:.88rem}.qualite p{color:var(--dim);font-size:.88rem;max-width:72ch;margin:14px 0 0;overflow-wrap:anywhere}
@media(max-width:520px){.suivi-grid,.qualite-grid{grid-template-columns:1fr}.suivi-circuit{display:grid;grid-template-columns:1fr auto;align-items:baseline}.suivi-circuit small{grid-column:1/-1}}
.plus{padding:18px}
.plus ul{margin:10px 0 0;padding-left:1.1em}
.plus li{margin:4px 0}
.plus .soon{display:inline-block;margin-top:12px}
.aide-ios{display:block;font-size:.9rem;color:var(--dim);border:1px dashed var(--line,rgba(255,255,255,.2));border-radius:12px;padding:10px 12px}
.plus-preuve{margin:10px 0 0;font-size:.92rem;color:var(--dim)}.plus-preuve b{color:var(--ink)}
.plus-comp-wrap{overflow-x:auto;margin:12px 0 0}.plus-comp{width:100%;border-collapse:collapse;font-size:.9rem}
.plus-comp th{font-weight:700;text-align:center;padding:6px 8px;border-bottom:1px solid var(--line,rgba(255,255,255,.12))}.plus-comp th:first-child{text-align:left}
.plus-comp td{padding:7px 8px;border-bottom:1px solid var(--line,rgba(255,255,255,.08));text-align:center;vertical-align:middle}.plus-comp td:first-child{text-align:left}
.plus-comp .oui{color:var(--ok);font-weight:700}.plus-comp .non{color:var(--dim)}.plus-comp small{color:var(--dim);font-size:.78rem}
.plus-comp th.p,.plus-comp td.p{background:rgba(46,230,255,.07)}
.plus .lien.plus-ex{background:none;border:0;color:var(--p1);cursor:pointer;padding:6px 0;font:inherit;font-size:.92rem;text-decoration:underline}
.fd-pay{margin-top:14px}.fd-pay .iban{font-family:ui-monospace,Menlo,monospace;background:rgba(var(--wv),.06);border-radius:8px;padding:10px 12px;margin:8px 0 0;line-height:1.6;user-select:all;word-break:break-all}
/* 23/11/2026 (paquet 377) — comptes et accès Plus */
a.compte-b{color:inherit;text-decoration:none}
.lien-joueur{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px}.lien-joueur::after{content:'';width:6px;height:6px;border:solid currentColor;border-width:2px 2px 0 0;transform:rotate(45deg);opacity:.4;flex:none;transition:opacity .15s,transform .15s}.lien-joueur:hover::after,.lien-joueur:focus-visible::after{opacity:.9;transform:translateX(2px) rotate(45deg)}
.compte-b{border:1px solid var(--line2);background:rgba(var(--wv),.06);border-radius:999px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:.85rem;white-space:nowrap}
.compte-b.plus{border-color:var(--ball)}
.compte-fond{position:fixed;inset:0;background:rgba(5,3,18,.72);display:grid;place-items:center;z-index:9000;padding:16px}
.compte-fond[hidden]{display:none}
.compte-boite{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line2);border-radius:16px;width:min(400px,100%);padding:18px;max-height:92vh;overflow:auto}
.compte-boite h3{margin:0 0 10px;font-family:var(--disp)}
.compte-boite label{display:block;font-size:.85rem;color:var(--dim);margin:10px 0 4px}
.compte-boite input{width:100%;box-sizing:border-box;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);color:var(--ink)}
.compte-boite .btn{width:100%;margin-top:14px}
.compte-boite .lien{background:none;border:0;color:var(--p1);cursor:pointer;padding:6px 0;font:inherit;font-size:.88rem;text-decoration:underline;display:block}
.compte-boite .msg{margin:10px 0 0;font-size:.9rem}.compte-boite .msg.ko{color:var(--ko)}.compte-boite .msg.ok{color:var(--ok)}
.fondateurs{border-top:1px solid var(--line,rgba(255,255,255,.12));margin-top:16px}.fondateurs .actions{display:flex;gap:8px;flex-wrap:wrap}
.fondateurs .msg{font-size:.9rem}.fondateurs .msg.ok{color:var(--ok)}.fondateurs .msg.ko{color:var(--ko)}
.fondateurs .lien{background:none;border:0;color:var(--p1);cursor:pointer;padding:6px 0;font:inherit;font-size:.88rem;text-decoration:underline;display:block}
.compte-boite .ferme{float:right;background:none;border:0;color:var(--dim);font-size:1.3rem;cursor:pointer;line-height:1}
.verrou-b{display:inline-block;padding:3px 9px;border-radius:999px;border:1px solid var(--ball);font-size:.78rem;font-weight:700;color:var(--ink)}
.verrou-p{padding:18px;text-align:center}.verrou-p .vs{font-family:var(--disp);font-size:1.15rem;margin:6px 0}
.verrou-p .actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
footer{color:var(--dim);font-size:.86rem;padding:22px 0 44px;border-top:1px solid var(--line);margin-top:44px}
footer p{max-width:72ch}

.legal-liens a{color:var(--dim);text-decoration:underline;text-underline-offset:3px}

.legal-boite p,.legal-boite li{color:var(--ink);opacity:.92}.legal-boite .maj{color:var(--dim);font-size:.82rem}
.legal-x{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--ink);font-size:1.8rem;line-height:1;cursor:pointer}

/* ── la borne d'arcade : même composant sur le site (dans .ecran-jeu) et dans la vidéo (plein écran 9:16) ──
   Toutes les tailles sont en cqw (largeur du conteneur) : la scène s'adapte à n'importe quelle largeur. */
.arcade{--ar-bg:#0E0A24;--ar-p1:#2EE6FF;--ar-p2:#FF4FAE;--ar-ball:#D4FF3A;--ar-ink:#F4F1FF;--ar-dim:#ABA3D6;--ar-disp:var(--disp);
  container-type:inline-size;position:relative;width:100%;height:100%;overflow:hidden;color:var(--ar-ink);font-family:var(--cond);
  background:radial-gradient(120cqw 80cqw at 50% 0%,#3A1F8F 0%,transparent 60%),radial-gradient(90cqw 70cqw at 50% 105%,#0F5C66 0%,transparent 60%),var(--ar-bg)}
.arcade .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(var(--wv),.05) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--wv),.05) 1px,transparent 1px);background-size:6cqw 6cqw;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 70%,transparent)}
.arcade .scene{position:absolute;inset:0;display:flex;flex-direction:column;padding:6cqw 5cqw 5cqw}
.arcade .tag{display:flex;justify-content:space-between;align-items:center;gap:2cqw;font-size:3.4cqw;color:var(--ar-dim);font-weight:600}
.arcade .tag > span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arcade .tag b{color:var(--ar-ball);font-family:var(--ar-disp);font-weight:400}
.arcade .live{display:inline-flex;align-items:center;gap:1.6cqw;padding:1cqw 2.4cqw;border-radius:99cqw;background:rgba(255,79,174,.16);color:#FF9ACF;font-family:var(--ar-disp);font-size:2.9cqw;white-space:nowrap}
.arcade .live i{width:1.8cqw;height:1.8cqw;border-radius:50%;background:var(--ar-p2);box-shadow:0 0 2cqw var(--ar-p2);animation:clign 1s steps(2) infinite}
@keyframes clign{50%{opacity:.2}}
.arcade .duel{display:grid;grid-template-columns:1fr 1fr;gap:3cqw;margin-top:4.5cqw}
.arcade .pj{padding:3cqw;border-radius:3cqw;background:linear-gradient(160deg,rgba(var(--wv),.08),rgba(var(--wv),.02));border:.4cqw solid rgba(var(--wv),.12);transition:box-shadow .15s,border-color .15s;min-width:0}
.arcade .pj.p1{--c:var(--ar-p1)} .arcade .pj.p2{--c:var(--ar-p2);text-align:right}
.arcade .pj .nom{font-family:var(--ar-disp);font-size:5.2cqw;line-height:1.05;color:var(--c);text-shadow:0 0 3cqw color-mix(in srgb,var(--c) 60%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arcade .pj .pct{font-family:var(--ar-disp);font-size:10.5cqw;line-height:1;margin-top:1.5cqw;font-variant-numeric:tabular-nums}
.arcade .pj .lbl{font-size:3cqw;color:var(--ar-dim);font-weight:600}
.arcade .vie{height:3cqw;border-radius:2cqw;background:rgba(var(--wv),.1);margin-top:2cqw;overflow:hidden;position:relative}
.arcade .vie i{position:absolute;top:0;bottom:0;background:var(--c);box-shadow:0 0 3cqw var(--c);transition:width .25s ease-out}
.arcade .p1 .vie i{left:0} .arcade .p2 .vie i{right:0}
.arcade .pj.flash{border-color:var(--c);box-shadow:0 0 6cqw color-mix(in srgb,var(--c) 70%,transparent)}
.arcade .secoue{animation:secoue .35s}
@keyframes secoue{20%{transform:translate(-1.2cqw,.6cqw)}40%{transform:translate(1.2cqw,-.6cqw)}60%{transform:translate(-.8cqw,.4cqw)}80%{transform:translate(.6cqw,0)}}
.arcade .score{margin-top:3.5cqw;border-radius:3cqw;background:rgba(5,3,20,.65);border:.4cqw solid rgba(var(--wv),.12);padding:1.6cqw 3cqw}
.arcade .score table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.arcade .score td{font-family:var(--ar-disp);font-size:6cqw;padding:.7cqw 1.3cqw;text-align:center}
.arcade .score td.n{text-align:left;font-size:5cqw;width:100%;white-space:nowrap;max-width:0;overflow:hidden;text-overflow:ellipsis}
.arcade .score tr.r1 td.n{color:var(--ar-p1)} .arcade .score tr.r2 td.n{color:var(--ar-p2)}
.arcade .score td.s{color:var(--ar-dim)}
.arcade .score td.pt{min-width:2.6em;background:var(--ar-ball);color:#160E33;border-radius:1.4cqw}
.arcade .score .srv{display:inline-block;width:2.2cqw;height:2.2cqw;border-radius:50%;background:var(--ar-ball);box-shadow:0 0 2cqw var(--ar-ball);margin-right:2cqw;vertical-align:middle;visibility:hidden}

    vent: ({calme: fr?'Vent calme (< 15 km/h)':'Light wind (< 15 km/h)', modere: fr?'Vent modéré (15–30 km/h)':'Moderate wind (15–30 km/h)', fort: fr?'Vent fort (> 30 km/h)':'Strong wind (> 30 km/h)'})[C.vent],

// 22/11/2026 (paquet 354) — BILANS DANS CES CONDITIONS EN BARRES : pour chaque condition, une barre par joueur partant

function divergentConditions(R, N, pts, bruit, MIN){

  if (!V.length) return '';

  const barre = (c, i) => {
    if (c.n < MIN) return `<div class="cj-b vide"><span class="cj-axe"><s></s></span><em>${esc(c.n ? `— · ${fmt(c.n)} m.` : (fr?'— · jamais':'— · never'))}</em></div>`;
    const p = pts(c, i), net = Math.abs(p) >= bruit(c.n), w = Math.min(50, Math.abs(p) / ech * 50);
    const style = p >= 0 ? `left:50%;width:${w.toFixed(1)}%` : `left:${(50 - w).toFixed(1)}%;width:${w.toFixed(1)}%`;
    return `<div class="cj-b"><span class="cj-axe"><s></s><i class="${i ? 'c2' : 'c1'}${net ? '' : ' pale'}" style="${style}"></i></span><em class="${net ? (p > 0 ? 'ok' : 'ko') : ''}">${p>0?'+':''}${dec(p,0)} · ${fmt(c.n)} m.</em></div>`;
  };
  return `<div class="cj-vis"><div class="cj-leg"><span class="a">${esc(N[0])}</span><span class="b">${esc(N[1])}</span><span class="cj-sens">${esc(fr ? `← moins bien · 0 = comme d’habitude · mieux → (échelle ±${ech} pts ; pâle = dans le bruit)` : `← worse · 0 = as usual · better → (scale ±${ech} pts; faded = within noise)`)}</span></div>
    ${R.map(r => `<div class="cj-r"><div class="cj-l">${esc(r.lib)}</div>${barre(r.cel[0], 0)}${barre(r.cel[1], 1)}</div>`).join('')}</div>`;
}

        score: SH.map((x, i) => `${+x || 0}-${+SA[i] || 0}`).join(' '),
        feuille: [0, 1].map(i => ({ aces: ac ? (+ac[2*i] || 0) : null, breaks: bk ? (+bk[2*i] || 0) : null,

function rng(seed){ let a = seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

  const memo = new Map();

    if (a>=3 && b>=3){ const d = p*p/(p*p+(1-p)*(1-p)); return a===b ? d : (a>b ? p+(1-p)*d : p*d); }

  function pTB(i,j,s0,cible){                    // P(home gagne le jeu décisif) depuis i-j
    if (i>=cible && i-j>=2) return 1; if (j>=cible && j-i>=2) return 0;
    if (i===j && i>=cible-1){ const k=i+j, p1=pServ(tbServ(k,s0)), p2=pServ(tbServ(k+1,s0)); const w=p1*p2, l=(1-p1)*(1-p2); return w/(w+l); }

    const p=pServ(tbServ(i+j,s0)); const v=p*pTB(i+1,j,s0,cible)+(1-p)*pTB(i,j+1,s0,cible); memo.set(key,v); return v;
  }

  function setDist(gh,ga,srv,fin){
    if ((gh>=6 && gh-ga>=2) || gh===7) return [srv===0?1:0, srv===1?1:0, 0,0];
    if ((ga>=6 && ga-gh>=2) || ga===7) return [0,0, srv===0?1:0, srv===1?1:0];
    const key='s'+gh+','+ga+','+srv+','+fin; if (memo.has(key)) return memo.get(key);

      const ps = S.srv===0 ? pGame(A,S.pts[0],S.pts[1]) : 1-pGame(B,S.pts[1],S.pts[0]);

/* Les probabilités au service (a, b) sont décalées d'un même δ (a + δ, b − δ) pour que le match simulé
   donne exactement le % publié : la simulation rejouée raconte la même histoire que le pronostic. */
function calibre(sim, p){
  const f = d => Moteur({...sim, a: sim.a + d, b: sim.b - d}).pLive(Moteur(sim).etat(0)) - p;
  let lo = -0.2, hi = 0.2;
  if (f(lo) > 0 || f(hi) < 0) return sim;
  for (let k=0;k<40;k++){ const mid=(lo+hi)/2; if (f(mid) < 0) lo = mid; else hi = mid; }
  const d=(lo+hi)/2; return {...sim, a: sim.a + d, b: sim.b - d};
}

      <div class="tag"><span class="live"><i></i>${esc(t('a_live'))}</span><span>${esc(m.tournoi)}</span><span><b>${esc(t('a_sim'))}</b> ${esc(t('a_fois', nSim))}</span></div>
      <div class="duel">${[0,1].map(i=>`<div class="pj p${i+1}" data-pj="${i}"><div class="nom">${i === 0 ? drap[0] + esc(noms[0]) : esc(noms[1]) + drap[1]}</div>
        <div class="pct" data-pc="${i}"></div><div class="lbl">${esc(t('a_chance'))}</div><div class="vie"><i data-vie="${i}"></i></div></div>`).join('')}</div>
      <div class="score"><table><tbody><tr class="r1" data-sr="0"></tr><tr class="r2" data-sr="1"></tr></tbody></table></div>
      ${fp ? '<div class="stats" data-stats></div>' : ''}
      <div class="arene"><div class="court"><div class="cote haut" data-cote="1"></div><div class="cote bas" data-cote="0"></div>
        <div class="filet"></div><div class="joueur j0">${esc(ini(noms[0]))}</div><div class="joueur j1">${esc(ini(noms[1]))}</div><div class="balle"></div></div></div>
      <div class="legende vide" data-legende></div>
      ${LG.length ? `<div class="lgn">${LG.map((x,i)=>`<div data-lg="${i}"><span>${esc(x.lib)}</span><span><b>${pc0(x.p)}</b> <i></i></span></div>`).join('')}</div>` : ''}
      <div class="pied">${esc(t('a_pied', nSim))}</div></div>
      <div class="annonce"></div><div class="mini"></div><div class="frappes"></div><div class="combo"></div><div class="ralenti">${esc(t('a_ralenti'))}</div>
      <div class="ecran intro">${opts.video ? `<div class="vs-h">${Math.max(p,1-p) < .55 ? esc(t('a_serre')) + ' · ' + pc0(Math.max(p,1-p))
          : `${drap[p >= .5 ? 0 : 1]}${esc(noms[p >= .5 ? 0 : 1])} ${pc0(Math.max(p,1-p))}`}<small>${esc(t('a_hook', nSim))}</small></div>` : ''}
        <div class="vs-n a">${drap[0]}${esc(m.home)}</div><div class="vs-x">VS</div>
        <div class="vs-n b">${esc(m.away)}${drap[1]}</div><div class="vs-t">${t(enCoursTop ? 'a_vs_top' : 'a_vs_t', nSim)}</div>
        ${opts.video ? '' : `<button type="button" class="start">▶ ${esc(t('jouer'))}</button>`}</div>`;
    const b = $('.start'); if (b) b.onclick = () => jouer();
  }
  let S, R, pPrec;
  function jauges(q){
    [q, 1-q].forEach((v,i)=>{ $(`[data-pc="${i}"]`).textContent = pc0(v); $(`[data-vie="${i}"]`).style.width = (v*100).toFixed(1)+'%'; });
    if (Math.abs(q - pPrec) > 0.06 && !MOINS_ANIM){ const d = $(`[data-pj="${q > pPrec ? 0 : 1}"]`); d.classList.remove('secoue'); void d.offsetWidth; d.classList.add('secoue'); }
    pPrec = q;
  }
  function tableau(){
    const srv = S.fini ? -1 : M.serveur(S);
    [0,1].forEach(i=>{
      $(`[data-sr="${i}"]`).innerHTML = `<td class="n"><span class="srv ${srv===i?'on':''}"></span>${drap[i]}${esc(noms[i])}</td>`
        + S.histo.map(h=>`<td class="s">${h[i]}</td>`).join('')
        + (S.fini ? '' : `<td>${S.jeux[i]}</td><td class="pt">${affPts(S,i)}</td>`);
    });
  }
  let ST = [[0,0],[0,0]], Rv = Math.random;            // [aces, doubles fautes] par joueur ; tirage du « type » de point
  function stats(){
    const z = $('[data-stats]'); if (!z) return;
    z.innerHTML = `<span>${esc(t('a_aces'))} <b class="c1">${ST[0][0]}</b> · <b class="c2">${ST[1][0]}</b></span>`
      + `<span>${esc(t('a_dfs'))} <b class="c1">${ST[0][1]}</b> · <b class="c2">${ST[1][1]}</b></span>`;
  }
  function ini(n){ const w = String(n||'').trim().split(/\s+/); return (w[w.length-1]||'?').slice(0,2).toUpperCase(); }
  // 05/11/2026 — légende du point : seulement ce que la simulation sait (ace, double faute, longueur de l'échange,
  // break, balle de break sauvée, jeu blanc, set) — aucun coup droit / revers inventé
  function legende(html, i){
    const z = $('[data-legende]'); if (!z) return;
    z.innerHTML = html ? `<span>${html}</span>` : ''; z.style.setProperty('--c', i == null ? '' : coul(i)); z.classList.toggle('vide', !html);
  }
  function lignesEtat(fin){
    if (!LG.length || !S) return;
    const jeux = S.histo.reduce((a,h)=>a+h[0]+h[1],0) + (S.fini ? 0 : S.jeux[0]+S.jeux[1]);
    const tb = S.histo.some(h => Math.max(h[0],h[1]) === 7 && Math.min(h[0],h[1]) === 6) || S.tb;
    const N = (m.simulation && m.simulation.sets_gagnants) || 2, dec = S.sets[0] === N-1 && S.sets[1] === N-1;
    LG.forEach((x,i)=>{ const el = $(`[data-lg="${i}"]`); if (!el) return;
      let ok = x.cle === 'total' ? jeux > x.n : x.cle === 'tb' ? tb : x.cle === 'decisif' ? dec || (S.fini && S.histo.length === 2*N-1) : null;
      if (x.cle === 'hand' && fin){ const d = S.histo.reduce((a,h)=>a+h[x.fav]-h[1-x.fav],0); ok = d > x.n; }
      el.className = ok ? 'oui' : (fin ? 'non' : ''); });
  }
  function placer(j, x, ms){                          // j : 0 bas, 1 haut ; x en % de la largeur du court
    const el = $(`.joueur.j${j}`); if (!el) return;
    el.style.transition = `left ${Math.max(0, ms)}ms cubic-bezier(.3,.1,.3,1)`; el.style.left = Math.max(8, Math.min(92, x)).toFixed(1) + '%';
  }
  function auService(sv, n){                         // côté égalité / avantage selon le nombre de points du jeu
    const droite = n % 2 === 0, xs = sv === 0 ? (droite ? 58 : 42) : (droite ? 42 : 58);
    placer(sv, xs, 160); placer(1 - sv, 100 - xs + (sv === 0 ? 8 : -8), 160);
  }
  function mini(txt, couleur, ms){
    const a = $('.mini'); a.classList.remove('pop'); void a.offsetWidth;
    a.textContent = txt; a.style.color = couleur || ''; a.style.setProperty('--duree', Math.max(380, ms) + 'ms'); a.classList.add('pop');
  }
  function balleVers(cote, ms, filet){                 // cote 0 = bas (joueur 1), 1 = haut (joueur 2)
    const b = $('.balle'), alea = (a,z) => a + (z-a) * Rv();
    b.style.transition = `left ${ms}ms cubic-bezier(.3,.1,.3,1), top ${ms}ms cubic-bezier(.3,.1,.3,1)`;
    const x = alea(18, 82);
    b.style.left = x.toFixed(1) + '%';
    b.style.top = (filet ? 50 + (cote ? -2 : 2) : cote === 0 ? alea(60, 92) : alea(8, 40)).toFixed(1) + '%';
    if (!filet) placer(cote, x, ms);                  // celui qui reçoit court vers la balle
  }
  function frappe(h, ms){
    const b = $('.balle'), perdant = 1 - h, alea = (a,z) => a + (z-a) * R();
    b.style.transition = `left ${ms}ms cubic-bezier(.3,.1,.3,1), top ${ms}ms cubic-bezier(.3,.1,.3,1)`;
    const x = alea(14, 86), j = $(`.joueur.j${perdant}`), x0 = j ? parseFloat(j.style.left) || 50 : 50;
    b.style.left = x.toFixed(1) + '%';
    b.style.top = (perdant === 0 ? alea(60, 92) : alea(8, 40)).toFixed(1) + '%';
    placer(perdant, x0 + (x - x0) * 0.55, ms);        // le perdant du point court… sans l'atteindre
    const c = $(`[data-cote="${perdant}"]`), base = 'cote ' + (perdant ? 'haut' : 'bas');
    c.className = base + ' eclat-p' + (h+1); setTimeout(()=>{ c.className = base; }, Math.max(120, ms));
    const pj = $(`[data-pj="${h}"]`); pj.classList.add('flash'); setTimeout(()=>pj.classList.remove('flash'), Math.max(120, ms));
    son('frappe' + h);
  }
  function annonce(txt, sous, ms, couleur){
    const a = $('.annonce'); a.classList.remove('pop'); void a.offsetWidth;
    a.innerHTML = esc(txt) + (sous ? `<small>${esc(sous)}</small>` : '');
    a.style.color = couleur || ''; a.style.setProperty('--duree', ms + 'ms'); a.classList.add('pop');
  }
  function enjeu(X){                                   // point important : match > set > break (pour qui)
    let best = null;
    for (const h of [0,1]){
      const C = JSON.parse(JSON.stringify(X)), srv = M.serveur(X), tb = X.tb;
      M.point(C, h === 0 ? 0 : 0.9999999);
      const set = C.sets[0]+C.sets[1] > X.sets[0]+X.sets[1], jeu = set || C.jeux[0]+C.jeux[1] > X.jeux[0]+X.jeux[1];
      const k = C.fini ? 3 : set ? 2 : (jeu && !tb && h !== srv) ? 1 : 0;
      if (k && (!best || k > best.k)) best = {k, h};
    }
    return best;
  }
  function preparer(seed, premier){
    S = M.etat(premier == null ? seed % 2 : premier); R = rng(seed); pPrec = p;
    const decal = logit(Math.min(.995,Math.max(.005,p))) - logit(Math.min(.995,Math.max(.005,M.pLive(S))));
    return () => { const q = M.pLive(S); return (q<=0||q>=1) ? q : sig(logit(q)+decal); };
  }
  async function jouer(seedVoulu){
    const mon = ++jeton, vivant = () => mon === jeton;
    let seed = seedVoulu != null ? seedVoulu : (opts.seed != null && mon === 1 ? opts.seed : null);
    enCoursTop = false;
    if (seed == null && traceTop){ seed = (scenario.simulation_index || 0) + 1; enCoursTop = true; }
    if (seed == null && !traceTop){ const k = chercherTop(); if (k != null){ seed = k; enCoursTop = true; } }
    if (seed == null) seed = Math.floor(Math.random()*1e9);
    const traceActive = enCoursTop && traceTop;
    const premier = traceActive ? scenario.premier_serveur : seed % 2;
    let iTrace = 0, iBlanc = 0;
    const pointSuivant = (X, Rng, blanc) => {
      const i = blanc ? iBlanc++ : iTrace++;
      return M.point(X, traceActive ? (Number(traceTop[i]) === 0 ? 0 : 0.9999999) : Rng());
    };
    const vit = opts.vitesse || 1; accel = 1;
    const z = ms => dort(ms / (vit * accel));
    if (!opts.video || mon > 1 || enCoursTop) squelette();
    opts.onDebut && opts.onDebut();
    const pAff = preparer(seed, premier);
    jauges(p); tableau();
    son('vs', opts.video ? 450 : 0);
    if (opts.video){
      await Promise.race([(document.fonts && document.fonts.load ? document.fonts.load('40px Bungee') : Promise.resolve()), dort(3000)]);
      window.__pret = true;
      await z(Number(Q.get('attente') || 1900));
    } else await z(1300);
    if (!vivant()) return;
    $('.intro').classList.add('cache');
    await z(500);
    // Rythme calé sur une durée cible : le match est d'abord joué « à blanc » (même tirage) pour compter ses
    // points et ses moments forts ; vitesse et ralentis sont dosés en conséquence.
    const CIBLE = (opts.duree || 27) * 1000;
    const gagnesSrv = [0,0], perdusSrv = [0,0];
    const blanc = (() => { const Rb = rng(seed), X = M.etat(premier); let n = 0, ev = 0;
      while (!X.fini){ const e = enjeu(X); const a = {s: X.sets[0]+X.sets[1], j: X.jeux[0]+X.jeux[1], v: M.serveur(X), tb: X.tb};
        const h = pointSuivant(X, Rb, true); n++; if (e) ev += 930;
        if (h === a.v) gagnesSrv[a.v]++; else perdusSrv[a.v]++;
        if (!X.fini && X.sets[0]+X.sets[1] > a.s) ev += 1100; else if (!X.fini && X.jeux[0]+X.jeux[1] > a.j && !a.tb && h !== a.v) ev += 700;
        if (X.tb && !a.tb) ev += 950; }
      return {n, ev}; })();
    // taux d'aces (parmi les points gagnés au service) et de doubles fautes (parmi les points perdus au service),
    // calés pour que ce match montre en moyenne le nombre prévu par l'algo ; sans feuille prévue : aucun
    const pAce = [0,1].map(i => fp && fp[i] ? Math.min(.45, (Number(fp[i].aces)||0) / Math.max(1, gagnesSrv[i])) : 0);
    const pDF = [0,1].map(i => fp && fp[i] ? Math.min(.35, (Number(fp[i].doubles_fautes)||0) / Math.max(1, perdusSrv[i])) : 0);
    ST = [[0,0],[0,0]]; Rv = rng((seed * 7 + 13) >>> 0); stats();
    const fixe = 3100 + 5100;
    const f = Math.max(0.45, Math.min(1, 0.55 * (CIBLE - fixe) / Math.max(1, blanc.ev)));
    const base = Math.max(28, Math.min(64, (CIBLE - fixe - f * blanc.ev) / Math.max(1, blanc.n)));
    let serie = 0, dernier = -1, nset = 1;
    while (!S.fini){
      if (!vivant()) return;
      const e = enjeu(S);
      let ms = base;
      if (e && accel < 10){
        annonce([null, t('a_bb'), t('a_bs'), t('a_bm')][e.k], noms[e.h], 950 * f / (vit * accel), coul(e.h));
        $('.ralenti').classList.add('on'); son(e.k === 3 ? 'balle_match' : 'annonce');
        await z(600 * f); ms = 330 * f;
        if (!vivant()) return;
      }
      const avant = { sets: S.sets[0]+S.sets[1], jeux: S.jeux[0]+S.jeux[1], srv: M.serveur(S), tb: S.tb, pts: S.pts.slice() };
      auService(avant.srv, avant.pts[0] + avant.pts[1]);
      const h = pointSuivant(S, R, false);
      // 04/11/2026 — nature du point (affichage seul, tirage séparé) : ace, double faute ou échange de n frappes
      const sv = avant.srv, u = Rv();
      const genre = h === sv && u < pAce[sv] ? 'ace' : h !== sv && u < pDF[sv] ? 'df' : 'echange';
      if (genre === 'ace'){ ST[sv][0]++; stats(); }
      if (genre === 'df'){ ST[sv][1]++; stats(); }
      let nf = 1;
      if (genre === 'echange'){
        nf = 1 + Math.floor(Math.log(1 - Rv()) / Math.log(1 - 1 / Math.max(1.2, FRAPPES)));
        if ((nf % 2 === 1) !== (h === sv)) nf++;          // le dernier coup gagnant est celui du vainqueur du point
      }
      const budget = ms * 0.9 / (vit * accel);
      if (genre === 'df'){
        balleVers(1 - sv, Math.min(budget, 300) / 2, true); son('frappe' + sv);
        if (budget >= 160) mini(t('a_df'), coul(1 - sv), budget * 2.2);
        await z(Math.min(ms, 300) / 2);
        frappe(h, Math.min(budget, 300) / 2);
      } else if (genre === 'ace'){
        frappe(h, Math.min(budget, 260));
        if (budget >= 160) mini(t('a_ace'), coul(sv), budget * 2.2);
      } else if (nf > 1 && budget >= 240){               // échange visible : seulement quand le jeu ralentit
        const pas = Math.max(70, Math.min(260, budget / nf));
        const fr = $('.frappes'); if (nf >= 7){ fr.textContent = t('a_frappes', nf); fr.classList.add('on'); }
        for (let k = 0; k < nf - 1; k++){ const qui = (k % 2 === 0) ? sv : 1 - sv; balleVers(1 - qui, pas); son('frappe' + qui); await z(pas * vit * accel); if (!vivant()) return; }
        frappe(h, pas); fr.classList.remove('on');
      } else frappe(h, Math.min(budget, 380));
      serie = h === dernier ? serie + 1 : 1; dernier = h;
      if (serie >= 4 && serie % 2 === 0) son('combo');
      const cb = $('.combo'); if (serie >= 4){ cb.textContent = t('a_combo', serie); cb.style.color = coul(h); cb.classList.add('on'); } else cb.classList.remove('on');
      jauges(pAff()); tableau();
      {                                                // légende : le fait le plus marquant du point
        const sets_ = S.sets[0]+S.sets[1], jeux_ = S.jeux[0]+S.jeux[1], nom = i => esc(noms[i]);
        const setFini = sets_ > avant.sets || (S.fini && S.histo.length);
        const jeuFini = setFini || jeux_ > avant.jeux;
        let lg;
        if (setFini){ const hs = S.histo[S.histo.length - 1] || [0,0]; lg = t('lg_set', nom(h), `${hs[h]}-${hs[1-h]}`); }
        else if (jeuFini && !avant.tb && h !== sv) lg = t('lg_break', nom(h), nom(sv));
        else if (e && e.k === 1 && h === sv) lg = t('lg_sauve', nom(sv));
        else if (jeuFini && !avant.tb && h === sv && avant.pts[1 - sv] === 0) lg = t('lg_blanc', nom(sv));
        else if (genre === 'ace') lg = t('lg_ace', nom(sv));
        else if (genre === 'df') lg = t('lg_df', nom(sv));
        else if (nf === 1) lg = t('lg_srv', nom(h));
        else if (nf === 2) lg = t('lg_ret', nom(h));
        else if (nf >= 3) lg = t('lg_ech', nom(h), nf);
        else lg = t('lg_pt', nom(h));
        legende(lg, h);
        lignesEtat(false);
      }
      await z(ms);
      if (!vivant()) return;
      $('.ralenti').classList.remove('on');
      if (S.fini) break;
      if (accel >= 10) continue;
      const sets = S.sets[0]+S.sets[1], jeux = S.jeux[0]+S.jeux[1];
      if (sets > avant.sets){ nset++; annonce(t('a_set', nset - 1), t('a_pour', noms[h]), 1150 * f / (vit * accel), coul(h)); son('set'); await z(1100 * f); }
      else if (jeux > avant.jeux && !avant.tb && h !== avant.srv){ annonce(t('a_break'), noms[h], 800 * f / (vit * accel), coul(h)); son('break'); await z(700 * f); }
      if (S.tb && !avant.tb){ annonce(t('a_tb'), '', 1000 * f / (vit * accel)); son('jeu_decisif'); await z(950 * f); }
    }
    if (!vivant()) return;
    const w = S.vainqueur, fav = p >= .5 ? 0 : 1;
    lignesEtat(true);
    await z(500);
    const fin = document.createElement('div'); fin.className = 'ecran';
    fin.innerHTML = `<div class="fin-t">${esc(t('a_fin'))}</div>
      <div class="fin-w" style="color:${coul(w)};text-shadow:0 0 5cqw ${coul(w)}">${esc(t('a_gagne', noms[w]))}</div>
      <div class="fin-s">${esc(scoreTxt(S, w === 1))}</div>
      <div class="fin-p">${t('a_fin_p', esc(noms[fav]), Math.max(p,1-p)*100, nSim)}</div>
      ${enCoursTop && cible && cible[1] != null ? `<div class="fin-p">${t('a_fin_top', esc(cible[0]), cible[1]*100, nSim)}</div>` : ''}
      ${fp && fp[0] && fp[1] && fp[0].aces != null ? `<div class="fin-p">${t('a_fin_stats', ST[0][0], ST[1][0], dec(fp[0].aces,1), dec(fp[1].aces,1))}</div>` : ''}
      ${opts.video && Q.get('adresse') === '1' ? `<div class="fin-url">${esc(t('v_url'))}</div>` : ''}
      ${opts.video ? '' : `<button type="button" class="start">↻ ${esc(t('rejouer'))}</button>`}`;
    root.appendChild(fin); son('fin');
    const b = fin.querySelector('.start'); if (b) b.onclick = () => jouer();
    if (!MOINS_ANIM){
      const cols = ['#2EE6FF','#FF4FAE','#D4FF3A','#F4F1FF','#9B6BFF'], H = root.offsetHeight + 60;
      for (let i=0;i<(opts.video?70:36);i++){ const c = document.createElement('i'); c.className='confetti';
        c.style.cssText = `left:${(R()*100).toFixed(1)}%;background:${cols[i%cols.length]};--d:${(2.2+R()*1.6).toFixed(2)}s;--r:${(R()*0.8).toFixed(2)}s;--rot:${Math.round(R()*720-360)}deg;--h:${H}px`;
        root.appendChild(c); }
    }
    opts.onFin && opts.onFin(S);
    if (opts.video){ await dort(4600); window.__fini = true; }
  }
  squelette();
  S = M.etat(0); R = rng(1); pPrec = p; jauges(p); tableau();
  return {
    jouer,
    stop(){ jeton++; },
    accelerer(){ accel = Math.min(accel * 3, 27); },
    finir(){ accel = 1000; },
  };
}

async function cssPourImage(){

function radarCartes(J){

  const grille = [25,50,75,100].map(v=>`<polygon points="${CJ_AXES.map((_,k)=>pt(k,v).map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="rgba(var(--wv),${v===100?.22:.1})"/>`).join('');

    <div class="cj-leg"><span><i style="background:var(--p1)"></i>${esc(court(J[0].nom))}</span><span><i style="background:var(--p2)"></i>${esc(court(J[1].nom))}</span></div>`;
}

// 24/11/2026 (paquet 423, Lucas : « fais ça ») — HISTORIQUE PAR TRANCHE (vitrine.reussite_tranches) : pour un %
// annoncé, ce que l'algo a fait à ce % sur les matchs passés. Lu du côté que l'algo jugeait le plus probable. Règle :
// 100 matchs au moins ; sinon la même tranche tous circuits ; sinon une tranche de 10 points tous circuits ; sinon rien.
function reussiteA(proj, circ, p){
  const R = D && D.reussite_tranches, P = R && R[proj]; if (!P || p == null) return null;
  const min = R.min_n || 100, c = Math.max(p, 1 - p), i = Math.min(Math.floor((c - .5) * 20 + 1e-9), 9);
  const k5 = `${50 + 5*i}-${55 + 5*i}`, lib = (a, b) => L==='fr' ? `${a}–${b} %` : `${a}–${b}%`;
  const fait = (x, a, b, portee) => ({ n: x[0], annonce: x[1], bon: x[2], pct: 100 * x[2] / x[0], tranche: lib(a, b), portee });
  const x = (P[circ] || {})[k5];
  if (x && x[0] >= min) return fait(x, 50 + 5*i, 55 + 5*i, circ);
  const y = (P.TOUS || {})[k5];
  if (y && y[0] >= min) return fait(y, 50 + 5*i, 55 + 5*i, 'TOUS');
  const j = i - (i % 2), A = (P.TOUS || {})[`${50 + 5*j}-${55 + 5*j}`] || [0, 0, 0], B = (P.TOUS || {})[`${55 + 5*j}-${60 + 5*j}`] || [0, 0, 0];
  const n = A[0] + B[0];
  if (n >= min) return fait([n, (A[0]*A[1] + B[0]*B[1]) / n, A[2] + B[2]], 50 + 5*j, 60 + 5*j, 'TOUS');
  return null;
}

// (WebSocket /live/flux) sur laquelle le serveur envoie le direct dès qu'il change. Tant qu'elle marche, plus de
// redemande toutes les 3 s. Un « ping » toutes les 20 s la garde en vie. Si elle tombe (réseau, veille, serveur), on
// la rouvre après 2 s, 5 s, 15 s puis 60 s, et en attendant la redemande classique de /live reprend toute seule.
// Page cachée → connexion fermée ; page revenue → rouverte. Code 4000 = garde-fou du serveur : retour dans 1 h.

/* ───────────── la vidéo du jour en 3D (paquet 276) ─────────────
   Le match représentatif des simulations (le même que la vidéo 2D), rejoué point par point par le moteur du match ;
   on garde ses moments forts (balles de break, breaks, sets, balles de match, un long échange) et le stade 3D les

function momentsForts(M, trace, premier, maxi){

      if (k && (!best || k > best.k)) best = {k, h: hh}; }

    else if (setFini){ note = 62; quoi = 'set'; }
    else if (brk){ note = 50; quoi = 'break'; }
    else if (e && e.k === 2){ note = 40; quoi = 'bs_sauvee'; }
    else if (e && e.k === 1){ note = 28; quoi = 'bb_sauvee'; }
    pts.push({i, avant, apres, h, srv, e, note, quoi, set: avant.sets[0]+avant.sets[1]});
  }
  const choix = [], parSet = {};
  for (const x of pts.filter(x => x.note).sort((a,b) => b.note - a.note || a.i - b.i)){
    if (choix.length >= maxi) break;
    if (x.quoi !== 'match' && (parSet[x.set] || 0) >= 2) continue;
    if (choix.some(y => Math.abs(y.i - x.i) < 3 && x.quoi !== 'match')) continue;            // pas deux points collés

    c.hidden = false; c.classList.remove('on'); void c.offsetWidth; c.classList.add('on'); son('volet', 0);

  }
  G3D.film.camera('orbite', 2.8); $('.f3-vs').hidden = false; son('vs', 200);
  await z(RESUME || COURT ? 1600 : 2600);
  $('.f3-vs').classList.add('part'); volet(); await z(400); $('.f3-vs').classList.add('fini');
  G3D.film.camera(null); $('.f3-bug').hidden = false;
  // 2) les moments forts
  const n = F.choix.length;
  for (let k = 0; k < n; k++){
    const x = F.choix[k], dernier = x.quoi === 'match';
    if (k) { volet(); await z(300); }
    bug(x.avant, false); etatLignes(x.avant, false);
    const titre = x.e ? [null, t('a_bb'), t('a_bs'), t('a_bm')][x.e.k] : x.quoi === 'echange' ? t('f3_echange') : x.avant.tb ? t('f3_jd') : t('f3_set_n', x.set + 1);
    const pour = x.e ? noms[x.e.h] : '';
    legende(titre, pour, x.e ? coul(x.e.h) : '#D4FF3A', 2000);
    if (x.e) son(x.e.k === 3 ? 'balle_match' : 'annonce', 150);
    son('voix', 450, { texte: arbitre.score(x.avant) });
    // résumé (30–45 s) : sans ralenti, échanges plus courts, plan large sauf sur la balle de match
    G3D.film.point(m, rDe(x.avant), x.h, { coupe: true, grand: RESUME || COURT ? dernier : x.note >= 50 || dernier, rejouer: dernier && !RESUME && !COURT,
      fin_match: dernier, prep: RESUME || COURT ? 1.2 : 1.9, minL: x.quoi === 'echange' ? (RESUME || COURT ? 5 : 6) : 0, maxL: x.quoi === 'echange' ? (RESUME || COURT ? 8 : 10) : RESUME || COURT ? 3 : 6, fin: dernier ? (Math.random() < 0.5 ? 'coup_droit' : 'revers') : undefined });
    await attendre(e => e.R, 4000);
    await attendre(e => !e.R, 30000);
    // le résultat du point
    bug(x.apres, x.apres.fini); commente(x); etatLignes(x.apres, x.apres.fini);
    { const j = x.apres.jeux[0] + x.apres.jeux[1] + x.apres.sets[0] + x.apres.sets[1] > x.avant.jeux[0] + x.avant.jeux[1] + x.avant.sets[0] + x.avant.sets[1];
      if (j) son('voix', 700, { texte: arbitre.jeu(x.h, x.quoi === 'set' ? x.set + 1 : 0, x.apres.fini) }); }
    if (x.apres.fini) legende(t('a_fin'), noms[x.h], coul(x.h), 2600);
    else if (x.quoi === 'set') { legende(t('a_set', x.set + 1), t('a_pour', noms[x.h]), coul(x.h), 1900); son('set'); }
    else if (x.quoi === 'break') { legende(t('a_break'), noms[x.h], coul(x.h), 1700); son('break'); }
    else if (x.e && x.h !== x.e.h) { legende(t('f3_sauvee'), noms[x.h], coul(x.h), 1700); }
    G3D.film.score(m, rDe(x.apres), false);
    if (dernier) break;
    await attendre(e => e.t > Math.max(e.plans, e.gestes) && !e.ralenti && !e.R, 14000);
    await z(250);
  }
  // 3) la fin : ralenti de la balle de match, puis le vainqueur et le verdict des simulations
  await attendre(e => e.actif || !e.ralenti, 6000);
  if (G3D.film.etat().actif){ legende(t('a_ralenti'), '', '#F4F1FF', 0); await attendre(e => !e.ralenti, 26000); $('.f3-cap').hidden = true; }
  G3D.film.score(m, rDe(F.final), true); bug(F.final, true);
  G3D.film.camera('heros', 4.2, w); son('ovation', 0);
  legende(t('a_fin'), t('a_gagne', noms[w]), coul(w), 0);
  await z(RESUME || COURT ? 2200 : 3000);
  const fp = (m.scores_probables || []).find(x => x[0] === sc.score);
  // paquet 312 : à la fin du résumé, les vraies stats du match (feuille TennisApi) — descriptif, le % ne change pas
  const statsReelles = S => { const L_ = t('r_st'), v = (k, i) => k === 'prem' ? `${S[k][i]}${L === 'fr' ? '\u202f%' : '%'}` : k === 'bb' ? `${S[k][i][0]}/${S[k][i][1]}` : String(S[k][i]);
    const lignes = ['aces', 'df', 'prem', 'bb', 'pts'].filter(k => S[k]).map(k => `<div><b class="j0">${v(k, 0)}</b><span>${esc(L_[k])}</span><b class="j1">${v(k, 1)}</b></div>`).join('');
    return lignes ? `<div class="f3-fin-st"><h4>${esc(t('r_st_t'))}</h4>${lignes}</div>` : ''; };
  const fin = $('.f3-fin');
  fin.innerHTML = `<div class="f3-fin-t">${esc(t('a_fin'))}</div><div class="f3-fin-w" style="color:${coul(w)}">${esc(t('a_gagne', noms[w]))}</div>
    <div class="f3-fin-s">${esc(scoreTxt(F.final, w === 1))}</div><div class="f3-fin-p">${RESUME ? t('r_fin_p', esc(noms[fav]), Math.max(p, 1 - p) * 100) : t('a_fin_p', esc(noms[fav]), Math.max(p, 1 - p) * 100, nSim)}</div>
    ${!RESUME && fp && fp[1] != null ? `<div class="f3-fin-p">${t('a_fin_top', esc(sc.score), fp[1] * 100, nSim)}</div>` : ''}
    ${RESUME && RESUME.stats ? statsReelles(RESUME.stats) : ''}
    ${LG.length ? `<div class="f3-fin-lg">${lignesFaites(F.final, true).map((c, i) => `<div class="${c}"><span>${c === 'oui' ? '✓' : '✗'} ${esc(LG[i].lib)}</span><b>${pc0(LG[i].p)}</b></div>`).join('')}</div>` : ''}
    <div class="f3-fin-pied">${esc(RESUME ? t('r_pied') : t('a_pied', nSim))}</div>`;
  $('.f3-cap').hidden = true; $('.f3-algo').hidden = true; fin.hidden = false; son('fin', 0); son('musique_fin', 300, { duree: 5.2 });
  G3D.film.camera('stade', 5);
  await z(RESUME ? (RESUME.stats ? 5200 : 3600) : 4800);                              // résumé : le temps de lire les vraies stats
  window.__fini = true;
}
