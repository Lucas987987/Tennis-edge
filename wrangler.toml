# Worker des fiches joueurs — https://joueurs.tennis-edge.workers.dev
#
# Déployé AUTOMATIQUEMENT par .github/workflows/deploy_joueurs.yml à chaque
# modification de ce dossier. Ne plus coller le code dans le tableau de bord
# Cloudflare : la prochaine modification du dépôt l'écraserait.
name = "joueurs"
main = "worker-joueurs.js"
compatibility_date = "2025-01-01"
workers_dev = true
# Garde les variables réglées dans le tableau de bord (GH_OWNER, GH_REPO
# s'il y en a) au lieu de les effacer à chaque déploiement.
keep_vars = true
